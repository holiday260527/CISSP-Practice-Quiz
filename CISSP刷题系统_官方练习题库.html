"Approve the credentials of developers.","Facilitate lessons learned sessions.","Review and approve/reject code changes.","Prioritize software development efforts."],"ans":"C","expl":"The purpose of the change advisory board (CAB) is to review and then approve or reject proposed code changes. The CAB is not normally involved in the approval of devel-oper credentials, the conduct of lessons learned sessions, or the prioritization of software development efforts."},{"ch":"D8","ch_name":"域8 软件开发安全","no":53,"type":"single","q":"Which one of the following tools is commonly used by software developers to interact with and manage code that is stored in code repositories?","opts":["grep","git","lsof","gcc"],"ans":"B","expl":"git is a version management tool that is very commonly used by developers to interact with code repositories, such as those hosted by GitHub. grep is a command-line tool used to search files for specific content. lsof is a command used to list the open files on a system. gcc is a C language compiler used to transform source code into executable code."},{"ch":"D8","ch_name":"域8 软件开发安全","no":54,"type":"single","q":"While evaluating a potential security incident, Harry comes across a log entry from a web server request showing that a user entered the following input into a form field:\n• CARROT'&1=1;--\n• What type of attack was attempted?","opts":["Buffer overflow","Cross-site scripting","SQL injection","Cross-site request forgery"],"ans":"C","expl":"The single quotation mark in the input field is a telltale sign that this is a SQL injection attack. The quotation mark is used to escape outside the SQL code’s input field, and the text following is used to directly manipulate the SQL command sent from the web application to the database."},{"ch":"D8","ch_name":"域8 软件开发安全","no":55,"type":"single","q":"Which one of the following is not an effective control against SQL injection attacks?","opts":["Escaping","Client-side input validation","Parameterization","Limiting database permissions"],"ans":"B","expl":"Client-side input validation is not an effective control against any type of attack because the attacker can easily bypass the validation by altering the code on the client. Escaping restricted characters prevents them from being passed to the database, as does parameteriza-tion. Limiting database permissions prevents dangerous code from executing."},{"ch":"D8","ch_name":"域8 软件开发安全","no":57,"type":"single","q":"In what software testing technique does the evaluator retest a large number of scenarios each time that the software changes to verify that the results are consistent with a stan-dard baseline?","opts":["Orthogonal array testing","Pattern testing","Matrix testing","Regression testing"],"ans":"D","expl":"Regression testing is performed after developers make changes to an application. It reruns a number of test cases and compares the results to baseline results. Orthogonal array testing is a method for generating test cases based on statistical analysis. Pattern testing uses records of past software bugs to inform the analysis. Matrix testing develops a matrix of all possible inputs and outputs to inform the test plan."},{"ch":"D8","ch_name":"域8 软件开发安全","no":58,"type":"single","q":"Haley is reviewing code created by her organization for its possible exposure to web appli-cation vulnerabilities. Which one of the following conditions may make an application most vulnerable to a cross-site scripting (XSS) attack?","opts":["Input validation","Reflected input","Unpatched server","Promiscuous firewall rules"],"ans":"B","expl":"Cross-site scripting (XSS) attacks may take advantage of the use of reflected input in a web application where input provided by one user is displayed to another user. Input valida-tion is a control used to prevent XSS attacks. XSS does not require an unpatched server or any firewall rules beyond those permitting access to the web application."},{"ch":"D8","ch_name":"域8 软件开发安全","no":59,"type":"single","q":"Roger is conducting a software test for a tax preparation application developed by his company. End users will access the application over the web, but Roger is conducting his test on the back end, evaluating the source code on the web server. What type of test is Roger conducting?","opts":["White box","Gray box","Blue box","Black box"],"ans":"A","expl":"In a white-box test, the attacker has access to full implementation details of the system, including source code, prior to beginning the test. In gray-box testing, the attacker has partial knowledge. In black-box testing, the attacker has no knowledge of the system and tests it from a user perspective. Blue boxes are a phone hacking tool and are not used in soft-ware testing."},{"ch":"D8","ch_name":"域8 软件开发安全","no":60,"type":"single","q":"Which of the following statements is true about heuristic-based antimalware software?","opts":["It has a lower false positive rate than signature detection.","It requires frequent definition updates to detect new malware.","It has a higher likelihood of detecting zero-day exploits than signature detection.","It monitors systems for files with content known to be viruses."],"ans":"C","expl":"Heuristic-based antimalware software has a higher likelihood of detecting a zero-day exploit than signature-based methods. Heuristic-based software does not require frequent signature updates because it does not rely upon monitoring systems for the presence of known malware. The trade-off with this approach is that it has a higher false positive rate than signature detection methods."},{"ch":"D8","ch_name":"域8 软件开发安全","no":61,"type":"single","q":"Martin is inspecting a system where the user reported unusual activity, including disk activity when the system is idle and abnormal CPU and network usage. He suspects that the machine is infected by a virus, but scans come up clean. What malware technique might be in use here that would explain the clean scan results?","opts":["File infector virus","MBR virus","Service injection virus","Stealth virus"],"ans":"D","expl":"One possibility for the clean scan results is that the virus is using stealth techniques, such as intercepting read requests from the antivirus software and returning a correct-looking ver-sion of the infected file. The system may also be the victim of a zero-day attack, using a virus that is not yet included in the signature definition files provided by the antivirus vendor."},{"ch":"D8","ch_name":"域8 软件开发安全","no":63,"type":"single","q":"An attacker posted a message to a public discussion forum that contains an embedded malicious script that is not displayed to the user but executes on the user’s system when read. What type of attack is this?","opts":["Persistent XSRF","Nonpersistent XSRF","Persistent XSS","Nonpersistent XSS"],"ans":"C","expl":"Attacks where the malicious user tricks the victim’s web browser into executing a script through the use of a third-party site are known as cross-site scripting (XSS) attacks. This particular attack is a persistent XSS attack because it remains on the discussion forum until an administrator discovers and deletes it, giving it the ability to affect many users."},{"ch":"D8","ch_name":"域8 软件开发安全","no":64,"type":"single","q":"Which one of the following is not a principle of the Agile software development process?","opts":["Welcome changing requirements, even late in the development process.","Maximizing the amount of work not done is essential.","Clear documentation is the primary measure of progress.","Build projects around motivated individuals."],"ans":"C","expl":"The Agile Manifesto includes 12 principles for software development. Three of those are listed as answer choices: maximizing the amount of work not done is essential, build\nprojects around motivated individuals, and welcome changing requirements throughout the development process. Agile does not, however, consider clear documentation the primary measure of progress. Instead, working software is the primary measure of progress."},{"ch":"D8","ch_name":"域8 软件开发安全","no":65,"type":"single","q":"Gavin is an internal auditor tasked with examining the change management practices of his organization. He would like to review a series of changes made to a software package to determine whether they were properly documented. Where should he turn for a description of each proposed change?","opts":["CAB","RFC","SOAR","SIEM"],"ans":"B","expl":"Each change should be the result of a reviewed and approved request for change (RFC). These RFCs may be approved by the change advisory board (CAB). The security information and event management (SIEM) and security orchestration, automation, and response (SOAR) platforms used by the organization would not normally contain information about the change management process."},{"ch":"D8","ch_name":"域8 软件开发安全","no":66,"type":"single","q":"Neal is working with a DynamoDB database. The database is not structured like a relational database but allows Neal to store data using a key-value store. What type of database\n• is DynamoDB?","opts":["Relational database","Graph database","Hierarchical database","NoSQL database"],"ans":"D","expl":"A key-value store is an example of a NoSQL database that does not follow a relational or hierarchical model like traditional databases. A graph database is another example of a NoSQL database, but it uses nodes and edges to store data rather than keys and values."},{"ch":"D8","ch_name":"域8 软件开发安全","no":68,"type":"single","q":"Tareck’s organization makes use of a significant amount of COTS software. He recently dis-covered a significant buffer overflow vulnerability in the code of a COTS software package that is crucial to his business. What is the most likely way that Tareck can get this corrected?","opts":["Work with his software development team to modify the code.","Notify the vendor and request a patch.","Deploy an intrusion prevention system.","Update firewall rules."],"ans":"B","expl":"When using commercial off-the-shelf (COTS) software, customers do not generally have access to the source code and must depend upon the vendor to release security patches that correct vulnerabilities. Other controls, such as intrusion prevention systems and firewalls, may be able to help mitigate the issue, depending upon the nature of the flaw, but they will not correct it."},{"ch":"D8","ch_name":"域8 软件开发安全","no":69,"type":"single","q":"Which one of the following statements is true about software testing?","opts":["Static testing works on runtime environments.","Static testing performs code analysis.","Dynamic testing uses automated tools, but static testing does not.","Static testing is a more important testing technique than dynamic testing."],"ans":"B","expl":"Static testing performs code analysis in an offline fashion, without actually executing the code. Dynamic testing evaluates code in a runtime environment. Both static and dynamic testing may use automated tools, and both are important security testing techniques."},{"ch":"D8","ch_name":"域8 软件开发安全","no":71,"type":"single","q":"Barry is a software tester who is working with a new gaming application developed by his company. He is playing the game on a smartphone to conduct his testing in an environment that best simulates a normal end user, but he is referencing the source code as he conducts his test. What type of test is Barry conducting?","opts":["White box","Black box","Blue box","Gray box"],"ans":"D","expl":"In a gray-box test, the tester evaluates the software from a user perspective but has access to the source code as the test is conducted. White-box tests also have access to the source code but perform testing from a developer’s perspective. Black-box tests work from a user’s perspective but do not have access to source code. Blue boxes are a telephone hacking tool and not a software testing technique."},{"ch":"D8","ch_name":"域8 软件开发安全","no":72,"type":"single","q":"Miguel recently completed a penetration test of the applications that his organization uses to handle sensitive information. During his testing, he discovered a condition where an attacker can exploit a timing condition to manipulate software into allowing him to perform an unau-thorized action. Which one of the following attack types fits this scenario?","opts":["SQL injection","Cross-site scripting","Pass the hash","TOC/TOU"],"ans":"D","expl":"The Time of Check to Time of Use (TOC/TOU) attack exploits timing differences between when a system verifies authorization and software uses that authorization to perform an action. It is an example of a race condition attack. The other three attacks mentioned do not depend on precise timing."},{"ch":"D8","ch_name":"域8 软件开发安全","no":73,"type":"single","q":"What part of the security review process are the input parameters shown in the dia-gram used for?","opts":["SQL injection review","Sprint review","Fagan inspection","Attack surface identification"],"ans":"D","expl":"Each of these input parameters makes up part of the attack surface of the application. Attackers may opt to target any of them to attack the code or its supporting infrastructure."},{"ch":"D8","ch_name":"域8 软件开发安全","no":75,"type":"single","q":"Which one of the following approaches to failure management is the most conservative from a security perspective?","opts":["Fail open","Fail mitigation","Fail clear","Fail closed"],"ans":"D","expl":"The fail closed approach prevents any activity from taking place during a system security failure and is the most conservative approach to failure management. Fail open takes the opposite philosophy, allowing all activity in the event of a security control failure. Fail clear and fail mitigation are not failure management approaches."},{"ch":"D8","ch_name":"域8 软件开发安全","no":76,"type":"single","q":"What software development model is shown in the figure?","opts":["Waterfall","Agile","Lean","Spiral"],"ans":"D","expl":"The illustration shows the spiral model of software development. In this approach, devel-opers use multiple iterations of a waterfall-style software development process. This becomes a “loop” of iterations through similar processes. The original waterfall approach does not iterate through the entire process repeatedly. Some variants do allow iteration, but only\nby allowing movement backward and forward one stage. The Agile approach to software development focuses on iterative improvement and does not follow a rigorous SDLC model. Lean is a process improvement methodology and not a software development model."},{"ch":"D8","ch_name":"域8 软件开发安全","no":77,"type":"single","q":"Mark is considering replacing his organization’s customer relationship management (CRM) solution with a new product that is available in the cloud. This new solution is completely managed by the vendor, and Mark’s company will not have to write any code or manage any physical resources. What type of cloud solution is Mark considering?","opts":["IaaS","CaaS","PaaS","SaaS"],"ans":"D","expl":"In a software as a service solution, the vendor manages both the physical infrastructure and the complete application stack, providing the customer with access to a fully managed application."},{"ch":"D8","ch_name":"域8 软件开发安全","no":78,"type":"single","q":"Which one of the following change management processes is initiated by users rather than developers?","opts":["Change request","Change control","Release control","Design review"],"ans":"A","expl":"The request process begins with a user-initiated request for a feature. Change and release control are initiated by developers seeking to implement changes. Design review is a phase of the change approval process initiated by developers when they have a completed design."},{"ch":"D8","ch_name":"域8 软件开发安全","no":79,"type":"single","q":"Teagan would like to better protect his organization against database inference attacks. Which one of the following techniques is an effective countermeasure against these attacks?","opts":["Input validation","Parameterization","Polyinstantiation","Server-side validation"],"ans":"C","expl":"Polyinstantiation allows the storage of multiple different pieces of information in a data-base at different classification levels to prevent attackers from inferring anything about the absence of information. Input validation, server-side validation, and parameterization are all techniques used to prevent web application attacks and are not effective against infer-ence attacks."},{"ch":"D8","ch_name":"域8 软件开发安全","no":80,"type":"single","q":"Ursula is a government web developer who recently created a public application that offers property records. She would like to make it available for other developers to integrate into their applications. What can Ursula create to make it easiest for developers to call her code directly and integrate the output into their applications?","opts":["Object model","Data dictionary","API","Primary key"],"ans":"C","expl":"While Ursula may certainly use an object model, data dictionary, and primary key in her development effort, external developers cannot directly use them to access her code. An application programming interface (API) allows other developers to call Ursula’s code from within their own without knowing the details of Ursula’s implementation."},{"ch":"D8","ch_name":"域8 软件开发安全","no":81,"type":"single","q":"Nathan recently completed a software development project where he integrated the organi-zation’s network operations stack with their development processes. As a result, developers can modify firewall rules from their code on an as-needed basis. What term best describes this ability?","opts":["Agile","IaC","SDS","DevOps"],"ans":"C","expl":"This is an example of software defined security (SDS), where security infrastructure may be easily manipulated by code. Answering this question is tricky because several of the other terms are closely related. Software-defined security is an example of infrastructure as code (IaC), but SDS is a more descriptive, and therefore better, answer. SDS is commonly used within an Agile development framework. The DevOps approach links together development and operations, but is generally called DevSecOps when it also includes SDS."},{"ch":"D8","ch_name":"域8 软件开发安全","no":83,"type":"single","q":"Charles is developing a mission-critical application that has a direct impact on human safety. Time and cost are less important than correctly functioning software. Which of the following software development methodologies should he choose given these requirements?","opts":["Agile","DevOps","Spiral","Waterfall"],"ans":"D","expl":"Despite many organizations moving to Agile, DevOps, or other more responsive development methodologies, waterfall remains a strong contender when clear objectives and\nstable requirements are combined with a need to prevent flaws and to have a high level of control over the development process and output."},{"ch":"D8","ch_name":"域8 软件开发安全","no":84,"type":"single","q":"Which one of the following types of artificial intelligence attempts to use complex computa-tions to replicate the partial function of the human mind?","opts":["Decision support systems","Expert systems","Knowledge bank","Neural networks"],"ans":"D","expl":"Neural networks attempt to use complex computational techniques to model the behavior of the human mind. Knowledge banks are a component of expert systems, which are designed to capture and reapply human knowledge. Decision support systems are designed to provide advice to those carrying out standard procedures and are often driven by expert systems."},{"ch":"D8","ch_name":"域8 软件开发安全","no":85,"type":"single","q":"At which level of the Software Capability Maturity Model (SW-CMM) does an organization introduce basic lifecycle management processes?","opts":["Initial","Repeatable","Defined","Managed"],"ans":"B","expl":"In level 2, the Repeatable level of the SW-CMM, an organization introduces basic lifecycle management processes. Reuse of code in an organized fashion begins, and repeatable results are expected from similar projects. The key process areas for this level include Requirements Management, Software Project Planning, Software Project Tracking and Oversight, Soft-ware Subcontract Management, Software Quality Assurance, and Software Configuration Management."},{"ch":"D8","ch_name":"域8 软件开发安全","no":86,"type":"single","q":"Lucas runs the accounting systems for his company. The morning after an essential was fired, systems began mysteriously losing information. Lucas suspects that the fired employee tam-pered with the systems prior to his departure. What type of attack should Lucas suspect?","opts":["Privilege escalation","SQL injection","Logic bomb","Remote code execution"],"ans":"C","expl":"The critical fact in this question is that Lucas suspects the tampering took place before the employee departed. This is the signature of a logic bomb: malicious code that lies dormant until certain conditions are met. The other attack types listed here—privilege escalation, SQL injection, and remote code execution—would more likely take place in real time."},{"ch":"D8","ch_name":"域8 软件开发安全","no":87,"type":"single","q":"Which one of the following principles would not be favored in an Agile approach to software development?","opts":["Processes and tools over individuals and interactions","Working software over comprehensive documentation","Customer collaboration over contract negotiations","Responding to change over following a plan"],"ans":"A","expl":"The Agile approach to software development embraces four principles. It values individ-uals and interactions over processes and tools, working software over comprehensive docu-mentation, customer collaboration over contract negotiation, and responding to change over following a plan."},{"ch":"D8","ch_name":"域8 软件开发安全","no":88,"type":"single","q":"What technique do API developers most commonly use to limit access to an API to autho-rized individuals and applications?","opts":["Encryption","Input validation","API keys","IP filters"],"ans":"C","expl":"API developers commonly use API keys to limit access to authorized users and applica-tions. Encryption provides for confidentiality of information exchanged using an API but does not provide authentication. Input validation is an application security technique used to protect against malicious input. IP filters may be used to limit access to an API, but they are not commonly used because it is difficult to deploy an API with IP filters since the filters require constant modification and maintenance as endpoints change."},{"ch":"D8","ch_name":"域8 软件开发安全","no":89,"type":"single","q":"Reggie recently received a letter from his company’s internal auditors scheduling the kickoff meeting for an assessment of his group. Which of the following should Reggie not expect to learn during that meeting?","opts":["Scope of the audit","Purpose of the audit","Expected timeframe","Expected findings"],"ans":"D","expl":"An audit kickoff meeting should clearly describe the scope and purpose of the audit as well as the expected time frame. Auditors should never approach an audit with any expec-tations about what they will discover because the findings should only be developed based upon the results of audit examinations"},{"ch":"D8","ch_name":"域8 软件开发安全","no":90,"type":"single","q":"Which one of the following is the proper order of steps in the waterfall model of software development?","opts":["Requirements, Design, Testing, Coding, Maintenance","Requirements, Design, Coding, Testing, Maintenance","Design, Requirements, Coding, Testing, Maintenance","Design, Requirements, Testing, Coding, Maintenance"],"ans":"B","expl":"In the waterfall model, the software development process follows five sequential steps that are, in order: Requirements, Design, Coding, Testing, and Maintenance."},{"ch":"D8","ch_name":"域8 软件开发安全","no":91,"type":"single","q":"Renee is a software developer who writes code in Node.js for her organization. The company is considering moving from a self-hosted Node.js environment to one where Renee will run her code on application servers managed by a cloud vendor. What type of cloud solution is Renee’s company considering?","opts":["IaaS","CaaS","PaaS","SaaS"],"ans":"C","expl":"In a platform as a service solution, the customer supplies application code that the vendor then executes on its own infrastructure."},{"ch":"D8","ch_name":"域8 软件开发安全","no":92,"type":"single","q":"Tom is writing a software program that calculates the sales tax for online orders placed from various jurisdictions. The application includes a user-defined field that allows the entry of the total sale amount. Tom would like to ensure that the data entered in this field is a properly formatted dollar amount. What technique should he use?","opts":["Limit check","Fail open","Fail secure","Input validation"],"ans":"D","expl":"Input validation ensures that the data provided to a program as input matches the expected parameters. Limit checks are a special form of input validation that ensure that the value remains within an expected range, but there was no range specified in this scenario. Fail open and fail secure are options when planning for possible system failures."},{"ch":"D8","ch_name":"域8 软件开发安全","no":93,"type":"multi","q":"Brian is helping implement a new software testing methodology for his organization and would like to review the completeness of his toolkit. Which of the following would be con-sidered dynamic application security testing (DAST) tools? (Select all that apply.)","opts":["Code review","Fuzzing","Static analysis","Web application vulnerability scanning"],"ans":"BD","expl":"Dynamic application security tools conduct their testing by actually executing the code. This is the case for both fuzzing and web application vulnerability scanning. Code reviews and static analysis packages analyze the code itself but do not execute it, making them static application security testing (SAST) tools."},{"ch":"D8","ch_name":"域8 软件开发安全","no":94,"type":"single","q":"What approach to technology management integrates the three components of technology management shown in this illustration?","opts":["Agile","Lean","DevOps","ITIL"],"ans":"C","expl":"The DevOps approach to technology management seeks to integrate software development, operations, and quality assurance in a seamless approach that builds collabora-tion between the three disciplines."},{"ch":"D8","ch_name":"域8 软件开发安全","no":95,"type":"single","q":"Olivia is conducting a risk analysis of a web application that her organization obtained from a third party and is concerned that it might contain vulnerabilities. Which one of the follow-ing activities might she take to best mitigate the risk?","opts":["Deploy a WAF.","Implement strong encryption.","Purchase an insurance policy.","Discontinue use of the software."],"ans":"A","expl":"Deploying a web application firewall (WAF) may reduce the likelihood or impact of a web application vulnerability and is, therefore, a good example of risk mitigation. Encryp-tion is also a risk mitigation control, but it is less likely be effective against a web applica-tion security flaw. Purchasing an insurance policy is an example of risk transference, not risk mitigation. Discontinuing use of the software is an example of risk avoidance, not risk mitigation."},{"ch":"D8","ch_name":"域8 软件开发安全","no":96,"type":"single","q":"Which one of the following database concurrency issues occurs when one transaction reads information that was written to a database by a second transaction that never committed?","opts":["Lost update","SQL injection","Incorrect summary","Dirty read"],"ans":"D","expl":"Dirty reads occur when one transaction reads a value from a database that was written by another transaction that did not commit. Lost updates occur when one transaction writes a value to the database that overwrites a value needed by transactions that have earlier prece-dence, causing those transactions to read an incorrect value. Incorrect summaries occur when one transaction is using an aggregate function to summarize data stored in a database while a second transaction is making modifications to the database, causing the summary to include incorrect information. SQL injection is a web application security flaw, not a database con-currency problem."},{"ch":"D8","ch_name":"域8 软件开发安全","no":97,"type":"single","q":"What software development concept was pioneered by the Defense Department in the 1990s as an effort to bring together diverse product development teams?","opts":["Integrated product team","Agile methodology","Scrum approach","User stories"],"ans":"A","expl":"The integrated product team (IPT) approach brought together cross-functional teams and was designed by the Defense Department in 1995. It was a predecessor to the Agile methodology, which uses tools like the scrum approach and user stories to conduct software development work."},{"ch":"D8","ch_name":"域8 软件开发安全","no":98,"type":"single","q":"Frank is working to select a new cloud service that will provide object storage for an application being developed by his team. What category of cloud service is Frank planning to use?","opts":["SaaS","IaaS","FaaS","PaaS"],"ans":"B","expl":"Storage is an infrastructure component and, therefore, an object storage service is an example of an infrastructure as a service (IaaS) cloud service. Software as a service (SaaS) models provide full applications managed by the provider. Platform as a service (PaaS) and function as a service (FaaS) approaches allow developers to run their own code on an infra-structure platform managed by the provider."},{"ch":"PT1","ch_name":"模拟卷 1","no":1,"type":"multi","q":"Lisa is attempting to prevent her network from being targeted by IP spoofing attacks as well as preventing her network from being the source of those attacks. Which of the fol-lowing rules are best practices that Lisa should configure at her network border? (Select all that apply.)","opts":["Block packets with internal source addresses from entering the network.","Block packets with external source addresses from leaving the network.","Block packets with public IP addresses from entering the network.","Block packets with private IP addresses from exiting the network."],"ans":"ABD","expl":"Packets with public IP addresses will routinely be allowed to enter the network, so you should not create a rule to block them, making this the correct answer. Packets with\ninternal source addresses should never originate from outside the network, so they should be blocked from entering the network. Packets with external source addresses should never be found on the internal network, so they should be blocked from leaving the network. Finally, private IP addresses should never be used on the internet, so packets containing private IP addresses should be blocked from leaving the network."},{"ch":"PT1","ch_name":"模拟卷 1","no":2,"type":"single","q":"Ed has been tasked with identifying a service that will provide a low-latency, high-performance, and high-availability way to host content for his employer. What type of solution should he seek out to ensure that his employer’s customers around the world can access their content quickly, easily, and reliably?","opts":["A hot site","A CDN","Redundant servers","A P2P CDN"],"ans":"B","expl":"A content distribution network (CDN) is designed to provide reliable, low-latency, geographically distributed content distribution. In this scenario, a CDN is an ideal solution. A P2P CDN like BitTorrent isn’t a typical choice for a commercial entity, whereas redun-dant servers or a hot site can provide high availability but won’t provide the remaining requirements."},{"ch":"PT1","ch_name":"模拟卷 1","no":3,"type":"multi","q":"Fran is building a forensic analysis workstation and is selecting a forensic disk controller to include in the setup. Which of the following are functions of a forensic disk controller? (Select all that apply.)","opts":["Preventing the modification of data on a storage device","Returning data requested from the device","Reporting errors sent by the device to the forensic host","Blocking read commands sent to the device"],"ans":"ABC","expl":"A forensic disk controller performs four functions. One of those, write blocking, intercepts write commands sent to the device and prevents them from modifying data on the device. The other three functions include returning data requested by a read operation,\nreturning access-significant information from the device, and reporting errors from the device back to the forensic host. The controller should not prevent read commands from being sent to the device because those commands may return crucial information."},{"ch":"PT1","ch_name":"模拟卷 1","no":6,"type":"single","q":"Evelyn believes that one of her organization’s vendors has breached a contractual obligation to protect sensitive data and would like to conduct an investigation into the circumstances. Based upon the results of the investigation, it is likely that Evelyn’s organization will sue the vendor for breach of contract. What term best describes the type of investigation that Evelyn is conducting?","opts":["Administrative investigation","Criminal investigation","Civil investigation","Regulatory investigation"],"ans":"C","expl":"This is an example of a civil investigation because it relates to a contract dispute and will likely wind up being litigated in civil court. Administrative investigations are for internal\npurposes and are not applicable when a third party is being investigated. Criminal and regulatory investigations may only be initiated by those with regulatory authority, typically government agencies."},{"ch":"PT1","ch_name":"模拟卷 1","no":7,"type":"single","q":"Ivan is installing a motion detector to protect a sensitive work area that uses high-frequency microwave signal transmissions to identify potential intruders. What type of detector is he installing?","opts":["Infrared","Heat-based","Wave pattern","Capacitance"],"ans":"C","expl":"Wave pattern motion detectors transmit ultrasonic or microwave signals into the mon-itor area, watching for changes in the returned signals bouncing off objects. Infrared head-based detectors watch for unusual heat patterns. Capacitance detectors work based upon electromagnetic fields."},{"ch":"PT1","ch_name":"模拟卷 1","no":8,"type":"single","q":"Susan sets up a firewall that keeps track of the status of the communication between two systems and allows a remote system to respond to a local system only after the local system starts communication. What type of firewall is Susan using?\nFor questions 9–11, please refer to the following scenario:","opts":["A static packet filtering firewall","An application-level gateway firewall","A stateful packet inspection firewall","A circuit-level gateway firewall"],"ans":"C","expl":"Stateful packet inspection firewalls, also known as dynamic packet filtering firewalls, track the state of a conversation and can allow a response from a remote system based on an internal system being allowed to start the communication. Static packet filtering and circuit-level gateways only filter based on source, destination, and ports, whereas application-level gateway firewalls proxy traffic for specific applications."},{"ch":"PT1","ch_name":"模拟卷 1","no":9,"type":"single","q":"How can Ben provide access control for his customers without having to provision user IDs before they connect while also gathering useful contact information for his business purposes?","opts":["WPA2 PSK","A captive portal","Require customers to use a publicly posted password like “BensCoffee”","WPA3 SAE"],"ans":"B","expl":"A captive portal can require those who want to connect to and use WiFi to provide an email address to connect. This allows Ben to provide easy-to-use wireless while meeting his business purposes. WPA2PSK is the preshared key mode of WPA and won’t provide information about users who are given a key. WPA3’s SAE mode would be preferable to\nWPA2PSK, but it still does not allow for the data gathering Ben desires. Sharing a password doesn’t allow for data gathering either.","scene":"Ben owns a coffeehouse and wants to provide wireless internet service for his customers. Ben’s network is simple and uses a single consumer-grade wireless router and a cable modem connected via a commercial cable data contract."},{"ch":"PT1","ch_name":"模拟卷 1","no":10,"type":"single","q":"Ben intends to run an open (unencrypted) wireless network. How should he connect his business devices?","opts":["Run WPA3 on the same SSID.","Set up a separate SSID using WPA3.","Run the open network in Enterprise mode.","Set up a separate wireless network using WEP."],"ans":"B","expl":"Many modern wireless routers can provide multiple SSIDs. Ben can create a private, secure network for his business operations, but he will need to make sure that the customer and business networks are firewalled or otherwise logically separated from each other. Running WPA3 on the same SSID isn’t possible without creating another wireless network and would cause confusion for customers (SSIDs aren’t required to be unique). Running\na network in Enterprise mode isn’t used for open networks, and WEP is outdated and incredibly vulnerable.","scene":"Ben owns a coffeehouse and wants to provide wireless internet service for his customers. Ben’s network is simple and uses a single consumer-grade wireless router and a cable modem connected via a commercial cable data contract."},{"ch":"PT1","ch_name":"模拟卷 1","no":11,"type":"single","q":"After implementing the solution from the first question, Ben receives a complaint about users in his cafe hijacking other customers’ web traffic, including using their usernames and pass-words. How is this possible?","opts":["The password is shared by all users, making traffic vulnerable.","A malicious user has installed a Trojan on the router.","A user has ARP spoofed the router, making all traffic broadcast to all users.","Open networks are unencrypted, making traffic easily sniffable."],"ans":"D","expl":"Unencrypted open networks broadcast traffic in the clear. This means that unencrypted sessions to websites can be easily captured with a packet sniffer. Some tools like FireSheep have been specifically designed to capture sessions from popular websites. Fortunately, many now use TLS by default, but other sites still send user session information in the clear. Shared passwords are not the cause of the vulnerability, ARP spoofing isn’t an\nissue with wireless networks, and a Trojan is designed to look like safe software, not to compromise a router.","scene":"Ben owns a coffeehouse and wants to provide wireless internet service for his customers. Ben’s network is simple and uses a single consumer-grade wireless router and a cable modem connected via a commercial cable data contract."},{"ch":"PT1","ch_name":"模拟卷 1","no":12,"type":"single","q":"Kevin is reviewing and updating the security documentation used by his organization. He would like to document some best practices for securing IoT devices that his team has devel-oped over the past year. The practices are generalized in nature and do not cover specific devices. What type of document would be best for this purpose?","opts":["Policy","Standard","Guideline","Procedure"],"ans":"C","expl":"It is possible that Kevin could use any one of these documents. We should zero in on the portion of the question where it indicates that these are best practices. This implies that the advice is not mandatory and, therefore, would not go into a policy or standard. The fact that the advice is general in nature means that it is likely not well-suited to the step-by-step nature of a procedure. A guideline would be the perfect place to document these best practices."},{"ch":"PT1","ch_name":"模拟卷 1","no":13,"type":"single","q":"Tom is tuning his security monitoring tools in an attempt to reduce the number of alerts received by administrators without missing important security events. He decides to con-figure the system to only report failed login attempts if there are five failed attempts to access the same account within a one-hour period of time. What term best describes the technique that Tom is using?","opts":["Thresholding","Sampling","Account lockout","Clipping"],"ans":"D","expl":"Clipping is an analysis technique that only reports alerts after they exceed a set threshold. It is a specific form of sampling, which is a more general term that describes any attempt to excerpt records for review. Thresholding is not a commonly used term. Administrators may choose to configure automatic or manual account lockout after failed login attempts, but that is not described in the scenario."},{"ch":"PT1","ch_name":"模拟卷 1","no":14,"type":"single","q":"Sally has been tasked with deploying an authentication, authorization, and accounting server for wireless network services in her organization and needs to avoid using proprietary tech-nology. What technology should she select?","opts":["OAuth","RADIUS","XTACACS","TACACS+"],"ans":"B","expl":"RADIUS is a common AAA technology used to provide services for dial-up, wireless net-works, network devices, and a range of other systems. OAuth is an authentication protocol used to allow applications to act on a user’s behalf without sharing the password and is used for many web applications. While both XTACACS and TACACS+ provide the functionality Sally is looking for, both are Cisco proprietary protocols."},{"ch":"PT1","ch_name":"模拟卷 1","no":15,"type":"single","q":"An accounting clerk for Christopher’s Cheesecakes does not have access to the salary information for individual employees but wanted to know the salary of a new hire. He pulled total payroll expenses for the pay period before the new person was hired and then pulled the same expenses for the following pay period. He computed the difference between those two amounts to determine the individual’s salary. What type of attack occurred?","opts":["Salami slicing","Data diddling","Inference","Social engineering"],"ans":"C","expl":"In an inference attack, the attacker uses several pieces of generic nonsensitive information to determine a specific sensitive value. In a salami slicing attack, the attacker siphons off minute quantities of money many times to accumulate a large amount of funds. In a data diddling attack, the attacker alters the contents of a database. Social engineering attacks exploit human psychology to achieve their goals."},{"ch":"PT1","ch_name":"模拟卷 1","no":16,"type":"single","q":"Alice would like to have read permissions on an object and knows that Bob already has those rights and would like to give them to herself. Which one of the rules in the Take-Grant pro-tection model would allow her to complete this operation if the relationship exists between Alice and Bob?","opts":["Take rule","Grant rule","Create rule","Remote rule"],"ans":"A","expl":"The take rule allows a subject to take the rights belonging to another object. If Alice has take rights on Bob, she can give herself the same permissions that Bob already possesses."},{"ch":"PT1","ch_name":"模拟卷 1","no":17,"type":"single","q":"During a log review, Danielle discovers a series of logs that show login failures:\n• Jan 31 11:39:12 ip-10-0-0-2 sshd[29092]: Invalid user admin from remotehost passwd=aaaaaaaa\n• Jan 31 11:39:20 ip-10-0-0-2 sshd[29098]: Invalid user admin from remotehost passwd=aaaaaaab\n• Jan 31 11:39:23 ip-10-0-0-2 sshd[29100]: Invalid user admin from remotehost passwd=aaaaaaac\n• Jan 31 11:39:31 ip-10-0-0-2 sshd[29106]: Invalid user admin from remotehost passwd=aaaaaaad\n• Jan 31 20:40:53 ip-10-0-0-254 sshd[30520]: Invalid user admin from remotehost passwd=aaaaaaae\n• What type of attack has Danielle discovered?","opts":["A pass-the-hash attack","A brute-force attack","A man-in-the-middle attack","A dictionary attack"],"ans":"B","expl":"Brute-force attacks try every possible password. In this attack, the password is chang-ing by one letter at each attempt, which indicates that it is a brute-force attack. A dictio-nary attack would use dictionary words for the attack, whereas a man-in-the-middle or pass-the-hash attack would most likely not be visible in an authentication log except as a successful login."},{"ch":"PT1","ch_name":"模拟卷 1","no":18,"type":"single","q":"Ben is designing a database-driven application and would like to ensure that two executing transactions do not affect each other by storing interim results in the database. What prop-erty is he seeking to enforce?","opts":["Atomicity","Isolation","Consistency","Durability"],"ans":"B","expl":"Isolation requires that transactions operate separately from each other. Atomicity ensures that if any part of a database transaction fails, the entire transaction must be rolled back as if it never occurred. Consistency ensures that all transactions are consistent with the logical rules of the database, such as having a primary key. Durability requires that once a transac-tion is committed to the database it must be preserved. Together, these properties make up the ACID model."},{"ch":"PT1","ch_name":"模拟卷 1","no":19,"type":"single","q":"Kim is the system administrator for a small business network that is experiencing security problems. She is in the office in the evening working on the problem, and nobody else is there. As she is watching, she can see that systems on the other side of the office that were previously behaving normally are now exhibiting signs of infection one after the other. What type of malware is Kim likely dealing with?","opts":["Virus","Worm","Trojan horse","Logic bomb"],"ans":"B","expl":"Worms have built-in propagation mechanisms that do not require user interaction, such as scanning for systems containing known vulnerabilities and then exploiting those vulnera-bilities to gain access. Viruses and Trojan horses typically require user interaction to spread. Logic bombs do not spread from system to system but lie in wait until certain conditions are met, triggering the delivery of their payload."},{"ch":"PT1","ch_name":"模拟卷 1","no":20,"type":"multi","q":"Barb is reviewing the compliance obligations facing her organization and the types of liability that each one might incur. Which of the following laws and regulations may involve criminal penalties if violated? (Select all that apply.)","opts":["FERPA","HIPAA","SOX","PCI DSS"],"ans":"BC","expl":"The Health Insurance Portability and Accountability Act (HIPAA) is a U.S. law govern-ing the healthcare sector that does provide for criminal penalties. The Sarbanes–Oxley (SOX) Act governs publicly traded corporations and also provides for criminal penalties. The Family Educational Rights and Privacy Act (FERPA) is a U.S. law governing educational records, but it does not provide for criminal penalties. PCI DSS, the Payment Card Industry Data Security Standard, is an industry standard for credit card operations and handling. Because it is not a law, PCI DSS violations cannot incur criminal sanctions."},{"ch":"PT1","ch_name":"模拟卷 1","no":21,"type":"single","q":"Quentin is analyzing network traffic that he collected with Wireshark on a TCP/IP network. He would like to identify all new connections that were set up during his traffic collection. If he is looking for the three packets that constitute the TCP three-way handshake used to establish a new connection, what flags should be set on the first three packets?","opts":["SYN, ACK, SYN/ACK","PSH, RST, ACK","SYN, SYN/ACK, ACK","SYN, RST, FIN"],"ans":"C","expl":"The TCP three-way handshake consists of initial contact via a SYN, or synchronize flagged packet; which receives a response with a SYN/ACK, or synchronize and acknowledge flagged packet; which is acknowledged by the original sender with an ACK, or acknowledge packet. RST is used in TCP to reset a connection, PSH is used to send data immediately, and FIN is used to end a connection."},{"ch":"PT1","ch_name":"模拟卷 1","no":22,"type":"multi","q":"Daniel is selecting a new mobile device management (MDM) solution for his organization and is writing the RFP. He is trying to decide what features he should include as requirements after aligning his organization’s security needs with an MDM platform’s capabilities. Which of the following are typical capabilities of MDM solutions? (Select all that apply.)","opts":["Remotely wiping the contents of a mobile device","Assuming control of a nonregistered BYOD mobile device","Enforcing the use of device encryption","Managing device backups"],"ans":"ACD","expl":"MDM products do not have the capability of assuming control of a device not currently managed by the organization. This would be equivalent to hacking into a device\nowned by someone else and might constitute a crime. They do normally provide the ability to manage device backups, enforce the use of encryption, and remotely wipe the contents of mobile devices."},{"ch":"PT1","ch_name":"模拟卷 1","no":23,"type":"single","q":"Jim is implementing an IDaaS solution for his organization. What type of technology is he putting in place?","opts":["Identity as a service","Employee ID as a service","Intrusion detection as a service","OAuth"],"ans":"A","expl":"Identity as a service (IDaaS) provides an identity platform as a third-party ser-vice. This can provide benefits, including integration with cloud services and removing\noverhead for maintenance of traditional on-premises identity systems, but can also cre-ate risk due to third-party control of identity services and reliance on an off-site identity infrastructure."},{"ch":"PT1","ch_name":"模拟卷 1","no":24,"type":"single","q":"Gina recently took the CISSP certification exam and then wrote a blog post that included the text of many of the exam questions that she experienced. What aspect of the (ISC)2 Code of Ethics is most directly violated in this situation?","opts":["Advance and protect the profession.","Act honorably, honestly, justly, responsibly, and legally.","Protect society, the common good, necessary public trust and confidence, and the infra-structure.","Provide diligent and competent service to principals."],"ans":"A","expl":"Gina’s actions harm the CISSP certification and information security community by undermining the integrity of the examination process. While Gina also is acting dishonestly, the harm to the profession is more of a direct violation of the (ISC)2 Code of Ethics."},{"ch":"PT1","ch_name":"模拟卷 1","no":25,"type":"single","q":"Gordon is conducting a risk assessment for his organization and determined the amount of damage that flooding is expected to cause to his facilities each year. What metric has Gordon identified?","opts":["ALE","ARO","SLE","EF"],"ans":"A","expl":"The annualized loss expectancy (ALE) is the amount of damage that the organization expects to occur each year as the result of a given risk."},{"ch":"PT1","ch_name":"模拟卷 1","no":26,"type":"single","q":"Greg would like to implement application control technology in his organization. He would like to limit users to installing only approved software on their systems. What type of appli-cation control would be appropriate in this situation?","opts":["Blacklisting","Graylisting","Whitelisting","Bluelisting"],"ans":"C","expl":"The whitelisting approach to application control allows users to install only those software packages specifically approved by administrators. This would be an appropriate approach in a scenario where application installation needs to be tightly controlled."},{"ch":"PT1","ch_name":"模拟卷 1","no":27,"type":"single","q":"Frank is the security administrator for a web server that provides news and information to people located around the world. His server received an unusually high volume of traffic that it could not handle and was forced to reject requests. Frank traced the source of the traffic back to a botnet. What type of attack took place?","opts":["Denial-of-service","Reconnaissance","Compromise","Malicious insider"],"ans":"A","expl":"This is a clear example of a denial-of-service attack—denying legitimate users authorized access to the system through the use of overwhelming traffic. It goes beyond a reconnais-sance attack because the attacker is affecting the system, but it is not a compromise because the attacker did not attempt to gain access to the system. There is no reason to believe that a malicious insider was involved."},{"ch":"PT1","ch_name":"模拟卷 1","no":28,"type":"single","q":"In the database table shown here, which column would be the best candidate for a primary key?","opts":["Company ID","Company Name","ZIP Code","Sales Rep"],"ans":"A","expl":"The Company ID column is likely unique for each row in the table, making it the best choice for a primary key. There may be multiple companies that share the same name or ZIP code. Similarly, a single sales representative likely serves more than one company, making those fields unsuitable for use as a unique identifier."},{"ch":"PT1","ch_name":"模拟卷 1","no":29,"type":"single","q":"Gwen is a cybersecurity professional for a financial services firm that maintains records of their customers. These records include personal information about each customer, including the customer’s name, Social Security number, date and place of birth, and mother’s maiden name. What category best describes these records?","opts":["PHI","Proprietary data","PII","EDI"],"ans":"C","expl":"Personally identifiable information (PII) includes data that can be used to distinguish or trace that person’s identity and also includes information like their medical, educational, financial, and employment information. PHI is personal health information, EDI is electronic data interchange, and proprietary data is used to maintain an organization’s competitive advantage."},{"ch":"PT1","ch_name":"模拟卷 1","no":30,"type":"single","q":"Bob is configuring egress filtering on his network, examining traffic destined for the internet. His organization uses the public address range 12.8.195.0/24. Packets with which one of the following destination addresses should Bob permit to leave the network?","opts":["12.8.195.15","10.8.15.9","192.168.109.55","129.53.44.124"],"ans":"D","expl":"129.53.44.124 is a valid public IP address and a legitimate destination for traffic leaving Bob’s network. 12.8.195.15 is a public address on Bob’s network and should not be a des-tination address on a packet leaving the network. 10.8.15.9 and 192.168.109.55 are both private IP addresses that should not be routed to the internet."},{"ch":"PT1","ch_name":"模拟卷 1","no":31,"type":"single","q":"Brian is considering increasing the length of the cryptographic keys used by his organization. If he adds 8 bits to the encryption key, how many more possible keys will be added to the keyspace for the algorithm?","opts":["The size of the keyspace will double.","The size of the keyspace will increase by a factor of 8.","The size of the keyspace will increase by a factor of 64.","The size of the keyspace will increase by a factor of 256."],"ans":"D","expl":"Binary keyspaces contain a number of keys equal to 2 raised to the power of the number of bits. Two to the eighth power is 256, so the keyspace will increase by a factor of 256."},{"ch":"PT1","ch_name":"模拟卷 1","no":32,"type":"multi","q":"Which of the following data assets may be safely and effectively disposed of using shredding? (Select all that apply.)","opts":["Paper records","Credit cards","Removable media","SSD hard drives"],"ans":"ABCD","expl":"Traditional office shredding machines may be used for the disposal of paper records and, depending upon their grade, may also be able to shred credit cards. Industrial shredders are capable of destroying larger pieces of equipment, including removable media and hard drives."},{"ch":"PT1","ch_name":"模拟卷 1","no":33,"type":"single","q":"GAD Systems is concerned about the risk of hackers stealing sensitive information stored on a file server. They choose to pursue a risk mitigation strategy. Which one of the following actions would support that strategy?","opts":["Encrypting the files","Deleting the files","Purchasing cyber-liability insurance","Taking no action"],"ans":"A","expl":"Encrypting the files reduces the probability that the data will be successfully stolen, so it is an example of risk mitigation. Deleting the files would be risk avoidance. Purchasing insur-ance would be risk transference. Taking no action would be risk acceptance."},{"ch":"PT1","ch_name":"模拟卷 1","no":34,"type":"single","q":"Viola is conducting a user account audit to determine whether accounts have the appropriate level of permissions and that all permissions were approved through a formal process. The organization has approximately 50,000 user accounts and an annual employee turnover rate of 24 percent. Which one of the following sampling approaches would be the most effective use of her time when choosing records for manual review?","opts":["Select all records that have been modified during the past month.","Ask access administrators to identify the accounts most likely to have issues and audit those.","Select a random sample of records, either from the entire population or from the population of records that have changed during the audit period.","Sampling is not effective in this situation, and all accounts should be audited."],"ans":"C","expl":"Sampling should be done randomly to avoid human bias. Sampling is an effective pro-cess if it is done on a truly random sample of sufficient size to provide effective coverage of the userbase. It is infeasible for a single person to review every single record. In an organi-zation of 50,000 users with a 24 percent annual turnover, it is likely that at least 1,000 of those records have changed in the last month. This is still too many records to review. Asking account administrators to select the records to review is a conflict of interest, as they are the group being audited."},{"ch":"PT1","ch_name":"模拟卷 1","no":35,"type":"single","q":"Lila is reviewing her organization’s adverse termination process. In that process, when would be the most appropriate time to revoke a user’s access privileges to digital systems?","opts":["At the time the user is informed of the termination","At the end of the last day of employment","At the time the decision is made","Several days after the last day of employment"],"ans":"A","expl":"In the case of an involuntary termination under adverse circumstances, the user is being fired and may have a negative and potentially hostile reaction. For this reason, it is impor-tant to terminate access immediately upon the user being informed of the termination. Terminating access prior to notification may tip the user off to the termination in advance. Leaving access privileges available after termination poses a risk of malicious insider activity."},{"ch":"PT1","ch_name":"模拟卷 1","no":37,"type":"single","q":"Roger is reviewing a list of security vulnerabilities in his organization and rating them based upon their severity. Which one of the following models would be most useful to his work?","opts":["CVSS","STRIDE","PASTA","ATT&CK"],"ans":"A","expl":"The Common Vulnerability Scoring System (CVSS) is a standardized approach to rat-ing the severity of vulnerabilities and would be the most helpful tool for Roger’s work. The STRIDE and ATT&CK models are used to classify the nature, not the severity, of threats. The PASTA model is designed to help with countermeasure selection."},{"ch":"PT1","ch_name":"模拟卷 1","no":38,"type":"single","q":"An attacker recently called an organization’s help desk and persuaded them to reset a pass-word for another user’s account. What term best describes this attack?","opts":["A human Trojan","Social engineering","Phishing","Whaling"],"ans":"B","expl":"Social engineering exploits humans to allow attacks to succeed. Since help-desk employees are specifically tasked with being helpful, they may be targeted by attackers posing as legit-imate employees. Trojans are a type of malware, whereas phishing is a targeted attack via electronic communication methods intended to capture passwords or other sensitive data. Whaling is a type of phishing aimed at high-profile or important targets."},{"ch":"PT1","ch_name":"模拟卷 1","no":39,"type":"single","q":"Greg is evaluating a new vendor that will be supplying networking gear to his organiza-tion. Due to the nature of his organization’s work, Greg is concerned that an attacker might attempt a supply chain exploit. Assuming that both Greg’s organization and the vendor operate under reasonable security procedures, which one of the following activities likely poses the greatest supply chain risk to the equipment?","opts":["Tampering by an unauthorized third party at the vendor’s site","Interception of devices in transit","Misconfiguration by an administrator after installation","Tampering by an unauthorized third party at Greg’s site"],"ans":"B","expl":"If the vendor operates with reasonable security procedures, it is unlikely that the devices will be tampered with at the vendor’s site. Similarly, if Greg’s organization has reasonable security procedures, tampering at his site is also unlikely. Misconfiguration by an adminis-trator is always possible, but this is a post-installation risk and not a supply chain risk. It is possible that devices will be intercepted and tampered with while in transit from the vendor to Greg’s organization."},{"ch":"PT1","ch_name":"模拟卷 1","no":40,"type":"single","q":"Kevin is operating in a single-level security environment and is seeking to classify information systems according to the type of information that they process. What procedure would be the best way for him to assign asset classifications?\nFor questions 41–43, please refer to the following scenario:","opts":["Assign systems the classification of information that they most commonly process.","Assign systems the classification of the highest level of information that they are expected to process regularly.","Assign systems the classification of the highest level of information that they are ever expected to process.","Assign all systems the same classification level."],"ans":"C","expl":"In a single-level security environment, systems should be assigned the classification level of the highest classification of information they are ever expected to process. Systems may not process information that is above their classification level without reclassifying the system upwards."},{"ch":"PT1","ch_name":"模拟卷 1","no":44,"type":"single","q":"Dave is responsible for password security in his organization and would like to strengthen the security of password files. He would like to defend his organization against the use of rainbow tables. Which one of the following techniques is specifically designed to frustrate the use of rainbow tables?","opts":["Password expiration policies","Salting","User education","Password complexity policies"],"ans":"B","expl":"Rainbow tables use precomputed password hashes to conduct cracking attacks against password files. They may be frustrated by the use of salting, which adds a specified value to the password prior to hashing, making it much more difficult to perform precomputa-tion. Password expiration policies, password complexity policies, and user education may all contribute to password security, but they are not direct defenses against the use of rainbow tables."},{"ch":"PT1","ch_name":"模拟卷 1","no":45,"type":"single","q":"Helen recently built a new system as part of her organization’s deception campaign. The system is configured in a manner that makes it vulnerable to attack and that conveys that it might contain highly sensitive information. What term best describes this system?","opts":["Honeynet","Darknet","Honeypot","Pseudoflaw"],"ans":"C","expl":"A honeypot is a decoy computer system used to bait intruders into attacking. A hon-eynet is a network of multiple honeypots that creates a more sophisticated environment for intruders to explore. A pseudoflaw is a false vulnerability in a system that may attract an attacker. A darknet is a segment of unused network address space that should have no net-work activity and, therefore, may be easily used to monitor for illicit activity."},{"ch":"PT1","ch_name":"模拟卷 1","no":46,"type":"single","q":"Nandi is evaluating a set of candidate systems to replace a biometric authentication mecha-nism in her organization. What metric would be the best way to compare the effectiveness of the different systems?","opts":["FAR","FRR","CER","FDR"],"ans":"C","expl":"The false acceptance rate (FAR) is the rate at which the system inadvertently admits an unauthorized user, while the false rejection rate (FRR) is the rate at which the system inad-vertently rejects an authorized user. Both the FAR and FRR may be modified by adjusting the sensitivity of the system. The crossover error rate (CER) is the point where both the false\nacceptance rate and the false rejection rate cross. The CER is less subject to manipulation and is, therefore, the best metric to use for evaluating systems. The FDR is not a metric used to evaluate authentication systems."},{"ch":"PT1","ch_name":"模拟卷 1","no":48,"type":"single","q":"Roger is concerned that a third-party firm hired to develop code for an internal application will embed a backdoor in the code. The developer retains rights to the intellectual property and will only deliver the software in its final form. Which one of the following languages would be least susceptible to this type of attack because it would provide Roger with code that is human-readable in its final form?","opts":["JavaScript","C","C++","Java"],"ans":"A","expl":"JavaScript is an interpreted language so the code is not compiled prior to execution, allowing Roger to inspect the contents of the code. C, C++, and Java are all compiled languages—a compiler produces an executable file that is not human-readable."},{"ch":"PT1","ch_name":"模拟卷 1","no":49,"type":"single","q":"Jesse is looking at the /etc/passwd file on a system configured to use shadowed pass-words. What should she expect to see in the password field of this file?","opts":["Plaintext passwords","Encrypted passwords","Hashed passwords","x"],"ans":"D","expl":"When a system is configured to use shadowed passwords, the /etc/passwd file contains only the character x in the place of a password. It would not contain any passwords, in either plaintext, encrypted, or hashed form."},{"ch":"PT1","ch_name":"模拟卷 1","no":50,"type":"single","q":"Rob recently received a notice from a vendor that the EOL date is approaching for a firewall platform that is used in his organization. What action should Rob take?","opts":["Prepare to discontinue use of the platform as soon as possible.","Immediately discontinue use of the device.","Prepare to discontinue use of the device as part of the organization’s normal planning cycle.","No action is necessary."],"ans":"C","expl":"The end-of-life (EOL) date for a product is normally the date that the vendor will stop selling a product. It is reasonable to continue using the product as long as support remains available. Rob should begin making plans to discontinue use of the product, pending the announcement of an end-of-support (EOS) date."},{"ch":"PT1","ch_name":"模拟卷 1","no":51,"type":"single","q":"What principle states that an individual should make every effort to complete his or her responsibilities in an accurate and timely manner?","opts":["Least privilege","Separation of duties","Due care","Due diligence"],"ans":"D","expl":"The due care principle states that an individual should react in a situation using the same level of care that would be expected from any reasonable person. It is a very broad stan-dard. The due diligence principle is a more specific component of due care that states that an individual assigned a responsibility should exercise due care to complete it accurately and in a timely manner. Least privilege says that an individual should have the minimum set of per-missions necessary to carry out their work. Separation of duties says that no single person should have the right to perform two distinct tasks, which, when combined, constitute a highly privileged action."},{"ch":"PT1","ch_name":"模拟卷 1","no":52,"type":"single","q":"Tony is developing a data classification system for his organization. What factor should he use as the primary driver when determining the classification level of each category of information?","opts":["Sensitivity","Source","Likelihood of theft","Likelihood of data loss"],"ans":"A","expl":"Information should be classified based upon its sensitivity. This may be due to the value of the information to the organization, the damage caused if lost or compromised, or other factors. The source of the information is one possible contributing factor to the sensitivity level. The likelihood of loss or theft is a component of risk, but does not contribute to the classification level."},{"ch":"PT1","ch_name":"模拟卷 1","no":53,"type":"single","q":"Perry is establishing information handling requirements for his organization. He discovers that the organization often needs to send sensitive information over the internet to a supplier and is concerned about it being intercepted. What handling requirement would best protect against this risk?","opts":["Require the use of transport encryption.","Require proper classification and labeling.","Require the use of data loss prevention technology.","Require the use of storage encryption."],"ans":"A","expl":"All of these controls are good practices for protecting sensitive information. However, Perry is most concerned about the risk of interception while in transit over the internet. Transport encryption would, therefore, be the most appropriate control, as anyone inter-cepting the information would be unable to read its contents. Storage encryption would protect against the theft of information at rest, rather than in transit over a network. Classification and labeling would not protect against interception. Data loss prevention technology may block the transfer entirely and would not meet the business requirement if it blocked the transmission and would not meet the security requirement if it did not detect the data transfer."},{"ch":"PT1","ch_name":"模拟卷 1","no":54,"type":"multi","q":"John is developing a tangible asset inventory for his organization. Which of the following items would most likely be included in this inventory? (Select all that apply.)","opts":["Intellectual property","Server hardware","Files stored on servers","Mobile devices"],"ans":"BD","expl":"Tangible asset inventories include physical items owned by the organization. This would include server hardware and mobile devices. Intellectual property and files stored on a server are not tangible property and would instead be included in an intangible asset inventory."},{"ch":"PT1","ch_name":"模拟卷 1","no":55,"type":"single","q":"Maria is analyzing a security incident where she believes that an attacker gained access to a fiber-optic cable and installed a tap on that cable. What layer of the OSI model did this attack occur at?","opts":["Transport","Network","Data Link","Physical"],"ans":"D","expl":"The Physical layer deals with the electrical impulses or optical pulses that are sent as bits to convey data. This is the layer where cable tapping would occur. Attacks at the Data Link, Network, or Transport layers would involve higher levels of activity in the OSI model, such as compromising a device and using a protocol analyzer to sniff network traffic."},{"ch":"PT1","ch_name":"模拟卷 1","no":56,"type":"single","q":"Bert is considering the use of an infrastructure as a service cloud computing partner to provide virtual servers. Which one of the following would be a vendor responsibility in this scenario?","opts":["Maintaining the hypervisor","Managing operating system security settings","Maintaining the host firewall","Configuring server access control"],"ans":"A","expl":"In an IaaS server environment, the customer retains responsibility for most server security operations under the shared responsibility model. This includes managing OS security set-tings, maintaining host firewalls, and configuring server access control. The vendor would be responsible for all security mechanisms at the hypervisor layer and below."},{"ch":"PT1","ch_name":"模拟卷 1","no":57,"type":"single","q":"When Ben records data and then replays it against his test website to verify how it performs based on a real production workload, what type of performance monitoring is he undertaking?","opts":["Passive","Proactive","Reactive","Replay"],"ans":"B","expl":"Proactive monitoring, aka synthetic monitoring, uses recorded or generated traffic to test systems and software. Passive monitoring uses a network span, tap, or other device to capture traffic to be analyzed. Reactive and replay are not industry terms for types of monitoring."},{"ch":"PT1","ch_name":"模拟卷 1","no":58,"type":"single","q":"Kailey is reviewing a set of old records maintained by her organization and wants to dispose of them securely. She is unsure how long the organization should keep the records because they involve tax data. How can Kailey determine whether the records may be disposed?","opts":["Consult the organization’s records retention policy.","Consult IRS requirements.","Retain the records for at least seven years.","Retain the records permanently."],"ans":"A","expl":"Kailey should consult her organization’s record retentions policy to determine the appropriate length of time to preserve the records. The organization may be subject to tax requirements in this regard, and many accountants recommend preserving records for at least seven years, but the organization’s own requirements may be stricter than these requirements."},{"ch":"PT1","ch_name":"模拟卷 1","no":60,"type":"single","q":"Mark is planning a disaster recovery test for his organization. He would like to perform a live test of the disaster recovery facility but does not want to disrupt operations at the pri-mary facility. What type of test should Mark choose?","opts":["Full interruption test","Checklist review","Parallel test","Tabletop exercise"],"ans":"C","expl":"During a parallel test, the team actually activates the disaster recovery site for testing, but the primary site remains operational. During a full interruption test, the team takes down the primary site and confirms that the disaster recovery site is capable of handling regular oper-ations. The full interruption test is the most thorough test but also the most disruptive. The checklist review is the least disruptive type of disaster recovery test. During a checklist review, team members each review the contents of their disaster recovery checklists on their own and suggest any necessary changes. During a tabletop exercise, team members come together and walk through a scenario without making any changes to information systems."},{"ch":"PT1","ch_name":"模拟卷 1","no":61,"type":"single","q":"Which one of the following is not a principle of the Agile approach to software development?","opts":["The best architecture, requirements, and designs emerge from self-organizing teams.","Deliver working software infrequently, with an emphasis on creating accurate code over longer timelines.","Welcome changing requirements, even late in the development process.","Simplicity is essential."],"ans":"B","expl":"The Agile approach to software development embraces 12 core principles, found in the Agile Manifesto. One of these principles is that the best architecture, requirements, and designs emerge from self-organizing teams. Another is that teams should welcome chang-ing requirements at any step in the process. A third is that simplicity is essential. The Agile approach emphasizes delivering software frequently, not infrequently."},{"ch":"PT1","ch_name":"模拟卷 1","no":62,"type":"single","q":"During a security audit, Susan discovers that the organization is using hand geometry scan-ners as the access control mechanism for their secure data center. What recommendation should Susan make about the use of hand geometry scanners?","opts":["They have a high FRR and should be replaced.","A second factor should be added because they are not a good way to reliably distinguish individuals.","The hand geometry scanners provide appropriate security for the data center and should be considered for other high-security areas.","They may create accessibility concerns, and an alternate biometric system should be considered."],"ans":"B","expl":"Hand geometry scanners assess the physical dimensions of an individual’s hand but do not verify other unique factors about the individual, or even verify if they are alive. This means that hand geometry scanners should not be implemented as the sole authentication factor\nfor secure environments. Hand geometry scanners do not have an abnormally high FRR and do not stand out as a particular issue from an accessibility standpoint compared to other biometric systems."},{"ch":"PT1","ch_name":"模拟卷 1","no":63,"type":"single","q":"Colleen is conducting a business impact assessment for her organization. What metric provides important information about the amount of time that the organization may be without a service before causing irreparable harm?","opts":["MTD","ALE","RPO","RTO"],"ans":"A","expl":"The maximum tolerable downtime (MTD) is the amount of time that a business may be without a service before irreparable harm occurs. This measure is sometimes also called maximum tolerable outage (MTO) or maximum allowable downtime (MAD)."},{"ch":"PT1","ch_name":"模拟卷 1","no":64,"type":"single","q":"Bailey is concerned that users around her organization are using sensitive information in a variety of cloud services and would like to enforce security policies consistently across those services. What security control would be best suited for her needs?","opts":["DRM","IPS","CASB","DLP"],"ans":"C","expl":"Cloud access security brokers (CASB) are designed to enforce security policies consistently across cloud services and would best meet Bailey’s needs. Data loss prevention (DLP) and digital rights management (DRM) solutions may be able to detect, block, and control some use of information in the cloud, but they would not provide a way to consistently enforce security policies across cloud platforms. Intrusion prevention systems (IPS) are designed to detect and block malicious activity and would not be relevant in this scenario."},{"ch":"PT1","ch_name":"模拟卷 1","no":65,"type":"multi","q":"Matt is designing a set of information handling requirements for his organization and would like to draw upon common industry practices. Which of the following practices should Matt implement? (Select all that apply.)","opts":["Labeling both paper and electronic documents with their classification level","Automatically granting senior executives full access to all classified information","Automatically granting visitors access to information classified at the lowest level of sen-sitivity","Encrypting sensitive information in storage and at rest"],"ans":"AD","expl":"Organizations should always label classified information in whatever form, paper or electronic, that it appears. This allows employees to apply proper handling procedures. It is also a common practice to encrypt sensitive information both at rest and in transit. Organizations should grant access to classified information on a need-to-know basis.\nAutomatically granting access to information, whether it is to a visitor or a senior executive, should not occur."},{"ch":"PT1","ch_name":"模拟卷 1","no":66,"type":"single","q":"Jerry is investigating an attack where the attacker stole an authentication token from a user’s web session and used it to impersonate the user on the site. What term best describes
