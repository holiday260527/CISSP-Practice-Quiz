 to match users with rights. Logins are used to vali-date a user."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":31,"type":"single","q":"Alex has been employed by his company for more than a decade and has held a number of positions in the company. During an audit, it is discovered that he has access to shared folders and applications because of his former roles. What issue has Alex’s company encountered?","opts":["Excessive provisioning","Unauthorized access","Privilege creep","Account review"],"ans":"C","expl":"Privilege creep occurs when users retain from roles they held previously rights they do not need to accomplish their current job. Unauthorized access occurs when an unauthorized user accesses files. Excessive provisioning is not a term used to describe permissions issues, and account review would help find issues like this."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":32,"type":"single","q":"Geoff wants to prevent privilege escalation attacks in his organization. Which of the following practices is most likely to prevent horizontal privilege escalation?","opts":["Multifactor authentication","Limiting permissions for groups and accounts","Disabling unused ports and services","Sanitizing user inputs to applications"],"ans":"A","expl":"Multifactor authentication is most likely to limit horizontal privilege escalation by making it difficult to access user accounts and to authenticate to a compromised account. Limiting permissions for groups and accounts can also help, but disabling unused ports and services and sanitizing user inputs both address threats that are most frequently associated with vertical privilege escalation attacks."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":33,"type":"single","q":"Jim’s Microsoft Exchange environment includes servers that are located in local data\n• centers at multiple business offices around the world as well as an Office 365 deployment for employees who are not located at one of those offices. Identities are created and used in both environments and will work in both. What type of federated system is Jim running?","opts":["A primary cloud system","A primary on-premise system","A hybrid system","A multitenant system"],"ans":"C","expl":"Hybrid systems use both on-premises and cloud identity and services to provide resources and tools in both environments. While they can be complex, hybrid systems also provide\na migration path to a fully cloud deployment or for a fault tolerant design that can handle on-premises or cloud outages while remaining functional."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":34,"type":"single","q":"What type of access control scheme is shown in the following table?","opts":["RBAC","DAC","MAC","TBAC"],"ans":"C","expl":"Mandatory access controls use a lattice or matrix to describe how classification labels relate to each other. In this image, classification levels are set for each of the labels shown. A discretionary access control (DAC) system would show how the owner of the objects allows access. RBAC could be either rule- or role-based access control and would use either system-wide rules or roles. Task-based access control (TBAC) would list tasks for users."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":35,"type":"single","q":"Michelle’s company is creating a new division by splitting the marketing and communica-tions departments into two separate groups. She wants to create roles that provide access to resources used by each group. What should she do to maintain the appropriate security and rights for each group?","opts":["Put both the marketing and communications teams into the existing group because they will have similar access requirements.","Keep the marketing team in the existing group and create a new communications group based on their specific needs.","Keep the communications team in the existing group and create a new marketing group based on their specific needs.","Create two new groups, assess which rights they need to perform their roles, and then add additional rights if required."],"ans":"D","expl":"Copying existing rights to new groups that have different needs will often result in overly broad privileges. Michelle should create new groups, move all staff into the appropriate groups, and then ensure that they have the access and permissions they need."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":36,"type":"single","q":"When a subject claims an identity, what process is occurring?","opts":["Login","Identification","Authorization","Token presentation"],"ans":"B","expl":"The process of a subject claiming or professing an identity is known as identification. Authorization verifies the identity of a subject by checking a factor like a password. Logins typically include both identification and authorization, and token presentation is a type of authentication."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":37,"type":"single","q":"Dogs, guards, and fences are all common examples of what type of control?","opts":["Detective","Recovery","Administrative","Physical"],"ans":"D","expl":"Dogs, guards, and fences are all examples of physical controls. While dogs and guards might detect a problem, fences cannot, so they are not all examples of detective controls. None of these controls would help repair or restore functionality after an issue, and thus they are not recovery controls, nor are they administrative controls that involve policy or proce-dures, although the guards might refer to them when performing their duties."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":38,"type":"single","q":"Susan’s organization is updating its password policy and wants to use the strongest possible passwords. What password requirement will have the highest impact in preventing brute-force attacks?","opts":["Change maximum age from 1 year to 180 days.","Increase the minimum password length from 8 characters to 16 characters.","Increase the password complexity so that at least three character classes (such as upper-case, lowercase, numbers, and symbols) are required.","Retain a password history of at least four passwords to prevent reuse."],"ans":"B","expl":"Password complexity is driven by length, and a longer password will be more effective against brute-force attacks than a shorter password. Each character of additional length increases the difficulty by the size of the potential character set (for example, a single lowercase character makes the passwords 26 times more difficult to crack). While each of the other settings is useful for a strong password policy, they won’t have the same impact on brute-force attacks."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":39,"type":"single","q":"Alaina is performing a regularly scheduled review for service accounts. Which of the follow-ing events should she be most concerned about?","opts":["An interactive login for the service account","A password change for the service account","Limitations placed on the service account’s rights","Local use of the service account"],"ans":"A","expl":"Interactive login for a service account is a critical warning sign, either of compromise or bad administrative practices. In either case, Alaina should immediately work to determine why the account logged in, what occurred, and if the interactive login was done remotely or locally. A remote interactive login for a service account in any professionally maintained envi-ronment is an almost guaranteed sign of compromise. Password changes for service accounts may be done as part of ongoing password expiration processes, limitations should always be\nplaced on service accounts rights to ensure that they are only those required, and a local use of the service account as part of the service is a normal event."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":40,"type":"single","q":"When might an organization using biometrics choose to allow a higher FRR instead of a higher FAR?","opts":["When security is more important than usability","When false rejection is not a concern due to data quality","When the CER of the system is not known","When the CER of the system is very high"],"ans":"A","expl":"Organizations that have very strict security requirements that don’t have a tolerance for false acceptance want to lower the false acceptance rate, or FAR, to be as near to zero as possible. That often means that the false rejection rate, or FRR, increases. Different bio-\nmetric technologies or a better registration method can help improve biometric performance, but false rejections due to data quality are not typically a concern with modern biometric systems. In this case, knowing the crossover error rate, or CER, or having a very high CER doesn’t help the decision."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":41,"type":"single","q":"After recent reports of undesired access to workstations after hours, Derek has been asked to find a way to ensure that maintenance staff cannot log in to workstations in business offices. The maintenance staff members do have systems in their break rooms and their offices for the organization, which they still need access to. What should Derek do to meet this need?","opts":["Require multifactor authentication and only allow office staff to have multifactor tokens.","Use rule-based access control to prevent logins after hours in the business area.","Use role-based access control by setting up a group that contains all maintenance staff and then give that group rights to log into only the designated workstations.","Use geofencing to only allow logins in maintenance areas."],"ans":"C","expl":"The most efficient use of Derek’s time would be to create a group that is populated with all maintenance staff and then to give that group login rights only to the designated PCs. While time-based constraints might help, in this case, it would continue to allow maintenance staff to log in to PCs they are not intended for use during business hours, leaving a gap in\nthe control. Multifactor authentication as described does not meet the requirements of the scenario but may be a good idea overall for greater security for authentication across the organization. Geofencing is typically not accurate enough to rely on inside of buildings for specific PCs."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":42,"type":"multi","q":"Nick wants to do session management for his web application. Which of the following are common web application session management techniques or methods? (Select all that apply.)\nFor questions 43–45, please use your knowledge of SAML integrations and security architecture design and refer to the following scenario and diagram:","opts":["IP tracking","Cookies","URL rewriting","TLS tokens"],"ans":"BC","expl":"Common session management techniques include the use of cookies, hidden form fields, URL rewriting, and built-in frameworks like Java’s HTTPSession. IP tracking may be included in session information but is not itself a complete session identifier, and TLS token binding is used to make TLS sessions more secure, not to provide session identification."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":46,"type":"single","q":"Susan has been asked to recommend whether her organization should use a MAC scheme or a DAC scheme. If flexibility and scalability are important requirements for implementing access controls, which scheme should she recommend and why?","opts":["MAC, because it provides greater scalability and flexibility because you can simply add more labels as needed","DAC, because allowing individual administrators to make choices about the objects they control provides scalability and flexibility","MAC, because compartmentalization is well suited to flexibility and adding compartments will allow it to scale well","DAC, because a central decision process allows quick responses and will provide scalability by reducing the number of decisions required and flexibility by moving those decisions to a central authority"],"ans":"B","expl":"Discretionary access control (DAC) can provide greater scalability by leveraging many administrators, and those administrators can add flexibility by making decisions about access to their objects without fitting into an inflexible mandatory access control system (MAC). MAC is more secure due to the strong set of controls it provides, but it does not scale as well as DAC and is relatively inflexible in comparison."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":47,"type":"single","q":"Which of the following tools is not typically used to verify that a provisioning process was followed in a way that ensures that the organization’s security policy is being followed?","opts":["Log review","Manual review of permissions","Signature-based detection","Review the audit trail"],"ans":"C","expl":"While signature-based detection is used to detect attacks, review of provisioning processes typically involves checking logs, reviewing the audit trail, or performing a manual review of permissions granted during the provisioning process."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":48,"type":"single","q":"Jessica needs to send information about services she is provisioning to a third-party organiza-tion. What standards-based markup language should she choose to build the interface?","opts":["SAML","SOAP","SPML","XACML"],"ans":"C","expl":"Service Provisioning Markup Language, or SPML, is an XML-based language designed to allow platforms to generate and respond to provisioning requests. SAML is used to make authorization and authentication data, while XACML is used to describe access controls. SOAP, or Simple Object Access Protocol, is a messaging protocol and could be used for any XML messaging but is not a markup language itself."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":49,"type":"single","q":"During a penetration test, Chris recovers a file containing hashed passwords for the system he is attempting to access. What type of attack is most likely to succeed against the hashed passwords?","opts":["A brute-force attack","A pass-the-hash attack","A rainbow table attack","A salt recovery attack"],"ans":"C","expl":"Rainbow tables are databases of pre-hashed passwords paired with high-speed lookup functions. Since they can quickly compare known hashes against those in a file, using rainbow tables is the fastest way to quickly determine passwords from hashes. A brute-force attack may eventually succeed but will be very slow against most hashes. Pass-the-hash attacks rely on sniffed or otherwise acquired NTLM or LanMan hashes being sent to a system to avoid the need to know a user’s password. Salts are data added to a hash to avoid the use of tools like rainbow tables. A salt added to a password means the hash won’t match a rainbow table generated without the same salt."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":50,"type":"single","q":"Google’s identity integration with a variety of organizations and applications across domains is an example of which of the following?","opts":["PKI","Federation","Single sign-on","Provisioning"],"ans":"B","expl":"Google’s federation with other applications and organizations allows single sign-on as well as management of their electronic identity and its related attributes. While this is an example of SSO, it goes beyond simple single sign-on. Provisioning provides accounts and rights, and a public key infrastructure is used for certificate management."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":51,"type":"single","q":"Amanda starts at her new job and finds that she has access to a variety of systems that she does not need to accomplish her job. What problem has she encountered?","opts":["Privilege creep","Rights collision","Least privilege","Excessive privileges"],"ans":"D","expl":"When users have more rights than they need to accomplish their job, they have excessive privileges. This is a violation of the concept of least privilege. Unlike creeping privileges, this is a provisioning or rights management issue rather than a problem of retention of rights the user needed but no longer requires. Rights collision is a made-up term and thus is not an issue here."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":52,"type":"single","q":"When Chris verifies an individual’s identity and adds a unique identifier like a user ID to an identity system, what process has occurred?","opts":["Identity proofing","Registration","Directory management","Session management"],"ans":"B","expl":"Registration is the process of adding a user to an identity management system. This includes creating their unique identifier and adding any attribute information that is associ-ated with their identity. Proofing occurs when the user provides information to prove who they are. Directories are managed to maintain lists of users, services, and other items. Session management tracks application and user sessions."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":53,"type":"multi","q":"Selah wants to provide accountability for actions performed via her organization’s main line of business application. What controls are most frequently used to provide accountability in a situation like this? (Select all that apply.)","opts":["Enable audit logging.","Provide every staff member with a unique account and enable multifactor authentica-tion.","Enable time- and location-based login requirements.","Provide every staff member with a unique account and require a self-selected password."],"ans":"AB","expl":"Audit logging when combined with user accounts that can reliably be expected to only be accessible to a specific user due to the use of multifactor authentication is frequently used to provide strong accountability for actions taken via systems and applications. A password can be shared, making it less reliable, and time and location requirements are useful security controls but do not impact accountability."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":54,"type":"single","q":"Charles wants to provide authorization services as part of his web application. What stan-dard should he use if he wants to integrate easily with other web identity providers?","opts":["OpenID","TACACS+","RADIUS","OAuth"],"ans":"D","expl":"OAuth is the most widely used open standard for authorization and delegation of rights for cloud services. OpenID is used for authentication, and TACAC+ and RADIUS are primarily used on-site for authentication and authorization for network devices."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":55,"type":"single","q":"The company that Cameron works for uses a system that allows users to request privileged access to systems when necessary. Cameron requests access, and the request is pre-approved due to his role. He is then able to access the system to perform the task. Once he is done, the rights are removed. What type of system is he using?","opts":["Zero trust","Federated identity management","Single sign-on","Just-in-time access"],"ans":"D","expl":"Cameron is using a just-in-time (JIT) system that provides the access needed when it is needed. A zero trust system requires authentication and authorization when actions are\nperformed but does not necessarily require privileges to be granted and removed when they are needed."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":56,"type":"single","q":"Elle is responsible for building a banking website. She needs proof of the identity of the users who register for the site. How should she validate user identities?","opts":["Require users to create unique questions that only they will know.","Require new users to bring their driver’s license or passport in person to the bank.","Use information that both the bank and the user have such as questions pulled from their credit report.","Call the user on their registered phone number to verify that they are who they claim to be."],"ans":"C","expl":"Identity proofing can be done by comparing user information that the organization already has, like account numbers or personal information. Requiring users to create unique questions can help with future support by providing a way for them to do password resets. Using a phone call only verifies that the individual who created the account has the phone that they registered and won’t prove their identity. In-person verification would not fit the business needs of most websites."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":57,"type":"single","q":"Susan’s organization is part of a federation that allows users from multiple organizations to access resources and services at other federated sites. When Susan wants to use a service at a partner site, which identity provider is used?","opts":["Susan’s home organization’s identity provider","The service provider’s identity provider","Both their identity provider and the service provider’s identity provider","The service provider creates a new identity"],"ans":"A","expl":"Federations use a user’s home organization’s identity provider (IDP). Service providers query those identity providers when the user attempts to authenticate to the service and, if the request is validated, allow access based on the rules and policies set for the service based on attributes that may be relevant that are provided by the IDP."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":58,"type":"single","q":"A new customer at a bank that uses fingerprint scanners to authenticate its users is surprised when he scans his fingerprint and is logged in to another customer’s account. What type of biometric factor error occurred?","opts":["A registration error","A Type 1 error","A Type 2 error","A time of use, method of use error"],"ans":"C","expl":"Type 2 errors occur in biometric systems when an invalid subject is incorrectly authen-ticated as a valid user. In this case, nobody except the actual customer should be validated when fingerprints are scanned. Type 1 errors occur when a valid subject is not authenticated; if the existing customer was rejected, it would be a Type 1 error. Registration is the process of adding users, but registration errors and time of use, method of use errors are not specific biometric authentication terms."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":59,"type":"single","q":"What type of access control is typically used by firewalls?","opts":["Discretionary access controls","Rule-based access controls","Task-based access control","Mandatory access controls"],"ans":"B","expl":"Firewalls use rule-based access control, or Rule-BAC, in their access control lists and apply rules created by administrators to all traffic that passes through them. DAC, or discretionary access control, allows owners to determine who can access objects they control, while task-based access control lists tasks for users. MAC, or mandatory access control, uses classifications to determine access."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":60,"type":"single","q":"When you input a user ID and password, you are performing what important identity and access management activity?","opts":["Authorization","Validation","Authentication","Login"],"ans":"C","expl":"When you input a username and password, you are authenticating yourself by providing a unique identifier and a verification that you are the person who should have that identi-fier (the password). Authorization is the process of determining what a user is allowed to do. Validation and login both describe elements of what is happening in the process; however, they aren’t the most important identity and access management activity."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":61,"type":"single","q":"Kathleen works for a data center hosting facility that provides physical data center space for individuals and organizations. Until recently, each client was given a magnetic-strip-based keycard to access the section of the facility where their servers are located, and they were also given a key to access the cage or rack where their servers reside. In the past month, a number of servers have been stolen, but the logs for the passcards show only valid IDs. What is Kathleen’s best option to make sure that the users of the passcards are who they are sup-posed to be?","opts":["Add a reader that requires a PIN for passcard users.","Add a camera system to the facility to observe who is accessing servers.","Add a biometric factor.","Replace the magnetic stripe keycards with smartcards."],"ans":"C","expl":"Kathleen should implement a biometric factor. The cards and keys are an example of a Type 2 factor, or “something you have.” Using a smart card replaces this with another Type 2 factor, but the cards could still be loaned out or stolen. Adding a PIN suffers from the same problem: a PIN can be stolen. Adding cameras doesn’t prevent access to the facility and thus doesn’t solve the immediate problem (but it is a good idea!)."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":62,"type":"single","q":"Theresa wants to allow her staff to securely store and manage passwords for systems including service accounts and other rarely used administrative credentials. What type of tool should she implement to enable this?","opts":["Single sign-on","A federated identity system","A password manager","A multifactor authentication system"],"ans":"C","expl":"Enterprise password management tools allow passwords to be securely generated, stored, and managed. They can provide logs of who uses passwords, when they were updated, and if they meet complexity and other requirements. Of course, this means that the keys to your\nenvironment are all in one place, so securing and managing the enterprise password manager is very important!"},{"ch":"D5","ch_name":"域5 身份与访问管理","no":63,"type":"single","q":"Olivia wants to limit the commands that a user can run via sudo to limit the potential for privilege escalation attacks. What Linux file should she modify to allow this?","opts":["The bash .bin configuration file","The sudoers file","The bash .allowed configuration file","The sudont file"],"ans":"B","expl":"The sudoers file can list the specific users who can use sudo as well as the commands or directories that are allowed for them."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":64,"type":"single","q":"Which objects and subjects have a label in a MAC model?\nFor questions 65–67, please refer to the following scenario and diagram:","opts":["Objects and subjects that are classified as Confidential, Secret, or Top Secret have a label.","All objects have a label, and all subjects have a compartment.","All objects and subjects have a label.","All subjects have a label and all objects have a compartment."],"ans":"C","expl":"In a mandatory access control system, all subjects and objects have a label. Compartments may or may not be used, but there is not a specific requirement for either subjects or objects to be compartmentalized. The specific labels of Confidential, Secret, and Top Secret are not required by MAC."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":68,"type":"single","q":"Questions like “What is your pet’s name?” are examples of what type of identity proofing?","opts":["Knowledge-based authentication","Dynamic knowledge-based authentication","Out-of-band identity proofing","A Type 3 authentication factor"],"ans":"A","expl":"Knowledge-based authentication relies on preset questions such as “What is your pet’s name?” and the answers. It can be susceptible to attacks because of the availability of the answers on social media or other sites. Dynamic knowledge-based authentication relies on facts or data that the user already knows that can be used to create questions they can answer on an as-needed basis (for example, a previous address or a school they attended). Out-of-band identity proofing relies on an alternate channel like a phone call or text mes-\nsage. Finally, Type 3 authentication factors are biometric, or “something you are,” rather than knowledge-based."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":69,"type":"single","q":"Madhuri creates a table that includes assigned privileges, objects, and subjects to manage access control for the systems she is responsible for. Each time a subject attempts to access an object, the systems check the table to ensure that the subject has the appropriate rights to the objects. What type of access control system is Madhuri using?","opts":["A capability table","An access control list","An access control matrix","A subject/object rights management system"],"ans":"C","expl":"An access control matrix is a table that lists objects, subjects, and their privileges. Access control lists focus on objects and which subjects can access them. Capability tables list sub-jects and what objects they can access. Subject/object rights management systems are not based on an access control model."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":70,"type":"single","q":"During a review of support tickets, Ben’s organization discovered that password changes accounted for more than a quarter of its help desk’s cases. Which of the following options would be most likely to decrease that number significantly?","opts":["Two-factor authentication","Biometric authentication","Self-service password reset","Passphrases"],"ans":"C","expl":"Self-service password reset tools typically have a significant impact on the number of password reset contacts that a help desk has. Two-factor and biometric authentication both add complexity and may actually increase the number of contacts. Passphrases can be easier to remember than traditional complex passwords and may decrease calls, but they don’t have the same impact that a self-service system does."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":71,"type":"single","q":"Brian’s large organization has used RADIUS for AAA services for its network devices for years and has recently become aware of security issues with the unencrypted information transferred during authentication. How should Brian implement encryption for RADIUS?","opts":["Use the built-in encryption in RADIUS.","Implement RADIUS over its native UDP using TLS for protection.","Implement RADIUS over TCP using TLS for protection.","Use an AES256 pre-shared cipher between devices."],"ans":"C","expl":"RADIUS supports TLS over TCP. RADIUS does not have a supported TLS mode over UDP. AES pre-shared symmetric ciphers are not a supported solution and would be difficult\nto both implement and maintain in a large environment, and the built-in encryption in RADIUS only protects passwords."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":72,"type":"single","q":"Jim wants to allow cloud-based applications to act on his behalf to access information from other sites. Which of the following tools can allow that?","opts":["Kerberos","OAuth","OpenID","LDAP"],"ans":"B","expl":"OAuth provides the ability to access resources from another service and would meet Jim’s needs. OpenID would allow him to use an account from another service with his application, and Kerberos and LDAP are used more frequently for in-house services."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":73,"type":"single","q":"Ben’s organization has had an issue with unauthorized access to applications and worksta-tions during the lunch hour when employees aren’t at their desk. What are the best types of session management solutions for Ben to recommend to help prevent this type of access?","opts":["Use session IDs for all access and verify system IP addresses of all workstations.","Set session timeouts for applications and use password-protected screensavers with inac-tivity timeouts on workstations.","Use session IDs for all applications, and use password-protected screensavers with inac-tivity timeouts on workstations.","Set session timeouts for applications and verify system IP addresses of all workstations."],"ans":"B","expl":"Since physical access to the workstations is part of the problem, setting application time-outs and password-protected screensavers with relatively short inactivity timeouts can help prevent unauthorized access. Using session IDs for all applications and verifying system IP addresses would be helpful for online attacks against applications."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":75,"type":"multi","q":"Chris wants to control access to his facility while still identifying individuals. He also wants to ensure that the individuals are the people who are being admitted without significant ongoing costs. Which solutions from the following options would meet all of these require-ments? (Select all that apply.)","opts":["Security guards and photo identification badges","RFID badges and readers with PIN pads","Magstripe badges and readers with PIN pads","Security guards and magstripe readers"],"ans":"BC","expl":"The best answers in the scenario that Chris faces are either RFID or magstripe readers and PIN pads. Guards create ongoing expenses, and any solution without a PIN will allow a stolen or cloned badge to be used without validating that the person accessing the building is a legitimate user. While a guard can prevent a stolen badge and PIN combination, this is only used in environments where the cost is justifiable."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":76,"type":"single","q":"A device like Yubikey or Titan Security Key is what type of Type 2 authentication factor?","opts":["A token","A biometric identifier","A smart card","A PIV"],"ans":"A","expl":"Yubikeys, Titan Security Keys, and similar devices are examples of tokens. PIV stands for personal identity verification and is a full multifactor authentication solution, not a device. Biometric identifiers are something you are, and a smart card is a card with an embedded chip."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":77,"type":"single","q":"What authentication technology can be paired with OAuth to perform identity verification and obtain user profile information using a RESTful API?","opts":["SAML","Shibboleth","OpenID Connect","Higgins"],"ans":"C","expl":"OpenID Connect is a RESTful, JSON-based authentication protocol that, when paired with OAuth, can provide identity verification and basic profile information. SAML is the Security Assertion Markup Language, Shibboleth is a federated identity solution designed to allow web-based SSO, and Higgins is an open source project designed to provide users with control over the release of their identity information."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":78,"type":"single","q":"Jim wants to implement an access control scheme that will ensure that users cannot delegate access. He also wants to enforce access control at the operating system level. What access control mechanism best fits these requirements?","opts":["Role-based access control","Discretionary access control","Mandatory access control","Attribute-based access control"],"ans":"C","expl":"In a mandatory access control system, the operating system enforces access control, and users cannot delegate rights. Discretionary access control allows users to delegate rights, and neither attribute nor role-based access control specifically meets these requirements."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":79,"type":"single","q":"The security administrators at the company that Susan works for have configured the work-station she uses to allow her to log in only during her work hours. What type of access con-trol best describes this limitation?","opts":["Constrained interface","Context-dependent control","Content-dependent control","Least privilege"],"ans":"B","expl":"Time-based controls are an example of context-dependent controls. A constrained inter-face would limit what Susan was able to do in an application or system interface, while content-dependent control would limit her access to content based on her role or rights. Least privilege is used to ensure that subjects only receive the rights they need to perform their role."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":80,"type":"single","q":"Ben uses a software-based token that changes its code every minute. What type of token is he using?","opts":["Asynchronous","Smart card","Synchronous","Static"],"ans":"C","expl":"Synchronous soft tokens, such as Google Authenticator, use a time-based algorithm that generates a constantly changing series of codes. Asynchronous tokens typically require a challenge to be entered on the token to allow it to calculate a response, which the server com-pares to the response it expects. Smartcards typically present a certificate but may have other token capabilities built-in. Static tokens are physical devices that can contain credentials and include smart cards and memory cards."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":81,"type":"single","q":"Firewalls are an example of what type of access control mechanism?","opts":["Mandatory access control","Attribute-based access control","Discretionary access control","Rule-based access control"],"ans":"D","expl":"Firewalls operate based on a ruleset and are an example of a rule-based access control scheme."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":82,"type":"single","q":"Michelle works for a financial services company and wants to register customers for her web application. What type of authentication mechanism could she use for the initial login if she wants to quickly and automatically verify that the person is who they claim to be without having a previous relationship with them?","opts":["Request their Social Security number.","Use knowledge-based authentication.","Perform manual identity verification.","Use a biometric factor."],"ans":"B","expl":"Knowledge-based authentication is used by some financial institutions to validate the identity of new users. It uses information from tax and financial records that is unlikely to be\navailable to others, allowing new users to provide details like their last credit card payment, mortgage payment, or other information to validate their identity. A Social Security number is somewhat trivial to acquire via paid services or other means, and manually validating iden-tities is neither quick nor automatic. A biometric factor would require a previous enrollment, making this unsuitable for new customers."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":83,"type":"multi","q":"Megan’s company wants to use Google accounts to allow users to quickly adopt their web application. What common cloud federation technologies will Megan need to implement? (Select all that apply.)","opts":["Kerberos","OpenID","OAuth","RADIUS"],"ans":"BC","expl":"Google accounts like many cloud identity providers rely on OpenID and OAuth. Ker-beros is used for on-premises environments, and RADIUS is frequently used for authentica-tion and authorization for network devices and services like VPN."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":84,"type":"single","q":"Session ID length and session ID entropy are both important to prevent what type of attack?","opts":["Denial of service","Cookie theft","Session guessing","Man-in-the-middle attacks"],"ans":"C","expl":"Best practices for session management involve a long session ID (often 128 bits or longer) and enough randomness or entropy to make it hard to guess session IDs. This makes brute-force or algorithmic guessing attacks unlikely unless there is a flaw in the implementation. These do not prevent denial-of-service or man-in-the-middle attacks, and cookie attacks are focused on acquiring and reading or reusing cookies in most scenarios."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":85,"type":"single","q":"The access control system for Naomi’s organization checks if her computer is fully patched, if it has a successful clean anti-malware scan, and if the firewall is turned on among other security validations before it allows her to connect to the network. If there are potential issues, she is not permitted to connect and must contact support. What type of access control scheme best describes this type of process?","opts":["MAC","Rule-based access control","Role-based access control","Risk-based access control"],"ans":"D","expl":"Risk-based access control models risk using information that is available when the access request is created. Information about the request and the risk it may create is calculated based on risk values and compared to access policies. If the risk value is acceptable, access\nis granted. One of the most common examples of this in organizations is NAC, or network access control, where a system is profiled to determine security risk and compliance before admission to a network. This can be seen as a more specific example of rule-based access control. Role-based access control bases its decisions on the roles of the individuals, whereas mandatory access control is enforced by the operating system."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":86,"type":"single","q":"Isabelle wants to prevent privilege escalation attacks via her organization’s service accounts. Which of the following security practices is best suited to this?","opts":["Remove unnecessary rights.","Disable interactive login for service accounts.","Limit when accounts can log in.","Use meaningless or randomized names for service accounts."],"ans":"A","expl":"The most important step in securing service accounts is to ensure that they have only the rights that are absolutely needed to accomplish the task they are designed for. Disabling inter-active logins is important as well and would be the next best answer. Limiting when accounts can log in and using randomized or meaningless account names can both be helpful in some circumstances but are far less important."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":87,"type":"single","q":"What danger is created by allowing the OpenID relying party to control the connection to the OpenID provider?","opts":["It may cause incorrect selection of the proper OpenID provider.","It creates the possibility of a phishing attack by sending data to a fake OpenID provider.","The relying party may be able to steal the client’s username and password.","The relying party may not send a signed assertion."],"ans":"B","expl":"Allowing the relying party to provide the redirect to the OpenID provider could allow a phishing attack by directing clients to a fake OpenID provider that can capture valid cre-\ndentials. Since the OpenID provider URL is provided by the client, the relying party cannot select the wrong provider. The relying party never receives the user’s password, which means that they can’t steal it. Finally, the relying party receives the signed assertion but does not send one."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":88,"type":"single","q":"Jim is implementing a cloud identity solution for his organization. What type of technology is he putting in place?","opts":["Identity as a service","Employee ID as a service","Cloud-based RADIUS","OAuth"],"ans":"A","expl":"IDaaS, or identity as a service, provides an identity platform as a third-party service. This can provide benefits including integration with cloud services and removing overhead for maintenance of traditional on-premises identity systems, but it can also create risk due to third-party control of identity services and reliance on an off-site identity infrastructure."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":89,"type":"single","q":"Kristen wants to control access to an application in her organization based on a combination of staff member’s job titles, the permissions each group of titles need for the application, and the time of day and location. What type of control scheme should she select?","opts":["ABAC","DAC","MAC","Role BAC"],"ans":"A","expl":"Attributes used for ABAC often fall into one of four categories: subject attributes like department or title; action attributes like the ability to view, edit, or delete; object attributes that describe the object that can be impacted; and contextual attributes like location, time, or elements. Discretionary access control would place these decisions in the hands of trusted subjects, MAC would enforce it at the operating system level, and role BAC would use only roles instead of the full set of criteria Kristen wants to apply."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":91,"type":"single","q":"Joanna leads her organization’s identity management team and wants to ensure that roles are properly updated when staff members change to new positions. What issue should she focus on for those staff members to avoid future issues with role definition?","opts":["Registration","Privilege creep","Deprovisioning","Accountability"],"ans":"B","expl":"Privilege creep is a constant concern when staff change roles over time. Privileges from previous roles may be easy to forget or to retain during transition because staff may con-tinue to help cover the tasks or processes the individual previously performed. Over time, these forgotten rights and privileges can stack, leaving the staff member with rights that their current role should not have. Registration is a concern for new staff, while de-provisioning is a concern for departing staff. Accountability is typically provided by IAM systems by authen-ticating and logging access and privilege usage."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":92,"type":"single","q":"What type of authorization mechanism is shown in the following chart?","opts":["RBAC","ABAC","MAC","DAC"],"ans":"A","expl":"This is a role-based access control (RBAC) chart noting that each group has specific rights by roles. Attribute-based access control (ABAC) would use other attributes including things like location, mandatory access control (MAC) would be enforced by the operating system, and discretionary access control (DAC) allows subjects like users to set rights on objects\nthey control."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":93,"type":"single","q":"Susan is troubleshooting Kerberos authentication problems with symptoms including TGTs that are not accepted as valid and an inability to receive new tickets. If the system she is trou-bleshooting is properly configured for Kerberos authentication, her username and password are correct, and her network connection is functioning, what is the most likely issue?","opts":["The Kerberos server is offline.","There is a protocol mismatch.","The client’s TGTs have been marked as compromised and de-authorized.","The Kerberos server and the local client’s time clocks are not synchronized."],"ans":"D","expl":"Kerberos relies on properly synchronized time on each end of a connection to function. If the local system time is more than five minutes out of sync, valid TGTs will be invalid, and the system won’t receive any new tickets."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":94,"type":"single","q":"Brian wants to explain the benefits of an on-premise federation approach for identity to his organization’s leadership. Which of the following is not a common benefit of a federated identity system?","opts":["Ease of account management","Single sign-on","Prevention of brute-force attacks","Increased productivity"],"ans":"C","expl":"Single sign-on (SSO) is part of identity federation. It also means that account management is simpler since multiple accounts don’t have to be maintained for users who need to access systems and resources across the federation. Productivity can increase because staff don’t have to remember multiple logins and can use SSO to log in once instead of multiple times.\nIt does not, however, do anything to prevent brute-force attacks, and in fact, a single account with broad access can make it easier for an attacker to gain that broader access unless solu-tions like multifactor authentication are put in place."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":95,"type":"single","q":"The bank that Aaron works for wants to allow customers to use a new add-on application from a third-party partner they are working with. Since not every customer will want or need an account, Aaron has suggested that the bank use a SAML-based workflow that creates an account when a user downloads the app and tries to log in. What type of provisioning system has he suggested?","opts":["JIT","OpenID","OAuth","Kerberos"],"ans":"A","expl":"A JIT, or just-in-time, provisioning mechanism creates accounts when they are needed rather than creating them in advance. This is an effective method to limit the number of accounts being maintained and can be useful if user account numbers are part of a licensing agreement. OAuth, OpenID, and Kerberos are not mentioned in the question."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":96,"type":"single","q":"What authentication protocol does Windows use by default for Active Directory systems?","opts":["RADIUS","Kerberos","OAuth","TACACS+"],"ans":"B","expl":"Windows uses Kerberos for authentication. RADIUS is typically used for wireless net-works, modems, and network devices, while OAuth is primarily used for web applications. TACACS+ is used for network devices."},{"ch":"D5","ch_name":"域5 身份与访问管理","no":97,"type":"single","q":"Valerie needs to control access to applications that are deployed to mobile devices in a BYOD environment. What type of solution will best allow her to exercise control over the applications while ensuring that they do not leave remnant data on the devices used by her end users?","opts":["Deploy the applications to the BYOD devices and require unique PINs on every device.","Deploy the application to desktop systems and require users to use remote desktop to access them using enterprise authentication.","Deploy the applications to the BYOD devices using application containers and require unique PINs on every device.","Use a virtual hosted application environment that requires authentication using enterprise credentials."],"ans":"D","expl":"When very high levels of control are needed or when endpoint devices cannot be trusted, using a centralized environment with remote connectivity and enterprise authentication can provide appropriate security."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":1,"type":"single","q":"During a port scan, Susan discovers a system running services on TCP and UDP 137–139 and TCP 445, as well as TCP 1433. What type of system is she likely to find if she connects to\n• the machine?","opts":["A Linux email server","A Windows SQL server","A Linux file server","A Windows workstation"],"ans":"B","expl":"TCP and UDP ports 137–139 are used for NetBIOS services, whereas 445 is used for Active Directory. TCP 1433 is the default port for Microsoft SQL, indicating that this is probably a Windows server providing SQL services."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":2,"type":"single","q":"Which of the following is a method used to automatically design new software tests and to ensure the quality of tests?","opts":["Code auditing","Static code analysis","Regression testing","Mutation testing"],"ans":"D","expl":"Mutation testing modifies a program in small ways and then tests that mutant to deter-mine if it behaves as it should or if it fails. This technique is used to design and test software tests through mutation. Static code analysis and regression testing are both means of testing code, whereas code auditing is an analysis of source code rather than a means of designing and testing software tests."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":3,"type":"single","q":"During a port scan, Naomi found TCP port 443 open on a system. Which tool is best suited to scanning the service that is most likely running on that port?","opts":["zzuf","Nikto","Metasploit","sqlmap"],"ans":"B","expl":"TCP port 443 normally indicates an HTTPS server. Nikto is useful for vulnerability scanning web servers and applications and is the best choice listed for a web server. Metasploit includes some scanning functionality but is not a purpose-built tool for vulner-ability scanning. zzuf is a fuzzing tool and isn’t relevant for vulnerability scans, whereas sqlmap is a SQL injection testing tool."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":4,"type":"single","q":"What message logging standard is commonly used by network devices, Linux and Unix sys-tems, and many other enterprise devices?","opts":["Syslog","Netlog","Eventlog","Remote Log Protocol (RLP)"],"ans":"A","expl":"Syslog is a widely used protocol for event and message logging. Eventlog, netlog, and Remote Log Protocol are all made-up terms."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":5,"type":"single","q":"Alex wants to use an automated tool to fill web application forms to test for format string vulnerabilities. What type of tool should he use?","opts":["A black box","A brute-force tool","A fuzzer","A static analysis tool"],"ans":"C","expl":"Fuzzers are tools that are designed to provide invalid or unexpected input to applica-tions, testing for vulnerabilities like format string vulnerabilities, buffer overflow issues, and other problems. A static analysis relies on examining code without running the application or code and thus would not fill forms as part of a web application. Brute-force tools attempt to bypass security by trying every possible combination for passwords or other values. A black box is a type of penetration test where the testers do not know anything about the environment."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":7,"type":"single","q":"Morgan is implementing a vulnerability management system that uses standards-based components to score and evaluate the vulnerabilities it finds. Which of the following is most commonly used to provide a severity score for vulnerabilities?","opts":["CCE","CVSS","CPE","OVAL"],"ans":"B","expl":"CVSS, the Common Vulnerability Scoring System, is used to describe the severity of secu-rity vulnerabilities. CCE is Common Configuration Enumeration, a naming system for con-figuration issues. CPE is Common Platform Enumeration, which names operating systems, applications, and devices. OVAL is a language for describing security testing procedures."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":8,"type":"single","q":"Jim has been contracted to perform a penetration test of a bank’s primary branch. To make the test as real as possible, he has not been given any information about the bank other than its name and address. What type of penetration test has Jim agreed to perform?","opts":["A crystal-box penetration test","A gray-box penetration test","A black-box penetration test","A white-box penetration test"],"ans":"C","expl":"Jim has agreed to a black-box penetration test, which provides no information about the organization, its systems, or its defenses. A crystal- or white-box penetration test provides all of the information an attacker needs, whereas a gray-box penetration test provides some, but not all, information."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":9,"type":"single","q":"In a response to a request for proposal, Susan receives an SSAE 18 SOC report. If she wants a report that includes operating effectiveness detail, what should Susan ask for as fol-\n• low-up and why?","opts":["A SOC 2 Type II report, because Type I does not cover operating effectiveness","A SOC 1 Type I report, because SOC 2 does not cover operating effectiveness","A SOC 2 Type I report, because SOC 2 Type II does not cover operating effectiveness","A SOC 3 report, because SOC 1 and SOC 2 reports are outdated"],"ans":"A","expl":"The key to answering this question correctly is understanding the difference between SOC 1 and SOC 2 reports, and Type I and Type II audits. SOC 1 reports cover financial report-ing, and SOC 2 reports look at security. Type I audits only cover a single point in time and are based upon management descriptions of controls. They do not include an assessment of operating effectiveness. Type II audits cover a period of time and do include an assessment of operating effectiveness."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":10,"type":"single","q":"During a wireless network penetration test, Susan runs aircrack-ng against the network using a password file. What might cause her to fail in her password-cracking efforts?","opts":["Using WPA2 encryption","Running WPA2 in Enterprise mode","Using WEP encryption","Running WPA2 in PSK mode"],"ans":"B","expl":"WPA2 enterprise uses RADIUS authentication for users rather than a preshared key. This means a password attack is more likely to fail as password attempts for a given user may result in account lockout. WPA2 encryption will not stop a password attack, and WPA2’s preshared key mode is specifically targeted by password attacks that attempt to find the key. Not only is WEP encryption outdated, but it can also frequently be cracked quickly by tools like aircrack-ng."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":11,"type":"single","q":"A zero-day vulnerability is announced for the popular Apache web server in the middle of a workday. In Jacob’s role as an information security analyst, he needs to quickly scan his network to determine what servers are vulnerable to the issue. What is Jacob’s best route to quickly identify vulnerable systems?","opts":["Immediately run Nessus against all of the servers to identify which systems are vulnerable.","Review the CVE database to find the vulnerability information and patch information.","Create a custom IDS or IPS signature.","Identify affected versions and check systems for that version number using an automated scanner."],"ans":"D","expl":"In many cases when an exploit is initially reported, there are no prebuilt signatures or detections for vulnerability scanners, and the CVE database may not immediately have information about the attack. Jacob’s best option is to quickly gather information and review potentially vulnerable servers based on their current configuration. As more information becomes available, signatures and CVE information are likely to be published. Unfortunately for Jacob, IDS and IPS signatures will only detect attacks and won’t detect whether systems are vulnerable unless he sees the systems being exploited."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":12,"type":"single","q":"What type of testing is used to ensure that separately developed software modules properly exchange data?","opts":["Fuzzing","Dynamic testing","Interface testing","API checksums"],"ans":"C","expl":"Interface testing is used to ensure that software modules properly meet interface speci-fications and thus will properly exchange data. Dynamic testing tests software in a running environment, whereas fuzzing is a type of dynamic testing that feeds invalid input to running software to test error and input handling. API checksums are not a testing technique."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":13,"type":"single","q":"Selah wants to provide security assessment information to customers who want to use her organization’s cloud services. Which of the following options should she select to ensure that the greatest number of customers are satisfied with the assessment information?","opts":["Use an internal audit team to self-assess against internal metrics.","Use a third-party auditor.","Use internal technical staff who know the systems.","Use an internal audit team to self-assess against a common standard like COBIT."],"ans":"B","expl":"Using a third-party auditor from a well-known and well-regarded firm is often the best option when providing audit and compliance information to third parties. Selah could engage an appropriate vendor for an SOC 2 Type II engagement as one example of a rea-sonable option to provide detail to her customers. Internal staff assessing to a common standard like COBIT would be the next most acceptable option on this list, with an internal standard less useful than that. Finally, internal nonaudit staff are the least useful in this circumstance."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":14,"type":"single","q":"Yasmine has been asked to consider a breach and attack simulation system. What type of system should she look for?","opts":["A ticket and change management system designed to help manage incidents","A system that runs incident response simulations for blue teams to test their skills","A system that combines red and blue team techniques with automation","A security operations and response (SOAR) system"],"ans":"C","expl":"BAS, or Breach and Attack Simulation, systems are systems that combine red team (attack) and blue team (defense) techniques together with automation to simulate advanced persistent threats and other advanced threat actors when run against your environment. This allows a variety of threats to be replicated and assessed in an environment without as much overhead as a fully staffed purple team would."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":15,"type":"single","q":"Monica wants to gather information about security awareness in her organization. What technique is most frequently used to assess security awareness?","opts":["Phishing simulators","Gamified applications","Assessment tests","Surveys"],"ans":"D","expl":"Most organizations use surveys to assess security awareness. Phishing simulators are also frequently used, but only test awareness of phishing issues and techniques, not general secu-rity awareness. Gamified applications are continuing to grow in popularity, but the ease of use and availability of surveys makes them the most popular. Finally, assessment tests may be used when compliance knowledge assessments are required to meet a specific standard, but testing is not as common as surveying."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":16,"type":"single","q":"Jim has been contracted to conduct a gray-box penetration test, and his clients have provided him with the following information about their networks so that he can scan them:\n• Data center: 10.10.10.0/24 Sales: 10.10.11.0/24\n• Billing: 10.10.12.0/24 Wireless: 192.168.0.0/16\n• What problem will Jim encounter if he is contracted to conduct a scan from off-site?","opts":["The IP ranges are too large to scan efficiently.","The IP addresses provided cannot be scanned.","The IP ranges overlap and will cause scanning issues.","The IP addresses provided are RFC 1918 addresses."],"ans":"D","expl":"The IP addresses that his clients have provided are RFC 1918 nonroutable IP addresses, and Jim will not be able to scan them from off-site. To succeed in his penetration test, he will have to either first penetrate their network border or place a machine inside their network to scan from the inside. IP addresses overlapping is not a real concern for scanning, and the ranges can easily be handled by current scanning systems."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":17,"type":"single","q":"Mark’s company has been notified that there is a flaw in their web application. The anony-mous individual has notified them that they have two weeks to fix it before the details of the flaw are published along with example exploit code. What industry norm is the individual who contacted Mark’s company violating?","opts":["Zero-day reporting","Ethical disclosure","Ethical hacking","The (ISC)2 vulnerability disclosure ethics statement"],"ans":"B","expl":"Ethical (or responsible) disclosure practices will provide companies and organizations with a reasonable period of time to fix a flaw and to get that fix into the hands of their cus-tomers. Two weeks is unlikely to be a reasonable amount of time for this. Unfortunately, Mark may not be able to persuade the individual to make a different decision, and Mark’s company will need to determine what to do about the issue."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":21,"type":"single","q":"During a penetration test, Michelle needs to identify systems, but she hasn’t gained sufficient access on the system she is using to generate raw packets. What type of scan should she run to verify the most open services?","opts":["A TCP connect scan","A TCP SYN scan","A UDP scan","An ICMP scan"],"ans":"A","expl":"When a tester does not have raw packet creation privileges, such as when they have not escalated privileges on a compromised host, a TCP connect scan can be used. TCP SYN\nscans require elevated privileges on most Linux systems due to the need to write raw packets. A UDP scan will miss most services that are provided via TCP, and an ICMP is merely a ping sweep of systems that respond to pings and won’t identify services at all."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":22,"type":"single","q":"During a port scan using nmap, Joseph discovers that a system shows two ports open that cause him immediate worry:\n• 21/open 23/open\n• What services are likely running on those ports?","opts":["SSH and FTP","FTP and Telnet","SMTP and Telnet","POP3 and SMTP"],"ans":"B","expl":"Joseph may be surprised to discover FTP (TCP port 21) and Telnet (TCP port 23) open on his network since both services are unencrypted and have been largely replaced by SSH, and SCP or SFTP. SSH uses port 22, SMTP uses port 25, and POP3 uses port 110."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":23,"type":"single","q":"Aaron wants to validate his compliance with PCI-DSS. His company is a large commercial organization with millions of dollars in transactions a year. What is the most common method of conducting this type of testing for large organizations?","opts":["Self-assessment","To conduct a thirty-party assessment using COBIT","To partner with another company and trade assessments between the organizations","To conduct a third-party assessment using a qualified security assessor"],"ans":"D","expl":"Large organizations hire QSAs, or qualified security assessors, to conduct compliance checks. Third-party certification is required for large organizations by PCI-DSS, although smaller organizations can self-certify."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":24,"type":"single","q":"What method is commonly used to assess how well software testing covered the potential uses of an application?","opts":["A test coverage analysis","A source code review","A fuzz analysis","A code review report"],"ans":"A","expl":"A test coverage analysis is often used to provide insight into how well testing covered the set of use cases that an application is being tested for. Source code reviews look at the code of a program for bugs, not necessarily at a use case analysis, whereas fuzzing tests invalid inputs. A code review report might be generated as part of a source code review."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":25,"type":"single","q":"Testing that is focused on functions that a system should not allow is an example of what type of testing?","opts":["Use case testing","Manual testing","Misuse case testing","Dynamic testing"],"ans":"C","expl":"Testing how a system could be misused, or misuse testing, focuses on behaviors that are not what the organization desires or that are counter to the proper function of a system or application. Use case testing is used to verify whether a desired functionality works. Dynamic testing is used to determine how code handles variables that change over time, whereas manual testing is just what it implies: testing code by hand."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":26,"type":"single","q":"What type of monitoring uses simulated traffic to a website to monitor performance?","opts":["Log analysis","Synthetic monitoring","Passive monitoring","Simulated transaction analysis"],"ans":"B","expl":"Synthetic monitoring uses emulated or recorded transactions to monitor for performance changes in response time, functionality, or other performance monitors. Passive monitoring uses a span port or other method to copy traffic and monitor it in real time. Log analysis is typically performed against actual log data but can be performed on simulated traffic to iden-tify issues. Simulated transaction analysis is not an industry term."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":27,"type":"single","q":"Derek wants to ensure that his organization tracks all changes to accounts through their life-cycle. What type of tool should he invest in for his organization?","opts":["A directory service like LDAP","An IAM system","An SIEM","An EDR system"],"ans":"B","expl":"Identity and access management (IAM) systems combine lifecycle management and mon-itoring tools to ensure that identity and authorization are properly handled throughout an organization. Derek should invest in a capable IAM system and ensure that it is configured to use appropriate workflows and to generate the logs and reports that he needs. EDR systems are endpoint detection and response tools and are used to protect against compromise by advanced attackers."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":28,"type":"single","q":"Jim uses a tool that scans a system for available services and then connects to them to col-lect banner information to determine what version of the service is running. It then pro-vides a report detailing what it gathers, basing results on service fingerprinting, banner information, and similar details it gathers combined with CVE information. What type of tool is Jim using?","opts":["A port scanner","A service validator","A vulnerability scanner","A patch management tool"],"ans":"C","expl":"Vulnerability scanners that do not have administrative rights to access a machine or that are not using an agent scan remote machines to gather information, including fingerprints from responses to queries and connections, banner information from services, and related data. CVE information is Common Vulnerability and Exposure information, or vulnerability information. A port scanner gathers information about what service ports are open, although some port scanners blur the line between port and vulnerability scanners. Patch management tools typically run as an agent on a system to allow them to both monitor patch levels and update the system as needed. Service validation typically involves testing the functionality of a service, not its banner and response patterns."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":29,"type":"single","q":"Emily builds a script that sends data to a web application that she is testing. Each time the script runs, it sends a series of transactions with data that fits the expected requirements of the web application to verify that it responds to typical customer behavior. What type of transactions is she using, and what type of test is this?","opts":["Synthetic, passive monitoring","Synthetic, use case testing","Actual, dynamic monitoring","Actual, fuzzing"],"ans":"B","expl":"Emily is using synthetic transactions, which can use recorded or generated transactions, and is conducting use case testing to verify that the application responds properly to actual use cases. Neither actual data nor dynamic monitoring is an industry term. Fuzzing involves sending unexpected inputs to a program to see how it responds. Passive monitoring uses a\nnetwork tap or other capture technology to allow monitoring of actual traffic to a system or application."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":30,"type":"single","q":"What passive monitoring technique records all user interaction with an application or web-site to ensure quality and performance?","opts":["Client/server testing","Real user monitoring","Synthetic user monitoring","Passive user recording"],"ans":"B","expl":"Real user monitoring (RUM) is a passive monitoring technique that records user interac-tion with an application or system to ensure performance and proper application behavior. RUM is often used as part of a predeployment process using the actual user interface. The other answers are all made up—synthetic monitoring uses simulated behavior, but synthetic user monitoring is not a testing method. Similarly, passive monitoring monitors actual traffic, but passive user recording is not an industry term or technique. Client/server testing merely describes one possible architecture."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":31,"type":"single","q":"Earlier this year, the information security team at Jim’s employer identified a vulnerability in the web server that Jim is responsible for maintaining. He immediately applied the patch and is sure that it installed properly, but the vulnerability scanner has continued to incorrectly flag the system as vulnerable. To deal with the issue so that it does not continue to be flagged incorrectly?","opts":["Uninstall and reinstall the patch.","Ask the information security team to flag the system as patched and not vulnerable to that particular flaw.","Update the version information in the web server’s configuration.","Review the vulnerability report and use alternate remediation options."],"ans":"B","expl":"Jim should ask the information security team to flag the issue as resolved if he is sure the patch was installed. Many vulnerability scanners rely on version information or ban-ner information and may flag patched versions if the software provider does not update the information they see. Uninstalling and reinstalling the patch will not change this. Chang-ing the version information may not change all of the details that are being flagged by the scanner and may cause issues at a later date. Reviewing the vulnerability information for a\nworkaround may be a good idea but should not be necessary if the proper patch is installed; it can create maintenance issues later."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":32,"type":"single","q":"Angela wants to test a web browser’s handling of unexpected data using an automated tool. What tool should she choose?","opts":["Nmap","zzuf","Nessus","Nikto"],"ans":"B","expl":"zzuf is the only fuzzer on the list, and zzuf is specifically designed to work with tools like web browsers, image viewers, and similar software by modifying network and file input to application. Nmap is a port scanner, Nessus is a vulnerability scanner, and Nikto is a web server scanner."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":33,"type":"single","q":"STRIDE, which stands for Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege, is useful in what part of application threat modeling?","opts":["Vulnerability assessment","Misuse case testing","Threat categorization","Penetration test planning"],"ans":"C","expl":"An important part of application threat modeling is threat categorization. It helps to assess attacker goals that influence the controls that should be put in place. The other answers all involve topics that are not directly part of application threat modeling."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":34,"type":"single","q":"Why should passive scanning be conducted in addition to implementing wireless security technologies like wireless intrusion detection systems?","opts":["It can help identify rogue devices.","It can test the security of the wireless network via scripted attacks.","Their short dwell time on each wireless channel can allow them to capture more packets.","They can help test wireless IDS or IPS systems."],"ans":"A","expl":"Passive scanning can help identify rogue devices by capturing MAC address vendor IDs that do not match deployed devices, by verifying that systems match inventories of orga-nizationally owned hardware by hardware address, and by monitoring for rogue SSIDs or connections.\nScripted attacks are part of active scanning rather than passive scanning, and active scanning is useful for testing IDS or IPS systems, whereas passive scanning will not be detected by detection systems. Finally, a shorter dwell time can actually miss troublesome traffic, so balancing dwell time versus coverage is necessary for passive wireless scanning efforts."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":35,"type":"single","q":"Paul is reviewing the approval process for a penetration test and wants to ensure that it has appropriate management review. Who should he ensure has approved the request for a pene-tration test for a business system?","opts":["The change advisory board","Senior management","The systems administrator for the system","The service owner"],"ans":"B","expl":"In most organizations, senior management needs to approve penetration tests due to the risk to the organization and the potential impact of the test. In a small number of organiza-tions, the service owner may be able to make this decision, but penetration tests often have broader impacts than a single service, meaning that senior management is the proper path. Change advisory boards approve changes, not penetration tests, and system administrators may be advised of the test but do not have the authority in most organizations to sign off on a penetration test."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":36,"type":"single","q":"What term describes software testing that is intended to uncover new bugs introduced by patches or configuration changes?","opts":["Nonregression testing","Evolution testing","Smoke testing","Regression testing"],"ans":"D","expl":"Regression testing, which is a type of functional or unit testing, tests to ensure that changes have not introduced new issues. Nonregression testing checks to see whether a\nchange has had the effect it was supposed to, smoke testing focuses on simple problems with impact on critical functionality, and evolution testing is not a software testing technique."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":37,"type":"single","q":"Which of the following tools cannot identify a target’s operating system for a penetra-tion tester?","opts":["Nmap","Nessus","Nikto","sqlmap"],"ans":"D","expl":"Nmap, Nessus, and Nikto all have OS fingerprinting or other operating system identification capabilities. sqlmap is designed to perform automated detection and testing of SQL injection flaws and does not provide OS detection."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":38,"type":"single","q":"Susan needs to predict high-risk areas for her organization and wants to use metrics to assess risk trends as they occur. What should she do to handle this?","opts":["Perform yearly risk assessments.","Hire a penetration testing company to regularly test organizational security.","Identify and track key risk indicators.","Monitor logs and events using a SIEM device."],"ans":"C","expl":"Key risk indicators are used to tell those in charge of risk management how risky an activity is and how much impact changes are having on that risk profile. Identifying key risk indicators and monitoring them can help to identify high-risk areas earlier in their lifecycle. Yearly risk assessments may be a good idea, but only provide a point-in-time view, whereas penetration tests may miss out on risks that are not directly security-related. Monitoring logs and events using a SIEM device can help detect issues as they occur but won’t necessarily show trends in risk."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":39,"type":"single","q":"What major difference separates synthetic and passive monitoring?\nFor questions 40–42, please refer to the following scenario. Chris uses the standard penetration testing methodology shown here. Use this methodology and your knowledge of penetration testing to answer questions about tool usage during a penetration test.","opts":["Synthetic monitoring works only after problems have occurred.","Passive monitoring cannot detect functionality issues.","Passive monitoring works only after problems have occurred.","Synthetic monitoring cannot detect functionality issues."],"ans":"C","expl":"Passive monitoring works only after issues have occurred because it requires actual traffic. Synthetic monitoring uses simulated or recorded traffic and thus can be used to proactively identify problems. Both synthetic and passive monitoring can be used to detect function-\nality issues."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":40,"type":"single","q":"What task is the most important during Phase 1, Planning?","opts":["Building a test lab","Getting authorization","Gathering appropriate tools","Determining if the test is white, black, or gray box"],"ans":"B","expl":"Getting authorization is the most critical element in the planning phase. Permission, and the “get out of jail free card” that demonstrates that organizational leadership is aware of the issues that a penetration test could cause, is the first step in any penetration test. Gathering tools and building a lab, as well as determining what type of test will be conducted, are all important, but nothing should happen without permission.","scene":"Chris uses the standard penetration testing methodology shown here. Use this methodolo
