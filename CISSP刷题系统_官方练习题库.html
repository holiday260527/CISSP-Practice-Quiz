organizations can inspect it, but more importantly that others can and often have also inspected it. This results in software that has had far more review than some closed-source or commercial packages (although large organizations may perform more review). The ability to change the code can sometimes be important as well, but changing open source code in-house can create maintenance issues in the future. Open source software may be compiled, but the source will still be available. The code being free is not a security advantage or disadvantage."},{"ch":"PT2","ch_name":"模拟卷 2","no":62,"type":"single","q":"As part of hiring a new employee, Kathleen’s identity management team creates a new user object and ensures that the user object is available in the directories and systems where it is needed. What is this process called?","opts":["Registration","Provisioning","Population","Authenticator loading"],"ans":"B","expl":"Provisioning includes the creation, maintenance, and removal of user objects from appli-cations, systems, and directories. Registration occurs when users are enrolled in a biometric system; population and authenticator loading are not common industry terms."},{"ch":"PT2","ch_name":"模拟卷 2","no":63,"type":"single","q":"What phase of the change management process for software occurs when changes are finalized?","opts":["Request control","Configuration control","Release control","Change control"],"ans":"C","expl":"Release control occurs after changes are finalized. With changes that are ready to be implemented in hand, release managers can follow their process with steps that typically include removing debugging code and conducting acceptance testing. Request control is the start of a process that allows users to submit change requests, while change control handles the process of ensuring quality assurance happens, that documentation is done, and that security testing is handled. Finally, configuration control is part of software configuration management, not the change process."},{"ch":"PT2","ch_name":"模拟卷 2","no":64,"type":"single","q":"Alice is designing a cryptosystem for use by six users and would like to use a symmetric encryption algorithm. She wants any two users to be able to communicate with each other without worrying about eavesdropping by a third user. How many symmetric encryption keys will she need to generate?","opts":["6","12","15","30"],"ans":"C","expl":"The formula for determining the number of encryption keys required by a symmetric algorithm is ((n*(n − 1))/2). With six users, you will need ((6*5)/2), or 15 keys."},{"ch":"PT2","ch_name":"模拟卷 2","no":65,"type":"single","q":"Which one of the following intellectual property protection mechanisms has the shortest duration in the United States?","opts":["Copyright","Patent","Trademark","Trade secret"],"ans":"B","expl":"Patents have the shortest duration of the techniques listed: at most, 20 years. Copyrights last for 70 years beyond the death of the author if owned by an individual, or 95 years from publication or 120 years from creation if owned by a corporation. Trademarks are renewable indefinitely, and trade secrets are protected as long as they remain secret."},{"ch":"PT2","ch_name":"模拟卷 2","no":66,"type":"single","q":"Gordon is developing a business continuity plan for a manufacturing company’s IT opera-tions. The company is located in North Dakota and currently evaluating the risk of earth-quake. They choose to pursue a risk acceptance strategy. Which one of the following actions is consistent with that strategy?","opts":["Purchasing earthquake insurance","Relocating the data center to a safer area","Documenting the decision-making process","Reengineering the facility to withstand the shock of an earthquake"],"ans":"C","expl":"In a risk acceptance strategy, the organization chooses to take no action other than documenting the risk. Purchasing insurance would be an example of risk transference.\nRelocating the data center would be risk avoidance. Reengineering the facility is an example of a risk mitigation strategy."},{"ch":"PT2","ch_name":"模拟卷 2","no":67,"type":"single","q":"Carol would like to implement a control that protects her organization from the momentary loss of power to the data center. Which control is most appropriate for her needs?","opts":["Redundant servers","RAID","UPS","Generator"],"ans":"C","expl":"Uninterruptible power supplies (UPSs) provide immediate, battery-driven power for a short period of time to cover momentary losses of power. Generators are capable of\nproviding backup power for a sustained period of time in the event of a power loss, but they take time to activate. RAID and redundant servers are high-availability controls but do not cover power loss scenarios."},{"ch":"PT2","ch_name":"模拟卷 2","no":68,"type":"single","q":"Ben has encountered problems with users in his organization reusing passwords, despite a requirement that they change passwords every 30 days. What type of password setting should Ben employ to help prevent this issue?","opts":["Longer minimum age","Increased password complexity","Implement password history","Implement password length requirements"],"ans":"C","expl":"Password histories retain a list of previous passwords, preferably a list of salted hashes for previous passwords, to ensure that users don’t reuse their previous passwords. Longer minimum age can help prevent users from changing their passwords and then changing them back but won’t prevent a determined user from eventually getting their old password back. Length requirements and complexity requirements tend to drive users to reuse passwords if they’re not paired with tools like single sign-on, password storage systems, or other tools that decrease the difficulty of password management."},{"ch":"PT2","ch_name":"模拟卷 2","no":69,"type":"single","q":"Chris is conducting a risk assessment for his organization and has determined the amount of damage that a single flood could be expected to cause to his facilities. What metric has Chris identified?","opts":["ALE","SLE","ARO","AV"],"ans":"B","expl":"The Single Loss Expectancy (SLE) is the amount of damage that a risk is expected to cause each time that it occurs."},{"ch":"PT2","ch_name":"模拟卷 2","no":70,"type":"single","q":"The removal of a hard drive from a PC before it is retired and sold as surplus is an example of what type of action?","opts":["Purging","Sanitization","Degaussing","Destruction"],"ans":"B","expl":"Sanitization includes steps such as removing the hard drive and other local storage from PCs before they are sold as surplus. Degaussing uses magnetic fields to wipe media; purging is an intense form of clearing used to ensure that data is removed and unrecoverable from media; and removing does not necessarily imply destruction of the drive."},{"ch":"PT2","ch_name":"模拟卷 2","no":71,"type":"single","q":"During which phase of the incident response process would an organization determine whether it is required to notify law enforcement officials or other regulators of the incident?","opts":["Detection","Recovery","Remediation","Reporting"],"ans":"D","expl":"During the Reporting phase, incident responders assess their obligations under laws and regulations to report the incident to government agencies and other regulators."},{"ch":"PT2","ch_name":"模拟卷 2","no":72,"type":"single","q":"Every 90 days, the staff in Charles’s department at his bank switch tasks as part of the orga-nization’s normal processes to ensure that an individual does not exploit their privileges. What security practice is his organization engaging in?","opts":["Dual control","Job rotation","Cross-training","Offboarding"],"ans":"B","expl":"The bank that Charles works at is using job rotation to ensure that employees are not exploiting the rights and permissions that they have in their roles. The practice is intended to allow the next person in the role to identify irregularities and to prevent\nindividuals from hiding malfeasance. Dual control requires two or more staff members to complete a task to ensure that a single employee cannot abuse their role. Cross-training is used to ensure that multiple staff members have the skills needed to perform a task or role so the loss of a staff member does not cause the organization’s inability to perform the service."},{"ch":"PT2","ch_name":"模拟卷 2","no":73,"type":"single","q":"Michelle is in charge of her organization’s mobile device management efforts and handles lost and stolen devices. Which of the following recommendations will provide the most assurance to her organization that data will not be lost if a device is stolen?","opts":["Mandatory passcodes and application management","Full device encryption and mandatory passcodes","Remote wipe and GPS tracking","Enabling GPS tracking and full device encryption"],"ans":"B","expl":"While full device encryption doesn’t guarantee that data cannot be accessed, it provides Michelle’s best option for preventing data from being lost with a stolen device when paired with a passcode. Mandatory passcodes and application management can help prevent application-based attacks and unwanted access to devices, but won’t keep the data secure if the device is lost. Remote wipe and GPS location is useful if the thief allows the device\nto connect to a cellular or WiFi network. Unfortunately, many modern thieves immediately take steps to ensure that the device will not be trackable or allowed to connect to a network before they capture data or wipe the device for resale."},{"ch":"PT2","ch_name":"模拟卷 2","no":74,"type":"single","q":"Susan’s SMTP server does not authenticate senders before accepting and relaying email. What is this security configuration issue known as?\nFor questions 75–77, please refer to the following scenario:","opts":["An email gateway","An SMTP relay","An X.400-compliant gateway","An open relay"],"ans":"D","expl":"SMTP servers that don’t authenticate users before relaying their messages are known as open relays. Open relays that are internet-exposed are typically quickly exploited to send email for spammers."},{"ch":"PT2","ch_name":"模拟卷 2","no":75,"type":"single","q":"When the breach was discovered and the logs were reviewed, it was discovered that the attacker had purged the logs on the system that they compromised. How can this be pre-vented in the future?","opts":["Encrypt local logs.","Require administrative access to change logs.","Enable log rotation.","Send logs to a bastion host."],"ans":"D","expl":"Sending logs to a secure log server, sometimes called a bastion host, is the most effective way to ensure that logs survive a breach. Encrypting local logs won’t stop an attacker from deleting them, and requiring administrative access won’t stop attackers who have breached a machine and acquired escalated privileges. Log rotation archives logs based on time or file size and can also purge logs after a threshold is hit. Rotation won’t prevent an attacker from purging logs.","scene":"The large business that Jack works for has been using noncentralized logging for years. They have recently started to implement centralized logging, however, and as they reviewed logs, they discovered a breach that appeared to have involved a malicious insider."},{"ch":"PT2","ch_name":"模拟卷 2","no":76,"type":"single","q":"How can Jack detect issues such as this using his organization’s new centralized logging?","opts":["Deploy and use an IDS.","Send logs to a central logging server.","Deploy and use a SIEM.","Use syslog."],"ans":"C","expl":"A security information and event management (SIEM) tool is designed to provide automated analysis and monitoring of logs and security events. A SIEM tool that receives access to logs can help detect and alert on events such as logs being purged or other breach indicators. An IDS can help detect intrusions, but IDSs are not typically designed to handle central logs. A central logging server can receive and store logs but won’t help with analysis without taking additional actions. Syslog is simply a log format.","scene":"The large business that Jack works for has been using noncentralized logging for years. They have recently started to implement centralized logging, however, and as they reviewed logs, they discovered a breach that appeared to have involved a malicious insider."},{"ch":"PT2","ch_name":"模拟卷 2","no":77,"type":"single","q":"How can Jack best ensure accountability for actions taken on systems in his environment?","opts":["Log review and require digital signatures for each log.","Require authentication for all actions taken and capture logs centrally.","Log the use of administrative credentials and encrypt log data in transit.","Require authorization and capture logs centrally."],"ans":"B","expl":"Requiring authentication can help provide accountability by ensuring that any action taken can be tracked back to a specific user. Storing logs centrally ensures that users can’t erase the evidence of actions that they have taken. Log review can be useful when identifying issues, but digital signatures are not a typical part of a logging environment. Logging the use of administrative credentials helps for those users but won’t cover all users, and encrypting the logs doesn’t help with accountability. Authorization helps, but being able to specifically identify users through authentication is more important.","scene":"The large business that Jack works for has been using noncentralized logging for years. They have recently started to implement centralized logging, however, and as they reviewed logs, they discovered a breach that appeared to have involved a malicious insider."},{"ch":"PT2","ch_name":"模拟卷 2","no":78,"type":"single","q":"Ed’s organization has 5 IP addresses allocated to them by their ISP but needs to connect more than 100 computers and network devices to the internet. What technology can he use to con-nect his entire network via the limited set of IP addresses he can use?","opts":["IPsec","PAT","SDN","IPX"],"ans":"B","expl":"Port Address Translation (PAT) is used to allow a network to use any IP address set inside without causing a conflict with the public internet. PAT is often confused with Net-work Address Translation (NAT), which maps one internal address to one external address. IPsec is a security protocol suite, software-defined networking (SDN) is a method of defining networks programmatically, and IPX is a non-IP network protocol."},{"ch":"PT2","ch_name":"模拟卷 2","no":79,"type":"single","q":"What type of attack would the following precautions help prevent?\n• Requesting proof of identity\n• Requiring callback authorizations on voice-only requests\n• Not changing passwords via voice communications","opts":["DoS attacks","Worms","Social engineering","Shoulder surfing"],"ans":"C","expl":"Each of the precautions listed helps to prevent social engineering by helping prevent exploitation of trust. Avoiding voice-only communications is particularly important, since establishing identity over the phone is difficult. The other listed attacks would not be prevented by these techniques."},{"ch":"PT2","ch_name":"模拟卷 2","no":80,"type":"single","q":"The CIS benchmarks are an example of what sort of compliance tool?","opts":["A security baseline","A compliance standard","A secure provisioning tool","A security automation tool"],"ans":"A","expl":"The CIS benchmarks provide a useful security standard and baseline to assess systems against or to configure them to. Organizations can adapt and modify the baseline to meet their specific needs while speeding up deployment by using an accepted industry standard. They are not a compliance standard and do not provide provisioning or automation, but tools that do may use the benchmark as a standard to do so."},{"ch":"PT2","ch_name":"模拟卷 2","no":81,"type":"single","q":"Residual data is another term for what type of data left after attempts have been made to erase it?","opts":["Leftover data","MBR","Bitrot","Remnant data"],"ans":"D","expl":"Remnant data is data that is left after attempts have been made to remove or erase it. Bitrot is a term used to describe aging media that decays over time. MBR is the master boot record, a boot sector found on hard drives and other media. Leftover data is not an industry term."},{"ch":"PT2","ch_name":"模拟卷 2","no":82,"type":"single","q":"Which one of the following disaster recovery test types involves the actual activation of the disaster recovery facility?","opts":["Simulation test","Tabletop exercise","Parallel test","Checklist review"],"ans":"C","expl":"During a parallel test, the team activates the disaster recovery site for testing, but the primary site remains operational. A simulation test involves a role-play of a prepared sce-nario overseen by a moderator. Responses are assessed to help improve the organization’s response process. The checklist review is the least disruptive type of disaster recovery test. During a checklist review, team members each review the contents of their disaster recovery\nchecklists on their own and suggest any necessary changes. During a tabletop exercise, team members come together and walk through a scenario without making any changes to information systems."},{"ch":"PT2","ch_name":"模拟卷 2","no":83,"type":"single","q":"What access control system lets owners decide who has access to the objects they own?","opts":["Role-based access control","Task-based access control","Discretionary access control","Rule-based access control"],"ans":"C","expl":"Discretionary access control gives owners the right to decide who has access to the objects they own. Role-based access control uses administrators to make that decision for roles or groups of people with a role, task-based access control uses lists of tasks for each user, and rule-based access control applies a set of rules to all subjects."},{"ch":"PT2","ch_name":"模拟卷 2","no":84,"type":"single","q":"Using a trusted channel and link encryption are both ways to prevent what type of access control attack?","opts":["Brute-force","Spoofed login screens","Man-in-the-middle attacks","Dictionary attacks"],"ans":"C","expl":"Trusted paths that secure network traffic from capture and link encryption are both ways to help prevent man-in-the-middle attacks. Brute-force and dictionary attacks can both be prevented using back-off algorithms that slow down repeated attacks. Log analysis tools can also create dynamic firewall rules, or an IPS can block attacks like these in real time. Spoofed login screens can be difficult to prevent, although user awareness training can help."},{"ch":"PT2","ch_name":"模拟卷 2","no":85,"type":"single","q":"Which one of the following is not one of the canons of the (ISC)2 Code of Ethics?","opts":["Protect society, the common good, necessary public trust and confidence, and the infra-structure.","Act honorably, honestly, justly, responsibly, and legally.","Provide diligent and competent service to principals.","Maintain competent records of all investigations and assessments."],"ans":"D","expl":"The four canons of the (ISC)2 Code of Ethics are to protect society, the common good, the necessary public trust and confidence, and the infrastructure; act honorably, honestly, justly, responsibly, and legally; provide diligent and competent service to principals; and advance and protect the profession."},{"ch":"PT2","ch_name":"模拟卷 2","no":86,"type":"single","q":"Which one of the following components should be included in an organization’s emergency response guidelines?","opts":["Immediate response procedures","Long-term business continuity protocols","Activation procedures for the organization’s cold sites","Contact information for ordering equipment"],"ans":"A","expl":"The emergency response guidelines should include the immediate steps an organization should follow in response to an emergency situation. These include immediate response procedures, a list of individuals who should be notified of the emergency, and secondary response procedures for first responders. They do not include long-term actions such as activating business continuity protocols, ordering equipment, or activating DR sites."},{"ch":"PT2","ch_name":"模拟卷 2","no":87,"type":"single","q":"Ben is working on integrating a federated identity management system and needs to exchange authentication and authorization information for browser-based single sign-on. What tech-nology is his best option?","opts":["HTML","XACML","SAML","SPML"],"ans":"C","expl":"Security Assertion Markup Language (SAML) is the best choice for providing authentica-tion and authorization information, particularly for browser-based SSO. HTML is primarily used for web pages, SPML is used to exchange user information for SSO, and XACML is used for access control policy markup."},{"ch":"PT2","ch_name":"模拟卷 2","no":88,"type":"single","q":"What is the minimum interval at which an organization should conduct business continuity plan refresher training for those with specific business continuity roles?","opts":["Weekly","Monthly","Semiannually","Annually"],"ans":"D","expl":"Individuals with specific business continuity roles should receive training on at least an annual basis."},{"ch":"PT2","ch_name":"模拟卷 2","no":89,"type":"single","q":"What three types of interfaces are typically tested during software testing?","opts":["Network, physical, and application interfaces","APIs, UIs, and physical interfaces","Network interfaces, APIs, and UIs","Application, programmatic, and user interfaces"],"ans":"B","expl":"Application programming interfaces (APIs), user interfaces (UIs), and physical interfaces are all tested during the software testing process. Network interfaces are not typically tested, and programmatic interfaces is another term for APIs."},{"ch":"PT2","ch_name":"模拟卷 2","no":90,"type":"single","q":"Amanda wants to monitor her LDAP servers to identify which types of queries are causing problems. What type of monitoring should she use if she wants to be able to use the produc-tion servers and actual traffic for her testing?","opts":["Active","Real-time","Passive","Replay"],"ans":"C","expl":"Since Amanda wants to monitor her production server, she should use passive monitoring by employing a network tap, span port, or other means of copying actual traffic to a moni-toring system that can identify performance and other problems. This will avoid introducing potentially problematic traffic on purpose while capturing actual traffic problems. Active monitoring relies on synthetic or previously recorded traffic, and both replay and real time are not common industry terms used to describe types of monitoring."},{"ch":"PT2","ch_name":"模拟卷 2","no":91,"type":"single","q":"Steve is developing an input validation routine that will protect the database supporting a web application from SQL injection attack. Where should Steve place the input vali-dation code?","opts":["JavaScript embedded in the web pages","Back-end code on the web server","Stored procedure on the database","Code on the user’s web browser"],"ans":"B","expl":"For web applications, input validation should always be performed on the web applica-tion server. By the time the input reaches the database, it is already part of a SQL command that is properly formatted and input validation would be far more difficult, if it is even pos-sible. Input validation controls should never reside in the client’s browser, as is the case with JavaScript, because the user may remove or tamper with the validation code."},{"ch":"PT2","ch_name":"模拟卷 2","no":92,"type":"single","q":"Ben is selecting an encryption algorithm for use in an organization with 10,000 employees. He must facilitate communication between any two employees within the organization. Which one of the following algorithms would allow him to meet this goal with the least time dedicated to key management?","opts":["RSA","IDEA","3DES","Skipjack"],"ans":"A","expl":"RSA is an asymmetric encryption algorithm that requires only two keys for each user. IDEA, 3DES, and Skipjack are all symmetric encryption algorithms and would require a key for every unique pair of users in the system."},{"ch":"PT2","ch_name":"模拟卷 2","no":95,"type":"single","q":"Which one of the following activities transforms a zero-day vulnerability into a less dan-gerous attack vector?","opts":["Discovery of the vulnerability","Implementation of transport-layer encryption","Reconfiguration of a firewall","Release of a security patch"],"ans":"D","expl":"Zero-day vulnerabilities remain in the dangerous zero-day category until the release of a patch that corrects the vulnerability. At that time, it becomes the responsibility of IT\nprofessionals to protect their systems by applying the patch. Implementation of other secu-rity controls, such as encryption or firewalls, does not change the nature of the zero-day vulnerability."},{"ch":"PT2","ch_name":"模拟卷 2","no":96,"type":"single","q":"Elle’s organization has had to shift to remote work. Each staff member needs access to specific applications, and due to the quick shift, staff members are working from systems that may be home systems or borrowed laptops. What is the best option for remote access in a situation like the one that Elle is facing?","opts":["An IPsec VPN","A dedicated fiber connection to each remote work location","An HTML5-based VPN","Use of remote desktop to connect to an existing workstation at the company’s office building"],"ans":"C","expl":"An HTML5-based VPN will provide Elle’s staff with access to the applications they need without requiring the installation of a client that might be challenging or impossible without managed machines. A client-based IPsec VPN provides additional opportunities for control that a broadly deployed base of directly accessed machines via RDP do not, making it the second-best choice here. Deploying fiber for direct connections for end users is not viable for most organizations based on cost and complexity."},{"ch":"PT2","ch_name":"模拟卷 2","no":97,"type":"single","q":"Susan wants to monitor traffic between systems in a VMware environment. What solution would be her best option to monitor that traffic?\nFor questions 98–101, please refer to the following scenario:","opts":["Use a traditional hardware-based IPS.","Install Wireshark on each virtual system.","Set up a virtual span port and capture data using a VM IDS.","Use netcat to capture all traffic sent between VMs."],"ans":"C","expl":"Using a virtual machine to monitor a virtual span port allows the same type of visibility that it would in a physical network if implemented properly. Installing Wireshark would allow monitoring on each system but doesn’t scale well. A physical appliance would require all traffic to be sent out of the VM environment, losing many of the benefits of the design. Finally, netcat is a network tool used to send or receive data, but it isn’t a tool that allows packet capture of traffic between systems."},{"ch":"PT2","ch_name":"模拟卷 2","no":98,"type":"single","q":"When Matthew sends Richard a message, what key should he use to encrypt the message?","opts":["Matthew’s public key","Matthew’s private key","Richard’s public key","Richard’s private key"],"ans":"C","expl":"The sender of a message encrypts the message using the public key of the message recipient.","scene":"Matthew and Richard are friends located in different physical locations who would like to begin communicating with each other using cryptography to protect the confidentiality of their communications. They exchange digital certificates to begin this process and plan to use an asymmetric encryption algorithm for the secure exchange of email messages."},{"ch":"PT2","ch_name":"模拟卷 2","no":99,"type":"single","q":"When Richard receives the message from Matthew, what key should he use to decrypt the message?","opts":["Matthew’s public key","Matthew’s private key","Richard’s public key","Richard’s private key"],"ans":"D","expl":"The recipient of a message uses his or her own private key to decrypt messages that were encrypted with the recipient’s public key. This ensures that nobody other than the intended recipient can decrypt the message.","scene":"Matthew and Richard are friends located in different physical locations who would like to begin communicating with each other using cryptography to protect the confidentiality of their communications. They exchange digital certificates to begin this process and plan to use an asymmetric encryption algorithm for the secure exchange of email messages."},{"ch":"PT2","ch_name":"模拟卷 2","no":100,"type":"single","q":"Matthew would like to enhance the security of his communication by adding a digital signature to the message. What goal of cryptography are digital signatures intended to enforce?","opts":["Secrecy","Availability","Confidentiality","Nonrepudiation"],"ans":"D","expl":"Digital signatures enforce nonrepudiation. They prevent individuals from denying that they were the actual originator of a message.","scene":"Matthew and Richard are friends located in different physical locations who would like to begin communicating with each other using cryptography to protect the confidentiality of their communications. They exchange digital certificates to begin this process and plan to use an asymmetric encryption algorithm for the secure exchange of email messages."},{"ch":"PT2","ch_name":"模拟卷 2","no":101,"type":"single","q":"When Matthew goes to add the digital signature to the message, what encryption key does he use to create the digital signature?","opts":["Matthew’s public key","Matthew’s private key","Richard’s public key","Richard’s private key"],"ans":"B","expl":"An individual creates a digital signature by encrypting the message digest with their own private key.","scene":"Matthew and Richard are friends located in different physical locations who would like to begin communicating with each other using cryptography to protect the confidentiality of their communications. They exchange digital certificates to begin this process and plan to use an asymmetric encryption algorithm for the secure exchange of email messages."},{"ch":"PT2","ch_name":"模拟卷 2","no":102,"type":"single","q":"When Jim logs into a system, his password is compared to a hashed value stored in a data-base. What is this process?","opts":["Identification","Hashing","Tokenization","Authentication"],"ans":"D","expl":"The comparison of a factor to validate an identity is known as authentication. Identification would occur when Jim presented his user ID. Tokenization is a process that converts a sensitive data element to a nonsensitive representation of that element. Hash-ing transforms a string of characters into a fixed-length value or key that represents the original string."},{"ch":"PT2","ch_name":"模拟卷 2","no":103,"type":"single","q":"What is the top priority for security professionals when considering facility design?","opts":["Limiting access to only approved personnel","Ensuring that the structure supports least privilege","Ensuring the safety of personnel","Limiting the potential for weather or other natural disasters to impact operations"],"ans":"C","expl":"The most important item in facility design is the safety of personnel. Once designs take that into account, security, operational effectiveness, and other concerns can be addressed."},{"ch":"PT2","ch_name":"模拟卷 2","no":104,"type":"single","q":"Which of the following types of controls does not describe a mantrap?","opts":["Deterrent","Preventive","Compensating","Physical"],"ans":"C","expl":"A mantrap, which is composed of two sets of doors with an access mechanism that allows only one door to open at a time, is an example of a preventive access control because it can stop unwanted access by keeping intruders from accessing a facility due to an opened door or following legitimate staff in. It can serve as a deterrent by discouraging intruders who would be trapped in it without proper access, and of course, doors with locks are an example of a physical control. A compensating control attempts to make up for problems with an existing control or to add additional controls to improve a primary control."},{"ch":"PT2","ch_name":"模拟卷 2","no":105,"type":"single","q":"Sally’s organization needs to be able to prove that certain staff members sent emails, and she wants to adopt a technology that will provide that capability without changing their existing email system. What is the technical term for the capability Sally needs to imple-ment as the owner of the email system, and what tool could she use to do it?","opts":["Integrity; IMAP","Repudiation; encryption","Nonrepudiation; digital signatures","Authentication; DKIM"],"ans":"C","expl":"Sally needs to provide nonrepudiation, the ability to provably associate a given email with a sender. Digital signatures can provide nonrepudiation and are her best option. IMAP is a mail protocol, encryption can provide confidentiality, and DKIM is a tool for identifying domains that send email."},{"ch":"PT2","ch_name":"模拟卷 2","no":106,"type":"single","q":"Which one of the following background checks is not normally performed during normal pre-hire activities?","opts":["Credit check","Reference verification","Criminal records check","Medical records check"],"ans":"D","expl":"In most situations, employers may not access medical information due to healthcare privacy laws. Reference checks, criminal records checks, and credit history reports are all typically found during pre-employment background checks."},{"ch":"PT2","ch_name":"模拟卷 2","no":107,"type":"single","q":"Naomi’s organization limits data access to only those users with roles that require it for their job. What key security operations practice does this describe?","opts":["Least privilege","Privileged account management","Job rotation","Privilege escalation"],"ans":"A","expl":"Naomi’s organization operates under the concept of least privilege. Individuals only receive the rights that they need to accomplish their task. This also means that the organiza-tion will need to ensure that those rights do not accrue to users over time and that they are changed or removed when user roles change. Privileged account management is the process of properly managing accounts with higher levels of privilege like administrative accounts. Job rotation moves employees between roles to ensure that they do not take advantage of the role and that a new set of eyes can help identify problems. Privilege escalation is the process of gaining additional rights when attacking systems or services."},{"ch":"PT2","ch_name":"模拟卷 2","no":108,"type":"single","q":"In the OSI model, when a packet changes from a data stream to a segment or a datagram, what layer has it traversed?","opts":["The Transport layer","The Application layer","The Data Link layer","The Physical layer"],"ans":"A","expl":"When a data stream is converted into a segment (TCP) or a datagram (UDP), it transi-tions from the Session layer to the Transport layer. This change from a message sent to an encoded segment allows it to then traverse the Network layer."},{"ch":"PT2","ch_name":"模拟卷 2","no":109,"type":"single","q":"Tommy handles access control requests for his organization. A user approaches him and explains that he needs access to the human resources database in order to complete a head-count analysis requested by the CFO. What has the user demonstrated success-fully to Tommy?","opts":["Clearance","Separation of duties","Need to know","Isolation"],"ans":"C","expl":"The user has successfully explained a valid need to know the data—completing the report requested by the CFO requires this access. However, the user has not yet demon-strated that they have appropriate clearance to access the information. A note from the CFO would meet this requirement."},{"ch":"PT2","ch_name":"模拟卷 2","no":110,"type":"single","q":"Kathleen wants to set up a service to provide information about her organization’s users and services using a central, open, vendor-neutral, standards-based system that can be easily queried. Which of the following technologies is her best choice?","opts":["RADIUS","LDAP","Kerberos","Active Directory"],"ans":"B","expl":"Kathleen’s needs point to a directory service, and the Lightweight Directory Access Protocol (LDAP) would meet her needs. LDAP is an open, industry-standard, and vendor-neutral protocol for directory services. Kerberos and RADIUS are both authentication pro-tocols, and Active Directory is a Microsoft product and is not vendor-neutral, although it does support a number of open standards."},{"ch":"PT2","ch_name":"模拟卷 2","no":111,"type":"single","q":"What type of tool is most frequently used to match assets to users and owners in enterprises?","opts":["An enterprise content management tool","Barcoded property tags","RFID-based property tags","A system inventory"],"ans":"D","expl":"A system inventory is most frequently used to associate individuals with systems or devices. This can help when tracking their support history and aids in provisioning the proper tools, permissions, and data to a system. Both barcode and RFID property tags are used to identify systems, which can then be checked against a system inventory. Finally, enterprise content management tools are used to manage files and data as part of workflows and other business processes."},{"ch":"PT2","ch_name":"模拟卷 2","no":112,"type":"single","q":"Alice would like to add another object to a security model and grant herself rights to that object. Which one of the rules in the Take-Grant protection model would allow her to complete this operation?","opts":["Take rule","Grant rule","Create rule","Remove rule"],"ans":"C","expl":"The create rule allows a subject to create new objects and also creates an edge from the subject to that object, granting rights on the new object."},{"ch":"PT2","ch_name":"模拟卷 2","no":113,"type":"single","q":"Which of the following concerns should not be on Amanda’s list of potential issues when penetration testers suggest using Metasploit during their testing?","opts":["Metasploit can only test vulnerabilities it has plug-ins for.","Penetration testing only covers a point-in-time view of the organization’s security.","Tools like Metasploit can cause denial-of-service issues.","Penetration testing cannot test process and policy."],"ans":"A","expl":"Metasploit provides an extensible framework, allowing penetration testers to create their own exploits in addition to those that are built into the tool. Unfortunately, penetration test-ing can only cover the point in time when it is conducted. When conducting a penetration test, the potential to cause a denial of service due to a fragile service always exists, but it can test process and policy through social engineering and operational testing that validates how those processes and policies work."},{"ch":"PT2","ch_name":"模拟卷 2","no":114,"type":"single","q":"Colin is reviewing a system that has been assigned the EAL7 evaluation assurance level under the Common Criteria. What is the highest level of assurance that he may have about the system?","opts":["It has been functionally tested.","It has been methodically tested and checked.","It has been methodically designed, tested, and reviewed.","It has been formally verified, designed, and tested."],"ans":"D","expl":"EAL7 is the highest level of assurance under the Common Criteria. It applies when a system has been formally verified, designed, and tested."},{"ch":"PT2","ch_name":"模拟卷 2","no":115,"type":"single","q":"Which ITU-T standard should Alex expect to see in use when he uses his smart card to provide a certificate to an upstream authentication service?","opts":["X.500","SPML","X.509","SAML"],"ans":"C","expl":"X.509 defines standards for public key certificates like those used with many smartcards.\nX.500 is a series of standards defining directory services. The Service Provisioning Markup Language (SPML) and the Security Assertion Markup Language (SAML) aren’t standards that Alex should expect to see when using a smartcard to authenticate."},{"ch":"PT2","ch_name":"模拟卷 2","no":116,"type":"single","q":"What type of websites are regulated under the terms of COPPA?","opts":["Financial websites not run by financial institutions","Healthcare websites that collect personal information","Websites that collect information from children","Financial websites run by financial institutions"],"ans":"C","expl":"The Children’s Online Privacy Protection Act (COPPA) regulates websites that cater to children or knowingly collect information from children under the age of 13."},{"ch":"PT2","ch_name":"模拟卷 2","no":117,"type":"single","q":"Tracy recently accepted an IT compliance position at a federal government agency that works very closely with the Defense Department on classified government matters. Which one of the following laws is least likely to pertain to Tracy’s agency?","opts":["HIPAA","FISMA","HSA","CFAA"],"ans":"A","expl":"The Health Insurance Portability and Accountability Act (HIPAA) applies to healthcare information and is unlikely to apply in this situation. The Federal Information Security Management Act (FISMA) and Government Information Security Reform Act regulate the activities of all government agencies. The Homeland Security Act (HSA) created the U.S. Department of Homeland Security and, more importantly for this question, included the Cyber Security Enhancement Act of 2002 and the Critical Infrastructure Information Act of 2002. The Computer Fraud and Abuse Act (CFAA) provides specific protections for systems operated by government agencies."},{"ch":"PT2","ch_name":"模拟卷 2","no":118,"type":"single","q":"Referring to the figure shown here, what is the name of the security control indicated by the arrow?","opts":["Mantrap","Intrusion prevention system","Turnstile","Portal"],"ans":"C","expl":"Turnstiles are unidirectional gates that prevent more than a single person from entering a facility at a time."},{"ch":"PT2","ch_name":"模拟卷 2","no":119,"type":"single","q":"What two important factors does accountability for access control rely on?","opts":["Identification and authorization","Authentication and authorization","Identification and authentication","Accountability and authentication"],"ans":"C","expl":"Access control systems rely on identification and authentication to provide account-ability. Effective authorization systems are desirable, but not required, since logs can pro-vide information about who accessed what resources, even if access to those resources\nis not managed well. Of course, poor authorization management can create many other problems."},{"ch":"PT2","ch_name":"模拟卷 2","no":120,"type":"single","q":"What part of the CIA triad does a checksum support?","opts":["Availability","Integrity","Confidentiality","Authenticity"],"ans":"B","expl":"Checksums validate whether a file or other data object has been changed or modified, and thus, they support integrity."},{"ch":"PT2","ch_name":"模拟卷 2","no":121,"type":"single","q":"Scott’s organization has configured their external IP address to be 192.168.1.25. When traffic is sent to their ISP, it never reaches its destination. What problem is Scott’s organiza-tion encountering?","opts":["BGP is not set up properly.","They have not registered their IP with their ISP.","The IP address is a private, nonroutable address.","192.168.1.25 is a reserved address for home routers."],"ans":"C","expl":"The 192.168.0.0 to 192.168.255.255 address range is one of the ranges defined by RFC 1918 as private, nonroutable IP ranges. Scott’s ISP (and any other organization with a prop-erly configured router) will not route traffic from these addresses over the public internet."},{"ch":"PT2","ch_name":"模拟卷 2","no":122,"type":"single","q":"Jack’s organization merges updates to their main application multiple times a day and then deploys it as code that is checked in and tested through their software development pipeline. What type of model is this?","opts":["Waterfall","CI/CD","SCM","IDE"],"ans":"B","expl":"Jack’s organization is using a continuous integration/continuous deliver (CI/CD) model where the application is updated and deployed on an ongoing basis. This can allow for an agile application but requires strong testing and validation practices to ensure that bad code doesn’t make it into production. Waterfall is a development model that is based on a slower, precise process. SCM is software configuration management, and an IDE is an integrated development environment."},{"ch":"PT2","ch_name":"模拟卷 2","no":123,"type":"single","q":"Sue’s organization recently failed a security assessment because their network was a single flat broadcast domain, and sniffing traffic was possible between different functional groups. What solution should she recommend to help prevent the issues that were identified?","opts":["Use VLANs.","Change the subnet mask for all systems.","Deploy gateways.","Turn on port security."],"ans":"A","expl":"A well-designed set of VLANs based on functional groupings will logically separate seg-ments of the network, making it difficult to have data exposure issues between VLANs. Changing the subnet mask will only modify the broadcast domain and will not fix issues with packet sniffing. Gateways would be appropriate if network protocols were different on different segments. Port security is designed to limit which systems can connect to a given port."},{"ch":"PT2","ch_name":"模拟卷 2","no":124,"type":"single","q":"Which of the following terms best describes the IP address 10.14.124.240?","opts":["Public IP address","Private IP address","APIPA address","Loopback address"],"ans":"B","expl":"Any 10.x.x.x address is a private address as defined by RFC 1918. APIPA addresses are self assigned by Windows when they cannot contact a DHCP server. 127.0.0.1 is a loopback address systems use to connect with themselves. Public IP addresses compose the majority of IP addresses with the exception of reserved addresses like those described in RFC 1918."},{"ch":"PT3","ch_name":"模拟卷 3","no":1,"type":"single","q":"Fred’s data role requires him to maintain system security plans and to ensure that system users and support staff get the training they need about security practices and acceptable use. What is the role that Fred is most likely to hold in the organization?","opts":["Data owner","System owner","User","Custodian"],"ans":"B","expl":"NIST SP800-18 describes system owner responsibilities that include helping to develop system security plans, maintaining the plan, ensuring training, and identifying, implement-ing, and assessing security controls. A data owner is more likely to delegate these tasks to the system owner. Custodians may be asked to enforce those controls, whereas a user will be directly affected by them."},{"ch":"PT3","ch_name":"模拟卷 3","no":2,"type":"single","q":"Sally is using IPsec’s ESP component in transport mode. What important information should she be aware of about transport mode?","opts":["Transport mode provides full encryption of the entire IP packet.","Transport mode adds a new, unencrypted header to ensure that packets reach their destination.","Transport mode does not encrypt the header of the packet.","Transport mode provides no encryption; only tunnel mode provides encryption."],"ans":"C","expl":"ESP’s Transport mode encrypts IP packet data but leaves the packet header unencrypted. Tunnel mode encrypts the entire packet and adds a new header to support transmission through the tunnel."},{"ch":"PT3","ch_name":"模拟卷 3","no":3,"type":"single","q":"Which one of the following is not an essential process area for the Repeatable phase of the Software Capability Maturity Model (SW-CMM)?","opts":["Software Project Planning","Software Quality Management","Software Project Tracking","Software Subcontract Management"],"ans":"B","expl":"In level 2, the Repeatable level of the SW-CMM, an organization introduces basic lifecycle management processes. Reuse of code in an organized fashion begins, and repeatable results are expected from similar projects. The crucial process areas for this level include Require-ments Management, Software Project Planning, Software Project Tracking and Oversight, Software Subcontract Management, Software Quality Assurance, and Software Configura-tion Management. Software Quality Management is a process that occurs during level 4, the Managed stage of the SW-CMM."},{"ch":"PT3","ch_name":"模拟卷 3","no":4,"type":"single","q":"Ben wants to provide predictive information about his organization’s risk exposure in an automated way as part of an ongoing organizational risk management plan. What should he use to do this?","opts":["KRIs","Quantitative risk assessments","KPIs","Penetration tests"],"ans":"A","expl":"Key risk indicators (KRIs) are often used to monitor risk for organizations that establish an ongoing risk management program. Using automated data gathering and tools that allow data to be digested and summarized can provide predictive information about how organiza-tional risks are changing. KPIs are key performance indicators, which are used to assess how an organization is performing. Quantitative risk assessments are good for point-in-time views with detailed valuation and measurement-based risk assessments, whereas a penetration test would provide details of how well an organization’s security controls are working."},{"ch":"PT3","ch_name":"模拟卷 3","no":6,"type":"single","q":"Chris is conducting reconnaissance on a remote target and discovers that pings are allowed through his target’s border firewall. What can he learn by using ping to probe the remote network?","opts":["Which systems respond to ping, a rough network topology, and potentially the location of additional firewalls","A list of all of the systems behind the target’s firewall","The hostnames and time to live (TTL) for each pingable system, and the ICMP types allowed through the firewall","Router advertisements, echo request responses, and potentially which hosts are tarpitted"],"ans":"A","expl":"Systems that respond to ping will show the time to live for packets that reach them. Since TTL is decremented at each hop, this can help build a rough network topology map. In addition, some firewalls respond differently to ping than a normal system, which means ping-ing a network can sometimes reveal the presence of firewalls that would otherwise be invis-ible. Hostnames are revealed by a DNS lookup, and ICMP types allowed through a firewall are not revealed by only performing a ping. ICMP can be used for router advertisements, but pinging won’t show them!"},{"ch":"PT3","ch_name":"模拟卷 3","no":7,"type":"single","q":"Jake is conducting a review of his organization’s identity and access management program. During his review, he is verifying the privileges assigned to each user and ensuring that they match with business requirements. What element of the program is he reviewing?","opts":["Identification","Accountability","Authorization","Authentication"],"ans":"C","expl":"Authorization defines what a subject can or can’t do. Identification occurs when a sub-ject claims an identity, accountability is provided by the logs and audit trail that track what occurs on a system, and authentication occurs when that identity is validated."},{"ch":"PT3","ch_name":"模拟卷 3","no":8,"type":"single","q":"Faith is looking at the /etc/passwd file on a system configured to use shadowed pass-words. When she examines a line in the file for a user with interactive login permissions, what should she expect to see in the password field?","opts":["Plaintext password","Hashed password","x","*"],"ans":"C","expl":"When a system uses shadowed passwords, the hashed password value is stored in /etc/ shadow instead of /etc/passwd. The /etc/passwd file would not contain the password in plaintext or hashed form. Instead, it would contain an x to indicate that the password hash is in the shadow file. The * character is normally used to disable interactive logins to an account."},{"ch":"PT3","ch_name":"模拟卷 3","no":10,"type":"single","q":"Danielle is testing tax software, and part of her testing process requires her to input a variety of actual tax forms to verify that the software produces the right answers. What type of test-ing is Danielle performing?","opts":["Use case testing","Dynamic testing","Fuzzing","Misuse testing"],"ans":"A","expl":"Testing for desired functionality is use case testing. Dynamic testing is used to deter-mine how code handles variables that change over time. Misuse testing focuses on how code handles examples of misuse, and fuzzing feeds unexpected data as an input to see how the code responds."},{"ch":"PT3","ch_name":"模拟卷 3","no":11,"type":"single","q":"After 10 years working in her organization, Cassandra is moving into her fourth role, this time as a manager in the accounting department. What issue is likely to show up during an account review if her organization does not have strong account maintenance practices?","opts":["An issue with least privilege","Privilege creep","Account creep","Account termination"],"ans":"B","expl":"Privilege creep is a common problem when employees change roles over time and their priv-ileges and permissions are not properly modified to reflect their new roles. Least privilege issues are a design or implementation problem, and switching roles isn’t typically what causes them to occur. Account creep is not a common industry term, and account termination would imply that someone has removed her account instead of switching her to new groups or new roles."},{"ch":"PT3","ch_name":"模拟卷 3","no":12,"type":"single","q":"IP addresses like 10.10.10.10 and 172.19.24.21 are both examples of what type of IP address?","opts":["Public IP addresses","Prohibited IP addresses","Private IP addresses","Class B IP ranges"],"ans":"C","expl":"These are examples of private IP addresses. RFC1918 defines a set of private IP addresses for use in internal networks. These private addresses including 10.0.0.0 to 10.255.255.255,\n172.16.0.0 to 172.31.255.255, and 192.168.0.0 to 196.168.255.255 should never be\nroutable on the public internet."},{"ch":"PT3","ch_name":"模拟卷 3","no":13,"type":"single","q":"Ben is reviewing the password recovery mechanism used by his website and discovers that the approach uses cognitive authentication through the use of security questions. What is the major issue with this approach?","opts":["It prevents the use of tokens.","The question’s answer may be easy to find on the internet.","Cognitive passwords require users to think to answer the question, and not all users may be able to solve the problems presented.","Cognitive passwords don’t support long passwords."],"ans":"B","expl":"A cognitive password authenticates users based on a series of facts or answers to ques-tions that they know. Preset questions for cognitive passwords typically rely on common information about a user like their mother’s maiden name or the name of their pet, and that information can frequently be found on the internet. The best cognitive password systems let users make up their own questions."},{"ch":"PT3","ch_name":"模拟卷 3","no":14,"type":"single","q":"Megan needs to create a forensic copy of a hard drive that will be used in an investigation. Which of the following tools is best suited to her work?","opts":["xcopy","dd","DBAN","ImageMagik"],"ans":"B","expl":"The Linux tool dd creates a bit-by-bit copy of the target drive that is well suited to forensic use, and special forensic versions of dd exist that can provide even more forensic features. Simply copying files using a tool like xcopy does not create a forensically sound copy. DBAN is a drive wiping tool and would cause Megan to lose the data she is seeking to copy. ImageMagik is a graphics manipulation and editing program."},{"ch":"PT3","ch_name":"模拟卷 3","no":15,"type":"single","q":"Kay is selecting an application management approach for her organization. Employees need the flexibility to install software on their systems, but Kay wants to prevent them from installing certain prohibited packages. What type of approach should she use?","opts":["Antivirus","Whitelist","Blacklist","Heuristic"],"ans":"C","expl":"The blacklist approach to application control blocks certain prohibited packages but allows the installation of other software on systems. The whitelist approach uses the reverse philosophy and only allows approved software. Antivirus software would only detect the installation of malicious software after the fact. Heuristic detection is a variant of antivi-rus software."},{"ch":"PT3","ch_name":"模拟卷 3","no":16,"type":"single","q":"Donna is a security administrator for a healthcare provider located in the United States and is reviewing their payment processing system. It contains data relating to the past, present, or future payment for the provision of healthcare to an individual. How would this information be classified under HIPAA?","opts":["PCI","Personal billing data","PHI","Personally identifiable information (PII)"],"ans":"C","expl":"Personal health information (PHI) is specifically defined by HIPAA to include information about an individual’s medical bills. PCI could refer to the payment card industry’s secu-\nrity standard but would only apply in relation to credit cards. PII is a broadly defined term for personally identifiable information, and personal billing data isn’t a broadly used industry term."},{"ch":"PT3","ch_name":"模拟卷 3","no":17,"type":"single","q":"Harold’s company has a strong password policy that requires a minimum length of 12 char-acters and the use of both alphanumeric characters and symbols. What technique would be the most effective way for an attacker to compromise passwords in Harold’s organization?","opts":["Brute-force attack","Dictionary attack","Rainbow table attack","Social engineering attack"],"ans":"D","expl":"A social engineering attack may trick a user into revealing their password to the attacker. Other attacks that depend on guessing passwords, such as brute-force attacks, rainbow table attacks, and dictionary attacks, are unlikely to be successful in light of the organization’s strong password policy."},{"ch":"PT3","ch_name":"模拟卷 3","no":18,"type":"single","q":"While traveling, James is held at knifepoint and forced to log into his laptop. What is this called?","opts":["Duress","Antisocial engineering","Distress","Knifepoint hacking"],"ans":"A","expl":"When someone is forced to perform an action under threat, it is known as duress."},{"ch":"PT3","ch_name":"模拟卷 3","no":19,"type":"single","q":"Brian recently joined an organization that runs the majority of its services on a virtualization platform located in its own data center but also leverages an IaaS provider for hosting its web services and a SaaS email system. What term best describes the type of cloud environ-ment this organization uses?","opts":["Public cloud","Dedicated cloud","Private cloud","Hybrid cloud"],"ans":"D","expl":"The scenario describes a mix of public cloud and private cloud services. This is an example of a hybrid cloud environment."},{"ch":"PT3","ch_name":"模拟卷 3","no":21,"type":"single","q":"Susan uses a span port to monitor traffic to her production website and uses a monitoring tool to identify performance issues in real time. What type of monitoring is she conducting?","opts":["Passive monitoring","Active monitoring","Synthetic monitoring","Signature-based monitoring"],"ans":"A","expl":"Susan is performing passive monitoring, which uses a network tap or span port to capture traffic to analyze it without impacting the network or devices that it is used to monitor. Synthetic, or active, monitoring uses recorded or generated traffic to test for performance and other issues. Signature-based technologies include IDS, IPS, and antimalware systems."},{"ch":"PT3","ch_name":"模拟卷 3","no":22,"type":"single","q":"In what type of attack do attackers manage to insert themselves into a connection between a user and a legitimate website?","opts":["Man-in-the-middle attack","Fraggle attack","Wardriving attack","Meet-in-the-middle attack"],"ans":"A","expl":"In a man-in-the-middle attack, attackers manage to insert themselves into a connec-tion between a user and a legitimate website, relaying traffic between the two parties while eavesdropping on the connection. Although similarly named, the meet-in-the-middle attack is a cryptographic attack that does not necessarily involve connection tampering. Fraggle is\na network-based denial-of-service attack using UDP packets. Wardriving is a reconnaissance technique for discovering open or weakly secured wireless networks."},{"ch":"PT3","ch_name":"模拟卷 3","no":23,"type":"single","q":"Which one of the following would be considered an example of infrastructure as a service cloud computing?\nFor questions 24–26, please refer to the following scenario:","opts":["Payroll system managed by a vendor and delivered over the web","Application platform managed by a vendor that runs customer code","Servers provisioned by customers on a vendor-managed virtualization platform","Web-based email service provided by a vendor"],"ans":"C","expl":"One of the core capabilities of infrastructure as a service is providing servers on a vendor-managed virtualization platform. Web-based payroll and email systems are examples of soft-ware as a service. An application platform managed by a vendor that runs customer code is an example of platform as a service."},{"ch":"PT3","ch_name":"模拟卷 3","no":24,"type":"single","q":"Based on the information in this scenario, what is the exposure factor for the effect of a fire on the Roscommon Agricultural Products data center?","opts":["7.5 percent","15.0 percent","27.5 percent","37.5 percent"],"ans":"D","expl":"The exposure factor is the percentage of the facility that risk managers expect will be damaged if a risk materializes. It is calculated by dividing the amount of damage by the asset value. In this case, that is $750,000 in damage divided by the $2million facility value, or\n37.5 percent.","scene":"Darcy is an information security risk analyst for Roscommon Agricultural Products. She is currently trying to decide whether the company should purchase an upgraded fire suppres-sion system for their primary data center. The data center facility has a replacement cost of $2 million. After consulting with actuaries, data center managers, and fire subject-matter experts, Darcy determined that a typical fire would likely require the replacement of all equipment inside the building but not cause significant structural damage. Together, they estimated that recovering from the fire would cost $750,000. They also determined that the company can expect a fire of this magnitude once every 50 years."},{"ch":"PT3","ch_name":"模拟卷 3","no":25,"type":"single","q":"Based on the information in this scenario, what is the annualized rate of occurrence for a fire at the Roscommon Agricultural Products data center?","opts":["0.002","0.005","0.02","0.05"],"ans":"C","expl":"The annualized rate of occurrence is the number of times each year that risk analysts expect a risk to happen. In this case, the analysts expect fires will occur once every 50 years, or 0.02 times per year.","scene":"Darcy is an information security risk analyst for Roscommon Agricultural Products. She is currently trying to decide whether the company should purchase an upgraded fire suppres-sion system for their primary data center. The data center facility has a replacement cost of $2 million. After consulting with actuaries, data center managers, and fire subject-matter experts, Darcy determined that a typical fire would likely require the replacement of all equipment inside the building but not cause significant structural damage. Together, they estimated that recovering from the fire would cost $750,000. They also determined that the company can expect a fire of this magnitude once every 50 years."},{"ch":"PT3","ch_name":"模拟卷 3","no":26,"type":"single","q":"Based on the information in this scenario, what is the annualized loss expectancy for a fire at the Roscommon Agricultural Products data center?","opts":["$15,000","$25,000","$75,000","$750,000"],"ans":"A","expl":"The annualized loss expectancy is calculated by multiplying the single loss expectancy (SLE) by the annualized rate of occurrence (ARO). In this case, the SLE is $750,000, and the ARO is 0.02. Multiplying these numbers together gives you the ALE of $15,000.","scene":"Darcy is an information security risk analyst for Roscommon Agricultural Products. She is currently trying to decide whether the company should purchase an upgraded fire suppres-sion system for their primary data center. The data center facility has a replacement cost of $2 million. After consulting with actuaries, data center managers, and fire subject-matter experts, Darcy determined that a typical fire would likely require the replacement of all equipment inside the building but not cause significant structural damage. Together, they estimated that recovering from the fire would cost $750,000. They also determined that the company can expect a fire of this magnitude once every 50 years."},{"ch":"PT3","ch_name":"模拟卷 3","no":27,"type":"single","q":"Which one of the following techniques uses statistical methods to select a small number of log records from a large pool for further analysis with the goal of choosing a set of records that is representative of the entire pool?","opts":["Clipping","Randomization","Sampling","Selection"],"ans":"C","expl":"The two main methods of choosing records from a large pool for further analysis are sampling and clipping. Sampling uses statistical techniques to choose a sample that is repre-sentative of the entire pool, while clipping uses threshold values to select those records that exceed a predefined threshold because they may be of most interest to analysts."},{"ch":"PT3","ch_name":"模拟卷 3","no":28,"type":"single","q":"Mike wants to ensure that third-party users of his service’s API can be tracked to prevent abuse of the API. What should he implement to help with this?","opts":["Session IDs","An API firewall","API keys","An API buffer"],"ans":"C","expl":"API keys, or application programming interface keys, are passed to services and identify the program, developer, or user. With this information, Mike can programmatically control API usage per user. Of course, if the keys are inadvertently exposed, the API keys themselves could be abused. Session IDs are typically used to identify users of an application, not an API. API firewalls and API buffers were made up for this question."},{"ch":"PT3","ch_name":"模拟卷 3","no":29,"type":"single","q":"Fran is a web developer who works for an online retailer. Her boss asked her to create a way that customers can easily integrate themselves with Fran’s company’s site. They need to be able to check inventory in real time, place orders, and check order status programmatically without having to access the web page. What can Fran create to most directly facilitate this interaction?","opts":["API","Web scraper","Data dictionary","Call center"],"ans":"A","expl":"An application programming interface (API) allows external users to directly call routines within Fran’s code. They can embed API calls within scripts and other programs to automate interactions with Fran’s company. A web scraper or call center might facilitate the same tasks, but they do not do so in a direct integration. Data dictionaries might provide useful information, but they also do not allow direct integration."},{"ch":"PT3","ch_name":"模拟卷 3","no":30,"type":"single","q":"Todd’s data center facility recently experienced a series of events that involved the momen-tary loss of power. What term best describes these events?","opts":["Fault","Blackout","Sag","Brownout"],"ans":"A","expl":"A fault is a momentary loss of power. Blackouts are sustained complete losses of power. Sags and brownouts are not complete power disruptions but rather periods of low-voltage conditions."},{"ch":"PT3","ch_name":"模拟卷 3","no":31,"type":"single","q":"Lauren’s team of system administrators each deal with hundreds of systems with varying levels of security requirements and find it difficult to handle the multitude of usernames and passwords they each have. What type of solution should she recommend to ensure that pass-words are properly handled and that features like logging and password rotation occur?","opts":["A credential management system","A strong password policy","Separation of duties","Single sign-on"],"ans":"A","expl":"Lauren’s team would benefit from a credential management system. Credential management systems offer features like password management, multifactor authentica-tion to retrieve passwords, logging, audit, and password rotation capabilities. A strong password policy would only make maintenance of passwords for many systems a more difficult task if done manually. Single sign-on would help if all the systems had the same sensitivity levels, but different credentials are normally required for higher-sensitivity systems."},{"ch":"PT3","ch_name":"模拟卷 3","no":33,"type":"single","q":"Gina is performing the initial creation of user accounts for a batch of new employees. What phase of the provisioning process is she conducting?","opts":["Enrollment","Clearance verification","Background checks","Initialization"],"ans":"A","expl":"Enrollment, or registration, is the initial creation of a user account in the provisioning process. Clearance verification and background checks are sometimes part of the process that ensures that the identity of the person being enrolled matches who they claim to be. Initiali-zation is not used to describe the provisioning process."},{"ch":"PT3","ch_name":"模拟卷 3","no":34,"type":"single","q":"Ravi is developing procedures for forensic investigations conducted by his organization and would like to differentiate based upon the evidentiary standards commonly used for each type of investigation. What type of forensic investigation typically has the highest evidentiary standards?","opts":["Administrative","Criminal","Civil","Industry"],"ans":"B","expl":"Criminal forensic investigations typically have the highest standards for evidence, as they must be able to help prove the case beyond a reasonable doubt. Administrative investiga-tions merely need to meet the standards of the organization and to be able to be defended in court, while civil investigations operate on a preponderance of evidence. There is not a cat-egory of forensic investigation referred to as “industry” in the CISSP exam’s breakdown of forensic types."},{"ch":"PT3","ch_name":"模拟卷 3","no":35,"type":"single","q":"What U.S. legal protection prevents law enforcement agencies from searching an American facility or electronic system without either probable cause or consent?","opts":["First Amendment","Fourth Amendment","Fifth Amendment","Fifteenth Amendment"],"ans":"B","expl":"The Fourth Amendment states, in part, that “the right of the people to be secure in their persons, houses, papers and effects, against unreasonable searches and seizures, shall not be violated, and no Warrants shall issue, but upon probable cause, supported by Oath or affir-mation, and particularly describing the place to be searched, and the persons or things to be seized.” The First Amendment contains protections related to freedom of speech. The Fifth Amendment ensures that no person will be required to serve as a witness against themselves. The Fifteenth Amendment protects the voting rights of citizens."},{"ch":"PT3","ch_name":"模拟卷 3","no":36,"type":"single","q":"Tom believes that a customer of his internet service provider has been exploiting a vulnera-bility in his system to read the email messages of other customers. If true, what law did the customer most likely violate?","opts":["ECPA","CALEA","HITECH","Privacy Act"],"ans":"A","expl":"The Electronic Communications Privacy Act (ECPA) makes it a crime to invade the electronic privacy of an individual. It prohibits the unauthorized monitoring of email and voicemail communications."},{"ch":"PT3","ch_name":"模拟卷 3","no":37,"type":"single","q":"In the ring protection model shown here, what ring contains user programs and applications?","opts":["Ring 0","Ring 1","Ring 2","Ring 3"],"ans":"D","expl":"The kernel lies within the central ring, Ring 0. Ring 1 contains other operating system components. Ring 2 is used for drivers and protocols. User-level programs and applications run at Ring 3. Rings 0–2 run in privileged mode, whereas Ring 3 runs in user mode."},{"ch":"PT3","ch_name":"模拟卷 3","no":38,"type":"single","q":"In virtualization platforms, what name is given to the module that is responsible for controlling access to physical resources by virtual resources?","opts":["Guest machine","SDN","Kernel","Hypervisor"],"ans":"D","expl":"The hypervisor runs within the virtualization platform and serves as the moderator between virtual resources and physical resources."},{"ch":"PT3","ch_name":"模拟卷 3","no":39,"type":"single","q":"In which cloud computing model does a customer share computing infrastructure with other customers of the cloud vendor where one customer may not know the other’s identity?","opts":["Public cloud","Private cloud","Community cloud","Shared cloud"],"ans":"A","expl":"In the public cloud computing model, the vendor builds a single platform that is shared among many different customers. This is also known as the shared tenancy model."},{"ch":"PT3","ch_name":"模拟卷 3","no":41,"type":"single","q":"Susan wants to integrate her website to allow users to use accounts from sites like Google. What technology should she adopt?","opts":["Kerberos","LDAP","OpenID","SESAME"],"ans":"C","expl":"OpenID is a widely supported standard that allows a user to use a single account to log in to multiple sites, and Google accounts are frequently used with OpenID."},{"ch":"PT3","ch_name":"模拟卷 3","no":42,"type":"single","q":"Tom is conducting a business continuity planning effort for Orange Blossoms, a fruit orchard located in Central Florida. During the assessment process, the committee determined that there is a small risk of snow in the region but that the cost of implementing controls to reduce the impact of that risk is not warranted. They elect to not take any specific action in response to the risk. What risk management strategy is Orange Blossoms pursuing?","opts":["Risk mitigation","Risk transference","Risk avoidance","Risk acceptance"],"ans":"D","expl":"Risk acceptance occurs when an organization determines that the costs involved in pursuing other risk management strategies are not justified and they choose not to pursue any action."},{"ch":"PT3","ch_name":"模拟卷 3","no":43,"type":"multi","q":"Paul is reviewing the contents of an audit report and discovers a finding that a manager in the accounting department has full access to perform every function in the financial system. What security principles have most likely been violated? (Select all that apply.)","opts":["Separation of duties","Job rotation","Management review","Least privilege"],"ans":"AD","expl":"Accounting departments are normally required to separate sensitive duties, such as the ability to add a new vendor and issue a check. Allowing the manager to perform both of these actions would, therefore, violate the principle of separation of duties. Also, it is quite likely that the manager does not need all of these privileges to carry out their work, violating the principle of least privilege. There is no indication that the situation does not\nfollow job rotation assignments or that the access was not properly granted and subject to a management review."},{"ch":"PT3","ch_name":"模拟卷 3","no":44,"type":"single","q":"Jack’s organization is a multinational nonprofit that has small offices in many developing countries throughout the world. They need to implement an access control system that allows flexibility and that can work despite poor internet connectivity at their locations. What is the best type of access control design for Jack’s organization?","opts":["Centralized access control","Mandatory access control","Decentralized access control","Rule-based access control"],"ans":"C","expl":"Decentralized access control makes sense because it allows local control over access. When network connectivity to a central control point is a problem or if rules and regulations may vary significantly from location to location, centralized control can be less desirable than decentralized control despite its challenges with consistency. Since the problem does\nnot describe specific control needs, mandatory access control and rule-based access controls could fit the need but aren’t the best answer."},{"ch":"PT3","ch_name":"模拟卷 3","no":46,"type":"single","q":"When the certificate authority (CA) created Renee’s digital certificate, what key was contained within the body of the certificate?","opts":["Renee’s public key","Renee’s private key","CA’s public key","CA’s private key"],"ans":"A","expl":"The purpose of a digital certificate is to provide the general public with an authenticated copy of the certificate subject’s public key.","scene":"Mike and Renee would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"PT3","ch_name":"模拟卷 3","no":47,"type":"single","q":"When the certificate authority created Renee’s digital certificate, what key did it use to digi-tally sign the completed certificate?","opts":["Renee’s public key","Renee’s private key","CA’s public key","CA’s private key"],"ans":"D","expl":"The last step of the certificate creation process is the digital signature. During this step, the certificate authority signs the certificate using its own private key.","scene":"Mike and Renee would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"PT3","ch_name":"模拟卷 3","no":48,"type":"single","q":"When Mike receives Renee’s digital certificate, what key does he use to verify the authenticity of the certificate?","opts":["Renee’s public key","Renee’s private key","CA’s public key","CA’s private key"],"ans":"C","expl":"When an individual receives a copy of a digital certificate, the person verifies the authenticity of that certificate by using the CA’s public key to validate the digital signature contained on the certificate.","scene":"Mike and Renee would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"PT3","ch_name":"模拟卷 3","no":49,"type":"single","q":"Mike would like to send Renee a private message using the information gained during this exchange. What key should he use to encrypt the message?","opts":["Renee’s public key","Renee’s private key","CA’s public key","CA’s private key"],"ans":"A","expl":"Mike uses the public key that he extracted from Renee’s digital certificate to encrypt the message that he would like to send to Renee.","scene":"Mike and Renee would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"PT3","ch_name":"模拟卷 3","no":50,"type":"single","q":"Which one of the following tools may be used to directly violate the confidentiality of com-munications on an unencrypted VoIP network?","opts":["Nmap","Nessus","Wireshark","Nikto"],
