<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CISSP 刷题系统 · 官方练习题库</title>
<style>
:root{
  --bg:#f1f6fd; --bg2:#e8f0fb; --card:#ffffff; --card2:#f8fbff;
  --text:#17233a; --text2:#5b6b86; --text3:#8494ab;
  --line:#e2ebf7; --line2:#d3e1f2;
  --primary:#2b6cf0; --primary-d:#1d55cf; --primary-soft:#e8f1ff;
  --ok:#0f9d6b; --ok-soft:#e6f8f0; --bad:#e0464d; --bad-soft:#fdecee;
  --warn:#c8811a; --warn-soft:#fdf3e3;
  --shadow:0 1px 2px rgba(23,35,58,.04),0 8px 24px rgba(23,35,58,.06);
  --r:16px;
  --fs-q:17px; --fs-o:15.5px; --fs-f:14.5px;
}
body.fs-sm{--fs-q:15.5px;--fs-o:14.5px;--fs-f:13.5px}
body.fs-lg{--fs-q:19.5px;--fs-o:17.5px;--fs-f:16px}
body.dark{
  --bg:#0e1622; --bg2:#131e2d; --card:#16212f; --card2:#1a2737;
  --text:#e8eef7; --text2:#a3b3c9; --text3:#7d8ea6;
  --line:#233346; --line2:#2c3f56;
  --primary:#5b9cfb; --primary-d:#7fb2fc; --primary-soft:#1b3050;
  --ok:#3fcf9a; --ok-soft:#15342a; --bad:#ff7b81; --bad-soft:#3a1d21;
  --warn:#e2ac5b; --warn-soft:#33280f;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  min-height:100vh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.app{max-width:1280px;margin:0 auto;padding:18px 18px 40px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px}
@media (max-width:1000px){.app{grid-template-columns:minmax(0,1fr);padding:12px 12px 108px}}

/* ---------- header ---------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:2px 2px 6px;min-width:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
@media (max-width:560px){.brand h1{font-size:15px}.brand p{font-size:11px}.top{gap:7px}.icon-btn{height:34px;min-width:34px}}
.shorter{display:none}
@media (max-width:640px){
  .full{display:none}.shorter{display:inline}
  .brand{flex:0 0 auto}
  .brand h1{font-size:14px;max-width:none}
  .brand p{display:none}
  .logo{height:32px;padding:0 8px;font-size:10.5px}
  .top{gap:6px;align-items:center}
  .top .sp{flex:0 0 2px}
  .icon-btn{height:32px;min-width:32px;padding:0 7px}
  .icon-btn svg{width:16px;height:16px}
}
.logo{height:36px;padding:0 11px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#6ea8ff);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.6px;flex:none}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:12px;color:var(--text3)}
.top .sp{flex:1}
.icon-btn{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line2);background:var(--card);
  border-radius:11px;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.icon-btn span{display:none}.icon-btn{padding:0 9px}}

/* ---------- sidebar ---------- */
.side{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:1000px){.side{position:static;max-height:none;order:2}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:8px;padding:13px 15px 9px;font-size:12px;font-weight:650;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.panel-h svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;flex-direction:column;padding:2px 8px 10px;gap:1px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;color:var(--text);width:100%;font-size:13px}
.nav-item:hover{background:var(--card2)}
.nav-item.on{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 28%,transparent);color:var(--primary-d);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.nav-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .ct{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums;flex:none}
.nav-item.on .ct{color:var(--primary)}
.nav-item .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--primary);border-radius:2px}
.nav-sep{height:1px;background:var(--line);margin:6px 4px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:1}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.stat{background:var(--card);padding:9px 12px}
.stat b{display:block;font-size:19px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--text3)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.pri b{color:var(--primary)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ch-sel{display:none}
@media (max-width:1000px){
  .ch-sel{display:block;width:100%;height:40px;border-radius:11px;border:1px solid var(--line2);
    background:var(--card);color:var(--text);font-size:14px;padding:0 12px;box-shadow:var(--shadow);margin-bottom:2px}
}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:12.5px;color:var(--text2);cursor:pointer}
.seg button.on{background:var(--primary-soft);color:var(--primary-d);font-weight:650}
.toolbar .sp{flex:1}

#cardQ{box-shadow:0 2px 6px rgba(23,35,58,.05),0 16px 40px rgba(23,35,58,.09)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.qbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text3);flex-wrap:wrap}
.chip{padding:2.5px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--text2);font-size:11.5px;white-space:nowrap}
.chip.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary-d)}
.chip.multi{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.qbar .sp{flex:1}
.prog{height:4px;background:var(--card2)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#77adff);transition:width .3s}
.qbody{padding:18px 20px 20px}
@media (max-width:640px){.qbody{padding:16px 15px 18px}.qbar{padding:10px 14px}}
.scene{background:var(--card2);border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:var(--text2)}
.scene summary{cursor:pointer;color:var(--primary-d);font-weight:600;font-size:13px;outline:none}
.scene div{margin-top:8px;white-space:pre-wrap}
.stem{font-size:var(--fs-q);line-height:1.7;font-weight:520;color:var(--text);margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1.5px solid var(--line2);border-radius:13px;
  background:var(--card);cursor:pointer;text-align:left;font-size:var(--fs-o);line-height:1.6;color:var(--text);transition:border-color .15s,background .15s,transform .06s}
.opt:active{transform:scale(.998)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;background:var(--card2);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--text2);margin-top:1px}
.opt:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line2))}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .k{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.opt .tx{flex:1;min-width:0;word-break:break-word}

.footer{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--card);
  color:var(--text);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--primary-d);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.footer .sp{flex:1}

.fb{margin-top:16px;border-radius:13px;padding:13px 15px;font-size:var(--fs-f);line-height:1.7;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 32%,transparent)}
.fb .ttl{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:6px;font-size:14px}
.fb.good .ttl{color:var(--ok)} .fb.bad .ttl{color:var(--bad)}
.fb .ttl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.fb .ans{color:var(--text);margin-bottom:6px}
.fb .ans b{color:var(--primary-d)}
.fb .ex{color:var(--text2);white-space:pre-wrap;word-break:break-word}
.fb .ex::before{content:"解析";display:inline-block;font-size:11px;font-weight:700;color:var(--text3);
  border:1px solid var(--line2);border-radius:6px;padding:0 5px;margin-right:6px;vertical-align:1px}

/* mobile sticky */
.mbar{display:none}
@media (max-width:1000px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    gap:8px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40}
  .mbar .btn{flex:1;height:46px;padding:0 8px;font-size:14px;white-space:nowrap}
  .mbar .btn.pri{flex:1.4}
}

/* result */
.ring-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:22px}
@media (max-width:640px){.ring-wrap{gap:16px;padding:16px}}
.ring{flex:none;position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-size:27px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.ring .mid span{font-size:11.5px;color:var(--text3)}
.rlist{flex:1;min-width:220px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:520px){.rlist{grid-template-columns:1fr}}
.rstat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--text2)}
.rstat b{color:var(--text);font-variant-numeric:tabular-nums}
.review{padding:0 18px 18px}
.review .hd{display:flex;align-items:center;gap:8px;padding:14px 0 10px;color:var(--text3);font-size:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.rq{height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-size:12px;
  color:var(--text2);cursor:pointer;font-variant-numeric:tabular-nums}
.rq.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok);font-weight:650}
.rq.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 36%,transparent);color:var(--bad);font-weight:650}
.rq.none{color:var(--text3);opacity:.65}

/* modal */
.mask{position:fixed;inset:0;background:rgba(16,26,42,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;place-items:center;z-index:80;padding:18px}
.mask.show{display:grid}
.dlg{width:min(430px,100%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 60px rgba(10,20,40,.28);padding:20px}
.dlg h3{margin:0 0 8px;font-size:16px}
.dlg p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.7}
.dlg .row{display:flex;gap:9px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);background:rgba(23,35,58,.92);color:#fff;
  padding:9px 16px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:44px 20px;text-align:center;color:var(--text3);font-size:14px}
.empty svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.4;opacity:.5;margin-bottom:8px}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:5px;padding:0 5px;color:var(--text2);background:var(--card);font-weight:600}
@media (max-width:760px){.hint{display:none}}
</style>
</head>
<body class="fs-md">
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo">CISSP</div>
      <div style="min-width:0">
        <h1><span class="full">CISSP 刷题系统</span><span class="shorter">CISSP 刷题</span></h1>
        <p id="subTitle">官方练习题库 · 第 3 版</p>
      </div>
    </div>
    <div class="sp"></div>
    <button class="icon-btn" id="btnFs" title="切换字号"><svg viewBox="0 0 24 24"><path d="M4 19V6a1 1 0 0 1 1-1h5M12 19V9a1 1 0 0 1 1-1h6"/><path d="M7 19h4M15 19h5"/></svg><span id="fsLabel">字号中</span></button>
    <button class="icon-btn" id="btnTheme" title="切换主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><span id="themeLabel">浅色</span></button>
    <button class="icon-btn" id="btnExport" title="导出进度备份"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>导出</span></button>
    <button class="icon-btn" id="btnImport" title="导入进度备份"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 20h14"/></svg><span>导入</span></button>
  </div>

  <aside class="side">
    <div class="panel">
      <div class="panel-h"><svg viewBox="0 0 24 24"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>题库</div>
      <div class="nav" id="navChapters"></div>
    </div>
    <div class="panel">
      <div class="panel-h"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>进度</div>
      <div class="stats">
        <div class="stat pri"><b id="stDone">0</b><span>已答 / 总题</span></div>
        <div class="stat ok"><b id="stOk">0</b><span>答对</span></div>
        <div class="stat bad"><b id="stBad">0</b><span>答错</span></div>
        <div class="stat"><b id="stRate">—</b><span>正确率</span></div>
      </div>
      <div class="nav" style="padding-top:8px">
        <button class="nav-item" id="btnResult"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M4 4h16v16H4z"/><path d="M8 12l3 3 5-6"/></svg><span class="nm">查看本次成绩</span></button>
        <button class="nav-item" id="btnReset"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="nm">清空全部进度</span></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <select id="chSel" class="ch-sel" aria-label="选择题库"></select>
      <div class="seg" id="segMode">
        <button data-m="cur" class="on">当前题库</button>
        <button data-m="single">只练单选</button>
        <button data-m="multi">只练多选</button>
        <button data-m="wrong">错题重练</button>
      </div>
      <div class="sp"></div>
      <div class="seg">
        <button id="btnShuffle">随机顺序</button>
        <button id="btnAuto">答对自动跳题</button>
      </div>
    </div>

    <section class="card" id="cardQ">
      <div class="qbar">
        <span class="chip pri" id="qIdx">第 1 / 1 题</span>
        <span class="chip" id="qCh">—</span>
        <span class="chip" id="qType">单选</span>
        <span class="sp"></span>
        <span id="qHint" class="hint" style="font-size:11.5px">快捷键 <kbd>1</kbd>-<kbd>4</kbd> 选择 · <kbd>Enter</kbd> 提交</span>
      </div>
      <div class="prog"><i id="bar" style="width:0%"></i></div>
      <div class="qbody" id="qbody"></div>
    </section>

    <section class="card" id="cardResult" style="display:none">
      <div class="qbar"><span class="chip pri">本次成绩</span><span class="chip" id="rScope">—</span><span class="sp"></span>
        <button class="icon-btn" id="btnBack2" style="height:30px"><span>返回做题</span></button></div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="56" fill="none" stroke="var(--card2)" stroke-width="12"/>
            <circle id="ringFg" cx="66" cy="66" r="56" fill="none" stroke="var(--primary)" stroke-width="12"
              stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
          </svg>
          <div class="mid"><div><b id="rRate">0%</b><span>正确率</span></div></div>
        </div>
        <div class="rlist">
          <div class="rstat"><span>总题数</span><b id="rTotal">0</b></div>
          <div class="rstat"><span>已作答</span><b id="rDone">0</b></div>
          <div class="rstat"><span>答对</span><b id="rOk" style="color:var(--ok)">0</b></div>
          <div class="rstat"><span>答错</span><b id="rBad" style="color:var(--bad)">0</b></div>
        </div>
      </div>
      <div class="review">
        <div class="hd"><span>题目回看（点数字跳转）</span><span class="sp" style="flex:1"></span>
          <span style="font-size:11.5px">绿=对 · 红=错 · 灰=未答</span></div>
        <div class="rgrid" id="rGrid"></div>
      </div>
    </section>
  </main>
</div>

<script>
const BANK = [{"ch":"D1","ch_name":"域1 安全与风险管理","no":1,"type":"single","q":"Alyssa is responsible for her organization’s security awareness program. She is concerned that changes in technology may make the content outdated. What control can she put in place to protect against this risk?","opts":["Gamification","Computer-based training","Content reviews","Live training"],"ans":"C","expl":"Alyssa should use periodic content reviews to continually verify that the content in her program meets the organization’s needs and is up-to-date based upon the evolving risk landscape. She may do this using a combination of computer-based training, live training, and gamification, but those techniques do not necessarily verify that the content is updated."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":2,"type":"single","q":"Gavin is creating a report to management on the results of his most recent risk assessment. In his report, he would like to identify the remaining level of risk to the organization after adopting security controls. What term best describes this current level of risk?","opts":["Inherent risk","Residual risk","Control risk","Mitigated risk"],"ans":"B","expl":"The residual risk is the level of risk that remains after controls have been applied to miti-gate risks. Inherent risk is the original risk that existed prior to the controls. Control risk is new risk introduced by the addition of controls to the environment. Mitigated risk is the risk that has been addressed by existing controls."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":3,"type":"single","q":"Francine is a security specialist for an online service provider in the United States. She recently received a claim from a copyright holder that a user is storing information on her service that violates the third party’s copyright. What law governs the actions that Francine must take?","opts":["Copyright Act","Lanham Act","Digital Millennium Copyright Act","Gramm Leach Bliley Act"],"ans":"C","expl":"The Digital Millennium Copyright Act (DMCA) sets forth the requirements for online service providers when handling copyright complaints received from third parties. The Copy-right Act creates the mechanics for issuing and enforcing copyrights but does not cover the actions of online service providers. The Lanham Act regulates the issuance of trademarks to protect intellectual property. The Gramm-Leach-Bliley Act regulates the handling of personal financial information."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":4,"type":"single","q":"FlyAway Travel has offices in both the European Union (EU) and the United States and transfers personal information between those offices regularly. They have recently received a request from an EU customer requesting that their account be terminated. Under the General Data Protection Regulation (GDPR), which requirement for processing personal information states that individuals may request that their data no longer be disseminated or processed?","opts":["The right to access","Privacy by design","The right to be forgotten","The right of data portability"],"ans":"C","expl":"The right to be forgotten, also known as the right to erasure, guarantees the data subject the ability to have their information removed from processing or use. It may be tied to con-sent given for data processing; if a subject revokes consent for processing, the data controller may need to take additional steps, including erasure."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":6,"type":"single","q":"Which one of the following elements of information is not considered personally identifiable information that would trigger most United States (U.S.) state data breach laws?","opts":["Student identification number","Social Security number","Driver’s license number","Credit card number"],"ans":"A","expl":"Most state data breach notification laws are modeled after California’s data breach noti-fication law, which covers Social Security number, driver’s license number, state identification card number, credit/debit card numbers, and bank account numbers (in conjunction with a PIN or password). California’s breach notification law also protects some items not com-monly found in other state laws, including medical records and health insurance information. These laws are separate and distinct from privacy laws, such as the California Consumer Privacy Act (CCPA), which regulates the handling of personal information more broadly."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":7,"type":"single","q":"Renee is speaking to her board of directors about their responsibilities to review cyberse-curity controls. What rule requires that senior executives take personal responsibility for information security matters?","opts":["Due diligence rule","Personal liability rule","Prudent man rule","Due process rule"],"ans":"C","expl":"The prudent man rule requires that senior executives take personal responsibility for ensuring the due care that ordinary, prudent individuals would exercise in the same situation. The rule originally applied to financial matters, but the Federal Sentencing Guidelines applied them to information security matters in the United States in 1991."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":8,"type":"single","q":"Henry recently assisted one of his co-workers in preparing for the CISSP exam. During this process, Henry disclosed confidential information about the content of the exam, in violation of Canon IV of the Code of Ethics: “Advance and protect the profession.” Who may bring ethics charges against Henry for this violation?","opts":["Anyone may bring charges.","Any certified or licensed professional may bring charges.","Only Henry’s employer may bring charges.","Only the affected employee may bring charges."],"ans":"B","expl":"This is a question about who has standing to bring an ethics complaint. The group of indi-viduals who has standing differs based upon the violated canon. In this case, we are exam-ining Canon IV, which permits any certified or licensed professional who subscribes to a code of ethics to bring charges. Charges of violations of Canons I or II may be brought by anyone.\nCharges of violations of Canon III may only be brought by a principal with an employer/ contractor relationship with the accused."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":9,"type":"single","q":"Wanda is working with one of her organization’s European Union business partners to facil-itate the exchange of customer information. Wanda’s organization is located in the United States. What would be the best method for Wanda to use to ensure GDPR compliance?","opts":["Binding corporate rules","Privacy Shield","Standard contractual clauses","Safe harbor"],"ans":"C","expl":"The European Union provides standard contractual clauses that may be used to facili-tate data transfer. That would be the best choice in a case where two different companies are sharing data. If the data were being shared internally within a company, binding corporate rules would also be an option. The EU/U.S. Privacy Shield was a safe harbor agreement that would previously have allowed the transfer but is no longer valid."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":10,"type":"single","q":"Yolanda is the chief privacy officer for a financial institution and is researching privacy requirements related to customer checking accounts. Which one of the following laws is most likely to apply to this situation?","opts":["GLBA","SOX","HIPAA","FERPA"],"ans":"A","expl":"The Gramm-Leach-Bliley Act (GLBA) contains provisions regulating the privacy of customer financial information. It applies specifically to financial institutions. The Sarbanes Oxley (SOX) Act regulates the financial reporting activities of publicly traded companies.\nThe Health Insurance Portability and Accountability Act (HIPAA) regulates the handling of protected health information (PHI). The Family Educational Rights and Privacy Act (FERPA) regulates the handling of student educational records."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":11,"type":"single","q":"Tim’s organization recently received a contract to conduct sponsored research as a government contractor. What law now likely applies to the information systems involved in this contract?","opts":["FISMA","PCI DSS","HIPAA","GISRA"],"ans":"A","expl":"The Federal Information Security Management Act (FISMA) specifically applies to government contractors. The Government Information Security Reform Act (GISRA) was the precursor to FISMA and expired in November 2002. HIPAA and PCI DSS apply to health-care and credit card information, respectively."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":12,"type":"single","q":"Chris is advising travelers from his organization who will be visiting many different countries overseas. He is concerned about compliance with export control laws. Which of the follow-ing technologies is most likely to trigger these regulations?","opts":["Memory chips","Office productivity applications","Hard drives","Encryption software"],"ans":"D","expl":"The export of encryption software to certain countries is regulated under U.S. export con-trol laws. Memory chips, office productivity applications, and hard drives are unlikely to be covered by these regulations."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":13,"type":"single","q":"Bobbi is investigating a security incident and discovers that an attacker began with a normal user account but managed to exploit a system vulnerability to provide that account with administrative rights. What type of attack took place under the STRIDE threat model?","opts":["Spoofing","Repudiation","Tampering","Elevation of privilege"],"ans":"D","expl":"In an elevation of privilege attack, the attacker transforms a limited user account into an account with greater privileges, powers, and/or access to the system. Spoofing attacks falsify an identity, while repudiation attacks attempt to deny accountability for an action. Tam-pering attacks attempt to violate the integrity of information or resources."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":14,"type":"single","q":"You are completing your business continuity planning effort and have decided that you want to accept one of the risks. What should you do next?","opts":["Implement new security controls to reduce the risk level.","Design a disaster recovery plan.","Repeat the business impact assessment.","Document your decision-making process."],"ans":"D","expl":"Whenever you choose to accept a risk, you should maintain detailed documentation of the risk acceptance process to satisfy auditors in the future. This should happen before implementing secu-rity controls, designing a disaster recovery plan, or repeating the business impact analysis (BIA)."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":15,"type":"multi","q":"You are completing a review of the controls used to protect a media storage facility in your organization and would like to properly categorize each control that is currently in place. Which of the following control categories accurately describe a fence around a facility? (Select all that apply.)","opts":["Physical","Detective","Deterrent","Preventive"],"ans":"ACD","expl":"A fence does not have the ability to detect intrusions. It does, however, have the ability to prevent and deter an intrusion. Fences are an example of a physical control."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":16,"type":"single","q":"Tony is developing a business continuity plan and is having difficulty prioritizing resources because of the difficulty of combining information about tangible and intangible assets. What would be the most effective risk assessment approach for him to use?","opts":["Quantitative risk assessment","Qualitative risk assessment","Neither quantitative nor qualitative risk assessment","Combination of quantitative and qualitative risk assessment"],"ans":"D","expl":"Tony would see the best results by combining elements of quantitative and qualitative risk assessment. Quantitative risk assessment excels at analyzing financial risk, while qualitative risk assessment is a good tool for intangible risks. Combining the two techniques provides a well-rounded risk picture."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":17,"type":"single","q":"Vincent believes that a former employee took trade secret information from his firm and brought it with him to a competitor. He wants to pursue legal action. Under what law could he pursue charges?","opts":["Copyright law","Lanham Act","Glass-Steagall Act","Economic Espionage Act"],"ans":"D","expl":"The Economic Espionage Act imposes fines and jail sentences on anyone found guilty of stealing trade secrets from a U.S. corporation. It gives true teeth to the intellectual property rights of trade secret owners. Copyright law does not apply in this situation because there is no indication that the information was copyrighted. The Lanham Act applies to trademark protec-tion cases. The Glass-Steagall Act was a banking reform act that is not relevant in this situation."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":18,"type":"single","q":"Which one of the following principles imposes a standard of care upon an individual that is broad and equivalent to what one would expect from a reasonable person under the cir-cumstances?","opts":["Due diligence","Separation of duties","Due care","Least privilege"],"ans":"C","expl":"The due care principle states that an individual should react in a situation using the same level of care that would be expected from any reasonable person. It is a very broad standard. The due diligence principle is a more specific component of due care that states that an individual assigned a responsibility should exercise due care to complete it accurately and in a timely manner."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":19,"type":"single","q":"Brenda’s organization recently completed the acquisition of a competitor firm. Which one of the following tasks would be LEAST likely to be part of the organizational processes addressed during the acquisition?","opts":["Consolidation of security functions","Integration of security tools","Protection of intellectual property","Documentation of security policies"],"ans":"C","expl":"The protection of intellectual property is a greater concern during a divestiture, where a subsidiary is being spun off into a separate organization, than an acquisition, where one firm has purchased another. Acquisition concerns include consolidating security functions and policies as well as integrating security tools."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":20,"type":"single","q":"Kelly believes that an employee engaged in the unauthorized use of computing resources for a side business. After consulting with management, she decides to launch an administrative investigation. What is the burden of proof that she must meet in this investigation?","opts":["Preponderance of the evidence","Beyond a reasonable doubt","Beyond the shadow of a doubt","There is no standard"],"ans":"D","expl":"Unlike criminal or civil cases, administrative investigations are an internal matter, and there is no set standard of proof that Kelly must apply. However, it would still be wise for her organization to include a standard burden of proof in their own internal procedures to ensure the thoroughness and fairness of investigations."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":21,"type":"single","q":"Keenan Systems recently developed a new manufacturing process for microprocessors. The company wants to license the technology to other companies for use but wants to prevent unauthorized use of the technology. What type of intellectual property protection is best suited for this situation?","opts":["Patent","Trade secret","Copyright","Trademark"],"ans":"A","expl":"Patents and trade secrets can both protect intellectual property related to a manufacturing process. Trade secrets are appropriate only when the details can be tightly controlled within an organization, so a patent is the appropriate solution in this case. Copyrights are used to protect creative works, while trademarks are used to protect names, logos, and symbols."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":22,"type":"single","q":"Which one of the following actions might be taken as part of a business continuity plan?","opts":["Restoring from backup tapes","Implementing RAID","Relocating to a cold site","Restarting business operations"],"ans":"B","expl":"RAID technology provides fault tolerance for hard drive failures and is an example of a business continuity action. Restoring from backup tapes, relocating to a cold site, and restarting business operations are all disaster recovery actions."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":23,"type":"single","q":"When developing a business impact analysis, the team should first create a list of assets. What should happen next?","opts":["Identify vulnerabilities in each asset.","Determine the risks facing the asset.","Develop a value for each asset.","Identify threats facing each asset."],"ans":"C","expl":"After developing a list of assets, the business impact analysis team should assign values to each asset. The other activities listed here occur only after the assets are assigned values."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":24,"type":"single","q":"Mike recently implemented an intrusion prevention system designed to block common network attacks from affecting his organization. What type of risk management strategy is Mike pursuing?","opts":["Risk acceptance","Risk avoidance","Risk mitigation","Risk transference"],"ans":"C","expl":"Risk mitigation strategies attempt to lower the probability and/or impact of a risk occur-ring. Intrusion prevention systems attempt to reduce the probability of a successful attack and are, therefore, examples of risk mitigation. Risk acceptance involves making a conscious decision to accept a risk as-is with no further action. Risk avoidance alters business activities to make a risk irrelevant. Risk transfer shifts the costs of a risk to another organization, such as an insurance company."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":25,"type":"single","q":"Laura has been asked to perform an SCA. What type of organization is she most likely in?","opts":["Higher education","Banking","Government","Healthcare"],"ans":"C","expl":"A security controls assessment (SCA) most often refers to a formal U.S. government process for assessing security controls and is often paired with a Security Test and Evaluation (ST&E) process. This means that Laura is probably part of a government organization or contractor."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":26,"type":"single","q":"Carl is a federal agent investigating a computer crime case. He identified an attacker who engaged in illegal conduct and wants to pursue a case against that individual that will lead to imprisonment. What standard of proof must Carl meet?","opts":["Beyond the shadow of a doubt","Preponderance of the evidence","Beyond a reasonable doubt","Majority of the evidence"],"ans":"C","expl":"There are two steps to answering this question. First, you must realize that for the case to lead to imprisonment, it must be the result of a criminal investigation. Next, you must know that the standard of proof for a criminal investigation is normally the beyond a reasonable doubt standard."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":29,"type":"single","q":"Which one of the following organizations would not be automatically subject to the privacy and security requirements of HIPAA if they engage in electronic transactions?","opts":["Healthcare provider","Health and fitness application developer","Health information clearinghouse","Health insurance plan"],"ans":"B","expl":"A health and fitness application developer would not necessarily be collecting or processing healthcare data, and the terms of HIPAA do not apply to this category of business. HIPAA regulates three types of entities—healthcare providers, health information clearinghouses, and health insurance plans—as well as the business associates of any of those covered entities."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":30,"type":"single","q":"John’s network begins to experience symptoms of slowness. Upon investigation, he realizes that the network is being bombarded with TCP SYN packets and believes that his organi-zation is the victim of a denial-of-service attack. What principle of information security is being violated?","opts":["Availability","Integrity","Confidentiality","Denial"],"ans":"A","expl":"A smurf attack is an example of a denial-of-service attack, which jeopardizes the availability of a targeted network. Smurf attacks do not target integrity or confidentiality. While this is a denial of service attack, denial is not the correct answer because you are asked which principle is violated, not what type of attack took place. Denial of service attacks target resource availability."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":31,"type":"single","q":"Renee is designing the long-term security plan for her organization and has a three- to five-year planning horizon. Her primary goal is to align the security function with the broader plans and objectives of the business. What type of plan is she developing?","opts":["Operational","Tactical","Summary","Strategic"],"ans":"D","expl":"Strategic plans have a long-term planning horizon of up to five years in most cases. They are designed to strategically align the security function with the business’ objectives. Operational and tactical plans have shorter horizons of a year or less."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":32,"type":"single","q":"Gina is working to protect a logo that her company will use for a new product they are launching. She has questions about the intellectual property protection process for this logo. What U.S. government agency would be best able to answer her questions?","opts":["USPTO","Library of Congress","NSA","NIST"],"ans":"A","expl":"First, you must realize that a trademark is the correct intellectual property protection mechanism for a logo. Therefore, Gina should contact the United States Patent and Trade-mark Office (USPTO), which bears responsibility for the registration of trademarks. The Library of Congress administers the copyright program. The National Security Agency (NSA) and the National Institute for Standards and Technology (NIST) play no role in intellectual property protection."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":33,"type":"single","q":"The Acme Widgets Company is putting new controls in place for its accounting department. Management is concerned that a rogue accountant may be able to create a new false vendor and then issue checks to that vendor as payment for services that were never rendered. What security control can best help prevent this situation?","opts":["Mandatory vacation","Separation of duties","Defense in depth","Job rotation"],"ans":"B","expl":"When following the separation of duties principle, organizations divide critical tasks into discrete components and ensure that no one individual has the ability to perform both\nactions. This prevents a single rogue individual from performing that task in an unauthorized manner. Mandatory vacations and job rotations are designed to detect fraud, not prevent\nit. Defense in depth is not the relevant principle here because the answer is seeking an initial control. We may choose to add additional controls at a later date, but the primary objective here would be to implement separation of duties."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":34,"type":"single","q":"Which one of the following categories of organizations is most likely to be covered by the provisions of FISMA?","opts":["Banks","Defense contractors","School districts","Hospitals"],"ans":"B","expl":"The U.S. Federal Information Security Management Act (FISMA) applies to federal government agencies and contractors. Of the entities listed, a defense contractor is the most likely to have government contracts subject to FISMA."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":35,"type":"single","q":"Robert is responsible for securing systems used to process credit card information. What security control framework should guide his actions?","opts":["HIPAA","PCI DSS","SOX","GLBA"],"ans":"B","expl":"The Payment Card Industry Data Security Standard (PCI DSS) governs the storage, processing, and transmission of credit card information. The Sarbanes Oxley (SOX) Act regulates the financial reporting activities of publicly traded companies. The Health Insur-ance Portability and Accountability Act (HIPAA) regulates the handling of protected health information (PHI). The Gramm Leach Bliley Act (GLBA) regulates the handling of personal financial information."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":36,"type":"single","q":"Which one of the following individuals is normally responsible for fulfilling the operational data protection responsibilities delegated by senior management, such as validating data integrity, testing backups, and managing security policies?","opts":["Data custodian","Data owner","User","Auditor"],"ans":"A","expl":"The data custodian role is assigned to an individual who is responsible for implementing the security controls defined by policy and senior management. The data owner does bear ultimate responsibility for these tasks, but the data owner is typically a senior leader who delegates operational responsibility to a data custodian."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":37,"type":"single","q":"Alan works for an e-commerce company that recently had some content stolen by another website and republished without permission. What type of intellectual property protection would best preserve Alan’s company’s rights?","opts":["Trade secret","Copyright","Trademark","Patent"],"ans":"B","expl":"Written works, such as website content, are normally protected by copyright law. Trade secret status would not be appropriate here because the content is online and available outside the company. Patents protect inventions, and trademarks protect words and symbols used to represent a brand, neither of which is relevant in this scenario."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":38,"type":"single","q":"Florian receives a flyer from a U.S. federal government agency announcing that a new administrative law will affect his business operations. Where should he go to find the text of the law?","opts":["United States Code","Supreme Court rulings","Code of Federal Regulations","Compendium of Laws"],"ans":"C","expl":"The Code of Federal Regulations (CFR) contains the text of all administrative laws promulgated by federal agencies. The United States Code contains criminal and civil law. Supreme Court rulings contain interpretations of law and are not laws themselves. The Compendium of Laws does not exist."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":39,"type":"single","q":"Tom enables an application firewall provided by his cloud infrastructure as a service pro-vider that is designed to block many types of application attacks. When viewed from a risk management perspective, what metric is Tom attempting to lower by implementing this countermeasure?","opts":["Impact","RPO","MTO","Likelihood"],"ans":"D","expl":"Installing a device that will block attacks is an attempt to lower risk by reducing the likelihood of a successful application attack. Adding a firewall will not address the impact of a risk, the recovery point objective (RPO) or the maximum tolerable outage (MTO)."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":40,"type":"single","q":"Which one of the following individuals would be the most effective organizational owner for an information security program?","opts":["CISSP-certified analyst","Chief information officer (CIO)","Manager of network security","President and CEO"],"ans":"B","expl":"The owner of information security programs may be different from the individuals responsible for implementing the controls. This person should be as senior an individual as possible who is able to focus on the management of the security program. The president and CEO would not be an appropriate choice because an executive at this level is unlikely to have the time necessary to focus on security. Of the remaining choices, the CIO is the most senior position who would be the strongest advocate at the executive level."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":41,"type":"single","q":"What important function do senior managers normally fill on a business continuity planning team?","opts":["Arbitrating disputes about criticality","Evaluating the legal environment","Training staff","Designing failure controls"],"ans":"A","expl":"Senior managers play several business continuity planning roles. These include setting priorities, obtaining resources, and arbitrating disputes among team members."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":42,"type":"single","q":"You are the CISO for a major hospital system and are preparing to sign a contract with a software as a service (SaaS) email vendor and want to perform a control assessment to ensure that its business continuity planning measures are reasonable. What type of audit might you request to meet this goal?","opts":["SOC 1","FISMA","PCI DSS","SOC 2"],"ans":"D","expl":"The Service Organizations Control audit program includes business continuity controls in a SOC 2, but not SOC 1, audit. Although FISMA and PCI DSS may audit business continuity, they would not apply to an email service used by a hospital."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":43,"type":"single","q":"Gary is analyzing a security incident and, during his investigation, encounters a user who denies having performed an action that Gary believes he did perform. What type of threat has taken place under the STRIDE model?","opts":["Repudiation","Information disclosure","Tampering","Elevation of privilege"],"ans":"A","expl":"Repudiation threats allow an attacker to deny having performed an action or activity without the other party being able to prove differently. There is no evidence that the attacker engaged in information disclosure, tampering, or elevation of privilege."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":44,"type":"single","q":"Beth is the security administrator for a public school district. She is implementing a new stu-dent information system and is testing the code to ensure that students are not able to alter their own grades. What principle of information security is Beth enforcing?","opts":["Integrity","Availability","Confidentiality","Denial"],"ans":"A","expl":"Integrity controls, such as the one Beth is implementing in this example, are designed to prevent the unauthorized modification of information. There is no evidence of an attack\nagainst availability or confidentiality. Denial is an objective of attackers, rather than of secu-rity professionals and is not relevant in this scenario that targets integrity."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":45,"type":"single","q":"Which one of the following issues is not normally addressed in a service-level agreement (SLA)?","opts":["Confidentiality of customer information","Failover time","Uptime","Maximum consecutive downtime"],"ans":"A","expl":"SLAs do not normally address issues of data confidentiality. Those provisions are nor-mally included in a nondisclosure agreement (NDA)."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":46,"type":"single","q":"Joan is seeking to protect a piece of computer software that she developed under intellectual property law. Which one of the following avenues of protection would not apply to a piece of software?\nFor questions 47–49, please refer to the following scenario:","opts":["Trademark","Copyright","Patent","Trade secret"],"ans":"A","expl":"Trademarks protect words and images that represent a product or service and would not protect computer software."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":47,"type":"single","q":"Users in the two offices would like to access each other’s file servers over the internet. What control would provide confidentiality for those communications?","opts":["Digital signatures","Virtual private network","Virtual LAN","Digital content management"],"ans":"B","expl":"Virtual private networks (VPNs) provide secure communications channels over otherwise insecure networks (such as the internet) using encryption. If you establish a VPN connection between the two offices, users in one office could securely access content located on the other office’s server over the internet. Digital signatures are used to provide nonrepudiation, not confidentiality. Virtual LANs (VLANs) provide network segmentation on local networks but do not cross the internet. Digital content management solutions are designed to manage web content, not access shared files located on a file server.","scene":"Juniper Content is a web content development company with 40 employees located in two offices: one in New York and a smaller office in the San Francisco Bay Area. Each office has a local area network protected by a perimeter firewall. The local area network (LAN) con-tains modern switch equipment connected to both wired and wireless networks. Each office has its own file server, and the information technology (IT) team runs software every hour to synchronize files between the two servers, distributing content between the offices. These servers are primarily used to store images and other files related to web content developed by the company. The team also uses a SaaS-based email and document collabora-tion solution for much of their work. You are the newly appointed IT manager for Juniper Content, and you are working to aug-ment existing security controls to improve the organization’s security."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":48,"type":"single","q":"You are also concerned about the availability of data stored on each office’s server. You would like to add technology that would enable continued access to files located on the server even if a hard drive in a server fails. What control allows you to add robustness without adding additional servers?","opts":["Server clustering","Load balancing","RAID","Scheduled backups"],"ans":"C","expl":"RAID uses additional hard drives to protect the server against the failure of a single device. Load balancing and server clustering do add robustness but require the addition of a server. Scheduled backups protect against data loss but do not provide immediate access to data in the event of a hard drive failure.","scene":"Juniper Content is a web content development company with 40 employees located in two offices: one in New York and a smaller office in the San Francisco Bay Area. Each office has a local area network protected by a perimeter firewall. The local area network (LAN) con-tains modern switch equipment connected to both wired and wireless networks. Each office has its own file server, and the information technology (IT) team runs software every hour to synchronize files between the two servers, distributing content between the offices. These servers are primarily used to store images and other files related to web content developed by the company. The team also uses a SaaS-based email and document collabora-tion solution for much of their work. You are the newly appointed IT manager for Juniper Content, and you are working to aug-ment existing security controls to improve the organization’s security."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":49,"type":"single","q":"Finally, there are historical records stored on the server that are extremely important to the business and should never be modified. You would like to add an integrity control that allows you to verify on a periodic basis that the files were not modified. What control can you add?","opts":["Hashing","ACLs","Read-only attributes","Firewalls"],"ans":"A","expl":"Hashing allows you to computationally verify that a file has not been modified bet-ween hash evaluations. ACLs and read-only attributes are useful controls that may help you prevent unauthorized modification, but they cannot verify that files were not modified. Firewalls are network security controls and do not verify file integrity.","scene":"Juniper Content is a web content development company with 40 employees located in two offices: one in New York and a smaller office in the San Francisco Bay Area. Each office has a local area network protected by a perimeter firewall. The local area network (LAN) con-tains modern switch equipment connected to both wired and wireless networks. Each office has its own file server, and the information technology (IT) team runs software every hour to synchronize files between the two servers, distributing content between the offices. These servers are primarily used to store images and other files related to web content developed by the company. The team also uses a SaaS-based email and document collabora-tion solution for much of their work. You are the newly appointed IT manager for Juniper Content, and you are working to aug-ment existing security controls to improve the organization’s security."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":50,"type":"single","q":"Beth is a human resources specialist preparing to assist in the termination of an employee. Which of the following is not typically part of a termination process?","opts":["An exit interview","Recovery of property","Account termination","Signing an NCA"],"ans":"D","expl":"Signing a noncompete or nondisclosure agreement is typically done at hiring. Exit interviews, recovery of organizational property, and account termination are all common elements of a termination process. During the exit interview, the team may choose to review employment agreements and policies that remain in force, such as a noncompete or nondisclosure agreement."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":51,"type":"single","q":"Frances is reviewing her organization’s business continuity plan documentation for complete-ness. Which one of the following is not normally included in business continuity plan doc-umentation?","opts":["Statement of accounts","Statement of importance","Statement of priorities","Statement of organizational responsibility"],"ans":"A","expl":"Business continuity plan documentation normally includes the continuity planning goals, a statement of importance, statement of priorities, statement of organizational responsibility, statement of urgency and timing, risk assessment and risk acceptance and mitigation docu-mentation, a vital records program, emergency response guidelines, and documentation for maintaining and testing the plan."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":52,"type":"single","q":"An accounting employee at Doolittle Industries was recently arrested for participation in an embezzlement scheme. The employee transferred money to a personal account and then shifted funds around between other accounts every day to disguise the fraud for months.\n• Which one of the following controls might have best allowed the earlier detection of this fraud?","opts":["Separation of duties","Least privilege","Defense in depth","Mandatory vacation"],"ans":"D","expl":"Mandatory vacation programs require that employees take continuous periods of time off each year and revoke their system privileges during that time. The purpose of these required vacation periods is to disrupt any attempt to engage in the cover-up actions necessary to hide fraud and result in exposing the threat. Separation of duties, least privilege, and defense in depth controls all may help prevent the fraud in the first place but are unlikely to speed the detection of fraud that has already occurred."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":53,"type":"single","q":"Jeff would like to adopt an industry-standard approach for assessing the processes his orga-nization uses to manage risk. What maturity model would be most appropriate for his use?","opts":["CMM","SW-CMM","RMM","COBIT"],"ans":"C","expl":"The Risk Maturity Model (RMM) is specifically designed for the purpose of assessing enterprise risk management programs. Jeff could conceivably use the more generic capability maturity model (CMM), but this would not be as good of a fit. The software capability matu-rity model (SW-CMM) is designed for assessing development projects, not risk management efforts. The Control Objectives for Information Technology (COBIT) are a set of security control objectives and not a maturity model."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":54,"type":"single","q":"Chris’ organization recently suffered an attack that rendered their website inacces-sible to paying customers for several hours. Which information security goal was most directly impacted?","opts":["Confidentiality","Integrity","Availability","Denial"],"ans":"C","expl":"Denial-of-service (DoS) attacks and distributed denial-of-service (DDoS) attacks try to disrupt the availability of information systems and networks by flooding a victim with traffic or otherwise disrupting service."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":55,"type":"single","q":"Yolanda is writing a document that will provide configuration information regarding the minimum level of security that every system in the organization must meet. What type of document is she preparing?","opts":["Policy","Baseline","Guideline","Procedure"],"ans":"B","expl":"Baselines provide the minimum level of security that every system throughout the organiza-tion must meet. This type of information would not appear in a policy, guideline, or procedure."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":56,"type":"single","q":"Who should receive initial business continuity plan training in an organization?","opts":["Senior executives","Those with specific business continuity roles","Everyone in the organization","First responders"],"ans":"C","expl":"Everyone in the organization should receive basic training on the nature and scope of the business continuity program. Those with specific roles, such as first responders and senior executives, should also receive detailed, role-specific training."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":57,"type":"single","q":"James is conducting a risk assessment for his organization and is attempting to assign an asset value to the servers in his data center. The organization’s primary concern is ensuring that it has sufficient funds available to rebuild the data center in the event it is damaged or destroyed. Which one of the following asset valuation methods would be most appropriate in this situation?","opts":["Purchase cost","Depreciated cost","Replacement cost","Opportunity cost"],"ans":"C","expl":"If the organization’s primary concern is the cost of rebuilding the data center, James should use the replacement cost method to determine the current market price for equivalent servers."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":58,"type":"single","q":"Roger’s organization suffered a breach of customer credit card records. Under the terms of PCI DSS, what organization may choose to pursue an investigation of this matter?","opts":["FBI","Local law enforcement","Bank","PCI SSC"],"ans":"C","expl":"PCI DSS is a standard promulgated by the Payment Card Industry Security Standards Council (PCI SSC), but is enforced through contractual relationships between merchants and their banks. Therefore, the bank would be the appropriate entity to initiate an investigation under PCI DSS. Local and federal law enforcement agencies (such as the FBI) could decide to pursue a criminal investigation if the circumstances warrant, but they do not have the authority to enforce PCI DSS requirements."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":59,"type":"single","q":"Rick recently engaged critical employees in each of his organization’s business units to ask for their assistance with his security awareness program. They will be responsible for sharing security messages with their peers and answering questions about cybersecurity matters. What term best describes this relationship?","opts":["Security champion","Security expert","Gamification","Peer review"],"ans":"A","expl":"This is an example of a security champion program that uses individuals employed in other roles in a business unit to share security messaging. The individuals in these roles are not necessarily security experts and do not have a peer review role."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":60,"type":"single","q":"Frank discovers a keylogger hidden on the laptop of his company’s chief executive officer. What information security principle is the keylogger most likely designed to disrupt?","opts":["Confidentiality","Integrity","Availability","Denial"],"ans":"A","expl":"Keyloggers monitor the keystrokes of an individual and report them back to an attacker. They are designed to steal sensitive information, a disruption of the goal of confidentiality."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":61,"type":"single","q":"Elise is helping her organization prepare to evaluate and adopt a new cloud-based human resource management (HRM) system vendor. What would be the most appropriate minimum security standard for her to require of possible vendors?","opts":["Compliance with all laws and regulations","Handling information in the same manner the organization would","Elimination of all identified security risks","Compliance with the vendor’s own policies"],"ans":"B","expl":"The most appropriate standard to use as a baseline when evaluating vendors is to deter-mine whether the vendor’s security controls meet the organization’s own standards. Compli-ance with laws and regulations should be included in that requirement and are a necessary, but not sufficient, condition for working with the vendor. Vendor compliance with their own policies also fits into the category of necessary, but not sufficient, controls, as the vendor’s policy may be weaker than the organization’s own requirements. The elimination of all identified security risks is an impossible requirement for a potential vendor to meet."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":63,"type":"single","q":"HAL Systems recently decided to stop offering public NTP services because of a fear that its NTP servers would be used in amplification DDoS attacks. What type of risk management strategy did HAL pursue with respect to its NTP services?","opts":["Risk mitigation","Risk acceptance","Risk transference","Risk avoidance"],"ans":"D","expl":"HAL Systems decided to stop offering the service because of the risk. This is an example of a risk avoidance strategy. The company altered its operations in a manner that eliminates the risk of NTP misuse. Risk acceptance involves making a conscious decision to accept a risk as-is with no further action. Risk mitigation takes measures to reduce the likelihood and/or impact of a risk. Risk transfer shifts the costs of a risk to another organization, such as an insurance company."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":64,"type":"single","q":"Susan is working with the management team in her company to classify data in an attempt to apply extra security controls that will limit the likelihood of a data breach. What principle of information security is Susan trying to enforce?","opts":["Availability","Denial","Confidentiality","Integrity"],"ans":"C","expl":"Confidentiality controls prevent the disclosure of sensitive information to unauthorized individuals. Limiting the likelihood of a data breach is an attempt to prevent unauthorized disclosure."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":65,"type":"single","q":"Which one of the following components should be included in an organization’s emergency response guidelines?","opts":["List of individuals who should be notified of an emergency incident","Long-term business continuity protocols","Activation procedures for the organization’s cold sites","Contact information for ordering equipment"],"ans":"A","expl":"The emergency response guidelines should include the immediate steps an organization should follow in response to an emergency situation. These include immediate response procedures, a list of individuals who should be notified of the emergency, and secondary response procedures for first responders. They do not include long-term actions such as activating business continuity protocols, ordering equipment, or activating DR sites."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":66,"type":"single","q":"Chas recently completed the development of his organization’s business continuity plan. Who is the ideal person to approve an organization’s business continuity plan?","opts":["Chief information officer","Chief executive officer","Chief information security officer","Chief operating officer"],"ans":"B","expl":"Although the CEO will not normally serve on a BCP team, it is best to obtain top-level management approval for your plan to increase the likelihood of successful adoption."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":67,"type":"single","q":"Which one of the following actions is not normally part of the project scope and planning phase of business continuity planning?","opts":["Structured analysis of the organization","Review of the legal and regulatory landscape","Creation of a BCP team","Documentation of the plan"],"ans":"D","expl":"The project scope and planning phase includes four actions: a structured analysis of the organization, the creation of a BCP team, an assessment of available resources, and an analysis of the legal and regulatory landscape."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":68,"type":"single","q":"Gary is implementing a new website architecture that uses multiple small web servers behind a load balancer. What principle of information security is Gary seeking to enforce?","opts":["Denial","Confidentiality","Integrity","Availability"],"ans":"D","expl":"Keeping a server up and running is an example of an availability control because it increases the likelihood that a server will remain available to answer user requests."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":69,"type":"single","q":"Becka recently signed a contract with an alternate data processing facility that will provide her company with space in the event of a disaster. The facility includes HVAC, power, and communications circuits but no hardware. What type of facility is Becka using?","opts":["Cold site","Warm site","Hot site","Mobile site"],"ans":"A","expl":"A cold site includes the basic capabilities required for data center operations: space, power, HVAC, and communications, but it does not include any of the hardware required to restore operations. Warm sites, hot sites, and mobile sites would all include hardware."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":70,"type":"single","q":"Greg’s company recently experienced a significant data breach involving the personal data of many of their customers. Which breach laws should they review to ensure that they are tak-ing appropriate action?","opts":["The breach laws in the state where they are headquartered.","The breach laws of states they do business in.","Only federal breach laws.","Breach laws only cover government agencies, not private businesses."],"ans":"B","expl":"In general, companies should be aware of the breach laws in any location where they do business. U.S. states have a diverse collection of breach laws and requirements, meaning that in this case, Greg’s company may need to review many different breach laws to determine which they may need to comply with if they conduct business in the state or with the state’s residents."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":71,"type":"single","q":"Ben is seeking a control objective framework that is widely accepted around the world and focuses specifically on information security controls. Which one of the following frameworks would best meet his needs?","opts":["ITIL","ISO 27002","CMM","PMBOK Guide"],"ans":"B","expl":"ISO 27002 is an international standard focused on information security and titled “Information technology—Security techniques—Code of practice for information security management.” The Information Technology Infrastructure Library (ITIL) does contain secu-rity management practices, but it is not the sole focus of the document, and the ITIL security section is derived from ISO 27002. The Capability Maturity Model (CMM) is focused on software development, and the Project Management Body of Knowledge (PMBOK) Guide focuses on project management."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":72,"type":"single","q":"Matt works for a telecommunications firm and was approached by a federal agent seeking assistance with wiretapping one of Matt’s clients pursuant to a search warrant. Which one of the following laws requires that communications service providers cooperate with law enforcement requests?","opts":["ECPA","CALEA","Privacy Act","HITECH Act"],"ans":"B","expl":"The Communications Assistance to Law Enforcement Act (CALEA) requires that all communications carriers make wiretaps possible for law enforcement officials who have an appropriate court order."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":73,"type":"single","q":"Every year, Gary receives privacy notices in the mail from financial institutions where he has accounts. What law requires the institutions to send Gary these notices?","opts":["FERPA","GLBA","HIPAA","HITECH"],"ans":"B","expl":"The Gramm-Leach-Bliley Act (GLBA) places strict privacy regulations on financial institu-tions, including providing written notice of privacy practices to customers."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":74,"type":"single","q":"Which one of the following agreements typically requires that a vendor not disclose confiden-tial information learned during the scope of an engagement?","opts":["NCA","SLA","NDA","RTO"],"ans":"C","expl":"Nondisclosure agreements (NDAs) typically require either mutual or one-way confiden-tiality in a business relationship. Service-level agreements specify service uptime and other performance measures. Noncompete agreements (NCAs) limit the future employment possibil-ities of employees. Recovery time objectives (RTOs) are used in business continuity planning."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":75,"type":"single","q":"The (ISC)2 Code of Ethics applies to all CISSP holders. Which of the following is not one of the four mandatory canons of the code?","opts":["Protect society, the common good, the necessary public trust and confidence, and the infrastructure.","Disclose breaches of privacy, trust, and ethics.","Provide diligent and competent service to the principles.","Advance and protect the profession."],"ans":"B","expl":"The (ISC)2 Code of Ethics also includes “Act honorably, honestly, justly, responsibly, and legally” but does not specifically require credential holders to disclose all breaches of privacy, trust, or ethics."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":76,"type":"single","q":"Which one of the following stakeholders is not typically included on a business continuity planning team?","opts":["Core business function leaders","Information technology staff","CEO","Support departments"],"ans":"C","expl":"While senior management should be represented on the BCP team, it would be highly unusual for the CEO to fill this role personally."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":77,"type":"single","q":"Ben is designing a messaging system for a bank and would like to include a feature that allows the recipient of a message to prove to a third party that the message did indeed come from the purported originator. What goal is Ben trying to achieve?","opts":["Authentication","Authorization","Integrity","Nonrepudiation"],"ans":"D","expl":"Nonrepudiation allows a recipient to prove to a third party that a message came from a purported source. Authentication would provide proof to Ben that the sender was authentic, but Ben would not be able to prove this to a third party."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":78,"type":"single","q":"What principle of information security states that an organization should implement overlap-ping security controls whenever possible?","opts":["Least privilege","Separation of duties","Defense in depth","Security through obscurity"],"ans":"C","expl":"Defense in depth states that organizations should have overlapping security controls designed to meet the same security objectives whenever possible. This approach provides secu-rity in the event of a single control failure. Least privilege ensures that an individual only has the minimum set of permissions necessary to carry out their assigned job functions and does not require overlapping controls. Separation of duties requires that one person not have per-mission to perform two separate actions that, when combined, carry out a sensitive function. Security through obscurity attempts to hide the details of security controls to add security to them. Neither separation of duties nor security through obscurity involve overlapping controls."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":79,"type":"multi","q":"Ryan is a CISSP-certified cybersecurity professional working in a nonprofit organization. Which of the following ethical obligations apply to his work? (Select all that apply.)","opts":["(ISC)2 Code of Ethics","Organizational code of ethics","Federal code of ethics","RFC 1087"],"ans":"AB","expl":"All (ISC)2 certified professionals are required to comply with the (ISC)2 Code of Ethics. All employees of an organization are required to comply with the organization’s code of ethics. The federal code of ethics (or, more formally, the Code of Ethics for Government Service) would not apply to a nonprofit organization, as it only applies to federal employees. RFC 1087 does provide a code of ethics for the internet, but it is not binding on any individual."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":80,"type":"single","q":"Ben is responsible for the security of payment card information stored in a database. Policy directs that he remove the information from the database, but he cannot do this for opera-tional reasons. He obtained an exception to policy and is seeking an appropriate compen-sating control to mitigate the risk. What would be his best option?","opts":["Purchasing insurance","Encrypting the database contents","Removing the data","Objecting to the exception"],"ans":"B","expl":"Ben should encrypt the data to provide an additional layer of protection as a compen-sating control. The organization has already made a policy exception, so he should not react by objecting to the exception or removing the data without authorization. Purchasing insurance may transfer some of the risk but is not a mitigating control."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":81,"type":"single","q":"The Domer Industries risk assessment team recently conducted a qualitative risk assessment and developed a matrix similar to the one shown here. Which quadrant contains the risks that require the most immediate attention?\n• Impact","opts":["I","II","III","IV"],"ans":"A","expl":"The risk assessment team should pay the most immediate attention to those risks that appear in quadrant I. These are the risks with a high probability of occurring and a high impact on the organization if they do occur."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":82,"type":"single","q":"Tom is planning to terminate an employee this afternoon for fraud and expects that the meeting will be somewhat hostile. He is coordinating the meeting with human resources and wants to protect the company against damage. Which one of the following steps is most important to coordinate in time with the termination meeting?","opts":["Informing other employees of the termination","Retrieving the employee’s photo ID","Calculating the final paycheck","Revoking electronic access rights"],"ans":"D","expl":"Electronic access to company resources must be carefully coordinated. An employee who retains access after being terminated may use that access to take retaliatory action. On the other hand, if access is terminated too early, the employee may figure out that he or she is about to be terminated."},{"ch":"D1","ch_name":"域1 安全与风险管
