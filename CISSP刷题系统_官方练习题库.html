gy and your knowledge of penetration testing to answer questions about tool usage during a penetration test."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":41,"type":"single","q":"Which of the following tools is most likely to be used during discovery?","opts":["Nessus","john","Nmap","Nikto"],"ans":"C","expl":"Discovery can include both active and passive discovery. Port scanning is commonly done during discovery to assess what services the target provides, and nmap is one of the most popular tools used for this purpose. Nessus and Nikto might be used during the vulnerability scanning phase, and john, a password cracker, can be used to recover passwords during the exploitation phase.","scene":"Chris uses the standard penetration testing methodology shown here. Use this methodology and your knowledge of penetration testing to answer questions about tool usage during a penetration test."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":42,"type":"single","q":"Which of these concerns is the most important to address during planning to ensure that the reporting phase does not cause problems?","opts":["Which CVE format to use","How the vulnerability data will be stored and sent","Which targets are off-limits","How long the report should be"],"ans":"B","expl":"Penetration test reports often include information that could result in additional exposure if they were accidentally released or stolen. Therefore, determining how vulnerability data should be stored and sent is critical. Problems with off-limits targets are more likely to result in issues during the vulnerability assessment and exploitation phase, and reports should\nnot be limited in length but should be as long as they need to be to accomplish the goals of the test.","scene":"Chris uses the standard penetration testing methodology shown here. Use this methodology and your knowledge of penetration testing to answer questions about tool usage during a penetration test."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":43,"type":"single","q":"What four types of coverage criteria are commonly used when validating the work of a code testing suite?","opts":["Input, statement, branch, and condition coverage","Function, statement, branch, and condition coverage","API, branch, bounds, and condition coverage","Bounds, branch, loop, and condition coverage"],"ans":"B","expl":"Code coverage testing most frequently requires that every function has been called, that each statement has been executed, that all branches have been fully explored, and that each condition has been evaluated for all possibilities. API, input, and loop testing are not common types of code coverage testing measures."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":44,"type":"single","q":"As part of his role as a security manager, Jacob provides the following chart to his organiza-tion’s management team. What type of measurement is he providing for them?\n• Time to Remediate in Days vs. Number of Vulnerabilities\n• 60\n• 45\n• 30\n• 15\n• 0\n• 3 6 9\n• Number of Vulnerabilities\n• 12 15","opts":["A coverage rate measure","A key performance indicator","A time to live metric","A business criticality indicator"],"ans":"B","expl":"Time to remediate a vulnerability is a commonly used key performance indicator for secu-rity teams. Time to live measures how long a packet can exist in hops, business criticality is\na measure used to determine how important a service or system is to an organization, and coverage rates are used to measure how effective code testing is."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":45,"type":"single","q":"What does using unique user IDs for all users provide when reviewing logs?","opts":["Confidentiality","Integrity","Availability","Accountability"],"ans":"D","expl":"Unique user IDs provide accountability when paired with auditable logs to provide that a specific user took any given action. Confidentiality, availability, and integrity can be provided through other means like encryption, systems design, and digital signatures."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":46,"type":"single","q":"Which of the following is not an interface that is typically tested during the software test-ing process?","opts":["APIs","Network interfaces","UIs","Physical interfaces"],"ans":"B","expl":"Application programming interfaces (APIs), user interfaces (UIs), and physical interfaces are all important to test when performing software testing. Network interfaces are not part of the typical list of interfaces tested in software testing."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":47,"type":"single","q":"Alan’s organization uses the Security Content Automation Protocol (SCAP) to standardize its vulnerability management program. Which component of SCAP can Alan use to reconcile the identity of vulnerabilities generated by different security assessment tools?","opts":["OVAL","XCCDF","CVE","SCE"],"ans":"C","expl":"The Common Vulnerabilities and Exposures (CVE) database provides a consistent ref-erence for identifying security vulnerabilities. The Open Vulnerability and Assessment Language (OVAL) is used to describe the security condition of a system. The Extensible Configuration Checklist Description Format (XCCDF) is used to create security check-lists in a standardized fashion. The Script Check Engine (SCE) is designed to make scripts interoperable with security policy definitions."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":49,"type":"single","q":"Which of the following strategies is not a reasonable approach for remediating a vulnera-bility identified by a vulnerability scanner?","opts":["Install a patch.","Use a workaround fix.","Update the banner or version number.","Use an application layer firewall or IPS to prevent attacks against the identified vulnera-bility."],"ans":"C","expl":"Simply updating the version that an application provides may stop the vulnerability scanner from flagging it, but it won’t fix the underlying issue. Patching, using workarounds, or installing an application layer firewall or IPS can all help to remediate or limit the impact of the vulnerability."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":50,"type":"single","q":"During a penetration test, Selah calls her target’s help desk claiming to be the senior assistant to an officer of the company. She requests that the help desk reset the officer’s password because of an issue with his laptop while traveling and persuades them to do so. What type of attack has she successfully completed?","opts":["Zero knowledge","Help desk spoofing","Social engineering","Black box"],"ans":"C","expl":"Selah’s social engineering attack succeeded in persuading a staff member at the help desk to change a password for someone who they not only couldn’t see, but who they couldn’t verify actually needed their password reset. Black box and zero knowledge are both terms describing penetration tests without information about the organization or system, and help desk spoofing is not an industry term."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":52,"type":"single","q":"Which of the following is not a hazard associated with penetration testing?","opts":["Application crashes","Denial of service","Blackouts","Data corruption"],"ans":"C","expl":"Penetration tests typically do not involve blackouts. Application crashes; denial of service due to system, network, or application failures; and even data corruption can all be hazards of penetration tests."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":53,"type":"single","q":"Which NIST special publication covers the assessment of security and privacy controls?","opts":["800-12","800-53A","800-34","800-86"],"ans":"B","expl":"NIST SP 800-53A is titled “Assessing Security and Privacy Controls in Federal Information Systems and Organizations: Building Effective Assessment Plans” and covers methods for assessing and measuring controls. NIST 800-12 is an introduction to com-puter security, 800-34 covers contingency planning, and 800-86 is the “Guide to Integrating Forensic Techniques into Incident Response.”"},{"ch":"D6","ch_name":"域6 安全评估与测试","no":54,"type":"multi","q":"Michelle is conducting a quantitative business impact assessment and wants to collect data to determine the dollar cost of downtime. What information would she need from outages during the previous year to calculate the cost of those outages to the business? (Select all that apply.)","opts":["The total amount of time the business was down","The number of personnel hours worked to recover from the outage","The business lost during the outage per hour in dollars","The average employee wage per hour"],"ans":"ABCD","expl":"All of these are important for the business impact analysis to gather a total cost for downtime. Businesses lose money when they cannot operate the business, but the expense of staff time and effort is also an important consideration."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":55,"type":"single","q":"If Kara’s primary concern is preventing eavesdropping attacks, which port should she block?","opts":["22","80","443","1433"],"ans":"B","expl":"Port 80 is used by the HTTP protocol for unencrypted web communications. If Kara wants to protect against eavesdropping, she should block this port and restrict web access to encrypted HTTPS connections on port 443."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":56,"type":"single","q":"If Kara’s primary concern is preventing administrative connections to the server, which port should she block?","opts":["22","80","443","1433"],"ans":"A","expl":"Port 22 is used by the Secure Shell (SSH) protocol for administrative connections. If Kara wants to restrict administrative connections, she should block access on this port."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":57,"type":"single","q":"During a third-party audit, Jim’s company receives a finding that states, “The adminis-trator should review backup success and failure logs on a daily basis and take action in a timely manner to resolve reported exceptions.” What potential problem does this find-ing indicate?","opts":["Administrators will not know if the backups succeeded or failed.","The backups may not be properly logged.","The backups may not be usable.","The backup logs may not be properly reviewed."],"ans":"C","expl":"The audit finding indicates that the backup administrator may not be monitoring backup logs and taking appropriate action based on what they report, thus resulting in potentially unusable backups. Issues with review, logging, or being aware of the success or failure of backups are less important than not having usable backups."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":58,"type":"single","q":"Jim is helping his organization decide on audit standards for use throughout their interna-tional organization. Which of the following is not an IT standard that Jim’s organization is likely to use as part of its audits?","opts":["COBIT","SSAE-18","ITIL","ISO 27001"],"ans":"C","expl":"ITIL, which originally stood for IT Infrastructure Library, is a set of practices for IT ser-vice management and is not typically used for auditing. COBIT, or the Control Objectives for Information and Related Technology, ISO 27001, and SSAE-18, or the Statement on Stan-dards for Attestation Engagements number 18, are all used for auditing."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":59,"type":"single","q":"Nicole wants to conduct a standards-based audit of her organization. Which of the following is commonly used to describe common requirements for information systems?","opts":["IEC","COBIT","FISA","DMCA"],"ans":"B","expl":"COBIT the Control Objectives for Information and Related Technologies, is com-monly used as an audit framework for organizations. The DMCA is the Digital Millennium Copyright Act, IEC is the International Electrotechnical Consortium and defines stan-dards for electrotechnology, and FISA is the Federal Intelligence Surveillance Act, not an audit standard."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":60,"type":"single","q":"Kelly’s team conducts regression testing on each patch that they release. What key performance measure should they maintain to measure the effectiveness of their testing?","opts":["Time to remediate vulnerabilities","A measure of the rate of defect recurrence","A weighted risk trend","A measure of the specific coverage of their testing"],"ans":"B","expl":"Kelly’s team is using regression testing, which is intended to prevent the recurrence of issues. This means that measuring the rate of defect recurrence is an appropriate measure for their work. Time to remediate vulnerabilities is associated with activities like patching, rather than preparing the patch, whereas a weighted risk trend is used to measure risk over time to an organization. Finally, specific coverage may be useful to determine if they are fully testing their effort, but regression testing is more specifically covered by defect recurrence rates."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":61,"type":"single","q":"Which of the following types of code review is not typically performed by a human?\nFor questions 62–64, please refer to the following scenario:","opts":["Software inspections","Pair programming","Static program analysis","Software walk-throughs"],"ans":"C","expl":"Static program reviews are typically performed by an automated tool. Program under-standing, program comprehension, pair programming, software inspections, and software walk-throughs are all human-centric methods for reviewing code."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":62,"type":"single","q":"Susan’s team of software testers are required to test every code path, including those that will only be used when an error condition occurs. What type of testing environment does her team need to ensure complete code coverage?","opts":["White box","Gray box","Black box","Dynamic"],"ans":"A","expl":"To fully test code, a white-box test is required. Without full visibility of the code, error conditions or other code could be missed, making a gray-box or black-box test an inappro-priate solution. Using dynamic testing that runs against live code could also result in some conditions being missed due to sections of code not being exposed to typical usage.","scene":"Susan is the lead of a quality assurance team at her company. The team has been tasked with the testing for a major release of their company’s core software product."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":63,"type":"single","q":"As part of the continued testing of their new application, Susan’s quality assurance team has designed a set of test cases for a series of black-box tests. These functional tests are then run, and a report is prepared explaining what has occurred. What type of report is typically gener-ated during this testing to indicate test metrics?","opts":["A test coverage report","A penetration test report","A code coverage report","A line coverage report"],"ans":"A","expl":"A test coverage report measures how many of the test cases have been completed and is used as a way to provide test metrics when using test cases. A penetration test report is provided when a penetration test is conducted—this is not a penetration test. A code cov-erage report covers how much of the code has been tested, and a line coverage report is a type of code coverage report.","scene":"Susan is the lead of a quality assurance team at her company. The team has been tasked with the testing for a major release of their company’s core software product."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":64,"type":"single","q":"As part of their code coverage testing, Susan’s team runs the analysis in a nonproduction environment using logging and tracing tools. Which of the following types of code issues is most likely to be missed during testing due to this change in the operating environment?","opts":["Improper bounds checking","Input validation","A race condition","Pointer manipulation"],"ans":"C","expl":"The changes from a testing environment with instrumentation inserted into the code and the production environment for the code can mask timing-related issues like race con-ditions. Bounds checking, input validation, and pointer manipulation are all related to cod-ing issues rather than environmental issues and are more likely to be discoverable in a test environment.","scene":"Susan is the lead of a quality assurance team at her company. The team has been tasked with the testing for a major release of their company’s core software product."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":65,"type":"single","q":"Robin recently conducted a vulnerability scan and found a critical vulnerability on a server that handles sensitive information. What should Robin do next?","opts":["Patching","Reporting","Remediation","Validation"],"ans":"D","expl":"Once a vulnerability scanner identifies a potential problem, validation is necessary to verify that the issue exists. Reporting, patching, or other remediation actions can be con-ducted once the vulnerability has been confirmed."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":66,"type":"single","q":"The automated code testing and integration that Andrea ran as part of her organization’s CI/ CD pipeline errored out. What should Andrea do with the code if the company needs the code to go live immediately?","opts":["Manually bypass the test.","Review error logs to identify the problem.","Rerun the test to see if it works.","Send the code back to the developer for a fix."],"ans":"B","expl":"While handling errors and exceptions can be something of an art, the first thing to do in circumstances like these is to review error logs and notifications to try to find out what went wrong. From there, Andrea can make a decision to remediate a problem, send the code back for a fix, or take another action. She might even opt to send the code forward if the error occurred after testing was completed and was with the process flow or another noncritical element, but would only do so if she was absolutely certain that was the case."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":67,"type":"single","q":"Michelle wants to compare vulnerabilities she has discovered in her data center based on how exploitable they are, if exploit code exists, and how hard they are to remediate. What scoring system should she use to compare vulnerability metrics like these?","opts":["CSV","NVD","VSS","CVSS"],"ans":"D","expl":"The Common Vulnerability Scoring System (CVSS) includes metrics and calculation tools for exploitability, impact, how mature exploit code is, and how vulnerabilities can be remedi-ated, as well as a means to score vulnerabilities against users’ unique requirements. NVD is the National Vulnerability Database, CSV is short for comma-separated values, and Visual SourceSafe (VSS) is an irrelevant term related to software development rather than vulnera-bility management."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":68,"type":"single","q":"During a port scan of his network, Alex finds that a number of hosts respond on TCP ports 80, 443, 515, and 9100 in offices throughout his organization. What type of devices is Alex likely discovering?","opts":["Web servers","File servers","Wireless access points","Printers"],"ans":"D","expl":"Network-enabled printers often provided services via TCP 515 and 9100, and have both nonsecure and secure web-enabled management interfaces on TCP 80 and 443. Web servers, access points, and file servers would not typically provide service on the LPR and LPD ports (515 and 9100)."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":69,"type":"single","q":"Nikto, Burp Suite, and Wapiti are all examples of what type of tool?","opts":["Web application vulnerability scanners","Code review tools","Vulnerability scanners","Port scanners"],"ans":"A","expl":"Nikto, Burp Suite, and Wapiti are all web application vulnerability scanners, tools designed specifically to scan web servers and applications. While they share some function-ality with broader vulnerability scanners and port scanning tools, they have a narrower focus and typically have deeper capabilities than vulnerability scanners."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":70,"type":"single","q":"Frank’s team is testing a new API that his company’s developers have built for their applica-tion infrastructure. Which of the following is not a common API issue that you would expect Frank’s team to find?","opts":["Improper encryption","Object-level authorization issues","User authentication issues","Lack of rate limiting"],"ans":"A","expl":"APIs typically transfer data for web application via HTTPS, meaning that the API itself is not responsible for encryption. If Frank’s team discovers that TLS is not enabled, they will need to work with the infrastructure or systems administration team to ensure that TLS is enabled and in use rather than making API changes. Authorization for object access, authentication weaknesses, and rate limiting are all common API issues. If you’re\nnot familiar with the types of issues you might encounter in APIs, you can read more about them in the OWASP API security top10 at github.com/OWASP/API-Security/blob/ master/2019/en/dist/owasp-api-security-top-10.pdf."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":71,"type":"single","q":"Jim is working with a penetration testing contractor who proposes using Metasploit as part of her penetration testing effort. What should Jim expect to occur when Metasploit is used?","opts":["Systems will be scanned for vulnerabilities.","Systems will have known vulnerabilities exploited.","Services will be probed for buffer overflow and other unknown flaws.","Systems will be tested for zero-day exploits."],"ans":"B","expl":"Metasploit is an exploitation package that is designed to assist penetration testers. A tester using Metasploit can exploit known vulnerabilities for which an exploit has been created\nor can create their own exploits using the tool. While Metasploit provides built-in access to some vulnerability scanning functionality, a tester using Metasploit should primarily be expected to perform actual tests of exploitable vulnerabilities. Similarly, Metasploit sup-ports creating buffer overflow attacks, but it is not a purpose-built buffer overflow testing tool, and of course, testing systems for zero-day exploits doesn’t work unless they have been released."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":72,"type":"single","q":"Susan needs to ensure that the interactions between the components of her e-commerce appli-cation are all handled properly. She intends to verify communications, error handling, and session management capabilities throughout her infrastructure. What type of testing is she planning to conduct?","opts":["Misuse case testing","Fuzzing","Regression testing","Interface testing"],"ans":"D","expl":"Susan is conducting interface testing. Interface testing involves testing system or appli-cation components to ensure that they work properly together. Misuse case testing focuses on how an attacker might misuse the application and would not test normal cases. Fuzzing\nattempts to send unexpected input and might be involved in interface testing, but it won’t cover the full set of concerns. Regression testing is conducted when testing changes and is used to ensure that the application or system functions as it did before the update or change."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":73,"type":"single","q":"Jim is designing his organization’s log management systems and knows that he needs to care-fully plan to handle the organization’s log data. Which of the following is not a factor that Jim should be concerned with?","opts":["The volume of log data","A lack of sufficient log sources","Data storage security requirements","Network bandwidth"],"ans":"B","expl":"Not having enough log sources is not a common consideration in log management system design, although it may be a worry for security managers who can’t capture the data they need. Log management system designs must take into account the volume of log data and the network bandwidth it consumes, the security of the data, and the amount of effort required to analyze the data."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":74,"type":"single","q":"Ryan’s organization wants to ensure that proper account management is occurring but does not have a central identity and access management tool in place. Ryan has a limited amount of time to do his verification process. What is his best option to test the account management process as part of an internal audit?","opts":["Validate all accounts changed in the past 90 days.","Select high-value administrative accounts for validation.","Validate all account changes in the past 180 days.","Validate a random sample of accounts."],"ans":"D","expl":"Random sampling of accounts is the recommended best practice if all accounts cannot be validated. Selecting only recently changed accounts will not identify long-term issues or his-toric issues, and only checking high-value accounts will not show if there are issues or bad practices with other account types."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":75,"type":"single","q":"When a Windows system is rebooted, what type of log is generated?","opts":["Error","Warning","Information","Failure audit"],"ans":"C","expl":"Rebooting a Windows machine results in an information log entry. Windows defines five types of events: errors, which indicate a significant problem; warnings, which may indi-cate future problems; information, which describes successful operation; success audits, which record successful security accesses; and failure audits, which record failed security access attempts."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":76,"type":"single","q":"During a review of access logs, Alex notices that Michelle logged into her workstation in New York at 8 a.m. daily but that she was recorded as logging into her department’s main web application shortly after 3 a.m. daily. What common logging issue has Alex likely encountered?","opts":["Inconsistent log formatting","Modified logs","Inconsistent timestamps","Multiple log sources"],"ans":"C","expl":"Inconsistent timestamps are a common problem, often caused by improperly set time zones or due to differences in how system clocks are set. In this case, a consistent time difference often indicates that one system uses local time, and the other is using Greenwich mean time (GMT). Logs from multiple sources tend to cause problems with centraliza-tion and collection, whereas different log formats can create challenges in parsing log data. Finally, modified logs are often a sign of intrusion or malicious intent."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":77,"type":"single","q":"What type of vulnerability scan accesses configuration information from the systems it is run against as well as information that can be accessed via services available via the network?\nFor questions 78–80, please refer to the following scenario:","opts":["Authenticated scans","Web application scans","Unauthenticated scans","Port scans"],"ans":"A","expl":"Authenticated scans use a read-only account to access configuration files, allowing more accurate testing of vulnerabilities. Web application scans, unauthenticated scans, and port scans don’t have access to configuration files unless they are inadvertently exposed."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":78,"type":"single","q":"Ben’s development team needs to address an authorization issue, resulting in an elevation of privilege threat. Which of the following controls is most appropriate to this type of issue?","opts":["Auditing and logging are enabled.","Role-based access control is used for specific operations.","Data type and format checks are enabled.","User input is tested against a whitelist."],"ans":"B","expl":"Microsoft’s STRIDE threat assessment model places threats into one of six categories:\nSpoofing—threats that involve user credentials and authentication, or falsifying legiti-mate communications\nTampering—threats that involve the malicious modification of data\nRepudiation—threats that cause actions to occur that cannot be denied by a user\nInformation disclosure—threats that involve exposure of data to unauthorized individuals\nDenial of service—threats that deny service to legitimate users\nElevation of privilege—threats that provide higher privileges to unauthorized users\nUsing role-based access controls (RBACs) for specific operations will help to ensure that users cannot perform actions that they should not be able to. Auditing and logging can help detect abuse but won’t prevent it; and data type, format checks, and whitelisting are all useful for preventing attacks like SQL injection and buffer overflow attacks but are not as directly aimed at authorization issues.","scene":"Ben’s organization has begun to use STRIDE to assess its software and has identified threat agents and the business impacts that these threats could have. Now they are working to iden-tify appropriate controls for the issues they have identified."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":79,"type":"single","q":"Ben’s team is attempting to categorize a transaction identification issue that is caused by use of a symmetric key shared by multiple servers. What STRIDE category should this fall into?","opts":["Information disclosure","Denial of service","Tampering","Repudiation"],"ans":"D","expl":"Since a shared symmetric key could be used by any of the servers, transaction identification problems caused by a shared key are likely to involve a repudiation issue.\nIf encrypted transactions cannot be uniquely identified by a server, they cannot be proved to have come from a specific server.","scene":"Ben’s organization has begun to use STRIDE to assess its software and has identified threat agents and the business impacts that these threats could have. Now they are working to iden-tify appropriate controls for the issues they have identified."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":80,"type":"single","q":"Ben wants to use a third-party service to help assess denial-of-service attack vulnerabilities due the amount of traffic during denial-of-service attacks. What type of engagement should he suggest to his organization?","opts":["A social engineering engagement","A penetration test","Load or stress testing","Testing using a fuzzer"],"ans":"C","expl":"Ben should engage a company that can perform a load or stress test to validate how the application performs under both expected and extreme loads so that he knows what a denial-of-service attack based on load will look like. Social engineering does not test the\nability of sites to handle load, and penetration testers may conduct denial-of-service attacks but typically do not. Fuzzers send random input to test how applications handle unexpected input rather than relying on extreme load. They might help test for flaws that could result in a denial-of-service condition, but the question specifically asks about load-based conditions, not software flaws.","scene":"Ben’s organization has begun to use STRIDE to assess its software and has identified threat agents and the business impacts that these threats could have. Now they are working to iden-tify appropriate controls for the issues they have identified."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":81,"type":"single","q":"Chris is troubleshooting an issue with his organization’s SIEM reporting. After analyzing the issue, he believes that the timestamps on log entries from different systems are inconsistent. What protocol can he use to resolve this issue?","opts":["SSH","FTP","TLS","NTP"],"ans":"D","expl":"The Network Time Protocol (NTP) allows the synchronization of system clocks with a stan-dardized time source. The Secure Shell (SSH) protocol provides encrypted administrative con-nections to servers. The File Transfer Protocol (FTP) is used for data exchange. Transport Layer Security (TLS) is an encryption process used to protect information in transit over a network."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":82,"type":"single","q":"Ryan is considering the use of fuzz testing in his web application testing program. Which one of the following statements about fuzz testing should Ryan consider when making his decision?","opts":["Fuzzers only find complex faults.","Testers must manually generate input.","Fuzzers may not fully cover the code.","Fuzzers can’t reproduce errors."],"ans":"C","expl":"Fuzz testers are capable of automatically generating input sequences to test an applica-tion. Therefore, testers do not need to manually generate input, although they may do so if they want. Fuzzers can reproduce errors (and thus, “fuzzers can’t reproduce errors” is not an issue) but typically don’t fully cover the code—code coverage tools are usually paired\nwith fuzzers to validate how much coverage was possible. Fuzzers are often limited to simple errors because they won’t handle business logic or attacks that require knowledge from the application user."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":83,"type":"single","q":"Ken is designing a testing process for software developed by his team. He is designing a test that verifies that every line of code was executed during the test. What type of analysis is Ken performing?\nFor questions 84–86, please refer to the following scenario. During a port scan, Ben uses nmap’s default settings and sees the following results.","opts":["Branch coverage","Condition coverage","Function coverage","Statement coverage"],"ans":"D","expl":"Statement coverage tests verify that every line of code was executed during the test. Branch coverage verifies that every if statement was executed under all if and else conditions. Condition coverage verifies that every logical test in the code was executed under all sets of inputs. Function coverage verifies that every function in the code was called and returns results."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":87,"type":"single","q":"Lucca is reviewing his organization’s disaster recovery process data and notes that the MTD for the business’s main website is two hours. What does he know about the RTO for the site when he does testing and validation?","opts":["It needs to be less than two hours.","It needs to be at least two hours.","The MTD is too short and needs to be longer.","The RTO is too short and needs to be longer."],"ans":"A","expl":"When Lucca reviews the recovery time objective (RTO) data, he needs to ensure that the organization can recover from an outage in less than two hours based on the maximum toler-able downtime (MTD) of two hours."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":88,"type":"single","q":"Diana has engaged third-party auditors and wants to release an audit attestation to third parties without including details of the audit. What type of SSAE 18 SOC report should she request?","opts":["SOC 1","SOC 2","SOC 3","SOC 4"],"ans":"C","expl":"Diana should request an SOC 3 report, which is intended for distribution to third parties. They include the auditor’s opinions and management assertions, along with information about the service organization. SOC3 reports are specifically intended for external\nrelease, unlike SOC 1 (financial reporting) and SOC 2 (confidential security and privacy) engagements."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":89,"type":"single","q":"While reviewing the software testing output for her organization’s new application, Madhuri notices that the application has produced errors that included directory and file information shown to the web application tester. What issue should she include in her report about the application?","opts":["It does not perform proper exception handling.","The software does not handle misuse case testing properly.","Debugging statements need to be removed.","The code was not fully tested due to errors."],"ans":"A","expl":"Showing end users error information about the code, particularly with directory and file information included, means that the application does not perform proper exception handling. Errors should be logged or noted in a way that the administrator can handle, but end users (and attackers!) should not see that information. The software may be handling misuse properly, as the problem does not note if this was due to normal testing or misuse\ntesting. There is no information about debugging code causing the output, and test coverage was not noted in the question."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":90,"type":"single","q":"What is the first step that should occur before a penetration test is performed?","opts":["Data gathering","Port scanning","Getting permission","Planning"],"ans":"C","expl":"The most important first step for a penetration test is getting permission. Once permis-sion has been received, planning, data gathering, and then elements of the actual test like port scanning can commence."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":91,"type":"single","q":"The president of Josh’s company is concerned about a significant increase in cryptographic malware that is impacting other companies in their industry. She has asked John to ensure that the company’s data will be recoverable if malware strikes and encrypts their production systems. What process does Josh need to undertake to be able to tell her that the company\n• is covered?","opts":["Encrypt all sensitive data.","Hash all of the organization’s data to detect cryptographic malware.","Perform backup verification.","Use anti-encryption technology to prevent the malware from encrypting drives."],"ans":"C","expl":"Validating that the organization has secure and usable backups is Josh’s best answer. If cryptographic malware strikes, the best answer is to have backups that you can rely on and that will not also be encrypted, which means a separation of systems and potentially a need to do versioning so that unencrypted backups are not replaced by encrypted and thus inac-cessible versions. Encrypting sensitive data won’t stop attackers from re-encrypting it, making it inaccessible. Hashing to detect the attack won’t stop it or make it possible to recover, and anti-encryption technology does what the option suggests does not exist."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":92,"type":"single","q":"Joanna is her organization’s CISO, and in her security operations oversight role she wants to ensure that management oversight is happening for security-related changes. What system should she focus on to track this type of data in most organizations?","opts":["The SIEM system","The IPS system","The CMS tool","The ITSM tool"],"ans":"D","expl":"IT service management, or ITSM, tools include change management and thus the type of approvals and review processes that Joanna is looking for. An SIEM helps with security logs and events, an IPS looks for intrusions and unwanted traffic, and a CMS is a content management tool."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":93,"type":"single","q":"Henry wants to validate that his backups are working. Which of the following options is the best way for him to ensure that the backups will be useful in a true disaster recovery scenario?","opts":["Periodically restore a random file to ensure that the backups are working.","Review configurations and settings on a regular schedule to validate backup settings.","Review the backup logs to ensure no errors are occurring.","Regularly perform full restores from backups to validate their success."],"ans":"D","expl":"All of these are useful parts of a backup strategy, but performing full restores from backups on a regular basis is the best option listed. If regular restores work, then individual files will be recoverable, but individual files may not show larger issues with backups. Con-figuration and setting reviews are important but will not validate the backups themselves, and error messages can indicate problems but won’t demonstrate intact logs either."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":94,"type":"single","q":"What type of vulnerabilities will not be found by a vulnerability scanner?","opts":["Local vulnerabilities","Service vulnerabilities","Zero-day vulnerabilities","Vulnerabilities that require authentication"],"ans":"C","expl":"Vulnerability scanners cannot detect vulnerabilities for which they do not have a test, plug-in, or signature. Signatures often include version numbers, service fingerprints, or configuration data. They can detect local vulnerabilities as well as those that require authentication if they are provided with credentials, and of course, they can detect service vulnerabilities."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":95,"type":"multi","q":"Jacinda wants to measure the effectiveness of her security training as one of her security met-rics. Which of the following measures are the most useful for assessing the effectiveness of security awareness training? (Select all that apply.)","opts":["How many people took the training","The level of security awareness before and after the training","The length of the training in hours","The number of training events each individual attended this year"],"ans":"AB","expl":"The number of staff who took a given training and the average change in their awareness from before the training to after the training can provide insight into how many trained staff you have and how impactful the training was. Over time, this will allow\nyou to determine if your training is helping and if awareness is increasing. The length of the training does not assess its impact; in addition, the number of events each individual attended does not mean that staff are becoming more aware."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":96,"type":"single","q":"Elaine has discovered a previously unknown critical vulnerability in a product that her orga-nization uses. Her organization has a strong commitment to ethical disclosure, and Elaine wants to follow common ethical disclosure practices. What should she do first?\nFor questions 97–99, please refer to the following scenario. NIST Special Publication 800-115, the Technical Guide to Information Security Testing and Assessment, provides NIST’s process for penetration testing. Use this image as well as your knowledge of penetration test-ing to answer the questions.","opts":["Build an in-house remediation or control and then publicly disclosure the vulnerability to prompt the vendor to patch it quickly.","Build an in-house remediation or control and then notify the vendor of the issue.","Notify the vendor and give them a reasonable amount of time to fix the issue.","Publicly disclose the vulnerability so that the vendor will patch it in an appropriate amount of time."],"ans":"C","expl":"Ethical (or responsible) disclosure norms include notifying the vendor and providing them with a reasonable amount of time to remediate the issue. Public disclosures before notifying the vendor or in a short period of time are considered unethical in most circum-stances. While this time frame varies, 90 to 120 days is not uncommon across the industry due to the complexity of software and other technologies."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":97,"type":"single","q":"Which of the following is not a part of the discovery phase?","opts":["Hostname and IP address information gathering","Service information capture","Dumpster diving","Privilege escalation"],"ans":"D","expl":"Privilege escalation occurs during the attack phase of a penetration test. Host and service information gathering, as well as activities like dumpster diving that can provide information about the organization, its systems, and security, are all part of the discovery phase.","scene":"NIST Special Publication 800-115, the Technical Guide to Information Security Testing and Assessment, provides NIST’s process for penetration testing. Use this image as well as your knowledge of penetration test-ing to answer the questions. Source: NIST SP 800-115."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":98,"type":"single","q":"NIST specifies four attack phase steps: gaining access, escalating privileges, system browsing, and installing additional tools. Once attackers install additional tools, what phase will a pen-etration tester typically return to?","opts":["Discovery","Gaining access","Escalating privileges","System browsing"],"ans":"B","expl":"Once additional tools have been installed, penetration testers will typically use them to gain additional access. From there they can further escalate privileges, search for new targets or data, and, once again, install more tools to allow them to pivot further into infrastructure or systems.","scene":"NIST Special Publication 800-115, the Technical Guide to Information Security Testing and Assessment, provides NIST’s process for penetration testing. Use this image as well as your knowledge of penetration test-ing to answer the questions. Source: NIST SP 800-115."},{"ch":"D6","ch_name":"域6 安全评估与测试","no":99,"type":"single","q":"Which of the following is not a typical part of a penetration test report?","opts":["A list of identified vulnerabilities","All sensitive data that was gathered during the test","Risk ratings for each issue discovered","Mitigation guidance for issues identified"],"ans":"B","expl":"Penetration testing reports often do not include the specific data captured during the assessment, as the readers of the report may not be authorized to access all of the data, and exposure of the report could result in additional problems for the organization. A listing\nof the issues discovered, risk ratings, and remediation guidance are all common parts of a penetration test report.","scene":"NIST Special Publication 800-115, the Technical Guide to Information Security Testing and Assessment, provides NIST’s process for penetration testing. Use this image as well as your knowledge of penetration test-ing to answer the questions. Source: NIST SP 800-115."},{"ch":"D7","ch_name":"域7 安全运营","no":2,"type":"single","q":"Joe is the security administrator for an ERP system. He is preparing to create accounts for several new employees. What default access should he give to all of the new employees as he creates the accounts?","opts":["Read only","Editor","Administrator","No access"],"ans":"D","expl":"The principle of least privilege should guide Joe in this case. He should apply no access permis-sions by default and then give each user the necessary permissions to perform their job responsibil-ities. Read only, editor, and administrator permissions may be necessary for one or more of these users, but those permissions should be assigned based upon business need and not by default."},{"ch":"D7","ch_name":"域7 安全运营","no":3,"type":"single","q":"Tim is configuring a privileged account management solution for his organization. Which one of the following is not a privileged administrative activity that should be automatically sent to a log of superuser actions?","opts":["Purging log entries","Restoring a system from backup","Logging into a workstation","Managing user accounts"],"ans":"C","expl":"While most organizations would want to log attempts to log in to a workstation, this is not considered a privileged administrative activity and would go through normal logging processes."},{"ch":"D7","ch_name":"域7 安全运营","no":4,"type":"single","q":"When one of the employees of Alice’s company calls in for support, she uses a code word that the company agreed to use if employees were being forced to perform an action. What is this scenario called?","opts":["Social engineering","Duress","Force majeure","Stockholm syndrome"],"ans":"B","expl":"Duress, or being under threat of violence or other constraints, is a concern for organizations such as banks, jewelry stores, or other organizations where an attacker may attempt to force an employee to perform actions. Organizations that expect that a scenario like this may occur will often use duress code words that let others know that they are performing actions under threat."},{"ch":"D7","ch_name":"域7 安全运营","no":5,"type":"single","q":"Jordan is preparing to bring evidence into court after a cybersecurity incident investigation. He is responsible for preparing the physical artifacts, including affected servers and mobile devices. What type of evidence consists entirely of tangible items that may be brought into a court of law?","opts":["Documentary evidence","Parol evidence","Testimonial evidence","Real evidence"],"ans":"D","expl":"Real evidence consists of things that may actually be brought into a courtroom as evi-dence. For example, real evidence includes hard disks, weapons, and items containing finger-prints. Documentary evidence consists of written items that may or may not be in tangible form. Testimonial evidence is verbal testimony given by witnesses with relevant information. The parol evidence rule says that when an agreement is put into written form, the written document is assumed to contain all the terms of the agreement."},{"ch":"D7","ch_name":"域7 安全运营","no":6,"type":"single","q":"Lauren wants to ensure that her users only run software that her organization has approved. What technology should she deploy?","opts":["Blacklisting","Configuration management","Whitelisting","Graylisting"],"ans":"C","expl":"A whitelist of allowed applications will ensure that Lauren’s users can run only the appli-cations that she preapproves. Blacklists would require her to maintain a list of every appli-cation that she doesn’t want to allow, which is an almost impossible task. Graylisting is not a technology option, and configuration management can be useful for making sure the right applications are on a PC but typically can’t directly prevent users from running undesired applications or programs."},{"ch":"D7","ch_name":"域7 安全运营","no":7,"type":"single","q":"Colin is responsible for managing his organization’s use of cybersecurity deception technologies. Which one of the following should he use on a honeypot system to consume an attacker’s time while alerting administrators?","opts":["Honeynet","Pseudoflaw","Warning banner","Darknet"],"ans":"B","expl":"A pseudoflaw is a false vulnerability in a system that may distract an attacker. A hon-eynet is a network of multiple honeypots that creates a more sophisticated environment for intruders to explore, rather than a feature Colin could use on a honeypot. A darknet is a segment of unused network address space that should have no network activity and, there-fore, may be easily used to monitor for illicit activity. A warning banner is a legal tool used to notify intruders that they are not authorized to access a system."},{"ch":"D7","ch_name":"域7 安全运营","no":8,"type":"single","q":"Toni responds to the desk of a user who reports slow system activity. Upon checking out-bound network connections from that system, Toni notices a large amount of social media traffic originating from the system. The user does not use social media, and when Toni checks the accounts in question, they contain strange messages that appear encrypted. What is the most likely cause of this traffic?","opts":["Other users are relaying social media requests through the user’s computer.","The user’s computer is part of a botnet.","The user is lying about her use of social media.","Someone else is using the user’s computer when she is not present."],"ans":"B","expl":"Social media is commonly used as a command-and-control system for botnet activity. The most likely scenario here is that the user’s computer was infected with malware and joined to a botnet. This accounts for both the unusual social media traffic and the slow system activity."},{"ch":"D7","ch_name":"域7 安全运营","no":9,"type":"single","q":"John deploys his website to multiple regions using load balancers around the world through his cloud infrastructure as a service provider. What availability concept is he using?","opts":["Multiple processing sites","Warm sites","Cold sites","A honeynet"],"ans":"A","expl":"John’s design provides multiple processing sites, distributing load to multiple regions. Not only does this provide business continuity and disaster recovery functionality, but it also means that his design will be more resilient to denial-of-service attacks."},{"ch":"D7","ch_name":"域7 安全运营","no":10,"type":"single","q":"Jim would like to identify compromised systems on his network that may be participating in a botnet. He plans to do this by watching for connections made to known command-and-control servers. Which one of the following techniques would be most likely to provide this information if Jim has access to a list of known servers?\nFor questions 11–15, please refer to the following scenario:","opts":["NetFlow records","IDS logs","Authentication logs","RFC logs"],"ans":"A","expl":"NetFlow records contain an entry for every network communication session that took place on a network and can be compared to a list of known malicious hosts. IDS logs may contain a relevant record, but it is less likely because they would create log entries only if the traffic triggers the IDS, as opposed to NetFlow records, which encompass all communica-tions. Authentication logs and RFC logs would not have records of any network traffic."},{"ch":"D7","ch_name":"域7 安全运营","no":11,"type":"single","q":"As Gary decides what access permissions he should grant to each user, what principle should guide his decisions about default permissions?","opts":["Separation of duties","Least privilege","Aggregation","Separation of privileges"],"ans":"B","expl":"Gary should follow the least privilege principle and assign users only the permissions they need to perform their job responsibilities. Aggregation is a term used to describe the unin-tentional accumulation of privileges over time, also known as privilege creep. Separation of duties and separation of privileges are principles used to secure sensitive processes.","scene":"Gary was recently hired as the first chief information security officer (CISO) for a local government agency. The agency recently suffered a security breach and is attempting to build a new information security program. Gary would like to apply some best practices for secu-rity operations as he is designing this program."},{"ch":"D7","ch_name":"域7 安全运营","no":12,"type":"single","q":"As Gary designs the program, he uses the matrix shown here. What principle of information security does this matrix most directly help enforce?","opts":["Segregation of duties","Aggregation","Two-person control","Defense in depth"],"ans":"A","expl":"The matrix shown in the figure is known as a segregation of duties matrix. It is used to ensure that one person does not obtain two privileges that would create a potential conflict.\nAggregation is a term used to describe the unintentional accumulation of privileges over time, also known as privilege creep. Two-person control is used when two people must work together to perform a sensitive action. Defense in depth is a general security principle used to describe a philosophy of overlapping security controls.","scene":"Gary was recently hired as the first chief information security officer (CISO) for a local government agency. The agency recently suffered a security breach and is attempting to build a new information security program. Gary would like to apply some best practices for secu-rity operations as he is designing this program."},{"ch":"D7","ch_name":"域7 安全运营","no":13,"type":"single","q":"Gary is preparing to create an account for a new user and assign privileges to the HR data-base. What two elements of information must Gary verify before granting this access?","opts":["Credentials and need to know","Clearance and need to know","Password and clearance","Password and biometric scan"],"ans":"B","expl":"Before granting access, Gary should verify that the user has a valid security clearance and a business need to know the information. Gary is performing an authorization task, so he does not need to verify the user’s credentials, such as a password or biometric scan.","scene":"Gary was recently hired as the first chief information security officer (CISO) for a local government agency. The agency recently suffered a security breach and is attempting to build a new information security program. Gary would like to apply some best practices for secu-rity operations as he is designing this program."},{"ch":"D7","ch_name":"域7 安全运营","no":14,"type":"single","q":"Gary is preparing to develop controls around access to root encryption keys and would like to apply a principle of security designed specifically for very sensitive operations. Which prin-ciple should he apply?","opts":["Least privilege","Defense in depth","Security through obscurity","Two-person control"],"ans":"D","expl":"Gary should follow the principle of two-person control by requiring simultaneous action by two separate authorized individuals to gain access to the encryption keys. He should\nalso apply the principles of least privilege and defense in depth, but these principles apply to all operations and are not specific to sensitive operations. Gary should avoid the security\nthrough obscurity principle, the reliance upon the secrecy of security mechanisms to provide security for a system or process.","scene":"Gary was recently hired as the first chief information security officer (CISO) for a local government agency. The agency recently suffered a security breach and is attempting to build a new information security program. Gary would like to apply some best practices for secu-rity operations as he is designing this program."},{"ch":"D7","ch_name":"域7 安全运营","no":15,"type":"multi","q":"How often should Gary and his team conduct a review of the privileged access that a user has to sensitive systems? (Select all that apply.)","opts":["On a periodic basis","When a user leaves the organization","When a user changes roles","On a daily basis"],"ans":"ABC","expl":"Privileged access reviews are one of the most critical components of an organiza-tion’s security program because they ensure that only authorized users have access to perform the most sensitive operations. They should take place whenever a user with privileged access leaves the organization or changes roles as well as on a regular, recurring basis. However, it is not reasonable to expect that these time-consuming reviews would take place on a daily basis.","scene":"Gary was recently hired as the first chief information security officer (CISO) for a local government agency. The agency recently suffered a security breach and is attempting to build a new information security program. Gary would like to apply some best practices for secu-rity operations as he is designing this program."},{"ch":"D7","ch_name":"域7 安全运营","no":16,"type":"single","q":"Which one of the following terms is often used to describe a collection of unrelated patches released in a large collection?","opts":["Hotfix","Update","Security fix","Service pack"],"ans":"D","expl":"Hotfixes, updates, and security fixes are all synonyms for single patches designed to correct a single problem. Service packs are collections of many different updates that serve as a major update to an operating system or application."},{"ch":"D7","ch_name":"域7 安全运营","no":17,"type":"single","q":"Tonya is collecting evidence from a series of systems that were involved in a cybersecurity incident. A colleague suggests that she use a forensic disk controller for the collection process. What is the function of this device?","opts":["Masking error conditions reported by the storage device","Transmitting write commands to the storage device","Intercepting and modifying or discarding commands sent to the storage device","Preventing data from being returned by a read operation sent to the device"],"ans":"C","expl":"A forensic disk controller performs four functions. One of those, write blocking, intercepts write commands sent to the device and prevents them from modifying data on the device. The other three functions include returning data requested by a read operation, returning access-signifi-cant information from the device, and reporting errors from the device back to the forensic host."},{"ch":"D7","ch_name":"域7 安全运营","no":18,"type":"single","q":"Lydia is processing access control requests for her organization. She comes across a request where the user does have the required security clearance, but there is no business justification for the access. Lydia denies this request. What security principle is she following?","opts":["Need to know","Least privilege","Separation of duties","Two-person control"],"ans":"A","expl":"Lydia is following the need to know principle. While the user may have the appropriate security clearance to access this information, there is no business justification provided, so she does not know that the user has an appropriate need to know the information."},{"ch":"D7","ch_name":"域7 安全运营","no":19,"type":"single","q":"Helen is tasked with implementing security controls in her organization that might be used to deter fraudulent insider activity. Which one of the following mechanisms would be LEAST useful to her work?","opts":["Job rotation","Mandatory vacations","Incident response","Two-person control"],"ans":"C","expl":"Job rotation and mandatory vacations deter fraud by increasing the likelihood that it will be detected. Two-person control deters fraud by requiring collusion between two employees. Incident response does not normally serve as a deterrent mechanism."},{"ch":"D7","ch_name":"域7 安全运营","no":20,"type":"single","q":"Matt wants to ensure that critical network traffic from systems throughout his company is prioritized over web browsing and social media use at this company. What technology can he use to do this?","opts":["VLANs","QoS","VPN","ISDN"],"ans":"B","expl":"Quality of service is a feature found on routers and other network devices that can priori-tize specific network traffic. QoS policies define which traffic is prioritized, and traffic is then handled based on the policy."},{"ch":"D7","ch_name":"域7 安全运营","no":21,"type":"single","q":"Tom is responding to a recent security incident and is seeking information on the approval process for a recent modification to a system’s security settings. Where would he most likely find this information?","opts":["Change log","System log","Security log","Application log"],"ans":"A","expl":"The change log contains information about approved changes and the change management process. While other logs may contain details about the change’s effect, the audit trail for change management would be found in the change log."},{"ch":"D7","ch_name":"域7 安全运营","no":22,"type":"single","q":"Staff from Susan’s company often travel internationally and require connectivity to corpo-rate systems for their work. Susan believes that these users may be targeted for corporate espionage activities because of the technologies that her company is developing and wants to include advice in the security training provided to international travelers. What practice should Susan recommend that they adopt for connecting to networks while they travel?","opts":["Only connect to public WiFi.","Use a VPN for all connections.","Only use websites that support TLS.","Do not connect to networks while traveling."],"ans":"B","expl":"While it may be tempting to tell her staff to simply not connect to any network, Susan knows that they will need connectivity to do their work. Using a VPN to connect their lap-tops and mobile devices to a trusted network and ensuring that all traffic is tunneled through the VPN is her best bet to secure their internet usage. Susan may also want to ensure that\nthey take “clean” laptops and devices that do not contain sensitive information or documents and that those systems are fully wiped and reviewed when they return."},{"ch":"D7","ch_name":"域7 安全运营","no":23,"type":"single","q":"Ricky is seeking a list of information security vulnerabilities in applications, devices, and operating systems. Which one of the following threat intelligence sources would be most use-ful to him?","opts":["OWASP","Bugtraq","Microsoft Security Bulletins","CVE"],"ans":"D","expl":"The Common Vulnerability and Exposures (CVE) dictionary contains standard-ized information on many different security issues. The Open Web Application Security Project (OWASP) contains general guidance on web application security issues but does\nnot track specific vulnerabilities or go beyond web applications. The Bugtraq mailing list and Microsoft Security Bulletins are good sources of vulnerability information but are not comprehensive databases of known issues."},{"ch":"D7","ch_name":"域7 安全运营","no":24,"type":"multi","q":"Which of the following would normally be considered an example of a disaster when performing disaster recovery planning? (Select all that apply.)","opts":["Hacking incident","Flood","Fire","Terrorism"],"ans":"ABCD","expl":"A disaster is any event that can disrupt normal IT operations and can be either natural or manmade. Hacking and terrorism are examples of manmade disasters, while flooding and fire are examples of natural disasters."},{"ch":"D7","ch_name":"域7 安全运营","no":25,"type":"single","q":"Glenda would like to conduct a disaster recovery test and is seeking a test that will allow a review of the plan with no disruption to normal information system activities and as minimal a commitment of time as possible. What type of test should she choose?","opts":["Tabletop exercise","Parallel test","Full interruption test","Checklist review"],"ans":"D","expl":"The checklist review is the least disruptive type of disaster recovery test. During a check-list review, team members each review the contents of their disaster recovery checklists on their own and suggest any necessary changes. During a tabletop exercise, team members come together and walk through a scenario without making any changes to information sys-tems. During a parallel test, the team actually activates the disaster recovery site for testing, but the primary site remains operational. During a full interruption test, the team takes down the primary site and confirms that the disaster recovery site is capable of handling regular operations. The full interruption test is the most thorough test but also the most disruptive."},{"ch":"D7","ch_name":"域7 安全运营","no":26,"type":"single","q":"Which one of the following is not an example of a backup tape rotation scheme?","opts":["Grandfather/Father/Son","Meet in the middle","Tower of Hanoi","Six Cartridge Weekly"],"ans":"B","expl":"The Grandfather/Father/Son, Tower of Hanoi, and Six Cartridge Weekly schemes are all different approaches to rotating backup media that balance reuse of media with data reten-tion concerns. Meet-in-the-middle is a cryptographic attack against 2DES encryption."},{"ch":"D7","ch_name":"域7 安全运营","no":27,"type":"single","q":"Helen is implementing a new security mechanism for granting employees administrative priv-ileges in the accounting system. She designs the process so that both the employee’s manager and the accounting manager must approve the request before the access is granted. What information security principle is Helen enforcing?","opts":["Least privilege","Two-person control","Job rotation","Separation of duties"],"ans":"B","expl":"In this scenario, Helen designed a process that requires the concurrence of two people to perform a sensitive action. This is an example of two-person control. This is different from separation of duties, where one individual may not have two separate permissions that, when combined, might allow an unwanted action. Separation of duties applied to a situation like this one might say that the same person may not have both the ability to initiate a request and the ability to approve a request. Least privilege says that an individual should have only the necessary permissions required to carry out their job function. Job rotation is a scheme that has users periodically shift job functions in order to detect malfeasance."},{"ch":"D7","ch_name":"域7 安全运营","no":28,"type":"single","q":"Frank is considering the use of different types of evidence in an upcoming criminal matter. Which one of the following is not a requirement for evidence to be admissible in court?","opts":["The evidence must be relevant.","The evidence must be material.","The evidence must be tangible.","The evidence must be competently acquired."],"ans":"C","expl":"Evidence provided in court must be relevant to determining a fact in question, material to the case at hand, and competently obtained. Evidence does not need to be tangible. Witness testimony is an example of intangible evidence that may be offered in court."},{"ch":"D7","ch_name":"域7 安全运营","no":29,"type":"single","q":"Harold recently completed leading the postmortem review of a security incident. What docu-mentation should he prepare next?","opts":["A lessons learned document","A risk assessment","A remediation list","A mitigation checklist"],"ans":"A","expl":"A lessons learned document is often created and distributed to involved parties after a postmortem review to ensure that those who were involved in the incident and others who may benefit from the knowledge are aware of what they can do to prevent future issues and to improve response in the event that one occurs."},{"ch":"D7","ch_name":"域7 安全运营","no":30,"type":"multi","q":"Beth is creating a new cybersecurity incident response team (CSIRT) and would like to deter-mine the appropriate team membership. Which of the following groups would she normally include? (Select all that apply.)","opts":["Information security","Law enforcement","Senior management","Public affairs"],"ans":"ACD","expl":"CSIRT representation normally includes at least representatives of senior management, information security professionals, legal representatives, public affairs staff, and engineering/technical staff. Law enforcement personnel would not be included on such a team and would only be consulted as necessary."},{"ch":"D7","ch_name":"域7 安全运营","no":32,"type":"single","q":"Which one of the following security tools is not capable of generating an active response to a security event?","opts":["IPS","Firewall","IDS","Antivirus software"],"ans":"C","expl":"Intrusion detection systems (IDSs) provide only passive responses, such as alerting admin-istrators to a suspected attack. Intrusion prevention systems and firewalls, on the other hand, may take action to block an attack attempt. Antivirus software also may engage in active response by quarantining suspect files."},{"ch":"D7","ch_name":"域7 安全运营","no":33,"type":"single","q":"Scott is responsible for disposing of disk drives that have been pulled from his company’s SAN as they are retired. Which of the following options should he avoid if the data on the SAN is considered highly sensitive by his organization?","opts":["Destroy them physically.","Sign a contract with the SAN vendor that requires appropriate disposal and provides a certification process.","Reformat each drive before it leaves the organization.","Use a secure wipe tool like DBAN."],"ans":"C","expl":"Physical destruction, an appropriate contract with certification, and secure wiping are all reasonable options. In each case, a careful inventory and check should be done to ensure that each drive is handled appropriately. Reformatting drives can leave remnant data, making this a poor data lifecycle choice for drives that contain sensitive data."},{"ch":"D7","ch_name":"域7 安全运营","no":34,"type":"single","q":"What term is used to describe the default set of privileges assigned to a user when a new account is created?","opts":["Aggregation","Transitivity","Baseline","Entitlement"],"ans":"D","expl":"Entitlement refers to the privileges granted to users when an account is first provisioned."},{"ch":"D7","ch_name":"域7 安全运营","no":35,"type":"single","q":"Which one of the following types of agreements is the most formal document that contains expectations about availability and other performance parameters between a service provider and a customer?","opts":["Service-level agreement (SLA)","Operational-level agreement (OLA)","Memorandum of understanding (MOU)","Statement of work (SOW)"],"ans":"A","expl":"The service-level agreement (SLA) is between a service provider and a customer and documents in a formal manner expectations around availability, performance, and other parameters. An MOU may cover the same items but is not as formal a document. An OLA is between internal service organizations and does not involve customers. An SOW is an addendum to a contract describing work to be performed."},{"ch":"D7","ch_name":"域7 安全运营","no":36,"type":"single","q":"As the CIO of a large organization, Clara would like to adopt standard processes for managing IT activities. Which one of the following frameworks focuses on IT service management and includes topics such as change management, configuration management, and service-level agreements?","opts":["ITIL","PMBOK","PCI DSS","TOGAF"],"ans":"A","expl":"The IT Infrastructure Library (ITIL) framework focuses on IT service management. The Project Management Body of Knowledge (PMBOK) provides a common core of project management expertise. The Payment Card Industry Data Security Standard (PCI DSS) con-tains regulations for credit card security. The Open Group Architecture Framework (TOGAF) focuses on IT architecture issues."},{"ch":"D7","ch_name":"域7 安全运营","no":37,"type":"single","q":"Richard is experiencing issues with the quality of network service on his organization’s net-work. The primary symptom is that packets are consistently taking too long to travel from their source to their destination. What term describes the issue Richard is facing?","opts":["Jitter","Packet loss","Interference","Latency"],"ans":"D","expl":"Latency is a delay in the delivery of packets from their source to their destination. Jitter is a variation in the latency for different packets. Packet loss is the disappearance of packets in transit that requires retransmission. Interference is electrical noise or other disruptions that corrupt the contents of packets."},{"ch":"D7","ch_name":"域7 安全运营","no":38,"type":"single","q":"Joe wants to test a program he suspects may contain malware. What technology can he use to isolate the program while it runs?","opts":["ASLR","Sandboxing","Clipping","Process isolation"],"ans":"B","expl":"Running the program in a sandbox provides secure isolation that can prevent the mal-ware from impacting other applications or systems. If Joe uses appropriate instrumentation, he can observe what the program does, what changes it makes, and any communications it may attempt. ASLR is a memory location randomization technology, process isolation keeps processes from impacting each other, but a sandbox typically provides greater utility in a scenario like this since it can be instrumented and managed in a way that better supports investigations, and clipping is a term often used in signal processing."},{"ch":"D7","ch_name":"域7 安全运营","no":39,"type":"single","q":"Which one of the following is an example of a non-natural disaster?","opts":["Hurricane","Flood","Mudslide","Transformer explosion"],"ans":"D","expl":"A transformer explosion is a failure of a human-made electrical component. Flooding, mudslides, and hurricanes are all examples of natural disasters."},{"ch":"D7","ch_name":"域7 安全运营","no":40,"type":"single","q":"Anne wants to gather information about security settings as well as build an overall view of her organization’s assets by gathering data about a group of Windows 10 workstations\n• spread throughout her company. What Windows tool is best suited to this type of configura-tion management task?","opts":["SCCM","Group Policy","SCOM","A custom PowerShell script"],"ans":"A","expl":"System Center Configuration Manager (SCCM) provides this capability and is designed to allow administrators to evaluate the configuration status of Windows workstations and servers, as well as providing asset management data. SCOM is primarily used to monitor for health and performance, Group Policy can be used for a variety of tasks including deploy-ing settings and software, and custom PowerShell scripts could do this but should not be required for a configuration check."},{"ch":"D7","ch_name":"域7 安全运营","no":41,"type":"single","q":"Javier is verifying that only IT system administrators have the ability to log on to servers used for administrative purposes. What principle of information security is he enforcing?","opts":["Need to know","Least privilege","Two-person control","Transitive trust"],"ans":"B","expl":"The principle of least privilege says that an individual should only have the privileges necessary to complete their job functions. Removing administrative privileges from nonad-ministrative users is an example of least privilege."},{"ch":"D7","ch_name":"域7 安全运营","no":42,"type":"single","q":"Which one of the following is not a basic preventative measure that you can take to protect your systems and applications against attack?","opts":["Implement intrusion detection and prevention systems.","Maintain current patch levels on all operating systems and applications.","Remove unnecessary accounts and services.","Conduct forensic imaging of all systems."],"ans":"D","expl":"There is no need to conduct forensic imaging as a preventative measure. Rather, forensic imaging should be used during the incident response process. Maintaining patch levels, implementing intrusion detection/prevention, and removing unnecessary services and accounts are all basic preventative measures."},{"ch":"D7","ch_name":"域7 安全运营","no":43,"type":"single","q":"Tim is a forensic analyst who is attempting to retrieve information from a hard drive. It appears that the user attempted to erase the data, and Tim is trying to reconstruct it. What type of forensic analysis is Tim performing?","opts":["Software analysis","Media analysis","Embedded device analysis","Network analysis"],"ans":"B","expl":"The scrutiny of hard drives for forensic purposes is an example of media analysis. Embedded device analysis looks at the computers included in other large systems, such as automobiles or security systems. Software analysis analyzes applications and their logs. Network analysis looks at network traffic and logs."},{"ch":"D7","ch_name":"域7 安全运营","no":44,"type":"multi","q":"Which one of the following is an example of a computer security incident? (Select all that apply.)","opts":["Failure of a backup to complete properly","System access recorded in a log","Unauthorized vulnerability scan of a file server","Update of antivirus signatures"],"ans":"AC","expl":"Security incidents negatively affect the confidentiality, integrity, or availability of information or assets and/or violate a security policy. The unauthorized vulnerability scan of a server does violate security policy and may negatively affect the security of that system, so it qualifies as a security incident. The failure of a backup to complete properly jeopardizes availability and is, therefore, also a security incident. The logging of system access and update of antivirus signatures are all routine actions that do not violate policy or jeopardize security, so they are all events rather than incidents."},{"ch":"D7","ch_name":"域7 安全运营","no":45,"type":"single","q":"Roland is a physical security specialist in an organization that has a large amount of expensive lab equipment that often moves around the facility. Which one of the following technologies would provide the most automation of an inventory control process in a cost-effective manner?","opts":["IPS","WiFi","RFID","Ethernet"],"ans":"C","expl":"Radio Frequency IDentification (RFID) technology is a cost-effective way to track items around a facility. While WiFi could be used for the same purpose, it would be much more expensive to implement."},{"ch":"D7","ch_name":"域7 安全运营","no":46,"type":"single","q":"Connor’s company recently experienced a denial-of-service attack that Connor believes came from an inside source. If true, what type of event has the company
