this attack?","opts":["Masquerading","Replay","Spoofing","Modification"],"ans":"B","expl":"Masquerading (or impersonation) attacks use stolen or falsified credentials to bypass authentication mechanisms. That term does describe this attack, but you should keep reading the answer choices even after finding a possible correct answer. In this case, replay attacks are\na more specific type of masquerading attack that relies on captured authentication tokens, and this is, therefore, a better answer. Spoofing attacks rely on falsifying an identity like an IP address or hostname without credentials. Modification attacks occur when captured packets are modified and replayed to a system to attempt to perform an action."},{"ch":"PT1","ch_name":"模拟卷 1","no":67,"type":"single","q":"Lisa wants to integrate with a cloud identity provider that uses OAuth 2.0, and she wants to select an appropriate authentication framework. Which of the following best suits her needs?","opts":["OpenID Connect","SAML","RADIUS","Kerberos"],"ans":"A","expl":"OpenID Connect is an authentication layer that works with OAuth 2.0 as its under-lying authorization framework. It has been widely adopted by cloud service providers and is widely supported. SAML, RADIUS, and Kerberos are alternative authentication technologies but do not have the same level of seamless integration with OAuth."},{"ch":"PT1","ch_name":"模拟卷 1","no":68,"type":"single","q":"Owen recently designed a security access control structure that prevents a single user from simultaneously holding the role required to create a new vendor and the role required to issue a check. What principle is Owen enforcing?","opts":["Two-person control","Least privilege","Separation of duties","Job rotation"],"ans":"C","expl":"This scenario describes separation of duties—not allowing the same person to hold two roles that, when combined, are sensitive. While two-person control is a similar concept, it does not apply in this case because the scenario does not say that either action requires the concurrence of two users. Least privilege says that an individual should have the minimum set of permissions necessary to carry out their work. Job rotation moves people through jobs on a periodic basis to deter fraud."},{"ch":"PT1","ch_name":"模拟卷 1","no":69,"type":"single","q":"Denise is preparing for a trial relating to a contract dispute between her company and a software vendor. The vendor is claiming that Denise made a verbal agreement that amended their written contract. What rule of evidence should Denise raise in her defense?","opts":["Real evidence rule","Best evidence rule","Parol evidence rule","Testimonial evidence rule"],"ans":"C","expl":"The parol evidence rule states that when an agreement between two parties is put into written form, it is assumed to be the entire agreement unless amended in writing. The best evidence rule says that a copy of a document is not admissible if the original document is available. Real evidence and testimonial evidence are evidence types, not rules of evidence."},{"ch":"PT1","ch_name":"模拟卷 1","no":70,"type":"single","q":"While Lauren is monitoring traffic on two ends of a network connection, she sees traffic that is inbound to a public IP address show up inside the production network. It is headed for an internal host with an RFC 1918 reserved destination address. What technology should she expect is in use at the network border?","opts":["NAT","VLANs","S/NAT","BGP"],"ans":"A","expl":"Network Address Translation (NAT) translates an internal address to an external address. VLANs are used to logically divide networks, BGP is a routing protocol, and S/NAT is a made-up term."},{"ch":"PT1","ch_name":"模拟卷 1","no":71,"type":"multi","q":"Which of the following statements about SSAE-18 are correct? (Select all that apply.)","opts":["It mandates a specific control set.","It is an attestation standard.","It is used for external audits.","It uses a framework, including SOC 1, SOC 2, and SOC 3 reports."],"ans":"BCD","expl":"SSAE-18 does not assert specific controls. Instead, it reviews the use and application of controls in an audited organization. It is an attestation standard, used for external audits, and forms part of the underlying framework for SOC 1, 2, and 3 reports."},{"ch":"PT1","ch_name":"模拟卷 1","no":72,"type":"single","q":"Elliott is using an asymmetric cryptosystem and would like to add a digital signature to a message. What key should he use to encrypt the message digest?","opts":["Elliott’s private key","Elliott’s public key","Recipient’s private key","Recipient’s public key"],"ans":"A","expl":"When creating a digital signature, the sender of a message always encrypts the mes-sage digest with their own private key. The recipient (or any third party) may then verify the digital signature by decrypting it with the sender’s public key and then comparing that decrypted signature with a message digest that the recipient computes themselves."},{"ch":"PT1","ch_name":"模拟卷 1","no":73,"type":"single","q":"Greg is building a disaster recovery plan for his organization and would like to determine the amount of time that it should take to restore a particular IT service after an outage. What variable is Greg calculating?","opts":["MTD","RTO","RPO","SLA"],"ans":"B","expl":"The recovery time objective (RTO) is the amount of time expected to return an IT ser-vice or component to operation after a failure. The maximum tolerable downtime (MTD) is the longest amount of time that an IT service or component may be unavailable without causing serious damage to the organization. The recovery point objective (RPO) identifies the maximum amount of data, measured in time, that may be lost during a recovery effort. Service-level agreements (SLAs) are written contracts that document service expectations."},{"ch":"PT1","ch_name":"模拟卷 1","no":74,"type":"single","q":"What business process typically requires sign-off from a manager before modifications are made to a system?","opts":["SDN","Release management","Change management","Versioning"],"ans":"C","expl":"Change management typically requires sign-off from a manager or supervisor before changes are made. This helps to ensure proper awareness and communication. SDN stands for software-defined networking, release management is the process that new software releases go through to be accepted, and versioning is used to differentiate versions of soft-ware, code, or other objects."},{"ch":"PT1","ch_name":"模拟卷 1","no":75,"type":"single","q":"Jen is selecting a fire suppression system for her organization’s data center and would like to narrow down the list of candidates. Which one of the following suppression systems would be LEAST appropriate for use?","opts":["Dry pipe","Wet pipe","Pre-action","FM-200"],"ans":"B","expl":"Wet pipe suppression systems have water present in the pipes at all times, posing an unac-ceptable level of risk for a data center containing electronics that might be damaged if a\npipe leaks. Dry pipe and pre-action systems only contain water when triggered in the event of a possible fire. FM-200 is a chemical suppressant commonly used in place of water in data centers."},{"ch":"PT1","ch_name":"模拟卷 1","no":76,"type":"single","q":"The company Chris works for has notifications posted at each door reminding employees to be careful to not allow people to enter when they do. Which type of control is this?","opts":["Detective","Physical","Preventive","Directive"],"ans":"D","expl":"Notifications and procedures like the signs posted at the company Chris works for are examples of directive access controls. Detective controls are designed to operate after the fact. The doors and the locks on them are examples of physical controls. Preventive controls are designed to stop an event and could also include the locks that are present on the doors."},{"ch":"PT1","ch_name":"模拟卷 1","no":77,"type":"multi","q":"Seth is designing the physical security controls for a new facility being constructed by his organization. He would like to deter attacks to the extent possible. Which of the following controls serve as deterrents? (Select all that apply.)","opts":["Motion detectors","Guard dogs","Mantraps","Lighting"],"ans":"BD","expl":"Deterrent controls seek to prevent an intruder from attempting an attack in the first place. Guard dogs have an intimidating presence that serves this purpose well. They do also serve to deny, detect, and delay intrusions depending upon their training. Lighting also deters attacks by making potential intrusions more visible, reducing the likelihood that an intruder will enter a well-lit area. Mantraps are intended to deny intruders access, rather than deter attempts. Motion detectors are intended to detect intruders rather than deter them."},{"ch":"PT1","ch_name":"模拟卷 1","no":78,"type":"single","q":"Thomas recently signed an agreement for a serverless computing environment where his organization’s developers will be able to write functions in Python and deploy them on the cloud provider’s servers for execution. The cloud provider will manage the servers. What term best describes this model?","opts":["SaaS","PaaS","IaaS","Containerization"],"ans":"B","expl":"This is an example of function as a service (FaaS) computing. However, FaaS is not listed as an answer choice, so you must also know that FaaS is a subcategory of platform as a ser-vice (PaaS) computing to answer this question correctly. This model does not necessarily take advantage of containerization. The cloud provider is managing the infrastructure and only making the platform available to customers, so it is not infrastructure as a service (IaaS). The customers are running their own code, so it is not software as a service (SaaS)."},{"ch":"PT1","ch_name":"模拟卷 1","no":79,"type":"multi","q":"An attacker has intercepted a large amount of data that was all encrypted with the same algorithm and encryption key. With no further information, which of the following cryptana-lytic attacks are possible? (Select all that apply.)\nFor questions 80–82, please refer to the following scenario:","opts":["Known plaintext","Chosen ciphertext","Frequency analysis","Brute-force"],"ans":"CD","expl":"The attacker may attempt to perform frequency analysis or a brute-force attack against the large volume of encrypted ciphertext. As the attacker does not have access to the plain-text information, a known plaintext attack is not possible. The attacker also does not have the ability to encrypt information, so they cannot use a chosen ciphertext attack."},{"ch":"PT1","ch_name":"模拟卷 1","no":83,"type":"single","q":"Robert is reviewing a system that has been assigned the EAL2 evaluation assurance level under the Common Criteria. What is the highest level of assurance that he may have about the system?","opts":["It has been functionally tested.","It has been structurally tested.","It has been formally verified, designed, and tested.","It has been semiformally designed and tested."],"ans":"B","expl":"EAL2 assurance applies when the system has been structurally tested. It is the second-to-lowest level of assurance under the Common Criteria."},{"ch":"PT1","ch_name":"模拟卷 1","no":84,"type":"single","q":"Adam is processing an access request for an end user. What two items should he verify before granting the access?","opts":["Separation and need to know","Clearance and endorsement","Clearance and need to know","Second factor and clearance"],"ans":"C","expl":"Before granting any user access to information, Adam should verify that the user has an appropriate security clearance as well as a business need to know the information\nin question."},{"ch":"PT1","ch_name":"模拟卷 1","no":85,"type":"single","q":"During what phase of the electronic discovery reference model does an organization ensure that potentially discoverable information is protected against alteration or deletion?","opts":["Identification","Preservation","Collection","Processing"],"ans":"B","expl":"During the preservation phase, the organization ensures that information related to the matter at hand is protected against intentional or unintentional alteration or deletion. The identification phase locates relevant information but does not preserve it. The collection phase occurs after preservation and gathers responsive information. The processing phase performs a rough cut of the collected information for relevance."},{"ch":"PT1","ch_name":"模拟卷 1","no":86,"type":"single","q":"Dana is selecting a hash function for use in her organization and would like to balance a concern for a cryptographically strong hash with the speed and efficiency of the algorithm. Which one of the following hash functions would best meet her needs?","opts":["MD5","RIPEMD","SHA-2","SHA-3"],"ans":"C","expl":"The original version of RIPEMD and the MD5hash algorithm have known vulnerabilities and should no longer be used. SHA-2 and SHA-3 are both considered secure today and pro-vide the same level of security. SHA-3 is, however, less efficient than SHA-2, making SHA-2 the better choice for Dana’s needs."},{"ch":"PT1","ch_name":"模拟卷 1","no":87,"type":"single","q":"Harry would like to access a document owned by Sally stored on a file server. Applying the subject/object model to this scenario, who or what is the object of the resource request?","opts":["Harry","Sally","File server","Document"],"ans":"D","expl":"In the subject/object model, the object is the resource being requested by a subject. In this example, Harry would like access to the document, making the document the object of the request."},{"ch":"PT1","ch_name":"模拟卷 1","no":88,"type":"single","q":"What is the process that occurs when the Session layer removes the header from data sent by the Transport layer?","opts":["Encapsulation","Packet unwrapping","De-encapsulation","Payloading"],"ans":"C","expl":"The process of removing a header (and possibly a footer) from the data received from a previous layer in the OSI model is known as de-encapsulation. Encapsulation occurs when the header and/or footer are added. Payloads are part of a virus or malware package that are delivered to a target, and packet unwrapping is a made-up term."},{"ch":"PT1","ch_name":"模拟卷 1","no":89,"type":"single","q":"Rob is reviewing his organization’s campus for physical security using the Crime Prevention Through Environmental Design (CPTED) framework. Which one of the following is NOT a strategy in this framework?","opts":["Natural intrusion detection","Natural access control","Natural surveillance","Natural territorial reinforcement"],"ans":"A","expl":"CPTED implements three strategies: natural access control, natural surveillance, and natural territorial reinforcement. Natural access control uses barricades and other physical elements to create a separation between secure and insecure spaces. Natural surveillance designs the environment to expose potential intruders to natural scrutiny by legitimate occu-pants. Natural territorial reinforcement uses fences, signs, and other elements to clearly define secure spaces. Natural intrusion detection is not an element of CPTED."},{"ch":"PT1","ch_name":"模拟卷 1","no":90,"type":"single","q":"What markup language uses the concepts of a requesting authority, a provisioning service point, and a provisioning service target to handle its core functionality?","opts":["SAML","SAMPL","SPML","XACML"],"ans":"C","expl":"Service Provisioning Markup Language (SPML) uses requesting authorities to issue SPML requests to a provisioning service point. Provisioning service targets are often user accounts and are required to be allowed unique identification of the data in its implementation. SAML is used for security assertions, SAMPL is an algebraic modeling language, and XACML is an access control markup language used to describe and process access control policies in an XML format."},{"ch":"PT1","ch_name":"模拟卷 1","no":91,"type":"single","q":"What type of risk assessment uses tools such as the one shown here?\n• Impact","opts":["Quantitative","Loss expectancy","Financial","Qualitative"],"ans":"D","expl":"The use of a probability/impact matrix is the hallmark of a qualitative risk assessment. It uses subjective measures of probability and impact, such as “high” and “low,” in place of quantitative measures."},{"ch":"PT1","ch_name":"模拟卷 1","no":92,"type":"single","q":"MAC models use three types of environments. Which of the following is not a mandatory access control design?","opts":["Hierarchical","Bracketed","Compartmentalized","Hybrid"],"ans":"B","expl":"Mandatory access control systems can be hierarchical, where each domain is ordered and related to other domains above and below it; compartmentalized, where there is no relation-ship between each domain; or hybrid, where both hierarchy and compartments are used. There is no concept of bracketing in mandatory access control design."},{"ch":"PT1","ch_name":"模拟卷 1","no":93,"type":"single","q":"Mandy is the team leader for a project team that includes six people. She would like to pro-vide those people with the ability to communicate privately, such that any pair of people can exchange communications that are not subject to interception by anyone else (team member or nonteam member). She is using an asymmetric encryption algorithm. How many keys are required to implement these requirements?","opts":["6","12","15","36"],"ans":"B","expl":"Asymmetric encryption algorithms require two keys per user, regardless of the number of participants. Therefore, this six-member team would require 12keys. If this team were to use symmetric cryptography, they would require (n*(n-1))/2, or (6*(6-1))/2 = 15keys."},{"ch":"PT1","ch_name":"模拟卷 1","no":94,"type":"single","q":"Sally is wiring a gigabit Ethernet network. What cabling choices should she make to ensure she can use her network at the full 1000 Mbps she wants to provide to her users?","opts":["Cat 5 and Cat 6","Cat 5e and Cat 6","Cat 4e and Cat 5e","Cat 6 and Cat 7"],"ans":"B","expl":"Category 5e and Category 6 UTP cable are both rated to 1000Mbps. Cat 5 (not Cat 5e) is only rated to 100Mbps, whereas Cat 7 is rated to 10Gbps. There is no Cat 4e."},{"ch":"PT1","ch_name":"模拟卷 1","no":95,"type":"single","q":"Ursula is seeking to expand the reach and scalability of her organization’s website. She would like to position copies of her data around the world in locations close to website visitors to reduce loading time and the burden on her servers. What type of cloud service would best meet her needs?","opts":["IaaS","Containerization","CDN","SaaS"],"ans":"C","expl":"While Ursula may use a variety of different options to meet her needs, the best approach would be the use of a content delivery network (CDN). CDNs are specifically designed for this role, distributing content to many remote endpoints where it may be quickly loaded by local users."},{"ch":"PT1","ch_name":"模拟卷 1","no":96,"type":"single","q":"Robert is the network administrator for a small business and recently installed a new firewall. After seeing signs of unusually heavy network traffic, he checked his intrusion detection system, which reported that a smurf attack was underway. What firewall configuration change can Robert make to most effectively prevent this attack?","opts":["Block the source IP address of the attack.","Block inbound UDP traffic.","Block the destination IP address of the attack.","Block inbound ICMP traffic."],"ans":"D","expl":"Smurf attacks use a distributed attack approach to send ICMP echo replies at a targeted system from many different source addresses. The most effective way to block this attack would be to block inbound ICMP traffic. Blocking the source addresses is not feasible because the attacker would likely simply change the source addresses. Blocking destina-tion addresses would likely disrupt normal activity. The smurf attack does not use UDP, so blocking that traffic would have no effect."},{"ch":"PT1","ch_name":"模拟卷 1","no":97,"type":"single","q":"Which one of the following types of firewalls does not have the ability to track connection status between different packets?","opts":["Stateful inspection","Application proxy","Packet filter","Next generation"],"ans":"C","expl":"Static packet filtering firewalls are known as first-generation firewalls and do not track connection state. Stateful inspection, application proxying, and next-generation firewalls all add connection state tracking capability."},{"ch":"PT1","ch_name":"模拟卷 1","no":98,"type":"single","q":"Frances is concerned that equipment failures within her organization’s servers will lead to a loss of power to those servers. Which one of the following controls would best address this risk?","opts":["Redundant power sources","Backup generators","Dual power supplies","Uninterruptible power supplies"],"ans":"C","expl":"All of these controls serve to increase the reliability of power to a server. However, only dual power supplies address hardware issues that arise within the server, allowing the server to continue operation if one of the power supplies fails. Redundant power sources, backup generators, and uninterruptible power supplies (UPS) are designed to increase the reliability of power flowing to the server."},{"ch":"PT1","ch_name":"模拟卷 1","no":99,"type":"multi","q":"Peter is reviewing the remote access technologies used by his organization and would like to eliminate the use of any techniques that do not include built-in encryption. Which of the fol-lowing approaches should he retain? (Select all that apply.)","opts":["RDP","Telnet","SSH","Dial-up"],"ans":"AC","expl":"The Remote Desktop Protocol (RDP) and Secure Shell (SSH) are modern approaches to remote access that include encryption features. Telnet and dial-up are outdated approaches that do not provide encryption and should not be relied upon for secure access."},{"ch":"PT1","ch_name":"模拟卷 1","no":100,"type":"single","q":"Matthew is experiencing issues with the quality of network service on his organization’s network. The primary symptom is that packets are occasionally taking too long to travel from their source to their destination. The length of this delay changes for individual packets. What term describes the issue Matthew is facing?","opts":["Latency","Jitter","Packet loss","Interference"],"ans":"B","expl":"Latency is a delay in the delivery of packets from their source to their destination. Jitter is a variation in the latency for different packets. Packet loss is the disappearance of packets in transit that requires retransmission. Interference is electrical noise or other disruptions that corrupt the contents of packets."},{"ch":"PT1","ch_name":"模拟卷 1","no":101,"type":"multi","q":"Gavin is an internal auditor working to assess his organization’s cybersecurity posture. Which of the following would be appropriate recipients of the reports he generates from his work? (Select all that apply.)","opts":["Managers","Individual contributors","Suppliers","Board members"],"ans":"ABD","expl":"It is entirely appropriate to distribute internal audit reports to anyone in the orga-nization who has a valid need to know. This may include both management and individual contributors responsible for remediating issues as well as board members charged with oversight. It would not normally be appropriate to distribute internal audit reports to external entities, such as suppliers and customers."},{"ch":"PT1","ch_name":"模拟卷 1","no":102,"type":"single","q":"Kim is conducting testing of a web application developed by her organization and would like to ensure that it is accessible from all commonly used web browsers. What type of testing should she conduct?","opts":["Regression testing","Interface testing","Fuzzing","White-box testing"],"ans":"B","expl":"Web applications communicate with web browsers via an interface, making interface testing the best answer here. Regression testing might be used as part of the interface test but is too specific to be the best answer. Similarly, the test might be a white-box, or full knowledge, test, but interface testing better describes this specific example. Fuzzing is less likely as part of a browser compatibility test, as it tests unexpected inputs, rather than functionality."},{"ch":"PT1","ch_name":"模拟卷 1","no":103,"type":"single","q":"Kathleen is implementing an access control system for her organization and builds the following array:\n• Reviewers: update files, delete files Submitters: upload files\n• Editors: upload files, update files Archivists: delete files\n• What type of access control system has Kathleen implemented?","opts":["Role-based access control","Task-based access control","Rule-based access control","Discretionary access control"],"ans":"A","expl":"Role-based access control gives each user an array of permissions based on their posi-tion in the organization, such as the scheme shown here. Task-based access control is not a standard approach. Rule-based access controls use rules that apply to all subjects, which\nisn’t something we see in the list. Discretionary access control gives object owners rights to choose how the objects they own are accessed, which is not what this list shows."},{"ch":"PT1","ch_name":"模拟卷 1","no":104,"type":"single","q":"Alan is installing a fire suppression system that will activate after a fire breaks out and protect the equipment in the data center from extensive damage. What metric is Alan attempting to lower?","opts":["Likelihood","RTO","RPO","Impact"],"ans":"D","expl":"Fire suppression systems do not stop a fire from occurring but do reduce the damage that fires cause. This is an example of reducing risk by lowering the impact of an event."},{"ch":"PT1","ch_name":"模拟卷 1","no":105,"type":"single","q":"Alan’s Wrenches recently developed a new manufacturing process for its product. They plan to use this technology internally and not share it with others. They would like it to remain protected for as long as possible. What type of intellectual property protection is best suited for this situation?","opts":["Patent","Copyright","Trademark","Trade secret"],"ans":"D","expl":"Patents and trade secrets can both protect intellectual property in the form of a process. Patents require public disclosure and have expiration dates while trade secrets remain in force for as long as they remain secret. Therefore, trade secret protection most closely aligns with the company’s goals."},{"ch":"PT1","ch_name":"模拟卷 1","no":106,"type":"single","q":"Ben wants to interface with the National Vulnerability Database using a standardized pro-tocol. What option should he use to ensure that the tools he builds work with the data contained in the NVD?","opts":["XACML","SCML","VSML","SCAP"],"ans":"D","expl":"The Security Content Automation Protocol (SCAP) is a suite of specifications used to handle vulnerability and security configuration information. The National Vulnerability Database provided by NIST uses SCAP. XACML is the eXtensible Access Control Markup Language, an OASIS standard used for access control decisions, and neither VSML nor SCML is an industry term."},{"ch":"PT1","ch_name":"模拟卷 1","no":107,"type":"single","q":"Ron’s organization does not have the resources to conduct penetration testing that uses time-intensive manual techniques, but he would like to achieve some of the benefits of pen-etration testing. Which one of the following techniques could he engage in that requires the least manual effort?","opts":["White-box testing","Black-box testing","Gray-box testing","Breach and attack simulation"],"ans":"D","expl":"Breach and attack simulation (BAS) platforms are intended to automate some aspects of penetration testing. These systems are designed to inject threat indicators onto systems and networks in an effort to trigger other security controls. White-box, gray-box, and black-box testing all involve more significant manual effort."},{"ch":"PT1","ch_name":"模拟卷 1","no":108,"type":"single","q":"In the figure shown here, Harry’s request to read the data file is blocked. Harry has a Secret security clearance, and the data file has a Top Secret classification. What principle of the Bell–LaPadula model blocked this request?\n• Read Request","opts":["Simple Security Property","Simple Integrity Property","*-Security Property","Discretionary Security Property"],"ans":"A","expl":"The Simple Security Property prevents an individual from reading information at a higher security level than his or her clearance allows. This is also known as the “no read up” rule. The Simple Integrity Property says that a user can’t write data to a higher integ-rity level than their own. The *-Security Property says that users can’t write data to a lower security level than their own. The Discretionary Security Property allows the use of a matrix to determine access permissions."},{"ch":"PT1","ch_name":"模拟卷 1","no":110,"type":"single","q":"Kolin is searching for a network security solution that will allow him to help reduce zero-day attacks while using identities to enforce a security policy on systems before they con-nect to the network. What type of solution should Kolin implement?","opts":["A firewall","A NAC system","An intrusion detection system","Port security"],"ans":"B","expl":"Network Access Control (NAC) systems can be used to authenticate users and then val-idate their system’s compliance with a security standard before they are allowed to connect to the network. Enforcing security profiles can help reduce zero-day attacks, making NAC a useful solution. A firewall can’t enforce system security policies, whereas an IDS can only monitor for attacks and alarm when they happen. Thus, neither a firewall nor an IDS meets Kolin’s needs. Finally, port security is a MAC address-based security feature that can only restrict which systems or devices can connect to a given port."},{"ch":"PT1","ch_name":"模拟卷 1","no":111,"type":"single","q":"Gwen comes across an application that is running under a service account on a web server. The service account has full administrative rights to the server. What principle of information security does this violate?","opts":["Need to know","Separation of duties","Least privilege","Job rotation"],"ans":"C","expl":"This scenario violates the least privilege principle because an application should never require full administrative rights to run. Gwen should update the service account to have only the privileges necessary to support the application."},{"ch":"PT1","ch_name":"模拟卷 1","no":112,"type":"multi","q":"Ed is developing a set of key performance and risk indicators for his organization’s information security program. Which of the following are commonly used indicators? (Select all that apply.)","opts":["Number of scheduled audits","Time to resolve vulnerabilities","Number of malicious site visit attempts","Number of account compromises"],"ans":"BCD","expl":"Organizations typically use the time to resolve vulnerabilities, the number of account compromises, and the number of attempts by users to visit malicious sites as indi-cators. The number of scheduled audits is not normally a measure of the performance of an\ninformation security team. A more appropriate indicator in this area is the number of repeat audit findings."},{"ch":"PT1","ch_name":"模拟卷 1","no":113,"type":"single","q":"Kara is documenting the results of a vulnerability scan. After reviewing one finding, she determined that the vulnerability did exist. The team then implemented a configuration change that corrected the issue. How should Kara classify this vulnerability in her report?\nFor questions 114–116, please refer to the following scenario:","opts":["True positive","True negative","False positive","False negative"],"ans":"A","expl":"This is a true positive report because the scan detected the vulnerability and the vulner-ability actually existed. The fact that the team later remediated the vulnerability could be noted in the report, but it does not change the result of the scan or its classification. True negatives occur when scans correctly note the absence of a vulnerability. False positives occur when scans report the presence of a vulnerability that does not actually exist. False negatives occur when scans report that no vulnerability exists when one does, in fact, exist."},{"ch":"PT1","ch_name":"模拟卷 1","no":117,"type":"single","q":"Who would be the most appropriate supervisor for an organization’s chief audit executive (CAE)?","opts":["CIO","CISO","CEO","CFO"],"ans":"C","expl":"The chief audit executive (CAE) should report to the most senior possible leader to avoid conflicts of interest. Of the choices provided, the chief executive officer (CEO) is the most senior position and the best option. It is also possible to provide an added degree of independence by having the CAE report to the board of directors, either as a primary reporting line or as a dotted line relationship."},{"ch":"PT1","ch_name":"模拟卷 1","no":118,"type":"single","q":"Ursula believes that many individuals in her organization are storing sensitive information on their laptops in a manner that is unsafe and potentially violates the organization’s secu-rity policy. What control can she use to identify the presence of these files?","opts":["Network DLP","Network IPS","Endpoint DLP","Endpoint IPS"],"ans":"C","expl":"Data loss prevention (DLP) systems specialize in the identification of sensitive information. In this case, Ursula would like to identify the presence of this information on endpoint devices, so she should choose an endpoint DLP control. Network-based DLP\nwould not detect stored information unless the user transmits it over the network. Intrusion prevention systems (IPSs) are designed to detect and block attacks in progress, not neces-sarily the presence of sensitive information."},{"ch":"PT1","ch_name":"模拟卷 1","no":119,"type":"single","q":"In what cloud computing model does the customer build a cloud computing environment in his or her own data center or build an environment in another data center that is for the customer’s exclusive use?","opts":["Public cloud","Private cloud","Hybrid cloud","Shared cloud"],"ans":"B","expl":"In the private cloud computing model, the cloud computing environment is dedicated to a single organization and does not follow the shared tenancy model. The environment may be built by the company in its own data center or built by a vendor at a co-location site."},{"ch":"PT1","ch_name":"模拟卷 1","no":120,"type":"single","q":"Which one of the following technologies is designed to prevent a web server going offline from becoming a single point of failure in a web application architecture?","opts":["Load balancing","Dual-power supplies","IPS","RAID"],"ans":"A","expl":"Load balancing helps to ensure that a failed server will not take a website or service offline. Dual power supplies only work to prevent failure of a power supply or power source. IPS can help to prevent attacks, and RAID can help prevent a disk failure from taking a system offline."},{"ch":"PT1","ch_name":"模拟卷 1","no":121,"type":"single","q":"Alice wants to send Bob a message with the confidence that Bob will know the message was not altered while in transit. What security goal is Alice trying to achieve?","opts":["Confidentiality","Nonrepudiation","Authentication","Integrity"],"ans":"D","expl":"Integrity ensures that unauthorized changes are not made to data while stored or in transit."},{"ch":"PT1","ch_name":"模拟卷 1","no":123,"type":"single","q":"Monica is developing a software application that calculates an individual’s body mass index for use in medical planning. She would like to include a control on the field where the physician enters an individual’s weight to ensure that the weight falls within an expected range. What type of control should Monica use?","opts":["Fail open","Fail secure","Limit check","Buffer bounds"],"ans":"C","expl":"Input validation ensures that the data provided to a program as input matches the expected parameters. Limit checks are a special form of input validation that ensure that the value remains within an expected range, as is the case described in this scenario. Fail open and fail secure are options when planning for possible system failures. Buffer bounds are not a type of software control."},{"ch":"PT2","ch_name":"模拟卷 2","no":1,"type":"single","q":"James is building a disaster recovery plan for his organization and would like to determine the amount of acceptable data loss after an outage. What variable is James determining?","opts":["SLA","RTO","MTD","RPO"],"ans":"D","expl":"The recovery point objective (RPO) identifies the maximum amount of data, measured in time, that may be lost during a recovery effort. The recovery time objective (RTO) is the amount of time expected to return an IT service or component to operation after a failure.\nThe maximum tolerable downtime (MTD) is the longest amount of time that an IT service or component may be unavailable without causing serious damage to the organization. Service-level agreements (SLAs) are written contracts that document service expectations."},{"ch":"PT2","ch_name":"模拟卷 2","no":2,"type":"single","q":"In his role, Chris is expected to protect the interests of the organization, and the customers whose information he is charged to protect. What term describes the preparation and research undertaken before decisions and actions are made?","opts":["Due care","Compliance","Due diligence","Regulatory action"],"ans":"C","expl":"Due care and due diligence can be a confusing pair of terms to keep straight. Chris is engaging in due diligence when he does the preparation and research. Once that is done, he must use due care while undertaking the actions. This is often described in the context of the prudent person rule: would a prudent person have taken the action given the same knowledge?"},{"ch":"PT2","ch_name":"模拟卷 2","no":3,"type":"single","q":"Alex is preparing to solicit bids for a penetration test of his company’s network and systems. He wants to maximize the effectiveness of the testing rather than the realism of the test. What type of penetration test should he require in his bidding process?","opts":["Black box","White box","Gray box","Zero box"],"ans":"B","expl":"White-box testing provides the tester with information about networks, systems, and con-figurations, allowing highly effective testing. It doesn’t simulate an actual attack like black-and gray-box testing can and thus does not have the same realism, and it can lead to attacks succeeding that would fail in a zero- or limited-knowledge attack."},{"ch":"PT2","ch_name":"模拟卷 2","no":4,"type":"single","q":"Application banner information is typically recorded during what penetration testing phase?","opts":["Planning","Attack","Reporting","Discovery"],"ans":"D","expl":"The discovery phase includes activities such as gathering IP addresses, network ranges, and hostnames, as well as gathering information about employees, locations, systems, and, of course, the services those systems provide. Banner information is typically gathered as part of discovery to provide information about what version and type of service is being provided."},{"ch":"PT2","ch_name":"模拟卷 2","no":5,"type":"single","q":"Tony wants to conduct a disaster recovery plan test exercise for his organization. What type of exercise should he conduct if he wants it to be the most realistic event possible and is able to disrupt his organization’s operations to conduct the exercise?","opts":["Read-through","Full interruption","Walk-through","Simulation"],"ans":"B","expl":"The most realistic but also most disruptive option for disaster recovery plan testing is a full interruption. The least obtrusive but also least similar to real-world scenarios is a read-through. After that, walk-throughs and simulations are each closer to a true scenario, but parallel operations is often the most popular option because it can be done without disrupt-ing the organization and still reasonably test capabilities."},{"ch":"PT2","ch_name":"模拟卷 2","no":7,"type":"single","q":"Ben works in an organization that uses a formal data governance program. He is consulting with an employee working on a project that created an entirely new class of data and wants to work with the appropriate individual to assign a classification level to that information. Who is responsible for the assignment of information to a classification level?","opts":["Data creator","Data owner","CISO","Data custodian"],"ans":"B","expl":"The data owner is normally responsible for classifying information at an appropriate level. This role is typically filled by a senior manager or director, who then delegates operational responsibility to a data custodian."},{"ch":"PT2","ch_name":"模拟卷 2","no":8,"type":"single","q":"James wants to ensure that his company’s backups will survive a disaster that strikes the data center. Which of the following options is the best solution to this concern?","opts":["Off-site backups","A grandfather/father/son backup tiering system","Redundant backup systems","Snapshots to a SAN or NAS"],"ans":"A","expl":"Off-site backups are the best option for disaster recovery in a scenario where a disaster directly impacts the data center. None of the other scenarios as described will directly address the issue, although snapshots to a remote storage location can act as a form of\noff-site backup."},{"ch":"PT2","ch_name":"模拟卷 2","no":9,"type":"single","q":"Gabe is concerned about the security of passwords used as a cornerstone of his organiza-tion’s information security program. Which one of the following controls would provide the greatest improvement in Gabe’s ability to authenticate users?","opts":["More complex passwords","User education against social engineering","Multifactor authentication","Addition of security questions based on personal knowledge"],"ans":"C","expl":"While all of the listed controls would improve authentication security, most simply strengthen the use of knowledge-based authentication. The best way to improve the authen-tication process would be to add a factor not based on knowledge through the use of multifactor authentication. This may include the use of biometric controls or token-based authentication."},{"ch":"PT2","ch_name":"模拟卷 2","no":10,"type":"single","q":"The separation of network infrastructure from the control layer, combined with the ability to centrally program a network design in a vendor-neutral, standards-based implementation, is an example of what important concept?","opts":["MPLS, a way to replace long network addresses with shorter labels and support a wide range of protocols","FCoE, a converged protocol that allows common applications over Ethernet","SDN, a converged protocol that allows network virtualization","CDN, a converged protocol that makes common network designs accessible"],"ans":"C","expl":"Software-defined networking (SDN) is a converged protocol that allows virtualization concepts and practices to be applied to networks. MPLS handles a wide range of protocols like ATM, DSL, and others, but isn’t intended to provide the centralization capabilities that SDN does. A content distribution network (CDN) is not a converged protocol, and FCoE is Fibre Channel over Ethernet, a converged protocol for storage."},{"ch":"PT2","ch_name":"模拟卷 2","no":11,"type":"single","q":"Susan is preparing to decommission her organization’s archival DVD-ROMs that contain Top Secret data. How should she ensure that the data cannot be exposed?","opts":["Degauss","Zero wipe","Pulverize","Secure erase"],"ans":"C","expl":"The best way to ensure that data on DVDs is fully gone is to destroy them, and pul-verizing DVDs is an appropriate means of destruction. DVD-ROMs are write-only media, meaning that secure erase and zero wipes won’t work. Degaussing only works on magnetic media and cannot guarantee that there will be zero data remanence."},{"ch":"PT2","ch_name":"模拟卷 2","no":12,"type":"single","q":"Susan is worried about a complex change and wants to ensure that the organization can recover if the change does not go as planned. What should she require in her role on the organization’s change advisory board (CAB)?","opts":["She should reject the change due to risk.","She should require a second change review.","She should ensure a backout plan exists.","She should ensure a failover plan exists."],"ans":"C","expl":"Backout plans are required in some change management processes to ensure that the thought process and procedures for what to do if something does not go as planned are needed. Validating backout plan quality can be just as important as the change, and you may find, in many organizations, if nobody is watching that backout plans may read, “Undo the change we made.” Rejecting the change won’t fix the problem if the change has been made.\nChange review is useful to identify problems before the change is made. Failover plans are not a term commonly used in change management processes."},{"ch":"PT2","ch_name":"模拟卷 2","no":13,"type":"single","q":"Angie is configuring egress monitoring on her network to provide added security. Which one of the following packet types should Angie allow to leave the network headed for the internet?","opts":["Packets with a source address from Angie’s public IP address block","Packets with a destination address from Angie’s public IP address block","Packets with a source address outside Angie’s address block","Packets with a source address from Angie’s private address block"],"ans":"A","expl":"All packets leaving Angie’s network should have a source address from her public IP address block. Packets with a destination address from Angie’s network should not be leav-ing the network. Packets with source addresses from other networks are likely spoofed and should be blocked by egress filters. Packets with private IP addresses as sources or destina-tions should never be routed onto the internet."},{"ch":"PT2","ch_name":"模拟卷 2","no":14,"type":"single","q":"Matt is conducting a penetration test against a Linux server and successfully gained access to an administrative account. He would now like to obtain the password hashes for use in a brute-force attack. Where is he likely to find the hashes, assuming the system is configured to modern security standards?","opts":["/etc/passwd","/etc/hash","/etc/secure","/etc/shadow"],"ans":"D","expl":"Security best practices dictate the use of shadowed password files that move the password hashes from the widely accessible /etc/passwd file to the more restricted /etc/ shadow file."},{"ch":"PT2","ch_name":"模拟卷 2","no":15,"type":"single","q":"Theresa is implementing a new access control system and wants to ensure that developers do not have the ability to move code from development systems into the production environ-ment. She wants to ensure that a developer who checks in code cannot then approve their own code as part of the process. What information security principle is she most directly enforcing?","opts":["Separation of duties","Two-person control","Least privilege","Job rotation"],"ans":"A","expl":"While developers may feel like they have a business need to be able to move code into production, the principle of separation of duties dictates that they should not have the ability to both write code and place it on a production server. The deployment of code is often per-formed by change management staff."},{"ch":"PT2","ch_name":"模拟卷 2","no":16,"type":"single","q":"Which one of the following tools may be used to achieve the goal of nonrepudiation?","opts":["Digital signature","Symmetric encryption","Firewall","IDS"],"ans":"A","expl":"Applying a digital signature to a message allows the sender to achieve the goal of nonre-pudiation. This allows the recipient of a message to prove to a third party that the message came from the purported sender. Symmetric encryption does not support nonrepudiation. Firewalls and IDS are network security tools that are not used to provide nonrepudiation."},{"ch":"PT2","ch_name":"模拟卷 2","no":18,"type":"single","q":"What RADIUS alternative is commonly used for Cisco network gear and supports two-factor authentication?","opts":["RADIUS+","TACACS+","XTACACS","Kerberos"],"ans":"B","expl":"TACACS+ is the most modern version of TACACS, the Terminal Access Controller Access-Control System. It is a Cisco proprietary protocol with added features beyond what RADIUS provides, meaning it is commonly used on Cisco networks. XTACACS is an earlier version, Kerberos is a network authentication protocol rather than a remote user authentication pro-tocol, and RADIUS+ is a made-up term."},{"ch":"PT2","ch_name":"模拟卷 2","no":19,"type":"single","q":"What two types of attacks are VoIP call managers and VoIP phones most likely to be sus-ceptible to?","opts":["DoS and malware","Worms and Trojans","DoS and host OS attacks","Host OS attacks and buffer overflows"],"ans":"C","expl":"Call managers and VoIP phones can be thought of as servers or appliances and embedded or network devices. That means that the most likely threats that they will face are denial-of-service (DoS) attacks and attacks against the host operating system. Malware and Trojans are less likely to be effective against a server or embedded system that doesn’t browse the internet or exchange data files; buffer overflows are usually aimed at specific applications or services."},{"ch":"PT2","ch_name":"模拟卷 2","no":20,"type":"single","q":"Vivian works for a chain of retail stores and would like to use a software product that restricts the software used on point-of-sale terminals to those packages on a preapproved list. What approach should Vivian use?\nFor questions 21–23, please refer to the following scenario:","opts":["Antivirus","Heuristic","Whitelist","Blacklist"],"ans":"C","expl":"The blacklist approach to application control blocks certain prohibited packages but allows the installation of other software on systems. The whitelist approach uses the reverse philosophy and only allows approved software. It is worth noting that the terms blacklist and whitelist are increasingly deprecated and that you may encounter terms like block list or deny list and allow list as language and terminology shifts. As you prepare for the exam and your professional work, make sure to consider these equivalents. Antivirus software would only detect the installation of malicious software after the fact. Heuristic detection is a variant of antivirus software."},{"ch":"PT2","ch_name":"模拟卷 2","no":21,"type":"single","q":"Based on the information in this scenario, what is the exposure factor for the effect of a flood on DataTech’s data center?","opts":["2 percent","20 percent","100 percent","200 percent"],"ans":"B","expl":"The exposure factor is the percentage of the facility that risk managers expect will be damaged if a risk materializes. It is calculated by dividing the amount of damage by the asset\nvalue. In this case, that is $20 million in damage divided by the $100 million facility value, or 20 percent.","scene":"Hunter is the facilities manager for DataTech, a large data center management firm. He is evaluating the installation of a flood prevention system at one of DataTech’s facilities. The facility and contents are valued at $100 million. Installing the new flood prevention system would cost $10 million. Hunter consulted with flood experts and determined that the facility lies within a 200-year flood plain and that, if a flood occurred, it would likely cause $20 million in damage to the facility."},{"ch":"PT2","ch_name":"模拟卷 2","no":22,"type":"single","q":"Based on the information in this scenario, what is the annualized rate of occurrence for a flood at DataTech’s data center?","opts":["0.002","0.005","0.02","0.05"],"ans":"B","expl":"The annualized rate of occurrence is the number of times each year that risk analysts expect a risk to happen in any given year. In this case, the analysts expect floods once every 200 years, or 0.005 times per year.","scene":"Hunter is the facilities manager for DataTech, a large data center management firm. He is evaluating the installation of a flood prevention system at one of DataTech’s facilities. The facility and contents are valued at $100 million. Installing the new flood prevention system would cost $10 million. Hunter consulted with flood experts and determined that the facility lies within a 200-year flood plain and that, if a flood occurred, it would likely cause $20 million in damage to the facility."},{"ch":"PT2","ch_name":"模拟卷 2","no":23,"type":"single","q":"Based on the information in this scenario, what is the annualized loss expectancy for a flood at DataTech’s data center?","opts":["$40,000","$100,000","$400,000","$1,000,000"],"ans":"B","expl":"The annualized loss expectancy is calculated by multiplying the single loss expectancy (SLE) by the annualized rate of occurrence (ARO). In this case, the SLE is $20 million, and the ARO is 0.005. Multiplying these numbers together gives you the ALE of $100,000.","scene":"Hunter is the facilities manager for DataTech, a large data center management firm. He is evaluating the installation of a flood prevention system at one of DataTech’s facilities. The facility and contents are valued at $100 million. Installing the new flood prevention system would cost $10 million. Hunter consulted with flood experts and determined that the facility lies within a 200-year flood plain and that, if a flood occurred, it would likely cause $20 million in damage to the facility."},{"ch":"PT2","ch_name":"模拟卷 2","no":24,"type":"single","q":"Which accounts are typically assessed during an account management assessment?","opts":["A random sample","Highly privileged accounts","Recently generated accounts","Accounts that have existed for long periods of time"],"ans":"B","expl":"The most frequent target of account management reviews are highly privileged accounts, as they create the greatest risk. Random samples are the second most likely choice. Accounts that have existed for a longer period of time are more likely to have a problem due to privi-lege creep than recently created accounts, but neither of these choices is likely unless there is a specific organizational reason to choose them."},{"ch":"PT2","ch_name":"模拟卷 2","no":26,"type":"single","q":"What type of error occurs when a valid subject using a biometric authenticator is not authenticated?","opts":["A Type 1 error","A Type 2 error","A Type 3 error","A Type 4 error"],"ans":"A","expl":"Type 1 errors occur when a valid subject is not authenticated. Type 2 errors occur when an invalid subject is incorrectly authenticated. Type 3 and Type 4 errors are not associated with biometric authentication."},{"ch":"PT2","ch_name":"模拟卷 2","no":27,"type":"single","q":"An emergency button under the desk is a common example of what type of physical security system?","opts":["An airgap button","A keylogger","A pushbutton lock","A duress system"],"ans":"D","expl":"Duress systems are intended to allow employees to notify security or others when they are in a dangerous situation or when they need help. Duress systems may be as simple as a push button and as complex as a code word or digital system that allows specific entries to trigger alarms while still performing a desired or deceptive but real-appearing action."},{"ch":"PT2","ch_name":"模拟卷 2","no":29,"type":"single","q":"George is assisting a prosecutor with a case against a hacker who attempted to break into the computer systems at George’s company. He provides system logs to the prosecutor for use as evidence, but the prosecutor insists that George testify in court about how he gathered the logs. What rule of evidence requires George’s testimony?","opts":["Testimonial evidence rule","Parol evidence rule","Best evidence rule","Hearsay rule"],"ans":"D","expl":"The hearsay rule says that a witness cannot testify about what someone else told them, except under very specific exceptions. The courts have applied the hearsay rule to include the concept that attorneys may not introduce logs into evidence unless they are authenticated\nby the system administrator. In this question, scenario George might also be able to provide a sworn affidavit, but the question doesn’t include that option. The best evidence rule states that copies of documents may not be submitted into evidence if the originals are available. The parol evidence rule states that if two parties enter into a written agreement, that written document is assumed to contain all of the terms of the agreement. Testimonial evidence is a type of evidence, not a rule of evidence."},{"ch":"PT2","ch_name":"模拟卷 2","no":30,"type":"single","q":"Which of the following is not a valid use for key risk indicators (KRIs)?","opts":["Provide warnings before issues occur.","Provide real-time incident response information.","Provide historical views of past incidents.","Provide insight into risk tolerance for the organization."],"ans":"B","expl":"While key risk indicators can provide useful information for organizational planning and a deeper understanding of how organizations view risk, KRIs are not a great way to handle a real-time security response. Monitoring and detection systems like IPS, SIEM, and other tools are better suited to handling actual attacks."},{"ch":"PT2","ch_name":"模拟卷 2","no":31,"type":"single","q":"Which one of the following malware types uses built-in propagation mechanisms that exploit system vulnerabilities to spread?","opts":["Trojan horse","Worm","Logic bomb","Virus"],"ans":"B","expl":"Worms have built-in propagation mechanisms that do not require user interaction, such as scanning for systems containing known vulnerabilities and then exploiting those vulnera-bilities to gain access. Viruses and Trojan horses typically require user interaction to spread. Logic bombs do not spread from system to system but lie in wait until certain conditions are met, triggering the delivery of their payload."},{"ch":"PT2","ch_name":"模拟卷 2","no":32,"type":"single","q":"As part of your company’s security team, you have been asked to advise on how to ensure that media is not improperly used or stored. What solution will help staff members in your organization to handle media appropriately?","opts":["Labeling with sensitivity levels","Encrypting the sensitive media","Dual control media systems","A clear desk policy"],"ans":"A","expl":"As simple as the answer may seem, labeling media or even color coding it with sensitivity levels and ensuring staff are appropriately trained on what the levels mean will normally have the biggest impact. Encrypting media can help, but without the labels, files may be stored on inappropriate media. A clear desk policy can help if casual media theft is an issue but is not likely to be an important control in this scenario. Dual control is used to ensure that a task cannot be performed by a single staff member to avoid malfeasance and is not directly useful here."},{"ch":"PT2","ch_name":"模拟卷 2","no":33,"type":"single","q":"Alaina wants to use a broadly adopted threat modeling framework for her organization’s threat intelligence efforts. Which of the following would you advise her to adopt if she wants\n• to use pre-existing tools to help her threat modeling team integrate both internally created intelligence and external threat feed data?","opts":["The Diamond Model of Intrusion Analysis","ATT&CK","Microsoft’s Threat-JUMP modeling system","Threat-EN"],"ans":"B","expl":"MITRE’s ATT&CK framework is broadly adopted by threat modeling and threat intel-ligence organizations and is used as a default model in many software packages and tools. The Diamond Model specifically addresses how to think about intrusions but does not address broader threats, and the other answers were made up for this question."},{"ch":"PT2","ch_name":"模拟卷 2","no":34,"type":"single","q":"Which one of the following is not a principle of the Agile approach to software development?","opts":["The most efficient method of conveying information is electronic.","Working software is the primary measure of progress.","Simplicity is essential.","Businesspeople and developers must work together daily."],"ans":"A","expl":"The Agile approach to software development states that working software is the primary measure of progress, that simplicity is essential, and that businesspeople and developers must work together daily. It also states that the most efficient method of conveying information is face to face, not electronic."},{"ch":"PT2","ch_name":"模拟卷 2","no":35,"type":"single","q":"Harry is concerned that accountants within his organization will modify data to cover up fraudulent activity in accounts that they normally access. Which one of the following con-trols would best defend against this type of attack?","opts":["Encryption","Access controls","Integrity verification","Firewalls"],"ans":"C","expl":"Encryption, access controls, and firewalls would not be effective in this example because the accountants have legitimate access to the data. Integrity verification software would protect against this attack by identifying unexpected changes in protected data."},{"ch":"PT2","ch_name":"模拟卷 2","no":36,"type":"single","q":"Ben wants to use the concept of crime prevention through environmental design to help secure his facility. Which of the following is not a common example of this design con-cept in use?","opts":["Mounting cameras in full view to act as a deterrent","Limiting the size of planters to avoid having them used to hide behind","Locating data centers at the edge of the building to enhance security","Making delivery access driveways and entrances less visible to the public"],"ans":"C","expl":"Crime prevention through environmental design (CPTED) focuses on making crime less likely due to design elements. Data centers are often placed near the core of a building to make them easier to secure and less likely to be impacted by natural disasters or accidents. Mounting cameras where they can be seen, avoiding the creation of easy hiding places, and keeping delivery areas less visible and thus less attractive to access are all common techniques used in CPTED."},{"ch":"PT2","ch_name":"模拟卷 2","no":37,"type":"single","q":"Meena wants to ensure that her supply chain risks are well managed. Which of the fol-lowing is not a common practice she should include in her supply chain risk management (SCRM) plan?\nUsing the following table and your knowledge of the auditing process, answer ques-tions 38–40.","opts":["Use contractual controls such as insurance and liability limitations where appropriate.","Sole source to provide vendor stability.","Ensure multiple suppliers exist for critical components.","Validate the financial stability of potential suppliers."],"ans":"B","expl":"Sole sourcing can create additional fragility in supply chains due to reliance on a single supplier. Contractual controls including requirements for supplier insurance and liability limitations, having multiple suppliers, and validating their financial stability are all common ways to help reduce supply chain risk."},{"ch":"PT2","ch_name":"模拟卷 2","no":38,"type":"single","q":"As they prepare to migrate their data center to an infrastructure as a service (IaaS) provider, Susan’s company wants to understand the effectiveness of their new provider’s security, integ-rity, and availability controls. What SOC report would provide them with the most detail, including input from the auditor on the effectiveness of controls at the IaaS provider?","opts":["SOC 1.","SOC 2.","SOC 3.","None of the SOC reports is suited to this, and they should request another form of report."],"ans":"B","expl":"SOC 2 reports are released under NDA to select partners or customers and can pro-vide detail on the controls and any issues they may have. A SOC 1 report would only pro-vide financial control information, and a SOC 3 report provides less information since it is publicly available."},{"ch":"PT2","ch_name":"模拟卷 2","no":39,"type":"single","q":"Susan wants to ensure that the audit report that her organization requested includes input from an external auditor and information about control implementation over a period of time. What type of report should she request?","opts":["SOC 2, Type 1","SOC 3, Type 1","SOC 2, Type 2","SOC 3, Type 2"],"ans":"C","expl":"An SOC 2, Type 2 report includes information about a data center’s security, availability, processing integrity, confidentiality, and privacy, and includes an auditor’s opinion on the operational effectiveness of the controls. SOC 3 does not have types, and an SOC 2 Type 1 is only conducted at a point in time."},{"ch":"PT2","ch_name":"模拟卷 2","no":40,"type":"single","q":"When Susan requests an SOC 2 report, she receives an SOC 1 report. What issue should Susan raise?","opts":["SOC 1 reports only reveal publicly available information.","SOC 1 reports cover financial data.","SOC 1 reports only cover a point in time.","SOC 1 reports only use a three-month period for testing."],"ans":"B","expl":"Susan asked for a security controls report (SOC 2) and received a financial internal con-trols report (SOC 1). This question doesn’t specify whether a Type 1 or Type 2 report is desired, but most security practitioners will prefer a Type 2 report if they can get it since it tests the actual controls and their implementation instead of their descriptions."},{"ch":"PT2","ch_name":"模拟卷 2","no":41,"type":"single","q":"Brad wants to engage third-party auditors to assess a vendor that his company will be signing a contract with. If Brad wants to assess the vendor’s security policies and controls as well as the effectiveness of those controls as implemented over time, what SOC level and type should he request the auditors perform?","opts":["A SOC 1, Type 2","A SOC 2, Type 1","A SOC 1, Type 1","A SOC 2, Type 2"],"ans":"D","expl":"An SOC 2 assessment looks at controls that affect security, and a Type 2 report vali-dates the operating effectiveness of the controls. SOC 1 engagement assesses controls that might impact financial reporting, and a Type 1 report provides the auditors opinions of the descriptions of controls provided by management at a single point in time—not the actual implementations of the controls."},{"ch":"PT2","ch_name":"模拟卷 2","no":42,"type":"single","q":"Bell–LaPadula is an example of what type of access control model?","opts":["DAC","RBAC","MAC","ABAC"],"ans":"C","expl":"Bell–LaPadula uses security labels on objects and clearances for subjects and is there-fore a MAC model. It does not use discretionary, rule-based, role-based, or attribute-based access control."},{"ch":"PT2","ch_name":"模拟卷 2","no":43,"type":"single","q":"Martha is the information security officer for a small college and is responsible for safeguard-ing the privacy of student records. What law most directly applies to her situation?","opts":["HIPAA","HITECH","COPPA","FERPA"],"ans":"D","expl":"The Family Educational Rights and Privacy Act (FERPA) protects the privacy of students in any educational institution that accepts any form of federal funding."},{"ch":"PT2","ch_name":"模拟卷 2","no":44,"type":"single","q":"What U.S. federal law mandates the security of protected health information?","opts":["FERPA","SAFE Act","GLBA","HIPAA"],"ans":"D","expl":"The Health Insurance Portability and Accountability Act (HIPAA) mandates the protec-tion of protected health information (PHI). The SAFE Act deals with mortgages, the Graham–Leach–Bliley Act (GLBA) covers financial institutions, and FERPA deals with student data."},{"ch":"PT2","ch_name":"模拟卷 2","no":45,"type":"single","q":"Which one of the following techniques can an attacker use to exploit a TOC/TOU vul-nerability?","opts":["File locking","Exception handling","Algorithmic complexity","Concurrency control"],"ans":"C","expl":"Attackers may use algorithmic complexity as a tool to exploit a time of change/time of use (TOC/TOU) condition. By varying the workload on the CPU, attackers may exploit the amount of time required to process requests and use that variance to effectively schedule the exploit’s execution. File locking, exception handling, and concurrency controls are all methods used to defend against TOC/TOU attacks."},{"ch":"PT2","ch_name":"模拟卷 2","no":46,"type":"single","q":"Susan is configuring her network devices to use syslog. What should she set to ensure that she is notified about issues but does not receive normal operational issue messages?","opts":["The facility code","The log priority","The security level","The severity level"],"ans":"D","expl":"Implementations of syslog vary, but most provide a setting for severity level, allowing con-figuration of a value that determines what messages are sent. Typical severity levels include debug, informational, notice, warning, error, critical, alert, and emergency. The facility code is also supported by syslog, but is associated with which services are being logged. Security level and log priority are not typical syslog settings."},{"ch":"PT2","ch_name":"模拟卷 2","no":47,"type":"single","q":"What RAID level is also known as disk mirroring?","opts":["RAID 0","RAID 1","RAID 3","RAID 5"],"ans":"B","expl":"In RAID 1, also known as disk mirroring, systems contain two physical disks. Each disk contains copies of the same data, and either one may be used in the event the other disk fails."},{"ch":"PT2","ch_name":"模拟卷 2","no":48,"type":"single","q":"Isaac recently purchased a 48 port switch from his switch vendor. The switch vendor has announced that the model of switch that Isaac purchased will reach end of life next year. What does this tell Isaac about the devices?","opts":["The devices will stop being sold next year.","The devices will stop functioning next year.","The devices will no longer be supported next year.","The devices will be supported for a minimum of three more years."],"ans":"A","expl":"Most vendors use the term end of life, or EOL, to denote when the product will stop being sold. End of support typically comes sometime after end of life, and this problem does not specify when end of support (EOS) will occur. Devices will still function after end of life and likely after end of support, but security professionals should raise concerns about the security of devices or software after the end of support because patches and updates will likely no longer be available."},{"ch":"PT2","ch_name":"模拟卷 2","no":49,"type":"single","q":"Surveys, interviews, and audits are all examples of ways to measure what important part of an organization’s security posture?","opts":["Code quality","Service vulnerabilities","Awareness","Attack surface"],"ans":"C","expl":"Interviews, surveys, and audits are all useful for assessing awareness. Code quality is best judged by code review, service vulnerabilities are tested using vulnerability scanners and related tools, and the attack surface of an organization requires both technical and administrative review."},{"ch":"PT2","ch_name":"模拟卷 2","no":50,"type":"single","q":"Tom is the general counsel for an internet service provider, and he recently received notice of a lawsuit against the firm because of copyrighted content illegally transmitted over the pro-vider’s circuits by a customer. What law protects Tom’s company in this case?","opts":["Computer Fraud and Abuse Act","Digital Millennium Copyright Act","Wiretap Act","Copyright Code"],"ans":"B","expl":"The Digital Millennium Copyright Act extends common carrier protection to online service providers, which are not liable for the “transitory activities” of their customers."},{"ch":"PT2","ch_name":"模拟卷 2","no":51,"type":"single","q":"A Type 2 authentication factor that generates dynamic passwords based on a time- or algorithm-based system is what type of authenticator?","opts":["A PII","A smart card","A token","A CAC"],"ans":"C","expl":"Tokens are hardware devices (something you have) that generate a one-time password based on time or an algorithm. They are typically combined with another factor like a pass-word to authenticate users. CAC and PIV cards are U.S. government–issued smartcards."},{"ch":"PT2","ch_name":"模拟卷 2","no":52,"type":"single","q":"Fred’s new employer has hired him for a position with access to their trade secrets and confi-dential internal data. What legal tool should they use to help protect their data if he chooses to leave to work at a competitor?","opts":["A stop-loss order","An NDA","An AUP","Encryption"],"ans":"B","expl":"A nondisclosure agreement (NDA) is a legal agreement between two parties that specifies what data they will not disclose. NDAs are common in industries that have sensitive or trade secret information they do not want employees to take to new jobs. Encryption would only help in transit or at rest, and Fred will likely have access to the data in unencrypted form\nas part of his job. An AUP is an acceptable use policy, and a stop-loss order is used on the stock market."},{"ch":"PT2","ch_name":"模拟卷 2","no":53,"type":"single","q":"Mark’s company is involved in a civil case. What evidentiary standard is he likely to need to meet?","opts":["The real evidence standard","Beyond a reasonable doubt","Preponderance of evidence","The documentary evidence standard"],"ans":"C","expl":"Civil cases typically rely on a preponderance of evidence. Criminal cases must be proven beyond a reasonable doubt. Real evidence is object evidence—tangible things that can be brought into a court of law. Documentary evidence are written items used to prove facts. Neither of these is an evidentiary standard; instead, they describe types of evidence."},{"ch":"PT2","ch_name":"模拟卷 2","no":54,"type":"single","q":"How many possible keys exist when using a cryptographic algorithm that has an 8-bit binary encryption key?","opts":["16","128","256","512"],"ans":"C","expl":"Binary keyspaces contain a number of keys equal to 2 raised to the power of the number of bits. Two to the eighth power is 256, so an 8-bit keyspace contains 256 possible keys."},{"ch":"PT2","ch_name":"模拟卷 2","no":55,"type":"single","q":"What activity is being performed when you apply security controls based on the specific needs of the IT system that they will be applied to?","opts":["Standardizing","Baselining","Scoping","Editing"],"ans":"C","expl":"Scoping is the process of reviewing and selecting security controls based on the system that they will be applied to. Editing is not a commonly used term in this context. Baselines are used as a base set of security controls, often from a third-party organization that creates them. Standardization isn’t a relevant term here."},{"ch":"PT2","ch_name":"模拟卷 2","no":56,"type":"single","q":"During what phase of the electronic discovery process does an organization perform a rough cut of the information gathered to discard irrelevant information?","opts":["Preservation","Identification","Collection","Processing"],"ans":"D","expl":"During the preservation phase, the organization ensures that information related to the matter at hand is protected against intentional or unintentional alteration or deletion. The identification phase locates relevant information but does not preserve it. The collection phase occurs after preservation and gathers responsive information. The processing phase performs a rough cut of the collected information for relevance."},{"ch":"PT2","ch_name":"模拟卷 2","no":57,"type":"single","q":"Ben’s job is to ensure that data is labeled with the appropriate sensitivity label. Since Ben works for the U.S. government, he has to apply the labels Unclassified, Confidential, Secret, and Top Secret to systems and media. If Ben is asked to label a system that handles Secret, Confidential, and Unclassified information, how should he label it?","opts":["Mixed classification","Confidential","Top Secret","Secret"],"ans":"D","expl":"Systems and media should be labeled with the highest level of sensitivity that they store or handle. In this case, based on the U.S. government classification scheme, the highest classification level in use on the system is Secret. Mixed classification provides no useful information about the level, whereas Top Secret and Confidential are too high and too low, respectively."},{"ch":"PT2","ch_name":"模拟卷 2","no":58,"type":"single","q":"Susan has discovered that the smart card–based locks used to keep the facility she works at secure are not effective because staff members are propping the doors open. She places signs on the doors reminding staff that leaving the door open creates a security issue, and she adds alarms that will sound if the doors are left open for more than five minutes. What type of controls has she put into place?","opts":["Physical","Administrative","Compensating","Recovery"],"ans":"C","expl":"She has placed compensation controls in place. Compensation controls are used when controls like the locks in this example are not sufficient. While the alarm is a physical control, the signs she posted are not. Similarly, the alarms are not administrative con-trols. None of these controls helps to recover from an issue, and they are thus not recovery controls."},{"ch":"PT2","ch_name":"模拟卷 2","no":59,"type":"single","q":"Ben is concerned about password cracking attacks against his system. He would like to implement controls that prevent an attacker who has obtained those hashes from easily cracking them. What two controls would best meet this objective?","opts":["Longer passwords and salting","Over-the-wire encryption and use of SHA1 instead of MD5","Salting and use of MD5","Using shadow passwords and salting"],"ans":"A","expl":"Rainbow tables rely on being able to use databases of precomputed hashes to quickly search for matches to known hashes acquired by an attacker. Making passwords longer can greatly increase the size of the rainbow table required to find the matching hash, and adding a salt to the password will make it nearly impossible for the attacker to generate a table that will match unless they can acquire the salt value. MD5 and SHA1 are both poor choices for password hashing compared to modern password hashes, which are designed to make hash-ing easy and recovery difficult. Rainbow tables are often used against lists of hashes acquired by attacks rather than over-the-wire attacks, so over-the-wire encryption is not particularly useful here. Shadow passwords simply make the traditionally world-readable list of password hashes on Unix and Linux systems available in a location readable only by root. This doesn’t prevent a rainbow table attack once the hashes are obtained."},{"ch":"PT2","ch_name":"模拟卷 2","no":60,"type":"single","q":"Which group is best suited to evaluate an organization’s administrative controls and provide credible reports to a third party?","opts":["Internal auditors","Penetration testers","External auditors","Employees who design, implement, and monitor the controls"],"ans":"C","expl":"External auditors can provide an unbiased and impartial view of an organization’s con-trols to third parties. Internal auditors are useful when reporting to senior management of the organization but are typically not asked to report to third parties. Penetration tests test technical controls but are not as well suited to testing many administrative controls. The employees who build and maintain controls are more likely to bring a bias to the testing of those controls and should not be asked to report on them to third parties."},{"ch":"PT2","ch_name":"模拟卷 2","no":61,"type":"single","q":"Lucca’s manager does not want to adopt an open source software package for their organiza-tion’s web application stack. What software security advantage is the most important when considering open source software packages?","opts":["The fact that the code is not compiled","The fact the code is free","The ability to inspect the code","The ability to change the code"],"ans":"C","expl":"The ability to inspect open source software means that
