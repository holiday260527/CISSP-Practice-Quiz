"ans":"C","expl":"Wireshark is a network monitoring tool that can capture and replay communications sent over a data network, including Voice over IP (VoIP) communications. Nmap, Nessus, and Nikto are all security tools that may identify security flaws in the network, but they do not directly undermine confidentiality because they do not have the ability to capture communications."},{"ch":"PT3","ch_name":"模拟卷 3","no":51,"type":"single","q":"Which of the following is not true about the (ISC)2 Code of Ethics?","opts":["Adherence to the code is a condition of certification.","Failure to comply with the code may result in revocation of certification.","The code applies to all members of the information security profession.","Members who observe a breach of the code are required to report the possible violation."],"ans":"C","expl":"The (ISC)2 Code of Ethics applies only to information security professionals who are members of (ISC)2. Adherence to the code is a condition of certification, and individuals found in violation of the code may have their certifications revoked. (ISC)2 members who observe a breach of the code are required to report the possible violation by following the ethics complaint procedures."},{"ch":"PT3","ch_name":"模拟卷 3","no":52,"type":"single","q":"Which one of the following cryptographic algorithms supports the goal of nonrepudiation?","opts":["Blowfish","DES","AES","RSA"],"ans":"D","expl":"Nonrepudiation is only possible with an asymmetric encryption algorithm. RSA is an asymmetric algorithm. AES, DES, and Blowfish are all symmetric encryption algorithms that do not provide nonrepudiation."},{"ch":"PT3","ch_name":"模拟卷 3","no":53,"type":"single","q":"Microsoft’s STRIDE threat assessment framework uses six categories for threats: Spoof-ing, Tampering, Repudiation, Information Disclosure, Denial of Service, and Elevation of Privilege. If a penetration tester is able to modify audit logs, what STRIDE categories best describe this issue?","opts":["Tampering and information disclosure","Elevation of privilege and tampering","Repudiation and denial of service","Repudiation and tampering"],"ans":"D","expl":"Modification of audit logs will allow repudiation because the data cannot be trusted, and thus actions can be provably denied. The modification of the logs is also a direct example of tampering. It might initially be tempting to answer elevation of privileges and tampering, as the attacker made changes to files that should be protected, but this is an unknown without more information. Similarly, the attacker may have accessed the files, resulting in information disclosure in addition to tampering, but again, this is not specified in the question. Finally, this did not cause a denial of service, and thus that answer can be ignored."},{"ch":"PT3","ch_name":"模拟卷 3","no":54,"type":"single","q":"Carmen is reviewing her organization’s web architecture and realizes that the web server is often under heavy load from users in different regions of the world. This load comes at\n• unpredictable times. She would like to find a solution that minimizes the burden on her orga-nization’s servers and places content geographically closer to the user to decrease load time. What would be the best solution to Carmen’s requirements?","opts":["Load balancer","Content delivery network","TLS acceleration","Web application firewall"],"ans":"B","expl":"Content delivery networks (CDNs) place endpoints at geographic locations around the world and then cache customer content at those endpoints. The CDN servers then handle user requests for data, greatly reducing the burden on the organization’s own servers and improving load time. Load balancers would distribute the load among Carmen’s own servers and would, therefore, not meet her requirements. TLS acceleration may improve load time by reducing the burden of encryption on servers, but they would not place content closer to end users. Web application firewalls would be used to protect the servers against attack, but this does not match Carmen’s requirements."},{"ch":"PT3","ch_name":"模拟卷 3","no":55,"type":"single","q":"Brian recently joined an organization that runs the majority of its services on a virtualization platform located in its own data center but also leverages an IaaS provider for hosting its web services and a SaaS email system. What term best describes the type of cloud environ-ment this organization uses?","opts":["Public cloud","Dedicated cloud","Private cloud","Hybrid cloud"],"ans":"D","expl":"The scenario describes a mix of public cloud and private cloud services. This is an example of a hybrid cloud environment."},{"ch":"PT3","ch_name":"模拟卷 3","no":56,"type":"single","q":"The government agency that Ben works at installed a new access control system. The system uses information such as Ben’s identity, department, normal working hours, job cat-egory, and location to make authorization. What type of access control system did Ben’s employer adopt?","opts":["Role-based access control","Attribute-based access control","Administrative access control","System discretionary access control"],"ans":"B","expl":"Each of the attributes linked to Ben’s access provides information for an attribute-based information control system. Attribute-based information controls like those described in NIST SP800-162 can take many details about the user, actions, and objects into consideration before allowing access to occur. A role-based access control would simply consider Ben’s role, whereas both administrative and system discretionary access controls are not commonly used terms to describe access controls."},{"ch":"PT3","ch_name":"模拟卷 3","no":57,"type":"multi","q":"Ben is building his organization’s security awareness and training program and would like to include interactive activities that better engage users. What techniques would best help him meet this goal?","opts":["Policy reviews","Gamification","Classroom training","Phishing simulations"],"ans":"BD","expl":"All of these techniques are valid components of a security awareness and training program. However, users generally find policy reviews and classroom training boring. Gami-fication and phishing simulations are designed to bring interactivity to the effort and make it more interesting and engaging for users."},{"ch":"PT3","ch_name":"模拟卷 3","no":58,"type":"single","q":"Andrew believes that a digital certificate belonging to his organization was compromised and would like to add it to a certificate revocation list (CRL). Who must add the certificate to the CRL?","opts":["Andrew","The root authority for the top-level domain","The CA that issued the certificate","The revocation authority for the top-level domain"],"ans":"C","expl":"Certificates may only be added to a certificate revocation list by the certificate authority that created the digital certificate."},{"ch":"PT3","ch_name":"模拟卷 3","no":59,"type":"single","q":"Amanda is considering the implementation of a database recovery mechanism recommended by a consultant. In the recommended approach, an automated process will move records of transactions from the primary site to a backup site on an hourly basis. What type of database recovery technique is the consultant describing?","opts":["Electronic vaulting","Transaction logging","Remote mirroring","Remote journaling"],"ans":"D","expl":"Remote journaling transfers transaction logs to a remote site on a more frequent basis than electronic vaulting, typically hourly. Transaction logging is not a recovery technique alone; it is a process for generating the logs used in remote journaling. In an electronic vaulting approach, automated technology moves database backups from the primary data-base server to a remote site on a scheduled basis, typically daily. Remote mirroring maintains a live database server at the backup site and mirrors all transactions at the primary site on the server at the backup site."},{"ch":"PT3","ch_name":"模拟卷 3","no":60,"type":"multi","q":"Ron is working to classify information used by his organization and would like to include all information that might trigger a U.S. state data breach notification law in his classification scheme. Which of the following categories of information should he include, assuming that they are connected to a specific individual? (Select all that apply.)","opts":["Bank account number and PIN","Driver’s license number","Marital status","Social Security number"],"ans":"ABD","expl":"The specific data elements covered by state data breach notification laws vary from state to state, but most include Social Security numbers, drivers’ license numbers, and bank account numbers when paired with a PIN. No state data breach notification laws include marital status as a covered element."},{"ch":"PT3","ch_name":"模拟卷 3","no":61,"type":"single","q":"Which one of the following investigation types has the loosest standards for the collection and preservation of information?","opts":["Civil investigation","Operational investigation","Criminal investigation","Regulatory investigation"],"ans":"B","expl":"Operational investigations are performed by internal teams to troubleshoot performance or other technical issues. They are not intended to produce evidence for use in court\nand, therefore, do not have the rigid collection standards of criminal, civil, or regulatory investigations."},{"ch":"PT3","ch_name":"模拟卷 3","no":62,"type":"single","q":"Sue was required to sign an NDA when she took a job at her new company. Why did the company require her to sign it?","opts":["To protect the confidentiality of their data","To ensure that Sue did not delete their data","To prevent Sue from directly competing with them in the future","To require Sue to ensure the availability for their data as part of her job"],"ans":"A","expl":"Nondisclosure agreements (NDAs) are designed to protect the confidentiality of an orga-nization’s data, including trade secrets during and after the person’s employment. NDAs do not protect against deletion or availability issues, and noncompete agreements would be required to stop competition."},{"ch":"PT3","ch_name":"模拟卷 3","no":63,"type":"single","q":"Susan is concerned about the FAR associated with her biometric technology. What is the best method to deal with the FAR?","opts":["Adjust the CER.","Change the sensitivity of the system to lower the FRR.","Add a second factor.","Replace the biometric system."],"ans":"C","expl":"Adding a second factor can ensure that users who might be incorrectly accepted are not given access due to a higher than desired false acceptance rate (FAR) from accessing a\nsystem. The CER is the crossover between the false acceptance and false rejection rate (FRR) and is used as a way to measure the accuracy of biometric systems. Changing the sensitivity to lower the FRR may actually increase the FAR, and replacing a biometric system can be expensive in terms of time and cost."},{"ch":"PT3","ch_name":"模拟卷 3","no":64,"type":"single","q":"Which data processing role in an organization is most likely to grant users access to information on a day-to-day basis?","opts":["Business owners","Data processors","Data owners","Data stewards"],"ans":"D","expl":"Data stewards carry out most of the operational responsibilities related to data management and would be the most likely to approve access requests. They have authority delegated to them by business and data owners. Data processors are required to perform specific actions under regulations like the EU GDPR."},{"ch":"PT3","ch_name":"模拟卷 3","no":65,"type":"single","q":"Ron is the CISO of a U.S. company that is entering into a business partnership with a European firm. The European firm will be sending his company customer records to run through Ron’s firm’s proprietary credit scoring algorithm. Under GDPR, what role will Ron’s company have relative to the customer data?","opts":["Data controller","Data owner","Data subject","Data processor"],"ans":"D","expl":"Ron’s company is a data processor in this instance, as it is receiving records from the European firm. The European firm is the data controller in this case, as they bear responsi-bility for the data. The individuals described in the records are the data subjects. Data owners are tasked with making decisions about data such as who receives access to it and how\nit is used."},{"ch":"PT3","ch_name":"模拟卷 3","no":66,"type":"single","q":"Tonya recently introduced a new security control in her organization for emergency access to system administrator privileges. Under this procedure, two qualified administrators must agree to retrieve emergency credentials. What term best describes this process?","opts":["Separation of duties","Least privilege","Two-person control","Multifactor authentication"],"ans":"C","expl":"This is an example of two-person control, where two people must concur to perform a sensitive action. Separation of duties is a slightly different principle, where one individual is prevented from holding the privileges to perform two separate actions that, when combined, would result in undesirable permissions. Least privilege says that an individual should have the minimum necessary set of permissions to carry out their job functions. There is no indication that least privilege is violated in this scenario. Multifactor authentication is an important security control, but the scenario does not mention whether the administrators use multifactor authentication to perform these activities."},{"ch":"PT3","ch_name":"模拟卷 3","no":67,"type":"single","q":"Attackers who compromise websites often acquire databases of hashed passwords. What technique can best protect these passwords against automated password cracking attacks that use precomputed values?","opts":["Using the MD5 hashing algorithm","Using the SHA-1 hashing algorithm","Salting","Double-hashing"],"ans":"C","expl":"Salting adds random text to the password before hashing in an attempt to defeat automated password cracking attacks that use precomputed values. MD5 and SHA-1 are both common hashing algorithms, so using them does not add any security. Double-hashing would only be a minor inconvenience for an attacker and would not be as effective as the use of salting."},{"ch":"PT3","ch_name":"模拟卷 3","no":68,"type":"single","q":"Jim starts a new job as a system engineer, and he is reviewing a team document entitled “Forensic Response Guidelines.” Which one of the following statements is not true?","opts":["Jim must comply with the information in this document.","The document contains information about forensic examinations.","Jim should read the document thoroughly.","The document is likely based on industry best practices."],"ans":"A","expl":"Guidelines provide advice based on best practices developed throughout industry and organizations, but they are not compulsory. Compliance with guidelines is optional."},{"ch":"PT3","ch_name":"模拟卷 3","no":69,"type":"single","q":"Evan is reviewing his access control system to ensure that no user is able to read information that is above their security clearance level. What security model is he enforcing?","opts":["Bell–LaPadula","Star security property","Discretionary security property","Biba"],"ans":"A","expl":"The Bell–LaPadula model includes the simple security property, which says that no user should be able to read information above their security clearance level. It also includes the star property, which says that a subject should not be able to write data to an object below their security clearance level, and the discretionary security property, which uses access matrices to control access. The Biba integrity model says that users should not be able to read data below their security clearance level."},{"ch":"PT3","ch_name":"模拟卷 3","no":70,"type":"single","q":"Ben needs to verify that the most recent patch for his organization’s critical application did not introduce issues elsewhere. What type of testing does Ben need to conduct to ensure this?","opts":["Unit testing","White box","Regression testing","Black box"],"ans":"C","expl":"Regression testing ensures proper functionality of an application or system after it has been changed. Unit testing focuses on testing each module of a program instead of against its previous functional state. White- and black-box testing both describe the amount of knowledge about a system or application, rather than a specific type or intent for testing."},{"ch":"PT3","ch_name":"模拟卷 3","no":71,"type":"single","q":"Tamara recently decided to purchase cyber-liability insurance to cover her company’s costs in the event of a data breach. What risk management strategy is she pursuing?","opts":["Risk acceptance","Risk mitigation","Risk transference","Risk avoidance"],"ans":"C","expl":"Risk transference involves shifting the impact of a potential risk from the organiza-tion incurring the risk to another organization. Insurance is a common example of risk transference."},{"ch":"PT3","ch_name":"模拟卷 3","no":72,"type":"single","q":"Which of the following is not one of the four canons of the (ISC)2 Code of Ethics?","opts":["Avoid conflicts of interest that may jeopardize impartiality.","Protect society, the common good, necessary public trust and confidence, and the infra-structure.","Act honorably, honestly, justly, responsibly, and legally.","Provide diligent and competent service to principals."],"ans":"A","expl":"The four canons of the (ISC)2 Code of Ethics are to protect society, the common good, the necessary public trust and confidence, and the infrastructure; act honorably, honestly, justly, responsibly, and legally; provide diligent and competent service to principals; and advance and protect the profession."},{"ch":"PT3","ch_name":"模拟卷 3","no":73,"type":"single","q":"Jim wants to allow a partner organization’s Active Directory forest (B) to access his domain forest’s (A)’s resources but doesn’t want to allow users in his domain to access B’s resources. He also does not want the trust to flow upward through the domain tree as it is formed. What should he do?","opts":["Set up a two-way transitive trust.","Set up a one-way transitive trust.","Set up a one-way nontransitive trust.","Set up a two-way nontransitive trust."],"ans":"C","expl":"A trust that allows one forest to access another’s resources without the reverse being pos-sible is an example of a one-way trust. Since Jim doesn’t want the trust path to flow as the domain tree is formed, this trust has to be nontransitive."},{"ch":"PT3","ch_name":"模拟卷 3","no":74,"type":"single","q":"Susan’s team is performing code analysis by manually reviewing the code for flaws. What type of analysis are they performing?","opts":["Gray box","Static","Dynamic","Fuzzing"],"ans":"B","expl":"Susan’s team is performing static analysis, which analyzes nonrunning code. Dynamic analysis uses running code, whereas gray-box assessments are a type of assessment\ndone without full knowledge. Fuzzing feeds unexpected inputs to a program as part of dynamic analysis."},{"ch":"PT3","ch_name":"模拟卷 3","no":75,"type":"multi","q":"Kevin’s organization recently suffered a ransomware attack, and he is considering paying the ransom. Which of the following statements are true about paying the ransom? (Select all that apply.)","opts":["There is no guarantee that he will receive the decryption key.","The attackers have encrypted his data but do not have access to the data itself.","Restoring from backup will not recover information.","Paying ransoms may be illegal."],"ans":"AD","expl":"Kevin may choose to pay the ransom, and he may regain access to his data by doing so, but there is no guarantee that the attackers will deliver the decryption key after he makes payment. Additionally, the payment of the ransom may be illegal depending upon the circum-stances. He cannot be sure that the attackers do not have access to his information, as the ransomware may have copied data for the attackers’ use. Restoring from backup is a good method to regain access to information encrypted by ransomware."},{"ch":"PT3","ch_name":"模拟卷 3","no":76,"type":"single","q":"What feature of a Trusted Platform Module (TPM) creates a hash summary of the system configuration to verify that changes have not been made?","opts":["Remote attestation","Binding","Sealing","RNG"],"ans":"A","expl":"Remote attestation creates a hash value from the system configuration to confirm the integrity of the configuration. Binding and sealing are techniques used by the TPM to encrypt data. The random number generator (RNG) function of the TPM is used to support crypto-graphic operations."},{"ch":"PT3","ch_name":"模拟卷 3","no":77,"type":"multi","q":"Gary is concerned that the environmental controls in his organization’s data center may not be effectively controlling humidity. Which of the following circumstances may result from humidity issues? (Select all that apply.)","opts":["Static electricity damaging equipment","Fires in power supplies","Corrosion of equipment","Physical access control failures"],"ans":"AC","expl":"Situations where humidity is too high may result in the buildup of moisture and corro-sion of equipment. If humidity falls too low, it may result in static electricity issues. Humidity issues generally do not contribute to fires or physical access control failures."},{"ch":"PT3","ch_name":"模拟卷 3","no":78,"type":"single","q":"Evan recently built an alternate processing facility that includes all of the hardware and data necessary to restore operations in a matter of minutes or seconds. What type of facility has he built?","opts":["Hot site","Warm site","Cold site","Mobile site"],"ans":"C","expl":"PCI-DSS, or the Payment Card Industry Data Security Standard is the industry standard Gary’s company will need to comply with. ISO27001 and 27002 are information security management standards. FIPS 140 is a standard for cryptographic modules."},{"ch":"PT3","ch_name":"模拟卷 3","no":79,"type":"single","q":"Hadley is reviewing network traffic logs and is searching for syslog activity on his network. When he creates a filter to look for this traffic, which UDP port should he include?","opts":["443","514","515","445"],"ans":"B","expl":"Syslog uses UDP port 514. TCP-based implementations of syslog typically use port 6514. The other ports may look familiar because they are commonly used TCP ports: 443 is HTTPS, 515 is the LPD print service, and 445 is used for Windows SMB."},{"ch":"PT3","ch_name":"模拟卷 3","no":80,"type":"single","q":"Fred finds a packet that his protocol analyzer shows with both PSH and URG set. What type of packet is he looking at, and what do the flags mean?","opts":["A UDP packet; PSH and URG are used to indicate that the data should be sent at high speed.","A TCP packet; PSH and URG are used to clear the buffer and indicate that the data is urgent.","A TCP packet; PSH and URG are used to preset the header and indicate that the speed of the network is unregulated.","A UDP packet; PSH and URG are used to indicate that the UDP buffer should be cleared and that the data is urgent."],"ans":"B","expl":"PSH is a TCP flag used to clear the buffer, resulting in immediately sending data, and URG is the TCP urgent flag. These flags are not present in UDP headers."},{"ch":"PT3","ch_name":"模拟卷 3","no":84,"type":"single","q":"What stage of the incident response process is Alejandro currently conducting?","opts":["Detection","Response","Recovery","Mitigation"],"ans":"A","expl":"Alejandro is in the first stage of the incident response process, detection. During this stage, the intrusion detection system provides the initial alert, and Alejandro performs preliminary triaging to determine if an intrusion is actually taking place and whether the scenario fits the criteria for activating further steps of the incident response process (which include response, mitigation, reporting, recovery, remediation, and lessons learned).","scene":"Alejandro is an incident response analyst for a large corporation. He is on the midnight shift when an intrusion detection system alerts him to a potential brute-force password attack against one of the company’s critical information systems. He performs an initial triage of the event before taking any additional action."},{"ch":"PT3","ch_name":"模拟卷 3","no":85,"type":"single","q":"If Alejandro’s initial investigation determines that a security incident is likely taking place, what should be his next step?","opts":["Investigate the root cause.","File a written report.","Activate the incident response team.","Attempt to restore the system to normal operations."],"ans":"C","expl":"After detection of a security incident, the next step in the process is response, which should follow the organization’s formal incident response procedure. The first step of this procedure is activating the appropriate teams, including the organization’s computer security incident response team (CSIRT).","scene":"Alejandro is an incident response analyst for a large corporation. He is on the midnight shift when an intrusion detection system alerts him to a potential brute-force password attack against one of the company’s critical information systems. He performs an initial triage of the event before taking any additional action."},{"ch":"PT3","ch_name":"模拟卷 3","no":86,"type":"single","q":"As the incident response progresses, during which stage should the team conduct a root-cause analysis?","opts":["Response","Reporting","Remediation","Lessons learned"],"ans":"C","expl":"The root-cause analysis examines the incident to determine what allowed it to happen and provides critical information for repairing systems so that the incident does not recur. This is a component of the remediation step of the incident response process because the root-cause analysis output is necessary to fully remediate affected systems and processes.","scene":"Alejandro is an incident response analyst for a large corporation. He is on the midnight shift when an intrusion detection system alerts him to a potential brute-force password attack against one of the company’s critical information systems. He performs an initial triage of the event before taking any additional action."},{"ch":"PT3","ch_name":"模拟卷 3","no":87,"type":"single","q":"Barry recently received a message from Melody that Melody encrypted using symmetric cryptography. What key should Barry use to decrypt the message?","opts":["Barry’s public key","Barry’s private key","Melody’s public key","Shared secret key"],"ans":"D","expl":"When using symmetric cryptography, the sender encrypts a message using a shared secret key, and the recipient then decrypts the message with that same key. Only asymmetric cryptography uses the concept of public and private key pairs."},{"ch":"PT3","ch_name":"模拟卷 3","no":88,"type":"single","q":"After you do automated functional testing with 100 percent coverage of an application, what type of error is most likely to remain?","opts":["Business logic errors","Input validation errors","Runtime errors","Error handling errors"],"ans":"A","expl":"Business logic errors are most likely to be missed by automated functional testing. If a complete coverage code test was conducted, runtime, input validation, and error handling issues are likely to have been discovered by automated testing. Any automated system is more likely to miss business logic errors, because humans are typically necessary to understand business logic issues."},{"ch":"PT3","ch_name":"模拟卷 3","no":89,"type":"single","q":"During what phase of the incident response process would security professionals analyze the process itself to determine whether any improvements are warranted?","opts":["Lessons learned","Remediation","Recovery","Reporting"],"ans":"A","expl":"During the lessons learned phase, analysts close out an incident by conducting a review of the entire incident response process. This may include making recommendations for improve-ments to the process that will streamline the efficiency and effectiveness of future incident response efforts."},{"ch":"PT3","ch_name":"模拟卷 3","no":90,"type":"single","q":"What U.S. law prevents the removal of protection mechanisms placed on a copyrighted work by the copyright holder?","opts":["HIPAA","DMCA","GLBA","ECPA"],"ans":"B","expl":"The Digital Millennium Copyright Act (DMCA) prohibits attempts to circumvent copy-right protection mechanisms placed on a protected work by the copyright holder. The Health Insurance Portability and Accountability Act (HIPAA) governs the security and privacy of protected health information. The Gramm-Leach-Bliley Act (GLBA) governs the security\nand privacy of financial information. The Electronic Communications Privacy Act (ECPA) restricts eavesdropping on private communications."},{"ch":"PT3","ch_name":"模拟卷 3","no":91,"type":"single","q":"Linda is selecting a disaster recovery facility for her organization, and she wants to retain independence from other organizations as much as possible. She would like to choose a facility that balances cost and recovery time, allowing activation in about one week after a disaster is declared. What type of facility should she choose?","opts":["Cold site","Warm site","Mutual assistance agreement","Hot site"],"ans":"B","expl":"Linda should choose a warm site. This approach balances cost and recovery time. Cold sites take a very long time to activate, measured in weeks or months. Hot sites activate immediately but are quite expensive. Mutual assistance agreements depend on the support of another organization."},{"ch":"PT3","ch_name":"模拟卷 3","no":92,"type":"single","q":"Helen’s organization handles large quantities of highly sensitive information. To help address this risk, she purchased a cyber-liability insurance policy. What type of risk response action is Helen taking?","opts":["Transfer","Avoid","Mitigate","Accept"],"ans":"A","expl":"Purchasing insurance is a way to transfer risk to another entity. Risk avoidance actions change business processes to eliminate a risk. Risk mitigation activities reduce the likelihood or impact of a risk occurring. Risk acceptance takes no action to control the risk other than acknowledging its presence."},{"ch":"PT3","ch_name":"模拟卷 3","no":93,"type":"single","q":"What type of penetration testing provides detail on the scope of a penetration test—including items like what systems would be targeted—but does not provide full visibility into the con-figuration or other details of the systems or networks the penetration tester must test?","opts":["Crystal box","White box","Black box","Gray box"],"ans":"D","expl":"Gray-box testing is a blend of crystal-box (or white-box) testing, which provides full information about a target, and black-box testing, which provides little or no knowledge about the target."},{"ch":"PT3","ch_name":"模拟卷 3","no":94,"type":"single","q":"Joanna would like to implement multifactor authentication for access to a restricted work area in her building. Which pairing of controls would best meet her requirement?","opts":["ID card and PIN","Password and retinal scan","ID card and access token","Retinal scan and fingerprint scan"],"ans":"A","expl":"The combination of an ID card (something you have) and a PIN (something you know) is a reasonable way to control access to a physical facility. The use of a password is not a user-friendly way to control access to a physical facility. The use of an ID card (something you have) in conjunction with an access token (something you have) does not constitute multifactor authentication because both are something you have factors. The same is true for the use of a retinal scan (something you are) and a fingerprint (something you are)."},{"ch":"PT3","ch_name":"模拟卷 3","no":95,"type":"single","q":"What network topology is used by modern-day Ethernet networks?","opts":["Star","Mesh","Ring","Bus"],"ans":"A","expl":"Ethernet networks in modern organizations use a star topology, where each device is directly connected to the switch and receives only traffic intended for that device. This reduces the possibility of eavesdropping on other devices."},{"ch":"PT3","ch_name":"模拟卷 3","no":96,"type":"single","q":"Reed would like to add capabilities to his network that allow him to hide the identities of his users from remote web servers. Which one of the following tools would best meet his needs?","opts":["Proxy server","Content filter","Malware filter","Caching server"],"ans":"A","expl":"Proxy servers can act to anonymize web requests by hiding their true source IP addresses and removing identifying information. Content filters restrict the websites that users may access. Malware filters search for and block malicious code. Caching servers store local copies of frequently requested content to reduce loading time."},{"ch":"PT3","ch_name":"模拟卷 3","no":97,"type":"single","q":"Evelyn is preparing a training program that will provide cybersecurity advice to users who often travel internationally. Which of the following topics requires special training to ensure that users do not run afoul of U.S. export control laws?","opts":["Encryption software","Content filtering","Firewall rules","Phishing simulations"],"ans":"A","expl":"U.S. export control laws contain special provisions around the use of encryption tech-nology, and Evelyn should include details about the software used by her firm in the training. These regulations do not affect content filtering controls, firewall rules, or phishing simulations."},{"ch":"PT3","ch_name":"模拟卷 3","no":98,"type":"single","q":"Skip needs to transfer files from his PC to a remote server. What protocol should he use instead of FTP?","opts":["SCP","SSH","HTTP","Telnet"],"ans":"A","expl":"Skip should use SCP (Secure Copy), which is a secure file transfer method. SSH is a secure command-line and login protocol, whereas HTTP is used for unencrypted web traffic. Telnet is an unencrypted command-line and login protocol."},{"ch":"PT3","ch_name":"模拟卷 3","no":99,"type":"single","q":"Ben’s New York–based commercial web service collects personal information from California residents. What does the California Online Privacy Protection Act require Ben to do to be compliant?","opts":["Ben must encrypt all personal data he receives.","Ben must comply with the EU GDPR.","Ben must have a conspicuously posted privacy policy on his site.","Ben must provide notice and choice for users of his website."],"ans":"C","expl":"The California Online Privacy Protection Act requires that commercial websites that collect personal information from users in California conspicuously post a privacy policy. The act does not require compliance with the EU GDPR, nor does it use the GDPR concepts of notice or choice, and it does not require encryption of all personal data."},{"ch":"PT3","ch_name":"模拟卷 3","no":100,"type":"single","q":"Grayson is reviewing his organization’s password policies and would like to follow modern best practices. What is the recommended expiration period for passwords?","opts":["30 days","90 days","180 days","None"],"ans":"D","expl":"Modern recommendations from the National Institute of Standards and Technology (NIST) are that users should not be forced to change their passwords through the use of password expiration policies. More information on these recommendations may be found in NIST Special Publication (SP) 800-63B, “Digital Identity Guidelines.”"},{"ch":"PT3","ch_name":"模拟卷 3","no":101,"type":"single","q":"A consortium of colleges and universities recently worked to integrate their authentication systems so that students registered at one institution may use their credentials to access ser-vices at other institutions. What term best describes this arrangement?","opts":["Federation","Identity proofing","Enrollment","Provisioning"],"ans":"A","expl":"This is an example of federation, where user credentials from one organization are accepted as proof of identity by another organization. The users are not creating new accounts, so there is no identity proofing, enrollment, or provisioning activity taking place."},{"ch":"PT3","ch_name":"模拟卷 3","no":102,"type":"single","q":"Olivia is selecting a new biometric authentication technology and is considering pur-chasing iris scanners. What advantage do iris scans have over most other types of bio-metric factors?","opts":["Iris scanners are harder to deceive.","Irises don’t change as much as other factors.","Iris scanners are cheaper than other factors.","Iris scans cannot be easily replicated."],"ans":"B","expl":"Iris scans have a longer useful life than many other types of biometric factors because they don’t change throughout a person’s life span (unless the eye itself is damaged). Iris scanners can be fooled in some cases by high-resolution images of an eye, and iris scanners are not significantly cheaper than other scanners."},{"ch":"PT3","ch_name":"模拟卷 3","no":103,"type":"single","q":"Harold’s company has a strong password policy that requires a minimum length of 12 characters and the use of both alphanumeric characters and symbols. What technique would be the most effective way for an attacker to compromise passwords in Harold’s organization?","opts":["Brute-force attack","Dictionary attack","Rainbow table attack","Social engineering attack"],"ans":"D","expl":"A social engineering attack may trick a user into revealing their password to the attacker. Other attacks that depend on guessing passwords, such as brute-force attacks, rainbow table attacks, and dictionary attacks, are unlikely to be successful in light of the organiza-tion’s strong password policy."},{"ch":"PT3","ch_name":"模拟卷 3","no":105,"type":"single","q":"Colleen is responsible for protecting credit card numbers as part of her organization’s efforts to comply with PCI DSS. She would like to select an appropriate control to protect those numbers while in transit over the network. Which of the following controls would best meet this need?","opts":["FDE","SSL","TPM","TLS"],"ans":"D","expl":"All of these controls involve the use of encryption, but only Transport Layer Security (TLS) provides a strong, effective means for protecting data in transit. Secure Sockets Layer (SSL) is an outdated method for protecting data in transit that should no longer be used. Full disk encryption (FDE) provides encryption for data at rest. The Trusted Platform Module (TPM) manages encryption keys for use in FDE."},{"ch":"PT3","ch_name":"模拟卷 3","no":106,"type":"single","q":"Joe is concerned about the confidentiality of email messages as they are transiting the inter-net from his organization’s servers to their final destination. What is the best way that Joe can ensure email confidentiality in motion?","opts":["Use TLS between the client and server.","Use SSL between the client and server.","Encrypt the email content.","Use a digital signature."],"ans":"C","expl":"The SMTP protocol does not guarantee confidentiality between servers, making TLS or SSL between the client and server only a partial measure. Encrypting the email content can provide confidentiality; digital signatures can provide nonrepudiation."},{"ch":"PT3","ch_name":"模拟卷 3","no":107,"type":"single","q":"Brenda is analyzing the web server logs after a successful compromise of her organization’s web-based order processing application. She finds an entry in the log file showing that a user entered the following information as his last name when placing an order:\n• Smith';DROP TABLE orders;--\n• What type of attack was attempted?","opts":["Buffer overflow","Cross-site scripting","Cross-site request forgery","SQL injection"],"ans":"D","expl":"The single quotation mark in the input field is a telltale sign that this is a SQL injection attack. The quotation mark is used to escape outside the SQL code’s input field, and the text following is used to directly manipulate the SQL command sent from the web application to the database."},{"ch":"PT3","ch_name":"模拟卷 3","no":108,"type":"single","q":"Hannah’s organization is implementing a new approach to user authentication that relies upon SAML. She would like to protect against eavesdropping on this traffic and also ensure that SAML traffic is not forged by an attacker. What should she do to protect against both types of attack?","opts":["Use SAML’s secure mode to provide secure authentication.","Implement TLS using a strong cipher suite, which will protect against both types of attacks.","Implement TLS using a strong cipher suite and use digital signatures.","Implement TLS using a strong cipher suite and message hashing."],"ans":"C","expl":"TLS provides message confidentiality and integrity, which can prevent eavesdropping. When paired with digital signatures, which provide integrity and authentication, forged assertions can also be defeated. SAML does not have a security mode and relies on TLS and digital signatures to ensure security if needed. Message hashing without a signature would help prevent modification of the message but won’t necessarily provide authentication."},{"ch":"PT3","ch_name":"模拟卷 3","no":109,"type":"single","q":"What is the goal of the BCP process?","opts":["RTO < MTD","MTD < RTO","RPO < MTD","MTD < RPO"],"ans":"A","expl":"The goal of the business continuity planning process is to ensure that your recovery time objectives are all less than your maximum tolerable downtimes."},{"ch":"PT3","ch_name":"模拟卷 3","no":110,"type":"single","q":"During which phase of the incident response process would administrators design new security controls intended to prevent a recurrence of the incident?","opts":["Reporting","Recovery","Remediation","Lessons learned"],"ans":"C","expl":"The remediation phase of incident handling focuses on conducting a root-cause analysis to identify the factors contributing to an incident and implementing new security controls, as needed."},{"ch":"PT3","ch_name":"模拟卷 3","no":111,"type":"single","q":"Bethany received an email from one of her colleagues with an unusual attachment named smime.p7s. She does not recognize the attachment and is unsure what to do. What is the most likely scenario?\nFor questions 112–114, please refer to the following scenario:","opts":["This is an encrypted email message.","This is a phishing attack.","This is embedded malware.","This is a spoofing attack."],"ans":"A","expl":"The S/MIME secure email format uses the P7S format for encrypted email messages.\nIf the recipient does not have a mail reader that supports S/MIME, the message will appear with an attachment named smime.p7s."},{"ch":"PT3","ch_name":"模拟卷 3","no":112,"type":"single","q":"Kim learned that the military is planning a classified mission that involves some ASI aircraft. She is concerned that employees not cleared for the mission may learn of it by noticing the movement of many aircraft to the region. Individual employees are cleared to know about the movement of an individual aircraft, but they are not cleared to know about the overall mission. What type of attack is Kim concerned about?","opts":["Aggregation","SQL injection","Inference","Multilevel security"],"ans":"A","expl":"Aggregation is a security issue that arises when a collection of facts has a higher classification than the classification of any of those facts standing alone. An inference problem occurs when an attacker can deduce information of greater sensitivity from a lower security level fact. SQL injection is a web application exploit. Multilevel security is a system control that allows the simultaneous processing of information at different classification levels.","scene":"Kim is the database security administrator for Aircraft Systems, Inc. (ASI). ASI is a military contractor engaged in the design and analysis of aircraft avionics systems and regularly handles classified information on behalf of the government and other government contrac-tors. Kim is concerned about ensuring the security of information stored in ASI databases. Kim’s database is a multilevel security database, and different ASI employees have different security clearances. The database contains information on the location of military aircraft containing ASI systems to allow ASI staff to monitor those systems."},{"ch":"PT3","ch_name":"模拟卷 3","no":113,"type":"single","q":"What technique can Kim employ to prevent employees not cleared for the mission from learning the true location of the aircraft?","opts":["Input validation","Polyinstantiation","Parameterization","Server-side validation"],"ans":"B","expl":"Polyinstantiation allows the storage of multiple different pieces of information in a database at different classification levels to prevent attackers from conducting aggregation or inference attacks. Kim could store incorrect location information in the database at lower classification levels to prevent the aggregation attack in this scenario. Input valida-tion, server-side validation, and parameterization are all techniques used to prevent web application attacks and are not effective against inference attacks.","scene":"Kim is the database security administrator for Aircraft Systems, Inc. (ASI). ASI is a military contractor engaged in the design and analysis of aircraft avionics systems and regularly handles classified information on behalf of the government and other government contrac-tors. Kim is concerned about ensuring the security of information stored in ASI databases. Kim’s database is a multilevel security database, and different ASI employees have different security clearances. The database contains information on the location of military aircraft containing ASI systems to allow ASI staff to monitor those systems."},{"ch":"PT3","ch_name":"模拟卷 3","no":114,"type":"single","q":"Kim’s database uniquely identifies aircraft by using their tail number. Which one of the fol-lowing terms would not necessarily accurately describe the tail number?","opts":["Database field","Foreign key","Primary key","Candidate key"],"ans":"B","expl":"The tail number is a database field because it is stored in the database. It is also a pri-mary key because the question states that the database uniquely identifies aircraft using this field. Any primary key is, by definition, also a candidate key. There is no information provided that the tail number is a foreign key used to reference a different database table.","scene":"Kim is the database security administrator for Aircraft Systems, Inc. (ASI). ASI is a military contractor engaged in the design and analysis of aircraft avionics systems and regularly handles classified information on behalf of the government and other government contrac-tors. Kim is concerned about ensuring the security of information stored in ASI databases. Kim’s database is a multilevel security database, and different ASI employees have different security clearances. The database contains information on the location of military aircraft containing ASI systems to allow ASI staff to monitor those systems."},{"ch":"PT3","ch_name":"模拟卷 3","no":115,"type":"single","q":"Kim would like to create a key that enforces referential integrity for the database. What type of key does she need to create?","opts":["Primary key","Foreign key","Candidate key","Master key"],"ans":"B","expl":"Foreign keys are used to create relationships between tables in a database. The data-base enforces referential integrity by ensuring that the foreign key used in a table has a corresponding record with that value as the primary key in the referenced table."},{"ch":"PT3","ch_name":"模拟卷 3","no":116,"type":"single","q":"Doug is choosing a software development lifecycle model for use in a project he is leading to develop a new business application. He has clearly defined requirements and would like to choose an approach that places an early emphasis on developing comprehensive doc-umentation. He does not have a need for the production of rapid prototypes or iterative improvement. Which model is most appropriate for this scenario?","opts":["Agile","Waterfall","Spiral","DevOps"],"ans":"B","expl":"The waterfall model uses an approach that develops software sequentially, spending quite a bit of time up front on the development and documentation of requirements and design. The spiral and Agile models focus on iterative development and are appropriate when requirements are not well understood or iterative development is preferred. DevOps is an approach to integrating development and operations activities and is not an SDLC model."},{"ch":"PT3","ch_name":"模拟卷 3","no":117,"type":"single","q":"Which individual bears the ultimate responsibility for data protection tasks?","opts":["Data owner","Data custodian","User","Auditor"],"ans":"A","expl":"The data owner is a senior manager who bears ultimate responsibility for data pro-tection tasks. The data owner typically delegates this responsibility to one or more data custodians."},{"ch":"PT3","ch_name":"模拟卷 3","no":118,"type":"single","q":"Carla is conducting a web application security test and would like to automatically gen-erate input that is used to test the application. Which of the following tools would be best suited for this purpose?","opts":["Static application testing tool","White-box testing tool","Brute-force testing tool","Fuzz testing tool"],"ans":"D","expl":"Fuzz testing tools are designed to provide invalid or unexpected input to applications, testing for vulnerabilities like format string vulnerabilities, buffer overflow issues, and other problems. A static analysis relies on examining code without running the applica-tion or code and thus would not fill forms as part of a web application. Brute-force tools attempt to bypass security by trying every possible combination for passwords or other values. A white box is a type of penetration test where the testers have full knowledge of the environment."},{"ch":"PT3","ch_name":"模拟卷 3","no":119,"type":"single","q":"Warren’s organization recently completed a massive phishing awareness campaign, and he would like to measure its effectiveness. Which of the following tools would best provide this measurement?","opts":["Survey","Simulation","Code review","Third-party assessment"],"ans":"B","expl":"Warren could use a survey or third-party assessment to evaluate the effectiveness of the campaign, but the best evidence would be provided by a phishing simulation where the organization measures user responses to simulated phishing attacks. Code reviews would not be useful in evaluating the effectiveness of antiphishing campaigns."},{"ch":"PT3","ch_name":"模拟卷 3","no":120,"type":"single","q":"Which one of the following controls would be most effective in detecting zero-day attack attempts?","opts":["Signature-based intrusion detection","Anomaly-based intrusion detection","Strong patch management","Full-disk encryption"],"ans":"B","expl":"Anomaly-based intrusion detection systems may identify a zero-day vulnerability because it deviates from normal patterns of activity. Signature-based detection methods would\nnot be effective because there are no signatures for zero-day vulnerabilities. Strong patch management would not be helpful because, by definition, zero-day vulnerabilities do not\nhave patches available. Full-disk encryption would not detect an attack because it is not a detective control."},{"ch":"PT3","ch_name":"模拟卷 3","no":121,"type":"single","q":"Which one of the following is not a canon of the (ISC)2 Code of Ethics?","opts":["Protect society, the common good, necessary public trust and confidence, and the infra-structure.","Promptly report security vulnerabilities to relevant authorities.","Act honorably, honestly, justly, responsibly, and legally.","Provide diligent and competent service to principals."],"ans":"B","expl":"The four canons of the (ISC)2 Code of Ethics are to protect society, the common good, the necessary public trust and confidence and the infrastructure; act honorably, honestly, justly, responsibly and legally; provide diligent and competent service to principals; and advance and protect the profession."},{"ch":"PT3","ch_name":"模拟卷 3","no":122,"type":"single","q":"Which one of the following components should be included in an organization’s emergency response guidelines?","opts":["Secondary response procedures for incident responders","Long-term business continuity protocols","Activation procedures for the organization’s cold sites","Contact information for ordering equipment"],"ans":"A","expl":"The emergency response guidelines should include the immediate steps an organization should follow in response to an emergency situation. These include immediate response procedures, a list of individuals who should be notified of the emergency, and secondary response procedures for incident responders. They do not include long-term actions such as activating business continuity protocols, ordering equipment, or activating disaster recovery sites."},{"ch":"PT3","ch_name":"模拟卷 3","no":123,"type":"single","q":"When Jim enters his organization’s data center, he has to use a smart card and code to enter and is allowed through one set of doors. The first set of doors closes, and he must then use his card again to get through a second set, which locks behind him. What type of control is this, and what is it called?","opts":["A physical control; a one-way trapdoor","A logical control; a dual-swipe authorization","A directive control; a one-way access corridor","A preventive access control; a mantrap"],"ans":"D","expl":"A mantrap uses two sets of doors, only one of which can open at a time. A mantrap is a type of preventive access control, although its implementation is a physical control."},{"ch":"PT4","ch_name":"模拟卷 4","no":1,"type":"single","q":"What type of access control is intended to discover unwanted or unauthorized activity by providing information after the event has occurred?","opts":["Preventive","Corrective","Detective","Directive"],"ans":"C","expl":"Detective access controls operate after the fact and are intended to detect or discover unwanted access or activity. Preventive access controls are designed to prevent the activity from occurring, whereas corrective controls return an environment to its original status after an issue occurs. Directive access controls limit or direct the actions of subjects to ensure compliance with policies."},{"ch":"PT4","ch_name":"模拟卷 4","no":2,"type":"single","q":"Which one of the following presents the most complex decoy environment for an attacker to explore during an intrusion attempt?\nBen’s organization is adopting biometric authentication for their high-security building’s access control system. Using this chart, answer questions 3–5 about their adoption of the technology.","opts":["Honeypot","Darknet","Honeynet","Pseudoflaw"],"ans":"C","expl":"A honeypot is a decoy computer system used to bait intruders into attacking. A hon-eynet is a network of multiple honeypots that creates a more sophisticated environment for intruders to explore. A pseudoflaw is a false vulnerability in a system that may attract an attacker. A darknet is a segment of unused network address space that should have no network activity and, therefore, may be easily used to monitor for illicit activity."},{"ch":"PT4","ch_name":"模拟卷 4","no":3,"type":"single","q":"Ben’s company is considering configuring their systems to work at the level shown by point A on the diagram. What level are they setting the sensitivity to?","opts":["The FRR crossover","The FAR point","The CER","The CFR"],"ans":"C","expl":"The CER is the point where FAR and FRR cross over, and it is a standard assessment used to compare the accuracy of biometric devices.","scene":"Ben’s organization is adopting biometric authentication for their high-security building’s access control system. Using this chart about their adoption of the technology. FRR Sensitivity"},{"ch":"PT4","ch_name":"模拟卷 4","no":5,"type":"single","q":"What should Ben do if the FAR and FRR shown in this diagram do not provide an accept-able performance level for his organization’s needs?","opts":["Adjust the sensitivity of the biometric devices.","Assess other biometric systems to compare them.","Move the CER.","Adjust the FRR settings in software."],"ans":"B","expl":"CER is a standard used to assess biometric devices. If the CER for this device does not fit the needs of the organization, Ben should assess other biometric systems to find one with a lower CER. Sensitivity is already accounted for in CER charts, and moving the CER isn’t something Ben can do. FRR is not a setting in software, so Ben can’t use that as an option either.","scene":"Ben’s organization is adopting biometric authentication for their high-security building’s access control system. Using this chart about their adoption of the technology. FRR Sensitivity"},{"ch":"PT4","ch_name":"模拟卷 4","no":6,"type":"single","q":"Ed is tasked with protecting information about his organization’s customers, including their name, Social Security number, birthdate, and place of birth, as well as a variety of other information. What is this information known as?","opts":["PHI","PII","Personal protected data","PID"],"ans":"B","expl":"Personally identifiable information (PII) can be used to distinguish a person’s identity. Personal health information (PHI) includes data such as medical history, lab results, insur-ance information, and other details about a patient. Personal protected data is a made-up term, and PID is an acronym for process ID, the number associated with a running program or process."},{"ch":"PT4","ch_name":"模拟卷 4","no":7,"type":"single","q":"What software development lifecycle model is shown in the following illustration?","opts":["Spiral","Agile","Boehm","Waterfall"],"ans":"D","expl":"The figure shows the waterfall model, developed by Winston Royce. An important characteristic of this model is a series of sequential steps that include a feedback loop that allows the process to return one step prior to the current step when necessary."},{"ch":"PT4","ch_name":"模拟卷 4","no":8,"type":"single","q":"Encapsulation is the core concept that enables what type of protocol?","opts":["Bridging","Multilayer","Hashing","Storage"],"ans":"B","expl":"Encapsulation creates both the benefits and potential issues with multilayer protocols. Bridging can use various protocols but does not rely on encapsulation. Hashing and storage protocols typically do not rely on encapsulation as a core part of their functionality."},{"ch":"PT4","ch_name":"模拟卷 4","no":9,"type":"single","q":"Amanda wants to use contacts from the existing Gmail accounts that new users for her appli-cation already have. What protocol from the following options is used to provide secure dele-gated access for this type of use by many cloud providers?","opts":["Open ID","Kerberos","OAuth","SAML"],"ans":"C","expl":"OAuth is used to provide secure delegated access in scenarios exactly like this. OpenID is used to sign in using credentials from an identity provider to other services, such as when you log in with Google to other sites. SAML, or Security Assertion Markup Language, is used to make security assertions allowing authentication and authorizations between identity pro-viders and service providers. Kerberos is mostly used inside of organizations instead of for federation, as this question focuses on."},{"ch":"PT4","ch_name":"模拟卷 4","no":10,"type":"single","q":"Which one of the following metrics specifies the amount of time that business continuity planners find acceptable for the restoration of service after a disaster?","opts":["MTD","RTO","RPO","MTO"],"ans":"B","expl":"The recovery time objective (RTO) is the amount of time that it may take to restore a ser-vice after a disaster without unacceptable impact on the business. The RTO for each service is identified during a business impact assessment."},{"ch":"PT4","ch_name":"模拟卷 4","no":11,"type":"single","q":"Jill is working to procure new network hardware for her organization. She finds a gray market supplier that is importing the hardware from outside the country at a much lower price. What security concern is the most significant for hardware acquired this way?","opts":["The security of the hardware and firmware","Availability of support for the hardware and software","Whether the hardware is a legitimate product of the actual vendor","The age of the hardware"],"ans":"A","expl":"Each of these answers may be a concern, but the overriding security concern is if the hardware and firmware can be trusted or may have been modified. Original equipment man-ufacturers (OEMs) have business reasons to ensure the security of their product, but third parties in the supply chain may not feel the same pressure. Both availability of support and whether the hardware is legitimate are also concerns, but less immediate security concerns.\nFinally, hardware may be older than expected, or may be used, refurbished, or other-wise not new."},{"ch":"PT4","ch_name":"模拟卷 4","no":12,"type":"single","q":"What process is typically used to ensure data security for workstations that are being removed from service but that will be resold or otherwise reused?","opts":["Destruction","Erasing","Sanitization","Clearing"],"ans":"C","expl":"When done properly, a sanitization process fully ensures that data is not remnant on the system before it is reused. Clearing and erasing can both be failure prone, and of course, destruction wouldn’t leave a machine or device to reuse."},{"ch":"PT4","ch_name":"模拟卷 4","no":13,"type":"single","q":"Colleen is conducting a software test that is evaluating code for both security flaws and usability issues. She is working with the application from an end-user perspective and referencing the source code as she works her way through the product. What type of testing is Colleen conducting?","opts":["White box","Blue box","Gray box","Black box"],"ans":"C","expl":"In a gray-box test, the tester evaluates the software from a user perspective but has access to the source code as the test is conducted. White-box tests also have access to the source code but perform testing from a developer’s perspective. Black-box tests work from a user’s perspective but do not have access to source code. Blue boxes are a telephone hacking tool and not a software testing technique. Note: as language changes, new terms like zero knowledge, partial knowledge, and full knowledge are starting to replace white-, gray-, and black-box testing terms."},{"ch":"PT4","ch_name":"模拟卷 4","no":14,"type":"single","q":"Harold is looking for a software development methodology that will help with a major issue he is seeing in his organization. Currently, developers and operations staff do not work together and are often seen as taking problems and “throwing them over the fence” to the other team. What technology management approach is designed to alleviate this problem?","opts":["ITIL","Lean","ITSM","DevOps"],"ans":"D","expl":"The DevOps approach to technology management seeks to integrate software development, operations, and quality assurance in a cohesive effort. It specifically attempts to eliminate the issue of “throwing problems over the fence” by building collaborative relation-ships between members of the IT team."},{"ch":"PT4","ch_name":"模拟卷 4","no":15,"type":"single","q":"NIST Special Publication 800-92, the Guide to Computer Security Log Management, describes four types of common challenges to log management:\n• Many log sources\n• Inconsistent log content\n• Inconsistent timestamps\n• Inconsistent log formats\n• Which of the following solutions is best suited to solving these issues?","opts":["Implement SNMP for all logging devices.","Implement a SIEM.","Standardize on the Windows event log format for all devices and use NTP.","Ensure that logging is enabled on all endpoints using their native logging formats and set their local time correctly."],"ans":"B","expl":"A security information and event management (SIEM) tool is designed to centralize logs from many locations in many formats and to ensure that logs are read and analyzed despite differences between different systems and devices. The Simple Network Management Pro-tocol (SNMP) is used for some log messaging but is not a solution that solves all of these problems. Most non-Windows devices, including network devices among others, are not designed to use the Windows event log format, although using NTP for time synchroniza-tion is a good idea. Finally, local logging is useful, but setting clocks individually will result in drift over time and won’t solve the issue with many log sources."},{"ch":"PT4","ch_name":"模拟卷 4","no":16,"type":"single","q":"Mike has a flash memory card that he would like to reuse. The card contains sensitive information. What technique can he use to securely remove data from the card and allow its reuse?","opts":["Degaussing","Physical destruction","Cryptoshredding","Reformatting"],"ans":"C","expl":"Mike should use cryptoshredding, a secure data destruction process to protect this device. While degaussing is a valid secure data removal technique, it would not be effective in this case, since degaussing works only on magnetic media. Physical destruction would prevent the reuse of the device. Reformatting is not a valid secure data removal technique."},{"ch":"PT4","ch_name":"模拟卷 4","no":17,"type":"single","q":"Carlos is investigating the compromise of sensitive information in his organization. He believes that attackers managed to retrieve personnel information on all employees from the database and finds the following user-supplied input in a log entry for a web-based personnel management system:\n• Collins'&1=1;––\n• What type of attack took place, and how could it be prevented?","opts":["SQL injection, use of stored procedures","Buffer overflow, automatic buffer expansion","Cross-site scripting, turning on XSS prevention on the web server","Cross-site request forgery, requiring signed requests"],"ans":"A","expl":"The single quotation mark in the input field is a telltale sign that this is a SQL injection attack. The quotation mark is used to escape outside the SQL code’s input field, and the text that follows is used to directly manipulate the SQL command sent from the web application to the database."},{"ch":"PT4","ch_name":"模拟卷 4","no":18,"type":"single","q":"Which one of the following is a detailed, step-by-step document that describes the exact actions that individuals must complete?","opts":["Policy","Standard","Guideline","Procedure"],"ans":"D","expl":"Procedures are formal, mandatory documents that provide detailed, step-by-step actions required from individuals performing a task."},{"ch":"PT4","ch_name":"模拟卷 4","no":19,"type":"single","q":"What purpose are the CIS benchmarks frequently used for in organizations?","opts":["Secure coding standards","Performance testing","Baselining","Monitoring metrics"],"ans":"C","expl":"The CIS benchmarks are configuration baselines that are frequently used to assess the security settings or configuration for devices and software. Baselining is the process of config-uring and validating that a system meets security configuration guidelines or standards."},{"ch":"PT4","ch_name":"模拟卷 4","no":20,"type":"single","q":"Bryan has a set of sensitive documents that he would like to protect from public disclosure. He would like to use a control that, if the documents appear in a public forum, may be used to trace the leak back to the person who was originally given the document copy. What secu-rity control would best fulfill this purpose?","opts":["Digital signature","Document staining","Hashing","Watermarking"],"ans":"D","expl":"Watermarking alters a digital object to embed information about the source, in either a visible or hidden form. Digital signatures may identify the source of a document, but they are easily removed. Hashing would not provide any indication of the document source, since anyone could compute a hash value. Document staining is not a security control."},{"ch":"PT4","ch_name":"模拟卷 4","no":21,"type":"single","q":"Carlos is planning a design for a data center that will be constructed within a new four-story corporate headquarters. The building consists of a basement and three above-ground floors. What is the best location for the data center?","opts":["Basement","First floor","Second floor","Third floor"],"ans":"C","expl":"Data centers should be located in the core of a building. Locating it on lower floors makes it susceptible to flooding and physical break-ins. Locating it on the top floor makes it vulnerable to wind and roof damage."},{"ch":"PT4","ch_name":"模拟卷 4","no":22,"type":"single","q":"Chris is an information security professional for a major corporation, and as he is walking into the building, he notices that the door to a secure area has been left ajar. Physical security does not fall under his responsibility, but he takes immediate action by closing the door and informing the physical security team of his action. What principle is Chris demonstrating?","opts":["Due care","Crime prevention through environmental design","Separation of duties","Informed consent"],"ans":"A","expl":"The due care principle states that an individual should react in a situation using the same level of care that would be expected from any reasonable person. It is a very broad standard. Crime prevention through environmental design is a design concept that focuses on making environments less conducive to illicit or unwanted actions. Separation of duties splits duties to ensure that a malicious actor cannot perform actions on their own like making a purchase and approving it. Informed consent is a term used in the medical industry that requires that a person’s permission is required and that they must be aware of what the consequences of their actions could be."},{"ch":"PT4","ch_name":"模拟卷 4","no":23,"type":"single","q":"Which one of the following investigation types always uses the beyond-a-reasonable-doubt standard of proof?","opts":["Civil investigation","Criminal investigation","Operational investigation","Regulatory investigation"],"ans":"B","expl":"Criminal investigations have high stakes with severe punishment for the offender that may include incarceration. Therefore, they use the strictest standard of evidence of all investiga-tions: beyond a reasonable doubt. Civil investigations use a preponderance-of-the-evidence standard. Regulatory investigations may use whatever standard is appropriate for the venue where the evidence will be heard. This may include the beyond-a-reasonable-doubt standard, but it is not always used in regulatory investigations in the United States. Operational investi-gations do not use a standard of evidence."},{"ch":"PT4","ch_name":"模拟卷 4","no":24,"type":"single","q":"Kristen wants to use multiple processing sites for her data, but does not want to pay for a full data center. Which of the following options would you recommend as her best option if she wants to be able to quickly migrate portions of her custom application environment to facil-ities in multiple countries without having to wait to ship or acquire hardware?","opts":["A cloud PaaS vendor","A hosted data center provider","A cloud IaaS vendor","A data center vendor that provides rack, power, and remote hands services"],"ans":"C","expl":"A cloud IaaS vendor will allow Kristen to set up infrastructure as quickly as she can deploy and pay for it. A PaaS vendor provides a platform that would require her to migrate her custom application to it, likely taking longer than a hosted data center provider. A data center vendor that provides rack, power, and remote hands assistance fails the test based on Kristen’s desire to not have to acquire or ship hardware."},{"ch":"PT4","ch_name":"模拟卷 4","no":25,"type":"single","q":"What type of alternate processing facility contains the hardware necessary to restore opera-tions but does not have a current copy of data?","opts":["Hot site","Warm site","Cold site","Mobile site"],"ans":"B","expl":"Warm sites contain the hardware necessary to restore operations but do not have a current copy of data."},{"ch":"PT4","ch_name":"模拟卷 4","no":26,"type":"single","q":"Which one of the following terms describes a period of momentary high voltage?","opts":["Sag","Brownout","Spike","Surge"],"ans":"C","expl":"A power spike is a momentary period of high voltage. A surge is a prolonged period of high voltage. Sags and brownouts are periods of low voltage."},{"ch":"PT4","ch_name":"模拟卷 4","no":27,"type":"single","q":"Greg needs to label drives used for his company’s medical insurance claims database. What data label from the following list best matches the type of data he is dealing with?","opts":["PII","Secret","Business confidential","PHI"],"ans":"D","expl":"Medical insurance claims will contain private health information, or PHI. Greg should label the drives as containing PHI and then ensure that they are handled according to his organization’s handling standards for that type of data."},{"ch":"PT4","ch_name":"模拟卷 4","no":28,"type":"single","q":"The Open Shortest Path First (OSPF) protocol is a routing protocol that keeps a map of all connected remote networks and uses that map to select the shortest path to a remote destina-tion. What type of routing protocol is OSPF?","opts":["Link state","Shortest path first","Link mapping","Distance vector"],"ans":"A","expl":"OSPF is a link state protocol. Link state protocols maintain a topographical map of all connected networks and preferentially select the shortest path to remote networks for traffic. A distance vector protocol would map the direction and distance in hops to a remote net-work, whereas shortest path first and link mapping are not types of routing protocols."},{"ch":"PT4","ch_name":"模拟卷 4","no":29,"type":"single","q":"Selah wants to ensure that vehicles cannot crash through into her company’s entryway and front lobby while still remaining accessible to pedestrians and wheelchairs or other mobility devices. What physical security control is best suited to this purpose?\nFor questions 30–34, please refer to the following scenario:","opts":["Fences","Bollards","Walls","Stairs"],"ans":"B","expl":"Bollards are physical security solutions that are short and strong posts or similar solutions intended to stop vehicles from crashing through or passing an area. Bollards can be used\nto allow pedestrians and mobility devices to pass while stopping vehicles. Fences and walls will prevent individuals from passing through them, while stairs are challenging for most mobility devices."},{"ch":"PT4","ch_name":"模拟卷 4","no":30,"type":"single","q":"What backup should Tara apply to the server first?","opts":["Sunday’s full backup","Monday’s differential backup","Tuesday’s differential backup","Wednesday’s differential backup"],"ans":"A","expl":"Tara first must achieve a system baseline. She does this by applying the most recent full backup to the new system. This is Sunday’s full backup. Once Tara establishes this baseline,\nshe may then proceed to apply differential backups to bring the system back to a more recent state.","scene":"Concho Controls is a midsize business focusing on building automation systems. It hosts a set of local file servers in its on-premises data center that store customer proposals, building plans, product information, and other data that is critical to their business operations. Tara works in the Concho Controls IT department and is responsible for designing and implementing the organization’s backup strategy, among other tasks. She currently conducts full backups every Sunday evening at 8 p.m. and differential backups on Monday through Friday at noon. Concho experiences a server failure at 3 p.m. on Wednesday. Tara rebuilds the server and wants to restore data from the backups."},{"ch":"PT4","ch_name":"模拟卷 4","no":32,"type":"single","q":"In this backup approach, some data may be irretrievably lost. How long is the time period where any changes made will have been lost?","opts":["3 hours.","5 hours.","8 hours.","No data will be lost."],"ans":"A","expl":"In this scenario, the differential backup was made at noon, and the server failed at 3 p.m. Therefore, any data modified or created between noon and 3 p.m. on Wednesday will not be contained on any backup and will be irretrievably lost.","scene":"Concho Controls is a midsize business focusing on building automation systems. It hosts a set of local file servers in its on-premises data center that store customer proposals, building plans, product information, and other data that is critical to their business operations. Tara works in the Concho Controls IT department and is responsible for designing and implementing the organization’s backup strategy, among other tasks. She currently conducts full backups every Sunday evening at 8 p.m. and differential backups on Monday through Friday at noon. Concho experiences a server failure at 3 p.m. on Wednesday. Tara rebuilds the server and wants to restore data from the backups."},{"ch":"PT4","ch_name":"模拟卷 4","no":34,"type":"single","q":"If Tara made the change from differential to incremental backups and we assume that the same amount of information changes each day, which one of the following files would be the largest?","opts":["Monday’s incremental backup.","Tuesday’s incremental backup.","Wednesday’s incremental backup.","All three will be the same size."],"ans":"D","expl":"Each incremental backup contains only the information changed since the most recent full or incremental backup. If we assume that the same amount of information changes every day, each of the incremental backups would be roughly the same size.","scene":"Concho Controls is a midsize business focusing on building automation systems. It hosts a set of local file servers in its on-premises data center that store customer proposals, building plans, product information, and other data that is critical to their business operations. Tara works in the Concho Controls IT department and is responsible for designing and implementing the organization’s backup strategy, among other tasks. She currently conducts full backups every Sunday evening at 8 p.m. and differential backups on Monday through Friday at noon. Concho experiences a server failure at 3 p.m. on Wednesday. Tara rebuilds the server and wants to restore data from the backups."},{"ch":"PT4","ch_name":"模拟卷 4","no":36,"type":"single","q":"Bob has been tasked with writing a policy that describes how long data should be kept and when it should be purged. What concept does this policy deal with?","opts":["Data remanence","Record retention","Data redaction","Audit logging"],"ans":"B","expl":"Record retention ensures that data is kept and maintained as long as it is needed and that it is purged when it is no longer necessary. Data remanence occurs when data is left behind after an attempt is made to remove it, whereas data redaction is not a technical term used\nto describe this effort. Finally, audit logging may be part of the records retained but doesn’t describe the lifecycle of data."},{"ch":"PT4","ch_name":"模拟卷 4","no":37,"type":"single","q":"Which component of IPsec provides authentication, integrity, and nonrepudiation?","opts":["L2TP","Encapsulating Security Payload","Encryption Security Header","Authentication Header"],"ans":"D","expl":"The Authentication Header provides authentication, integrity, and nonrepudiation for IPsec connections. The Encapsulating Security Payload provides encryption and thus pro-vides confidentiality. It can also provide limited authentication. L2TP is an independent VPN protocol, and Encryption Security Header is a made-up term."},{"ch":"PT4","ch_name":"模拟卷 4","no":38,"type":"single","q":"Renee notices that a system on her network recently received connection attempts on all 65,536 TCP ports from a single system during a short period of time. What type of attack did Renee most likely experience?","opts":["Denial-of-service","Reconnaissance","Malicious insider","Compromise"],"ans":"B","expl
