ess purpose.","scene":"As shown in the following security lifecycle diagram (loosely based on the NIST reference architecture), NIST uses a five-step process for risk management. Using your knowledge of data roles and practices, answer the following questions based on the NIST frame-work process."},{"ch":"D2","ch_name":"域2 资产安全","no":86,"type":"single","q":"If the systems that are being assessed all handle credit card information (and no other sensitive data), at what step would the PCI DSS first play an important role?","opts":["Step 1","Step 2","Step 3","Step 4"],"ans":"B","expl":"PCI DSS provides a set of required security controls and standards. Step 2 would be guided by the requirements of PCI DSS. PCI DSS will not greatly influence step1 because all of the systems handle credit card information, making PCI DSS apply to all systems covered. Steps 3 and 4 will be conducted after PCI DSS has guided the decisions in step 2.","scene":"As shown in the following security lifecycle diagram (loosely based on the NIST reference architecture), NIST uses a five-step process for risk management. Using your knowledge of data roles and practices, answer the following questions based on the NIST frame-work process."},{"ch":"D2","ch_name":"域2 资产安全","no":87,"type":"single","q":"What data security role is primarily responsible for step 5?","opts":["Data owners","Data processors","Custodians","Users"],"ans":"C","expl":"Custodians are tasked with the day-to-day monitoring of the integrity and security of data. Step 5 requires monitoring, which is a custodial task. A data owner may grant rights to custodians but will not be responsible for conducting monitoring. Data processors process data on behalf of the data controller, and a user simply uses the data via a computing system.","scene":"As shown in the following security lifecycle diagram (loosely based on the NIST reference architecture), NIST uses a five-step process for risk management. Using your knowledge of data roles and practices, answer the following questions based on the NIST frame-work process."},{"ch":"D2","ch_name":"域2 资产安全","no":88,"type":"single","q":"Susan’s organization performs a secure disk wipe process on hard drives before they are sent to a third-party organization to be shredded. What issue is her organization attempt-ing to avoid?","opts":["Data retention that is longer than defined in policy","Mishandling of drives by the third party","Classification mistakes","Data permanence"],"ans":"B","expl":"Susan’s organization is limiting its risk by sending drives that have been sanitized before they are destroyed. This limits the possibility of a data breach if drives are mishandled by the third party, allowing them to be stolen, resold, or simply copied. The destruction of the drives will handle any issues with data remanence, while classification mistakes are not important\nif the drives have been destroyed. Wiping the data before destruction does not make a mean-ingful difference for data retention policy concerns. Data permanence and the life span of the data are not important on a destroyed drive."},{"ch":"D2","ch_name":"域2 资产安全","no":89,"type":"single","q":"Mike wants to track hardware assets as devices and equipment are moved throughout his organization. What type of system can help do this without requiring staff to individually check bar codes or serial numbers?","opts":["A visual inventory","WiFi MAC address tracking","RFID tags","Steganography"],"ans":"C","expl":"RFID tags are a common solution for tracking hardware assets and equipment. They can be queried wirelessly at varying ranges depending on the tags and may be built-in to hand-held readers or even included in doorways or arches to track items as they enter or leave a facility. Visual inventory relies on staff checking items, MAC addresses are hardware addresses for networked devices and not every asset in inventory is likely to have a wireless network capability—or to be on! Steganography is hiding messages in images and doesn’t help at all with inventory."},{"ch":"D2","ch_name":"域2 资产安全","no":90,"type":"single","q":"Retaining and maintaining information for as long as it is needed is known as what?","opts":["Data storage policy","Data storage","Asset maintenance","Record retention"],"ans":"D","expl":"Record retention is the process of retaining and maintaining information for as long as it is needed. A data storage policy describes how and why data is stored, while data storage is the process of actually keeping the data. Asset maintenance is a noninformation-security-related process for maintaining physical assets."},{"ch":"D2","ch_name":"域2 资产安全","no":91,"type":"single","q":"Which of the following activities is not a consideration during data classification?","opts":["Who can access the data","What the impact would be if the data was lost or breached","How much the data cost to create","What protection regulations may be required for the data"],"ans":"C","expl":"The cost of the data is not directly included in the classification process. Instead, the impact to the organization if the data were exposed or breached is considered. Who can access the data and what regulatory or compliance requirements cover the data are also important considerations."},{"ch":"D2","ch_name":"域2 资产安全","no":92,"type":"single","q":"What type of encryption is typically used for data at rest?","opts":["Asymmetric encryption","Symmetric encryption","DES","OTP"],"ans":"B","expl":"Symmetric encryption like AES is typically used for data at rest. Asymmetric encryption is often used during transactions or communications when the ability to have public and private keys is necessary. DES is an outdated encryption standard, and OTP is the acronym for onetime password."},{"ch":"D2","ch_name":"域2 资产安全","no":93,"type":"single","q":"Which data role is tasked with apply rights that provide appropriate access to staff members?","opts":["Data processors","Business owners","Custodians","Administrators"],"ans":"D","expl":"Administrators have the rights to apply the permissions to access and handle data. Custodians are trusted with day-to-day data handling tasks. Business owners are typically system or project owners, and data processors are systems used to process data."},{"ch":"D2","ch_name":"域2 资产安全","no":94,"type":"single","q":"What element of asset security is often determined by identifying an asset’s owner?","opts":["It identifies the individual(s) responsible for protecting the asset.","It provides a law enforcement contact in case of theft.","It helps establish the value of the asset.","It determines the security classification of the asset."],"ans":"A","expl":"Knowing the asset’s owner also tells you who is responsible for protecting the asset or for delegating that task. While asset owners may be law enforcement contacts, this is not a critical item for asset security. It does not directly help you to establish the value of the asset or to set security classification levels for an asset."},{"ch":"D2","ch_name":"域2 资产安全","no":95,"type":"single","q":"Fred is preparing to send backup tapes off-site to a secure third-party storage facility. What steps should Fred take before sending the tapes to that facility?","opts":["Ensure that the tapes are handled the same way the original media would be handled based on their classification.","Increase the classification level of the tapes because they are leaving the possession of the company.","Purge the tapes to ensure that classified data is not lost.","Decrypt the tapes in case they are lost in transit."],"ans":"A","expl":"Tapes may be vulnerable to theft or loss in transit. That means that tapes that are leaving their normal storage facility should be handled according to the organization’s classification schemes and handling requirements. Purging the tapes would cause the loss of data, while increasing the classification level of the tapes. The tapes should be encrypted rather than decrypted."},{"ch":"D2","ch_name":"域2 资产安全","no":96,"type":"single","q":"Which of the following does not describe data in motion?","opts":["Data on a backup tape that is being shipped to a storage facility","Data in a TCP packet","Data in an e-commerce transaction","Data in files being copied between locations"],"ans":"A","expl":"The correct answer is the tape that is being shipped to a storage facility. You might think that the tape in shipment is “in motion,” but the concept is that the data is not being accessed and is instead in storage rather than being sent across a network. Data in a TCP packet, in an e-commerce transaction, or in local RAM is in motion and is actively being used."},{"ch":"D2","ch_name":"域2 资产安全","no":97,"type":"single","q":"A new law is passed that would result in significant financial harm to your company if the data that it covers was stolen or inadvertently released. What should your organization do about this?","opts":["Select a new security baseline.","Relabel the data.","Encrypt all of the data at rest and in transit.","Review its data classifications and classify the data appropriately."],"ans":"D","expl":"When the value of data changes due to legal, compliance, or business reasons, review-ing classifications and reclassifying the data is an appropriate response. Once the review is complete, data can be reclassified and handled according to its classification level. Simply relabeling the data avoids the classification process and may not result in the data being handled appropriately. Similarly, selecting a new baseline or simply encrypting the data may not handle all of the needs that the changes affecting the data create."},{"ch":"D2","ch_name":"域2 资产安全","no":98,"type":"multi","q":"Which of the following data roles are typically found inside of a company instead of as a third-party contracting relationship? (Select all that apply.)","opts":["Data owners","Data controllers","Data custodians","Data processors"],"ans":"ABC","expl":"Data owners, controllers, and custodians are typically found inside of a company, while data processors are typically third parties."},{"ch":"D2","ch_name":"域2 资产安全","no":99,"type":"single","q":"What commercial data classification is most appropriate for data contained on corporate websites?","opts":["Private","Sensitive","Public","Proprietary"],"ans":"C","expl":"Public data is just that—information that can be made public without any harm to the organization, and in fact, it is often information that the organization wants to make avail-able. Private information should stay private inside of an organization, sensitive data may cause damage to the mission of the organization if exposed, and proprietary or confidential information is the most sensitive data that an organization wants to protect."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":1,"type":"single","q":"Matthew is the security administrator for a consulting firm and must enforce access controls that restrict users’ access based upon their previous activity. For example, once a consultant accesses data belonging to Acme Cola, a consulting client, they may no longer access data belonging to any of Acme’s competitors. What security model best fits Matthew’s needs?","opts":["Clark-Wilson","Biba","Bell-LaPadula","Brewer-Nash"],"ans":"D","expl":"The Brewer-Nash model allows access controls to change dynamically based upon a user’s actions. It is often used in environments like Matthew’s to implement a “Chinese wall” between data belonging to different clients."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":2,"type":"single","q":"Referring to the figure shown here, what is the earliest stage of a fire where it is possible to use detection technology to identify it?\n• Stage 1: Incipient","opts":["Incipient","Smoke","Flame","Heat"],"ans":"A","expl":"Fires may be detected as early as the incipient stage. During this stage, air ionization takes place, and specialized incipient fire detection systems can identify these changes to provide early warning of a fire."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":4,"type":"single","q":"Harry would like to retrieve a lost encryption key from a database that uses m of n control, with m = 4 and n = 8. What is the minimum number of escrow agents required to retrieve the key?","opts":["2","4","8","12"],"ans":"B","expl":"In an m of n control system, at least m of n possible escrow agents must collaborate to retrieve an encryption key from the escrow database."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":5,"type":"single","q":"Fran’s company is considering purchasing a web-based email service from a vendor and elim-inating its own email server environment as a cost-saving measure. What type of cloud com-puting environment is Fran’s company considering?","opts":["SaaS","IaaS","CaaS","PaaS"],"ans":"A","expl":"This is an example of a vendor offering a fully functional application as a web-based ser-vice. Therefore, it fits under the definition of software as a service (SaaS). In infrastructure as a service (IaaS), compute as a service (CaaS), and platform as a service (PaaS) approaches, the customer provides their own software. In this example, the vendor is providing the email software, so none of those choices is appropriate."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":6,"type":"single","q":"Bob is a security administrator with the U.S. federal government and wants to choose a digital signature approach that is an approved part of the federal Digital Signature Standard under FIPS 186-4. Which one of the following encryption algorithms is not an acceptable choice for use in digital signatures?","opts":["DSA","HAVAL","RSA","ECDSA"],"ans":"B","expl":"The Digital Signature Standard approves three encryption algorithms for use in digital signatures: the Digital Signature Algorithm (DSA); the Rivest, Shamir, Adleman (RSA) algorithm; and the Elliptic Curve DSA (ECDSA) algorithm. HAVAL is a hash function, not an encryption algorithm. While hash functions are used as part of the digital signature process, they do not provide encryption."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":7,"type":"single","q":"Harry would like to access a document owned by Sally and stored on a file server. Applying the subject/object model to this scenario, who or what is the subject of the resource request?","opts":["Harry","Sally","Server","Document"],"ans":"A","expl":"In the subject/object model of access control, the user or process making the request for a resource is the subject of that request. In this example, Harry is requesting resource access and is, therefore, the subject."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":8,"type":"single","q":"Michael is responsible for forensic investigations and is investigating a medium-severity security incident that involved the defacement of a corporate website. The web server in question ran on a virtualization platform, and the marketing team would like to get the web-site up and running as quickly as possible. What would be the most reasonable next step for Michael to take?","opts":["Keep the website offline until the investigation is complete.","Take the virtualization platform offline as evidence.","Take a snapshot of the compromised system and use that for the investigation.","Ignore the incident and focus on quickly restoring the website."],"ans":"C","expl":"Michael should conduct his investigation, but there is a pressing business need to bring the website back online. The most reasonable course of action would be to take a snapshot of the compromised system and use the snapshot for the investigation, restoring the website to operation as quickly as possible while using the results of the investigation to improve the security of the site."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":9,"type":"single","q":"Helen is a software engineer and is developing code that she would like to restrict to running within an isolated sandbox for security purposes. What software development technique is Helen using?","opts":["Bounds","Input validation","Confinement","TCB"],"ans":"C","expl":"Using a sandbox is an example of confinement, where the system restricts the access of a particular process to limit its ability to affect other processes running on the\nsame system."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":10,"type":"single","q":"What concept describes the degree of confidence that an organization has that its controls satisfy security requirements?","opts":["Trust","Credentialing","Verification","Assurance"],"ans":"D","expl":"Assurance is the degree of confidence that an organization has that its security controls are correctly implemented. It must be continually monitored and reverified."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":11,"type":"single","q":"What type of security vulnerability are developers most likely to introduce into code when they seek to facilitate their own access, for testing purposes, to software they developed?","opts":["Maintenance hook","Cross-site scripting","SQL injection","Buffer overflow"],"ans":"A","expl":"Maintenance hooks, otherwise known as backdoors, provide developers with easy access to a system, bypassing normal security controls. If not removed prior to finalizing code, they pose a significant security vulnerability if an attacker discovers the maintenance hook."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":12,"type":"single","q":"In the figure shown here, Sally is blocked from reading the file due to the Biba integrity model. Sally has a Secret security clearance, and the file has a Confidential classification. What principle of the Biba model is being enforced?\n• Read Request","opts":["Simple Security Property","Simple Integrity Property","*-Security Property","*-Integrity Property"],"ans":"B","expl":"The Simple Integrity Property states that an individual may not read a file classified at a lower security level than the individual’s security clearance."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":13,"type":"single","q":"Tom is responsible for maintaining the security of systems used to control industrial processes located within a power plant. What term is used to describe these systems?","opts":["POWER","SCADA","HAVAL","COBOL"],"ans":"B","expl":"Supervisory control and data acquisition (SCADA) systems are used to control and gather data from industrial processes. They are commonly found in power plants and other industrial environments."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":14,"type":"single","q":"Sonia recently removed an encrypted hard drive from a laptop and moved it to a new device because of a hardware failure. She is having difficulty accessing encrypted content on the drive despite the fact that she knows the user’s password. What hardware security feature is likely causing this problem?","opts":["TCB","TPM","NIACAP","RSA"],"ans":"B","expl":"The Trusted Platform Module (TPM) is a hardware security technique that stores an encryption key on a chip on the motherboard and prevents someone from accessing an encrypted drive by installing it in another computer."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":15,"type":"single","q":"Chris wants to verify that a software package that he downloaded matches the original ver-sion. What hashing tool should he use if he believes that technically sophisticated attackers may have replaced the software package with a version containing a backdoor?\nFor questions 16–19, please refer to the following scenario:","opts":["MD5","3DES","SHA1","SHA 256"],"ans":"D","expl":"Intentional collisions have been created with MD5, and a real-world collision attack against SHA 1was announced in early 2017. 3DES is not a hashing tool, leaving SHA 256 (sometimes called SHA 2) as the only real choice that Chris has in this list."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":16,"type":"single","q":"If Alice wants to send Bob a message that is encrypted for confidentiality, what key does she use to encrypt the message?","opts":["Alice’s public key","Alice’s private key","Bob’s public key","Bob’s private key"],"ans":"C","expl":"In an asymmetric cryptosystem, the sender of a message encrypts the message using the recipient’s public key. The recipient may then decrypt that message using their own private key, which only they should possess.","scene":"Alice and Bob would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":17,"type":"single","q":"When Bob receives the encrypted message from Alice, what key does he use to decrypt the message’s plaintext content?","opts":["Alice’s public key","Alice’s private key","Bob’s public key","Bob’s private key"],"ans":"D","expl":"When Bob receives the message, he uses his own private key to decrypt it. Since he is the only one with his private key, he is the only one who should be able to decrypt it, thus pre-serving confidentiality.","scene":"Alice and Bob would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":18,"type":"single","q":"Which one of the following keys would Bob not possess in this scenario?","opts":["Alice’s public key","Alice’s private key","Bob’s public key","Bob’s private key"],"ans":"B","expl":"Each user retains their private key as secret information. In this scenario, Bob would only have access to his own private key and would not have access to the private key of Alice or any other user.","scene":"Alice and Bob would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":19,"type":"single","q":"Alice would also like to digitally sign the message that she sends to Bob. What key should she use to create the digital signature?","opts":["Alice’s public key","Alice’s private key","Bob’s public key","Bob’s private key"],"ans":"B","expl":"Alice creates the digital signature using her own private key. Then Bob, or any other user, can verify the digital signature using Alice’s public key.","scene":"Alice and Bob would like to use an asymmetric cryptosystem to communicate with each other. They are located in different parts of the country but have exchanged encryption keys by using digital certificates signed by a mutually trusted certificate authority."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":20,"type":"single","q":"What name is given to the random value added to a password in an attempt to defeat rainbow table attacks?","opts":["Hash","Salt","Extender","Rebar"],"ans":"B","expl":"The salt is a random value added to a password before it is hashed by the operating system. The salt is then stored in a password file with the hashed password. This increases the complexity of cryptanalytic attacks by negating the usefulness of attacks that use precom-puted hash values, such as rainbow tables."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":21,"type":"single","q":"Which one of the following is not an attribute of a hashing algorithm?","opts":["They require a cryptographic key.","They are irreversible.","It is very difficult to find two messages with the same hash value.","They take variable-length input."],"ans":"A","expl":"Hash functions do not include any element of secrecy and, therefore, do not require a cryptographic key."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":22,"type":"single","q":"What type of fire suppression system fills with water after a valve opens when the initial stages of a fire are detected and then requires a sprinkler head heat activation before dis-pensing water?","opts":["Wet pipe","Dry pipe","Deluge","Preaction"],"ans":"D","expl":"A preaction fire suppression system activates in two steps. The pipes fill with water once the early signs of a fire are detected. The system does not dispense water until heat sensors on the sprinkler heads trigger the second phase."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":23,"type":"single","q":"Susan would like to configure IPsec in a manner that provides confidentiality for the content of packets. What component of IPsec provides this capability?","opts":["AH","ESP","IKE","ISAKMP"],"ans":"B","expl":"The Encapsulating Security Payload (ESP) protocol provides confidentiality and integrity for packet contents. It encrypts packet payloads and provides limited authentication and pro-tection against replay attacks."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":24,"type":"single","q":"Which one of the following cryptographic goals protects against the risks posed when a device is lost or stolen?","opts":["Nonrepudiation","Authentication","Integrity","Confidentiality"],"ans":"D","expl":"The greatest risk when a device is lost or stolen is that sensitive data contained on the device will fall into the wrong hands. Confidentiality protects against this risk.\nNonrepudiation is when the recipient of a message can prove the originator’s identity to a third party. Authentication is a means of proving one’s identity. Integrity demonstrates that information has not been modified since transmission."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":25,"type":"single","q":"Joanna wants to review the status of the industrial control systems her organization uses for building control. What type of systems should she inquire about access to?","opts":["SCADA","DSS","BAS","ICS-CSS"],"ans":"A","expl":"Supervisory Control and Data Acquisition systems, or SCADA systems, provide a graphical interface to monitor industrial control systems (ICS). Joanna should ask about access to her organization’s SCADA systems."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":26,"type":"single","q":"In the figure shown here, Harry’s request to write to the data file is blocked. Harry has a Secret security clearance, and the data file has a Confidential classification. What principle of the Bell-LaPadula model blocked this request?\n• Write Request","opts":["Simple Security Property","Simple Integrity Property","*-Security Property","Discretionary Security Property"],"ans":"C","expl":"The *-Security Property states that an individual may not write to a file at a lower classification level than that of the individual. This is also known as the confine-ment property."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":27,"type":"single","q":"Florian and Tobias would like to begin communicating using a symmetric cryptosystem, but they have no prearranged secret and are not able to meet in person to exchange keys. What algorithm can they use to securely exchange the secret key?","opts":["IDEA","Diffie-Hellman","RSA","MD5"],"ans":"B","expl":"The Diffie-Hellman algorithm allows for the secure exchange of symmetric encryption keys over a public network. IDEA and RSA are encryption algorithms. MD5 is a hash-ing function."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":28,"type":"single","q":"Carl’s organization recently underwent a user access review. At the conclusion of the review, the auditors noted several cases of privilege creep. What security principle was violated?","opts":["Fail securely","Keep it simple","Trust but verify","Least privilege"],"ans":"D","expl":"The principle of least privilege says that an employee should have only the minimum necessary privileges required to perform their jobs. Privilege creep indicates that an employee has accumulated permissions that they no longer require, indicating a violation of the least privilege principle. The trust but verify principle says that organizations should use auditing to ensure that control objectives are met. The fail securely principle says that security con-trols should default to a secure state in the event of a control failure. The keep it simple prin-ciple says that security controls and other technologies should remain as simple as possible while still completing their objectives."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":29,"type":"single","q":"Matt’s organization recently adopted a zero-trust network architecture. Under this approach, which one of the following criteria would be LEAST appropriate to use when granting a sub-ject access to resources?","opts":["Password","Two-factor authentication","IP address","Biometric scan"],"ans":"C","expl":"In a zero-trust network architecture, access control decisions should never be made based upon a system’s location on the network. Therefore, an IP address should never be used and would be the least appropriate of these options. While the other options have differing levels of security (two-factor authentication is clearly stronger than a pass-word or biometrics alone), they do not violate the principles of a zero-trust network architecture."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":30,"type":"single","q":"Colin is the chief privacy officer for a nonprofit organization and is assisting with the team’s transition to a Privacy by Design approach. Under this approach, which of the following principles should the team embrace?","opts":["Proactive, not reactive","Privacy as the default setting","End-to-end security","Defense in depth"],"ans":"D","expl":"While defense in depth is a strong security principle, it is not a component of Privacy by Design. The following are the seven principles of the Privacy by Design model:\nProactive, not reactive; preventive, not remedial\nPrivacy as the default setting\nPrivacy embedded into design\nFull functionality—positive-sum, not zero-sum\nEnd-to-end security—full lifecycle protection\nVisibility and transparency—keep it open\nRespect for user privacy—keep it user-centric"},{"ch":"D3","ch_name":"域3 安全架构与工程","no":31,"type":"single","q":"What cryptographic principle stands behind the idea that cryptographic algorithms should be open to public inspection?","opts":["Security through obscurity","Kerckhoffs’ principle","Defense in depth","Heisenburg principle"],"ans":"B","expl":"Kerckhoffs’ principle says that a cryptographic system should be secure even if everything about the system, except the key, is public knowledge."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":32,"type":"single","q":"Ryan is developing a physical access plan for his organization’s data center and wants to implement the security control indicated by the arrow in this diagram. What is the name of this control?","opts":["Mantrap","Turnstile","Intrusion prevention system","Portal"],"ans":"A","expl":"Mantraps use two sets of doors to control access to a facility. This may be used to pre-vent piggybacking by monitoring use of the mantrap to allow only a single individual to enter a facility at a time. They may also be used to allow manual inspection of individuals\nor perform other security screening. Mantraps are also commonly known as access control vestibules."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":33,"type":"single","q":"Which one of the following does not describe a standard physical security requirement for wiring closets?","opts":["Place only in areas monitored by security guards.","Do not store flammable items in the closet.","Use sensors on doors to log entries.","Perform regular inspections of the closet."],"ans":"A","expl":"While it would be ideal to have wiring closets in a location where they are monitored by security staff, this is not feasible in most environments. Wiring closets must be distributed geographically in multiple locations across each building used by an organization."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":34,"type":"single","q":"In the figure shown here, Sally is blocked from writing to the data file by the Biba integrity model. Sally has a Secret security clearance, and the file is classified Top Secret. What prin-ciple is preventing her from writing to the file?\n• Write Request","opts":["Simple Security Property","Simple Integrity Property","*-Security Property","*-Integrity Property"],"ans":"D","expl":"The *-Integrity Property states that a subject cannot modify an object at a higher integrity level than that possessed by the subject."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":35,"type":"single","q":"Lana recently implemented a new process in her organization where managers who are responsible for granting users access to a system are not permitted to participate in access reviews. What principle is she enforcing?","opts":["Two-person control","Least privilege","Privilege creep","Separation of duties"],"ans":"D","expl":"The separation of duties principle says that no employee should have permission to perform two tasks that, when combined, would pose a security risk. In this situation, an employee auditing their own work would create a conflict of interest, so Lana has imple-mented a separation of duties. Two-person control is closely related, but it requires that two different employees approve an action. If she required that two managers approve new accounts, that would be an example of two-person control."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":36,"type":"multi","q":"Which of the following statements about system development are correct? (Select all that apply.)","opts":["Systems should be designed to operate in a secure manner if the user performs no other configuration.","Systems should be designed to fall back to a secure state if they experience an error.","Systems should be designed to incorporate security as a design feature.","Systems should be designed in a manner that keeps their functionality as simple as possible."],"ans":"ABCD","expl":"All of these statements are correct. The idea that systems should be designed to operate in a secure manner if the user performs no other configuration is the secure defaults principle. The idea that systems should be designed to fall back to a secure state if they expe-rience an error is the fail securely principle. The idea that systems should be designed to incorporate security as a design feature is the security by design principle. The idea that sys-tems should be designed in a manner that keeps their functionality as simple as possible is the keep it simple principle."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":37,"type":"single","q":"Alan is reviewing a system that has been assigned the EAL1 evaluation assurance level under the Common Criteria. What is the degree of assurance that he may have about the system?","opts":["It has been functionally tested.","It has been structurally tested.","It has been formally verified, designed, and tested.","It has been methodically designed, tested, and reviewed."],"ans":"A","expl":"EAL1 assurance applies when the system in question has been functionally tested. It is the lowest level of assurance under the Common Criteria."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":38,"type":"single","q":"Jake works for a research organization that is seeking to deploy a grid computing system that will perform cycle scavenging on user workstations to conduct research tasks that require high-performance computing. What is the most significant risk associated with this operation?","opts":["Data confidentiality","Isolation breach","Data integrity","Data availability"],"ans":"B","expl":"The system can be designed in a manner that protects the confidentiality, integrity, and availability of data. The research workstations included in the grid are from internal users, minimizing the risk of distributing the data. However, an isolation breach in the distributed computing client could be catastrophic, allowing someone who compromises the controller to assume control of every device in the organization."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":39,"type":"single","q":"Eimear’s software development team uses an approach that creates many discrete software objects and then binds them together using APIs. What term best describes this architecture?","opts":["Microservices","Function-as-a-service","Containerization","Virtualization"],"ans":"A","expl":"This is an example of a microservices architecture. Each of the component microservices performs a discrete task and then communicates with other microservices using APIs. This might be accomplished using FaaS cloud computing, containerization, and/or virtualization, but there is no indication whether those services are being used in the scenario."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":40,"type":"single","q":"Adam recently configured permissions on an NTFS filesystem to describe the access that dif-ferent users may have to a file by listing each user individually. What did Adam create?","opts":["An access control list","An access control entry","Role-based access control","Mandatory access control"],"ans":"A","expl":"Adam created a list of individual users who may access the file. This is an access control list, which consists of multiple access control entries. It includes the names of users, so it is not role-based, and Adam was able to modify the list, so it is not mandatory access control."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":41,"type":"single","q":"Betty is concerned about the use of buffer overflow attacks against a custom application developed for use in her organization. What security control would provide the strongest defense against these attacks?","opts":["Firewall","Intrusion detection system","Parameter checking","Vulnerability scanning"],"ans":"C","expl":"Parameter checking, or input validation, is used to ensure that input provided by users to an application matches the expected parameters for the application. Developers may use parameter checking to ensure that input does not exceed the expected length, preventing a buffer overflow attack."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":42,"type":"single","q":"Which one of the following combinations of controls best embodies the defense in depth principle?","opts":["Encryption of email and network intrusion detection","Cloud access security brokers (CASB) and security awareness training","Data loss prevention and multifactor authentication","Network firewall and host firewall"],"ans":"D","expl":"The defense-in-depth principle suggests using multiple overlapping security controls to achieve the same control objective. Network and host firewalls are both designed to limit\nnetwork traffic and therefore are an example of defense in depth. The encryption of email and network intrusion detection are unrelated controls and do not satisfy the same objective. The same is true for the combination of CASB and security awareness training and the combination of DLP and multifactor authentication."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":43,"type":"single","q":"James is working with a Department of Defense system that is authorized to simultaneously handle information classified at the Secret and Top Secret levels. What type of system\n• is he using?","opts":["Single state","Unclassified","Compartmented","Multistate"],"ans":"D","expl":"Multistate systems are certified to handle data from different security classifications simul-taneously by implementing protection mechanisms that segregate data appropriately."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":44,"type":"single","q":"Kyle is being granted access to a military computer system that uses System High mode. What is not true about Kyle’s security clearance requirements?","opts":["Kyle must have a clearance for the highest level of classification processed by the system, regardless of his access.","Kyle must have access approval for all information processed by the system.","Kyle must have a valid need to know for all information processed by the system.","Kyle must have a valid security clearance."],"ans":"C","expl":"For systems running in System High mode, the user must have a valid security clearance for all information processed by the system, access approval for all information processed by the system, and a valid need to know for some, but not necessarily all, information processed by the system."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":46,"type":"single","q":"Philip is developing a new security tool that will be used by individuals in many different subsidiaries of his organization. He chooses to use Docker to deploy the tool to simplify con-figuration. What term best describes this approach?","opts":["Virtualization","Abstraction","Simplification","Containerization"],"ans":"D","expl":"All of these terms accurately describe this use of technology. However, the use of Docker is best described as a containerization technology, so this is the best possible answer choice."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":47,"type":"single","q":"In the ring protection model shown here, what ring contains the operating system’s kernel?","opts":["Ring 0","Ring 1","Ring 2","Ring 3"],"ans":"A","expl":"The kernel lies within the central ring, Ring 0. Conceptually, Ring 1 contains other operating system components. Ring 2 is used for drivers and protocols. User-level programs and applications run at Ring 3. Rings 0 through 2 run in privileged mode while Ring 3 runs in user mode. It is important to note that many modern operating systems do not fully implement this model."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":48,"type":"single","q":"In an infrastructure as a service (IaaS) environment where a vendor supplies a customer with access to storage services, who is normally responsible for removing sensitive data from drives that are taken out of service?","opts":["Customer’s security team","Customer’s storage team","Customer’s vendor management team","Vendor"],"ans":"D","expl":"In an infrastructure as a service environment, security duties follow a shared responsi-bility model. Since the vendor is responsible for managing the storage hardware, the vendor would retain responsibility for destroying or wiping drives as they are taken out of service. However, it is still the customer’s responsibility to validate that the vendor’s sanitization procedures meet their requirements prior to utilizing the vendor’s storage services."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":49,"type":"single","q":"During a system audit, Casey notices that the private key for her organization’s web server has been stored in a public Amazon S3 storage bucket for more than a year. Which one of the following actions should she take first?","opts":["Remove the key from the bucket.","Notify all customers that their data may have been exposed.","Request a new certificate using a new key.","Nothing, because the private key should be accessible for validation."],"ans":"C","expl":"The first thing Casey should do is notify her management, but after that, replacing the certificate and using proper key management practices with the new certificate’s key should be at the top of her list."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":50,"type":"single","q":"Which one of the following systems assurance processes provides an independent third-party evaluation of a system’s controls that may be trusted by many different organizations?","opts":["Certification","Definition","Verification","Accreditation"],"ans":"C","expl":"The verification process is similar to the certification process in that it validates security controls. Verification may go a step further by involving a third-party testing service and compiling results that may be trusted by many different organizations. Accreditation is the act of management formally accepting an evaluating system, not evaluating the system itself."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":51,"type":"single","q":"Darcy’s organization is deploying serverless computing technology to better meet the needs of developers and users. In a serverless model, who is normally responsible for configuring operating system security controls?","opts":["Software developer","Cybersecurity professional","Cloud architect","Vendor"],"ans":"D","expl":"In a serverless computing model, the vendor does not expose details of the operating system to its customers. Therefore, the vendor retains full responsibility for configuring it securely under the shared responsibility model of cloud computing."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":52,"type":"single","q":"Harold is assessing the susceptibility of his environment to hardware failures and would like to identify the expected lifetime of a piece of hardware. What measure should he use for this?","opts":["MTTR","MTTF","RTO","MTO"],"ans":"B","expl":"The mean time to failure (MTTF) provides the average amount of time before a device of that particular specification fails."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":53,"type":"single","q":"Chris is designing a cryptographic system for use within his company. The company has 1,000 employees, and they plan to use an asymmetric encryption system. They would like the system to be set up so that any pair of arbitrary users may communicate privately. How many total keys will they need?","opts":["500","1,000","2,000","4,950"],"ans":"C","expl":"Asymmetric cryptosystems use a pair of keys for each user. In this case, with 1,000 users, the system will require 2,000 keys."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":54,"type":"single","q":"Gary is concerned about applying consistent security settings to the many mobile devices used throughout his organization. What technology would best assist with this challenge?","opts":["MDM","IPS","IDS","SIEM"],"ans":"A","expl":"Mobile Device Management (MDM) products provide a consistent, centralized interface for applying security configuration settings to mobile devices."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":55,"type":"single","q":"Alice sent a message to Bob. Bob would like to demonstrate to Charlie that the message he received definitely came from Alice. What goal of cryptography is Bob attempting to achieve?","opts":["Authentication","Confidentiality","Nonrepudiation","Integrity"],"ans":"C","expl":"Nonrepudiation occurs when the recipient of a message is able to demonstrate to a third party that the message came from the purported sender."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":57,"type":"single","q":"Gordon is concerned about the possibility that hackers may be able to use the Van Eck radi-ation phenomenon to remotely read the contents of computer monitors in a restricted work area within his facility. What technology would protect against this type of attack?","opts":["TCSEC","SCSI","GHOST","TEMPEST"],"ans":"D","expl":"The TEMPEST program creates technology that is not susceptible to Van Eck phreaking attacks because it reduces or suppresses natural electromagnetic emanations."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":58,"type":"single","q":"Jorge believes that an attacker has obtained the hash of the Kerberos service account from one of his organization’s Active Directory servers. What type of attack would this enable?","opts":["Golden ticket","Kerberoasting","Pass the ticket","Brute force"],"ans":"A","expl":"Golden ticket attacks use the hash of the Kerberos service account to create tickets in an Active Directory environment. Kerberoasting attacks rely on collected TGS tickets. Pass the ticket attacks rely on tickets harvested from the lsass process. Brute-force attacks depend on random guessing without any additional information."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":59,"type":"single","q":"Sherry conducted an inventory of the cryptographic technologies in use within her organiza-tion and found the following algorithms and protocols in use. Which one of these technol-ogies should she replace because it is no longer considered secure?","opts":["MD5","AES","PGP","WPA3"],"ans":"A","expl":"The MD5hash algorithm has known collisions and, as of 2005, is no longer considered secure for use in modern environments. The AES, PGP, and WPA3 algorithms are all still considered secure."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":60,"type":"single","q":"Robert is investigating a security breach and discovers the Mimikatz tool installed on a system in his environment. What type of attack has likely taken place?","opts":["Password cracking","Pass the hash","MAC spoofing","ARP poisoning"],"ans":"B","expl":"The use of the Mimikatz tool is indicative of an attempt to capture user password hashes for use in a pass-the-hash attack against Microsoft Active Directory accounts."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":61,"type":"single","q":"Tom is a cryptanalyst and is working on breaking a cryptographic algorithm’s secret key. He has a copy of an intercepted message that is encrypted, and he also has a copy of the decrypted version of that message. He wants to use both the encrypted message and its\n• decrypted plaintext to retrieve the secret key for use in decrypting other messages. What type of attack is Tom engaging in?","opts":["Chosen ciphertext","Chosen plaintext","Known plaintext","Brute force"],"ans":"C","expl":"In a known plaintext attack, the attacker has a copy of the encrypted message along with the plaintext message used to generate that ciphertext. In a chosen plaintext attack, the\nattacker has the ability to choose the plaintext to be encrypted. In a chosen ciphertext attack, the attacker can choose the ciphertext output. In a brute-force attack, the attacker simply tries all possible key combinations."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":62,"type":"single","q":"A hacker recently violated the integrity of data in James’s company by modifying a file using a precise timing attack. The attacker waited until James verified the integrity of a file’s con-tents using a hash value and then modified the file between the time that James verified the integrity and read the contents of the file. What type of attack took place?","opts":["Social engineering","TOCTOU","Data diddling","Parameter checking"],"ans":"B","expl":"In a time of check to time of use (TOCTOU) attack, the attacker exploits the difference in time between when a security control is verified and the data protected by the control is actually used."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":63,"type":"single","q":"Carl is deploying a set of video sensors that will be placed in remote locations as part of a research project. Due to connectivity limitations, he would like to perform as much image processing and computation as possible on the device itself before sending results back to the cloud for further analysis. What computing model would best meet his needs?","opts":["Serverless computing","Edge computing","IaaS computing","SaaS computing"],"ans":"B","expl":"In this case, most cloud service models (including IaaS, SaaS, and serverless/FaaS) would require transmitting most information back to the cloud. The edge computing service model would be far more appropriate, as it places computing power at the sen-sor, minimizing the data that must be sent back to the cloud over limited connectivity network links."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":64,"type":"single","q":"What action can you take to prevent accidental data disclosure due to wear leveling on an SSD device before reusing the drive?","opts":["Reformatting","Disk encryption","Degaussing","Physical destruction"],"ans":"B","expl":"Encrypting data on SSD drives does protect against wear leveling. Disk formatting does not effectively remove data from any device. Degaussing is only effective for magnetic media. Physically destroying the drive would not permit reuse."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":65,"type":"single","q":"Johnson Widgets strictly limits access to total sales volume information, classifying it as a competitive secret. However, shipping clerks have unrestricted access to order records to facilitate transaction completion. A shipping clerk recently pulled all of the individual sales records for a quarter from the database and totaled them up to determine the total sales volume. What type of attack occurred?","opts":["Social engineering","Inference","Aggregation","Data diddling"],"ans":"C","expl":"In an aggregation attack, individual(s) use their access to specific pieces of information to piece together a larger picture that they are not authorized to access."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":66,"type":"single","q":"What physical security control broadcasts false emanations constantly to mask the presence of true electromagnetic emanations from computing equipment?","opts":["Faraday cage","Copper-infused windows","Shielded cabling","White noise"],"ans":"D","expl":"While all of the controls mentioned protect against unwanted electromagnetic emana-tions, only white noise is an active control. White noise generates false emanations that effectively “jam” the true emanations from electronic equipment."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":67,"type":"single","q":"In a software as a service cloud computing environment, who is normally responsible for ensuring that appropriate firewall controls are in place to protect the application?","opts":["Customer’s security team","Vendor","Customer’s networking team","Customer’s infrastructure management team"],"ans":"B","expl":"In a software as a service environment, the customer has no access to any underlying infrastructure, so firewall management is a vendor responsibility under the cloud computing shared responsibility model."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":68,"type":"single","q":"Alice has read permissions on an object, and she would like Bob to have those same rights. Which one of the rules in the Take-Grant protection model would allow her to complete this operation?","opts":["Create rule","Remove rule","Grant rule","Take rule"],"ans":"C","expl":"The grant rule allows a subject to grant rights that it possesses on an object to another subject."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":69,"type":"single","q":"As part of his incident response process, Charles securely wipes the drive of a compromised machine and reinstalls the operating system (OS) from original media. Once he is done, he patches the machine fully and applies his organization’s security templates before reconnect-ing the system to the network. Almost immediately after the system is returned to service, he discovers that it has reconnected to the same botnet it was part of before. Where should Charles look for the malware that is causing this behavior?","opts":["The operating system partition","The system BIOS or firmware","The system memory","The installation media"],"ans":"B","expl":"The system Charles is remediating may have a firmware or BIOS infection, with malware resident on the system board. While uncommon, this type of malware can be difficult to find and remove. Since he used original media, it is unlikely that the malware came from the soft-ware vendor. Charles wiped the system partition, and the system would have been rebooted before being rebuilt, thus clearing system memory."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":70,"type":"single","q":"Lauren implements ASLR to help prevent system compromises. What technique has she used to protect her system?","opts":["Encryption","Mandatory access control","Memory address randomization","Discretionary access control"],"ans":"C","expl":"Lauren has implemented address space layout randomization, a memory protection meth-odology that randomizes memory locations, which prevents attackers from using known address spaces and contiguous memory regions to execute code via overflow or stack smash-ing attacks."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":71,"type":"single","q":"Alan intercepts an encrypted message and wants to determine what type of algorithm was used to create the message. He first performs a frequency analysis and notes that the fre-quency of letters in the message closely matches the distribution of letters in the English lan-guage. What type of cipher was most likely used to create this message?","opts":["Substitution cipher","AES","Transposition cipher","3DES"],"ans":"C","expl":"This message was most likely encrypted with a transposition cipher. The use of a substitution cipher, a category that includes AES and 3DES, would change the frequency dis-tribution so that it did not mirror that of the English language. This type of attack, where the attacker only has access to an encrypted message, is also known as a ciphertext-only attack."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":72,"type":"single","q":"The Double DES (2DES) encryption algorithm was never used as a viable alternative to the original DES algorithm. What implementation attack is 2DES vulnerable to that does not exist for the DES or 3DES approach?","opts":["Chosen ciphertext","Brute force","Man-in-the-middle","Meet-in-the-middle"],"ans":"D","expl":"The meet-in-the-middle attack uses a known plaintext message and uses both encryption of the plaintext and decryption of the ciphertext simultaneously in a brute-force manner to identify the encryption key in approximately double the time of a brute-force attack against the basic DES algorithm."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":73,"type":"single","q":"Grace would like to implement application control technology in her organization. Users often need to install new applications for research and testing purposes, and she does not want to interfere with that process. At the same time, she would like to block the use of known malicious software. What type of application control would be appropriate in this situation?","opts":["Blacklisting","Graylisting","Whitelisting","Bluelisting"],"ans":"A","expl":"The blacklisting approach to application control allows users to install any software they wish except for packages specifically identified by the administrator as prohibited. This would be an appropriate approach in a scenario where users should be able to install any nonmalicious software they wish to use."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":74,"type":"single","q":"Warren is designing a physical intrusion detection system for use in a sensitive media storage facility and wants to include technology that issues an alert if the communications lines for the alarm system are unexpectedly cut. What technology would meet this requirement?","opts":["Heartbeat sensor","Emanation security","Motion detector","Faraday cage"],"ans":"A","expl":"Heartbeat sensors send periodic status messages from the alarm system to the monitoring center. The monitoring center triggers an alarm if it does not receive a status message for a prolonged period of time, indicating that communications were disrupted."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":76,"type":"single","q":"After scanning all of the systems on his wireless network, Mike notices that one system is identified as an iOS device running a massively out-of-date version of Apple’s mobile operating system. When he investigates further, he discovers that the device is an original\n• iPad and that it cannot be updated to a current secure version of the operating system. What would be the best option for handling this device?","opts":["Retire or replace the device.","Isolate the device on a dedicated wireless network.","Install a firewall on the tablet.","Reinstall the OS."],"ans":"A","expl":"When operating system patches are no longer available for mobile devices, the best option is typically to retire or replace the device. Building isolated networks will not stop the device from being used for browsing or other purposes, which means it is likely to continue to\nbe exposed to threats. Installing a firewall will not remediate the security flaws in the OS, although it may help somewhat. Finally, reinstalling the OS will not allow new updates or fix the root issue."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":77,"type":"single","q":"Tonya believes that an attacker was able to eavesdrop on legitimate HTTPS communications between her users and remote web servers by engaging in a DNS poisoning attack. After conducting DNS poisoning, what technique would an attacker likely use to conduct this eavesdropping?","opts":["Man-in-the-middle","Brute-force","Timing","Meet-in-the-middle"],"ans":"A","expl":"In a man-in-the-middle attack, the attacker tricks the user into establishing a connec-tion with the attacker. The attacker then establishes a connection to the legitimate server\nand relays communications between the two, eavesdropping on the contents. A meet-in-the-middle attack is an attack against cryptographic algorithms that use multiple rounds of\nencryption. There is no indication in the scenario that the attacker used an exhaustive brute-force attack or a specialized timing attack to achieve their goals."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":78,"type":"single","q":"Howard is choosing a cryptographic algorithm for his organization, and he would like to choose an algorithm that supports the creation of digital signatures. Which one of the follow-ing algorithms would meet his requirement?","opts":["RSA","3DES","AES","Blowfish"],"ans":"A","expl":"Digital signatures are possible only when using an asymmetric encryption algorithm. Of the algorithms listed, only RSA is asymmetric and supports digital signature capabilities."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":79,"type":"single","q":"Laura is responsible for securing her company’s web-based applications and wants to con-duct an educational program for developers on common web application security vulnerabil-ities. Where can she turn for a concise listing of the most common web application issues?","opts":["CVE","NSA","OWASP","CSA"],"ans":"C","expl":"The Open Web Application Security Project (OWASP) produces an annual list of the top ten web application security issues that developers and security professionals around the world rely upon for education and training purposes. The OWASP vulnerabilities form the basis for many web application security testing products."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":80,"type":"single","q":"The Bell-LaPadula and Biba models implement state machines in a fashion that uses what specific state machine model?","opts":["Information flow","Noninterference","Cascading","Feedback"],"ans":"A","expl":"The information flow model applies state machines to the flow of information. The Bell-LaPadula model applies the information flow model to confidentiality while the Biba model applies it to integrity."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":81,"type":"single","q":"During a third-party vulnerability scan and security test, Danielle’s employer recently discovered that the embedded systems that were installed to manage her company’s new buildings have a severe remote access vulnerability. The manufacturer has gone out of business, and there is no patch or update for the devices. What should Danielle recommend that her employer do about the hundreds of devices that are vulnerable?","opts":["Identify a replacement device model and replace every device.","Turn off all of the devices.","Move the devices to a secure and isolated network segment.","Reverse engineer the devices and build an in-house patch."],"ans":"C","expl":"The most reasonable choice presented is to move the devices to a secure and isolated net-work segment. This will allow the devices to continue to serve their intended function while preventing them from being compromised. All of the other scenarios either create major new costs or deprive her organization of the functionality that the devices were purchased to provide."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":82,"type":"single","q":"What type of motion detector senses changes in the electromagnetic fields in moni-tored areas?","opts":["Infrared","Wave pattern","Capacitance","Photoelectric"],"ans":"C","expl":"Capacitance motion detectors monitor the electromagnetic field in a monitored area, sens-ing disturbances that correspond to motion."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":83,"type":"single","q":"Mike has been tasked with preventing an outbreak of malware like Mirai, a botnet that targeted IP-based cameras and routers. What type of systems should be protected in his organization?","opts":["Servers","SCADA","Mobile devices","Internet of Things (IoT) devices"],"ans":"D","expl":"Mirai targeted “Internet of Things” devices, including routers, cameras, and DVRs. As organizations bring an increasing number of devices like these into their corporate networks, protecting both internal and external targets from insecure, infrequently updated, and often vulnerable IoT devices is increasingly important."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":84,"type":"single","q":"Which one of the following statements is correct about the Biba model of access control?","opts":["It addresses confidentiality and integrity.","It addresses integrity and availability.","It prevents covert channel attacks.","It focuses on protecting objects from integrity threats."],"ans":"D","expl":"The Biba model focuses only on protecting integrity and does not provide protection against confidentiality or availability threats. It also does not provide protection against covert channel attacks. The Biba model focuses on external threats and assumes that internal threats are addressed programmatically."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":85,"type":"single","q":"In Transport Layer Security, what type of key is used to encrypt the actual content of commu-nications between a web server and a client?","opts":["Ephemeral session key","Client’s public key","Server’s public key","Server’s private key"],"ans":"A","expl":"In TLS, both the server and the client communicate using an ephemeral symmetric session key. They exchange this key using asymmetric cryptography, but all encrypted content is protected using symmetric cryptography."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":86,"type":"single","q":"Beth would like to include technology in a secure area of her data center to protect against unwanted electromagnetic emanations. What technology would assist her with this goal?","opts":["Heartbeat sensor","Faraday cage","Piggybacking","WPA2"],"ans":"B","expl":"A Faraday cage is a metal skin that prevents electromagnetic emanations from exiting.\nIt is a rarely used technology because it is unwieldy and expensive, but it is quite effective at blocking unwanted radiation."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":87,"type":"single","q":"In a virtualized computing environment, what component is responsible for enforcing separa-tion between guest machines?","opts":["Guest operating system","Hypervisor","Kernel","Protection manager"],"ans":"B","expl":"The hypervisor is responsible for coordinating access to physical hardware and enforcing isolation between different virtual machines running on the same physical platform."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":88,"type":"single","q":"Rick is an application developer who works primarily in Python. He recently decided to eval-uate a new service where he provides his Python code to a vendor who then executes it on their server environment. What type of cloud computing environment is this service?","opts":["SaaS","PaaS","IaaS","CaaS"],"ans":"B","expl":"Cloud computing systems where the customer only provides application code for execu-tion on a vendor-supplied computing platform are examples of platform as a service (PaaS) computing."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":89,"type":"single","q":"A component failure in the primary HVAC system leads to a high temperature alarm in the data center that Kim manages. After resolving the issue, what should Kim consider to prevent future issues like this?","opts":["A closed loop chiller","Redundant cooling systems","Swamp coolers","Relocating the data center to a colder climate"],"ans":"B","expl":"A well-designed data center should have redundant systems and capabilities for each critical part of its infrastructure. That means that power, cooling, and network connectivity should all be redundant. Kim should determine how to ensure that a single system failure cannot take her data center offline."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":90,"type":"single","q":"Tommy is planning to implement a power conditioning UPS for a rack of servers in his data center. Which one of the following conditions will the UPS be unable to protect against if it persists for an extended period of time?","opts":["Fault","Blackout","Sag","Noise"],"ans":"B","expl":"UPSs are designed to protect against short-term power losses, such as power faults. When they conduct power conditioning, they are also able to protect against sags and noise. UPSs have limited-life batteries and are not able to maintain continuous operating during a sustained blackout."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":91,"type":"single","q":"Which one of the following humidity values is within the acceptable range for a data center operation?","opts":["0 percent","10 percent","25 percent","40 percent"],"ans":"D","expl":"Data center humidity should be maintained between 40 percent and 60 percent. Values below this range increase the risk of static electricity, while values above this range may generate moisture that damages equipment."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":92,"type":"multi","q":"Kristen’s organization suffered a ransomware infection and has lost access to critical business data. She is considering paying the ransom to regain access to her data. Which of the follow-ing statements about this payment are correct? (Select all that apply.)","opts":["Payment of the ransom may be illegal.","Payment of the ransom may result in further demands for payments.","Payment of the ransom guarantees access to the decryption key.","Payment of the ransom may cause a data breach."],"ans":"AB","expl":"Payment of a ransom often results in the release of a decryption key, but this is not guaranteed by any means. There is also no link between the payment of a ransom and a future data breach, as an attacker may choose to release confidential information regardless of whether the ransom was paid. Depending upon applicable jurisdictions, payment of a ransom may be illegal under corrupt practices laws or embargoes against terrorist organiza-tions. For example, the U.S. Office of Foreign Assets Control (OFAC) issued an advisory in 2020 stating that ransom payments may violate sanctions. Payment of a ransom may also cause attackers to consider the victim a “mark” and demand future payments in exchange for continued access to their data."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":93,"type":"single","q":"Alex’s employer creates most of their work output as PDF files. Alex is concerned about lim-iting the audience for the PDF files to those individuals who have paid for them. What tech-nology can he use to most effectively control the access to and distribution of these files?","opts":["EDM","Encryption","Digital signatures","DRM"],"ans":"D","expl":"Alex can use digital rights management technology to limit use of the PDFs to paying customers. While DRM is rarely a perfect solution, in this case, it may fit his organiza-tion’s needs. EDM is electronic dance music, which his customers may appreciate but which won’t solve the problem. Encryption and digital signatures can help to keep the files secure and to prove who they came from but won’t solve the rights management issue Alex is tackling."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":94,"type":"single","q":"As part of his team’s forensic investigation process, Matt signs out drives and other evidence from an evidence storage facility before working with them. What type of documentation is he creating?","opts":["Criminal","Chain of custody","Civil","CYA"],"ans":"B","expl":"Matt is helping to maintain the chain of custody documentation for his electronic evi-dence. This can be important if his organization needs to prove that the digital evidence they handled has not been tampered with. A better process would involve more than one person to ensure that no tampering was possible."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":95,"type":"single","q":"Todd believes that a digital certificate used by his organization has been compromised and he wants to add it to the certificate revocation list (CRL). What element of the certificate goes on the CRL?","opts":["Serial number","Public key","Digital signature","Private key"],"ans":"A","expl":"The certificate revocation list contains the serial numbers of digital certificates issued by a certificate authority that have later been revoked."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":96,"type":"single","q":"Alison is examining a digital certificate presented to her by her bank’s website. Which one of the following requirements is not necessary for her to trust the digital certificate?","opts":["She knows that the server belongs to the bank.","She trusts the certificate authority.","She verifies that the certificate is not listed on a CRL.","She verifies the digital signature on the certificate."],"ans":"A","expl":"The point of the digital certificate is to prove to Alison that the server belongs to the bank, so she does not need to have this trust in advance. To trust the certificate, she must verify the CA’s digital signature on the certificate, trust the CA, verify that the certificate is not listed on a CRL, and verify that the certificate contains the name of the bank."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":97,"type":"single","q":"Which one of the following is an example of a covert timing channel when used to exfiltrate information from an organization?","opts":["Sending an electronic mail message","Posting a file on a peer-to-peer file sharing service","Typing with the rhythm of Morse code","Writing data to a shared memory space"],"ans":"C","expl":"Covert channels use surreptitious communications’ paths. Covert timing channels alter the use of a resource in a measurable fashion to exfiltrate information. If a user types using a specific rhythm of Morse code, this is an example of a covert timing channel. Someone watching or listening to the keystrokes could receive a secret message with no trace of the message left in logs."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":98,"type":"single","q":"Which one of the following would be a reasonable application for the use of self-signed digital certificates?","opts":["Digital commerce website","Banking application","Internal scheduling application","Customer portal"],"ans":"C","expl":"Self-signed digital certificates should be used only for internal-facing applications, where the user base trusts the internally generated digital certificate."},{"ch":"D3","ch_name":"域3 安全架构与工程","no":99,"type":"single","q":"Ron is investigating a security incident that took place at a highly secure government facility. He believes that encryption keys were stolen during the attack and finds evidence that the attackers used dry ice to freeze an encryption component. What type of attack was likely attempted?","opts":["Side channel attack","Brute-force attack","Timing attack","Fault injection attack"],"ans":"D","expl":"In a fault injection attack, the attacker attempts to compromise the integrity of a cryp-tographic device by causing some type of external fault. For example, they might use\nhigh-voltage electricity, high or low temperature, or other factors to cause a malfunction that undermines the security of the device. Side-channel attacks seek to use information about system activity and retrieve information that is actively being encrypted. Brute-force attacks attempt every possible valid combination for a key or password. In a timing attack, the attacker measures precisely how long cryptographic operations take to complete, gain-ing information about the cryptographic process that may be used to undermine its security."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":1,"type":"single","q":"Gary wants to distribute a large file and prefers a peer-to-peer CDN. Which of the following is the most common example of this type of technology?","opts":["CloudFlare","BitTorrent","Amazon CloudFront","Akamai Edge"],"ans":"B","expl":"BitTorrent is an example of a peer-to-peer (P2P) content delivery network. It is com-monly used for legitimate purposes to distribute large files like Linux ISOs and other freely distributed software packages and files in addition to its less legitimate uses. CloudFlare, CloudFront, and Akamai’s Edge are all hosted CDNs."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":2,"type":"single","q":"During a security assessment of a wireless network, Jim discovers that LEAP is in use on a network using WPA. What recommendation should Jim make?","opts":["Continue to use LEAP. It provides better security than TKIP for WPA networks.","Use an alternate protocol like PEAP or EAP-TLS and implement WPA2 if supported.","Continue to use LEAP to avoid authentication issues, but move to WPA2.","Use an alternate protocol like PEAP or EAP-TLS, and implement Wired Equivalent Pri-vacy to avoid wireless security issues."],"ans":"B","expl":"LEAP, the Lightweight Extensible Authentication Protocol, is a Cisco proprietary protocol designed to handle problems with TKIP. Unfortunately, LEAP has significant security issues\nas well and should not be used. Any modern hardware should support WPA2 and technol-ogies like PEAP or EAP-TLS. Using WEP, the predecessor to WPA and WPA2, would be a major step back in security for any network."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":3,"type":"single","q":"Ben has connected his laptop to his tablet PC using an 802.11ac connection. What wireless network mode has he used to connect these devices?","opts":["Infrastructure mode","Wired extension mode","Ad hoc mode","Standalone mode"],"ans":"C","expl":"Ben is using ad hoc mode, which directly connects two clients. It can be easy to confuse this with standalone mode, which connects clients using a wireless access point but not to wired resources like a central network. Infrastructure mode connects endpoints to a central network, not directly to each other. Finally, wired extension mode uses a wireless access point to link wireless clients to a wired network."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":4,"type":"single","q":"Selah’s and Nick’s PCs simultaneously send traffic by transmitting at the same time. What network term describes the range of systems on a network that could be affected by this same issue?","opts":["The subnet","The supernet","A collision domain","A broadcast domain"],"ans":"C","expl":"A collision domain is the set of systems that could cause a collision if they transmitted at the same time. Systems outside a collision domain cannot cause a collision if they send at the same time. This is important, as the number of systems in a collision domain increases the likelihood of network congestion due to an increase in collisions. A broadcast domain is the set of systems that can receive a broadcast from each other. A subnet is a logical division of a network, while a supernet is made up of two or more networks."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":6,"type":"single","q":"Gary is deploying a wireless network and wants to deploy the fastest possible wireless technology. Which one of the following wireless networking standards should he use?","opts":["802.11a","802.11g","802.11n","802.11ac"],"ans":"D","expl":"He should choose 802.11ac, which supports theoretical speeds up to 3.4 Gbps. 802.11n supports up to 600 Mbps, 802.11g and 802.11a are only capable of 54 Mbps."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":7,"type":"single","q":"Michele wants to replace FTP traffic with a secure replacement. What secure protocol should she select instead?","opts":["TFTP","HFTPS","SecFTP","SFTP"],"ans":"D","expl":"Both FTP/S and SFTP are commonly used as replacement insecure FTP services. SFTP offers the advantage of using SSH for transfers, making it easy to use existing firewall rules. TFTP is trivial FTP, an insecure quick transfer method often used to transfer files for network devices, among other uses. HFTPS and SecFTP were made up for this question."},{"ch":"D4","ch_name":"域4 通信与网络安全","no":8,"type":"single","q":"Jake has been
