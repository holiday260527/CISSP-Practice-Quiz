理","no":83,"type":"single","q":"Rolando is a risk manager with a large-scale enterprise. The firm recently evaluated the risk of California mudslides on its operations in the region and determined that the cost of responding outweighed the benefits of any controls it could implement. The company\n• chose to take no action at this time. What risk management strategy did Rolando’s organiza-tion pursue?","opts":["Risk avoidance","Risk mitigation","Risk transference","Risk acceptance"],"ans":"D","expl":"In a risk acceptance strategy, the organization decides that taking no action is the most beneficial route to managing a risk."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":84,"type":"single","q":"Helen is the owner of a U.S. website that provides information for middle and high school students preparing for exams. She is writing the site’s privacy policy and would like to ensure that it complies with the provisions of the Children’s Online Privacy Protection Act (COPPA). What is the cutoff age below which parents must give consent in advance of the collection of personal information from their children under COPPA?","opts":["13","15","17","18"],"ans":"A","expl":"COPPA requires that websites obtain advance parental consent for the collection of personal information from children under the age of 13."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":87,"type":"single","q":"Alan is performing threat modeling and decides that it would be useful to decompose the system into the core elements shown here. What tool is he using?\n• User/Web Server Boundary\n• Login Request\n• Login Response\n• Pages\n• Web Pages\n• Authenticate User Result\n• Authenticate User SQL Query Result\n• College Library Database\n• Authenticate User SQL Query\n• Data\n• Web Server/ Database Boundary\n• Database Files","opts":["Vulnerability assessment","Fuzzing","Reduction analysis","Data modeling"],"ans":"C","expl":"In reduction analysis, the security professional breaks the system down into five core elements: trust boundaries, data flow paths, input points, privileged operations, and details about security controls."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":89,"type":"single","q":"Which type of business impact assessment tool is most appropriate when attempting to eval-uate the impact of a failure on customer confidence?","opts":["Quantitative","Qualitative","Annualized loss expectancy","Reduction"],"ans":"B","expl":"Qualitative tools are often used in business impact assessment to capture the impact on intangible factors such as customer confidence, employee morale, and reputation."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":90,"type":"single","q":"Ryan is a security risk analyst for an insurance company. He is currently examining a sce-nario in which a malicious hacker might use a SQL injection attack to deface a web server due to a missing patch in the company’s web application. In this scenario, what is the threat?\nFor questions 91–93, please refer to the following scenario:","opts":["Unpatched web application","Web defacement","Malicious hacker","Operating system"],"ans":"C","expl":"Risks are the combination of a threat and a vulnerability. Threats are the external forces seeking to undermine security, such as the malicious hacker in this case. Vulnerabilities are the internal weaknesses that might allow a threat to succeed. In this case, the missing patch is the vulnerability. In this scenario, if the malicious hacker (threat) attempts a SQL injection attack against the unpatched server (vulnerability), the result is website defacement."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":91,"type":"single","q":"Based upon the information in this scenario, what is the exposure factor for the effect of a tornado on Atwood Landing’s data center?","opts":["10 percent","25 percent","50 percent","75 percent"],"ans":"C","expl":"The exposure factor is the percentage of the facility that risk managers expect will be dam-aged if a risk materializes. It is calculated by dividing the amount of damage by the asset value. In this case, that is $5million in damage divided by the $10million facility value, or 50 percent.","scene":"Henry is the risk manager for Atwood Landing, a resort community in the midwestern United States. The resort’s main data center is located in northern Indiana in an area that is prone to tornados. Henry recently undertook a replacement cost analysis and determined that rebuilding and reconfiguring the data center would cost $10 million. Henry consulted with tornado experts, data center specialists, and structural engineers. Together, they determined that a typical tornado would cause approximately $5 million of damage to the facility. The meteorologists determined that Atwood’s facility lies in an area where they are likely to experience a tornado once every 200 years."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":92,"type":"single","q":"Based upon the information in this scenario, what is the annualized rate of occurrence for a tornado at Atwood Landing’s data center?","opts":["0.0025","0.005","0.01","0.015"],"ans":"B","expl":"The annualized rate of occurrence is the number of times that risk analysts expect a risk to happen in any given year. In this case, the analysts expect tornados once every 200 years, or 0.005 times per year.","scene":"Henry is the risk manager for Atwood Landing, a resort community in the midwestern United States. The resort’s main data center is located in northern Indiana in an area that is prone to tornados. Henry recently undertook a replacement cost analysis and determined that rebuilding and reconfiguring the data center would cost $10 million. Henry consulted with tornado experts, data center specialists, and structural engineers. Together, they determined that a typical tornado would cause approximately $5 million of damage to the facility. The meteorologists determined that Atwood’s facility lies in an area where they are likely to experience a tornado once every 200 years."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":93,"type":"single","q":"Based upon the information in this scenario, what is the annualized loss expectancy for a tor-nado at Atwood Landing’s data center?","opts":["$25,000","$50,000","$250,000","$500,000"],"ans":"A","expl":"The annualized loss expectancy is calculated by multiplying the single loss expectancy (SLE) by the annualized rate of occurrence (ARO). In this case, the SLE is $5,000,000, and the ARO is 0.005. Multiplying these numbers together gives you the ALE of $25,000.","scene":"Henry is the risk manager for Atwood Landing, a resort community in the midwestern United States. The resort’s main data center is located in northern Indiana in an area that is prone to tornados. Henry recently undertook a replacement cost analysis and determined that rebuilding and reconfiguring the data center would cost $10 million. Henry consulted with tornado experts, data center specialists, and structural engineers. Together, they determined that a typical tornado would cause approximately $5 million of damage to the facility. The meteorologists determined that Atwood’s facility lies in an area where they are likely to experience a tornado once every 200 years."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":94,"type":"single","q":"John is analyzing an attack against his company in which the attacker found comments embedded in HTML code that provided the clues needed to exploit a software vulnerability. Using the STRIDE model, what type of attack did he uncover?","opts":["Spoofing","Repudiation","Information disclosure","Elevation of privilege"],"ans":"C","expl":"Information disclosure attacks rely upon the revelation of private, confidential, or con-trolled information. Programming comments embedded in HTML code are an example of this type of attack."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":95,"type":"single","q":"Chris is worried that the laptops that his organization has recently acquired were modified by a third party to include keyloggers before they were delivered. Where should he focus his efforts to prevent this?","opts":["His supply chain","His vendor contracts","His post-purchase build process","The original equipment manufacturer (OEM)"],"ans":"A","expl":"Supply chain management can help ensure the security of hardware, software, and ser-vices that an organization acquires. Chris should focus on each step that his laptops take from the original equipment manufacturer to delivery."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":96,"type":"single","q":"In her role as a developer for an online bank, Lisa is required to submit her code for test-ing and review. After it passes through this process and it is approved, another employee moves the code to the production environment. What security management does this pro-cess describe?","opts":["Regression testing","Code review","Change management","Fuzz testing"],"ans":"C","expl":"Change management is a critical control process that involves systematically managing change. Without it, Lisa might simply deploy her code to production without oversight, documen-tation, or testing. Regression testing focuses on testing to ensure that new code doesn’t bring back old flaws, while fuzz testing feeds unexpected input to code. Code review reviews the source code itself and may be involved in the change management process but isn’t what is described here."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":97,"type":"single","q":"After completing the first year of his security awareness program, Charles reviews the data about how many staff completed training compared to how many were assigned the training to determine whether he hit the 95 percent completion rate he was aiming for. What is this type of measure called?","opts":["A KPI","A metric","An awareness control","A return on investment rate"],"ans":"A","expl":"Charles is tracking a key performance indicator (KPI). A KPI is used to measure performance (and success). Without a definition of success, this would simply be a metric, but Charles is working toward a known goal and can measure against it. There is not a return investment calculation in this problem, and the measure is not a control."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":98,"type":"single","q":"Which of the following is not typically included in a prehire screening process?","opts":["A drug test","A background check","Social media review","Fitness evaluation"],"ans":"D","expl":"A fitness evaluation is not a typical part of a hiring process. Drug tests, background checks, and social media checks are all common parts of current hiring practices."},{"ch":"D1","ch_name":"域1 安全与风险管理","no":99,"type":"multi","q":"Which of the following would normally be considered a supply chain risk? (Select all that apply.)","opts":["Adversary tampering with hardware prior while being shipped to the end customer","Adversary hacking into a web server run by the organization in an IaaS environment","Adversary using social engineering to compromise an employee of a SaaS vendor to gain access to customer accounts","Adversary conducting a denial-of-service attack using a botnet"],"ans":"AC","expl":"Supply chain risks occur when the adversary is interfering with the delivery of goods or services from a supplier to the customer. This might involve tampering with hardware before the customer receives it or using social engineering to compromise a vendor employee. Hacking into a web server run in an IaaS environment is not a supply chain\nrisk because the web server is already under the control of the customer. Using a botnet to conduct a denial-of-service attack does not involve any supply chain elements."},{"ch":"D2","ch_name":"域2 资产安全","no":1,"type":"single","q":"Angela is an information security architect at a bank and has been assigned to ensure that transactions are secure as they traverse the network. She recommends that all transactions use TLS. What threat is she most likely attempting to stop, and what method is she most likely using to protect against it?","opts":["Man-in-the-middle, VPN","Packet injection, encryption","Sniffing, encryption","Sniffing, TEMPEST"],"ans":"C","expl":"Encryption is often used to protect traffic like bank transactions from sniffing. While packet injection and man-in-the-middle attacks are possible, they are far less likely to occur, and if a VPN were used, it would be used to provide encryption. TEMPEST is a specification for techniques used to prevent spying using electromagnetic emissions and wouldn’t be used to stop attacks at any normal bank."},{"ch":"D2","ch_name":"域2 资产安全","no":2,"type":"single","q":"Control Objectives for Information and Related Technology (COBIT) is a framework for information technology (IT) management and governance. Which data management role is most likely to select and apply COBIT to balance the need for security controls against business requirements?","opts":["Business owners","Data processors","Data owners","Data stewards"],"ans":"A","expl":"Business owners have to balance the need to provide value with regulatory, security, and other requirements. This makes the adoption of a common framework like COBIT attrac-tive. Data owners are more likely to ask that those responsible for control selection identify\na standard to use. Data processors are required to perform specific actions under regula-tions like the EU GDPR. Finally, in many organizations, data stewards are internal roles that oversee how data is used."},{"ch":"D2","ch_name":"域2 资产安全","no":3,"type":"single","q":"Nadia’s company is operating a hybrid cloud environment with some on-site systems and some cloud-based systems. She has satisfactory monitoring on-site, but needs to apply secu-rity policies to both the activities her users engage in and to report on exceptions with her growing number of cloud services. What type of tool is best suited to this purpose?","opts":["A NGFW","A CASB","An IDS","A SOAR"],"ans":"B","expl":"The best option for Nadia is a cloud access security broker (CASB). A CASB is designed to sit between a cloud environment and the users who use it, and it provides monitoring and policy enforcement capabilities. A next-generation firewall (NGFW), an intrusion detec-tion system (IDS), and a security operations and response (SOAR) tool could each provide some insight into what is going on, but they are not purpose built and designed for this like the CASB is. The NGFW and IDS are most likely to provide insight into traffic patterns and\nbehaviors, while the SOAR is primarily intended to monitor other systems and centralize data for response, making it potentially the least useful in this specific scenario."},{"ch":"D2","ch_name":"域2 资产安全","no":4,"type":"single","q":"When media is labeled based on the classification of the data it contains, what rule is typi-cally applied regarding labels?","opts":["The data is labeled based on its integrity requirements.","The media is labeled based on the highest classification level of the data it contains.","The media is labeled with all levels of classification of the data it contains.","The media is labeled with the lowest level of classification of the data it contains."],"ans":"B","expl":"Media is typically labeled with the highest classification level of data it contains. This pre-vents the data from being handled or accessed at a lower classification level. Data integrity requirements may be part of a classification process but don’t independently drive labeling in a classification scheme."},{"ch":"D2","ch_name":"域2 资产安全","no":6,"type":"single","q":"How can a data retention policy help to reduce liabilities?","opts":["By ensuring that unneeded data isn’t retained","By ensuring that incriminating data is destroyed","By ensuring that data is securely wiped so it cannot be restored for legal discovery","By reducing the cost of data storage required by law"],"ans":"A","expl":"A data retention policy can help to ensure that outdated data is purged, removing poten-tial additional costs for discovery. Many organizations have aggressive retention policies to both reduce the cost of storage and limit the amount of data that is kept on hand and dis-coverable. Data retention policies are not designed to destroy incriminating data, and legal requirements for data retention must still be met."},{"ch":"D2","ch_name":"域2 资产安全","no":7,"type":"single","q":"Staff in an information technology (IT) department who are delegated responsibility for day-to-day tasks hold what data role?","opts":["Business owner","User","Data processor","Custodian"],"ans":"D","expl":"Custodians are delegated the role of handling day-to-day tasks by managing and over-seeing how data is handled, stored, and protected. Data processors are systems used to process data. Business owners are typically project or system owners who are tasked with making sure systems provide value to their users or customers."},{"ch":"D2","ch_name":"域2 资产安全","no":9,"type":"single","q":"Ben has been tasked with identifying security controls for systems covered by his organiza-tion’s information classification system. Why might Ben choose to use a security baseline?","opts":["It applies in all circumstances, allowing consistent security controls.","They are approved by industry standards bodies, preventing liability.","They provide a good starting point that can be tailored to organizational needs.","They ensure that systems are always in a secure state."],"ans":"C","expl":"Security baselines provide a starting point to scope and tailor security controls to your organization’s needs. They aren’t always appropriate to specific organizational needs, they cannot ensure that systems are always in a secure state, and they do not prevent liability."},{"ch":"D2","ch_name":"域2 资产安全","no":10,"type":"single","q":"Megan wants to prepare media to allow for its reuse in an environment operating at the same sensitivity level. Which of the following is the best option to meet her needs?","opts":["Clearing","Erasing","Purging","Sanitization"],"ans":"A","expl":"Clearing describes preparing media for reuse. When media is cleared, unclassified data is written over all addressable locations on the media. Once that’s completed, the media can be reused. Erasing is the deletion of files or media and may not include all of the data on the\ndevice or media, making it the worst choice here. Purging is a more intensive form of clearing for reuse in lower-security areas, and sanitization is a series of processes that removes data\nfrom a system or media while ensuring that the data is unrecoverable by any means."},{"ch":"D2","ch_name":"域2 资产安全","no":11,"type":"single","q":"Mikayla wants to identify data that should be classified that already exists in her environ-ment. What type of tool is best suited to identifying data like Social Security numbers, credit card numbers, and similar well-understood data formats?","opts":["Manual searching","A sensitive data scanning tool","An asset metadata search tool","A data loss prevention system (DLP)"],"ans":"B","expl":"Sensitive data scanning tools are designed to scan for and flag sensitive data types using known formatting and structure. Social Security numbers, credit card numbers, and other regularly structured data that follows known rules can be identified and then addressed as needed. Manual searching is a massive undertaking for an organization with even a relatively small amount of data; asset metadata needs to be set first and would have already been iden-tified; and a DLP system looks for data that is in transit using rules rather than hunting down data at rest and in storage."},{"ch":"D2","ch_name":"域2 资产安全","no":12,"type":"single","q":"What issue is common to spare sectors and bad sectors on hard drives as well as overprovi-sioned space on modern SSDs?","opts":["They can be used to hide data.","They can only be degaussed.","They are not addressable, resulting in data remanence.","They may not be cleared, resulting in data remanence."],"ans":"D","expl":"Spare sectors, bad sectors, and space provided for wear leveling on SSDs (overprovisioned space) may all contain data that was written to the space that will not be cleared when the drive is wiped. This is a form of data remanence and is a concern for organizations that do not want data to potentially be accessible. Many wiping utilities only deal with currently addressable space on the drive. SSDs cannot be degaussed, and wear leveling space cannot be reliably used to hide data. These spaces are still addressable by the drive, although they may not be seen by the operating system."},{"ch":"D2","ch_name":"域2 资产安全","no":13,"type":"single","q":"Naomi knows that commercial data is typically classified based on different criteria than government data. Which of the following is not a common criterion for commercial data classification?\nFor questions 14–16, please refer to the following scenario:","opts":["Useful lifespan","Data value","Impact to national security","Regulatory or legal requirements"],"ans":"C","expl":"Commercial data classification often takes into account the value of the data, any regulatory or legal requirements that may apply to the data, and how long the data is useful—its lifespan. The impact to national security is more typically associated with government classification schemes."},{"ch":"D2","ch_name":"域2 资产安全","no":14,"type":"single","q":"What term best describes data that is resident in system memory?","opts":["Data at rest","Buffered data","Data in use","Data in motion"],"ans":"C","expl":"Data is often considered based on the data state that it is in. Data can be at rest (on a drive or other storage medium), in use and thus in memory or a buffer and often decrypted for use, or in transit over a network. Data that is resident in system memory is considered data in use.","scene":"Your organization regularly handles three types of data: information that it shares with cus-tomers, information that it uses internally to conduct business, and trade secret information that offers the organization significant competitive advantages. Information shared with cus-tomers is used and stored on web servers, while both the internal business data and the trade secret information are stored on internal file servers and employee workstations."},{"ch":"D2","ch_name":"域2 资产安全","no":16,"type":"single","q":"What type of encryption is best suited for use on the file servers for the proprietary data, and how might you secure the data when it is in motion?","opts":["TLS at rest and AES in motion","AES at rest and TLS in motion","VPN at rest and TLS in motion","DES at rest and AES in motion"],"ans":"B","expl":"AES is a strong modern symmetric encryption algorithm that is appropriate for encrypting data at rest. TLS is frequently used to secure data when it is in transit. A virtual private network is not necessarily an encrypted connection and would be used for data in motion, while DES is an outdated algorithm and should not be used for data that needs strong security.","scene":"Your organization regularly handles three types of data: information that it shares with cus-tomers, information that it uses internally to conduct business, and trade secret information that offers the organization significant competitive advantages. Information shared with cus-tomers is used and stored on web servers, while both the internal business data and the trade secret information are stored on internal file servers and employee workstations."},{"ch":"D2","ch_name":"域2 资产安全","no":17,"type":"single","q":"What does labeling data allow a DLP system to do?","opts":["The DLP system can detect labels and apply appropriate protections based on rules.","The DLP system can adjust labels based on changes in the classification scheme.","The DLP system can modify labels to permit requested actions.","The DLP system can delete unlabeled data."],"ans":"A","expl":"Data loss prevention (DLP) systems can use labels on data to determine the appropriate controls to apply to the data. Most DLP systems won’t modify labels in real time and typi-cally don’t work directly with firewalls to stop traffic. Deleting unlabeled data would cause big problems for organizations that haven’t labeled every piece of data!"},{"ch":"D2","ch_name":"域2 资产安全","no":18,"type":"single","q":"Why is it cost effective to purchase high-quality media to contain sensitive data?","opts":["Expensive media is less likely to fail.","The value of the data often far exceeds the cost of the media.","Expensive media is easier to encrypt.","More expensive media typically improves data integrity."],"ans":"B","expl":"The value of the data contained on media often exceeds the cost of the media, making more expensive media that may have a longer life span or additional capabilities like encryp-tion support a good choice. While expensive media may be less likely to fail, the reason it\nmakes sense is the value of the data, not just that it is less likely to fail. In general, the cost of the media doesn’t have anything to do with the ease of encryption, and data integrity isn’t ensured by better media."},{"ch":"D2","ch_name":"域2 资产安全","no":19,"type":"single","q":"Chris is responsible for workstations throughout his company and knows that some of the company’s workstations are used to handle both proprietary information and highly sensitive trade secrets. Which option best describes what should happen at the end of their life (EOL) for workstations he is responsible for?","opts":["Erasing","Clearing","Sanitization","Destruction"],"ans":"D","expl":"Destruction is the most complete method of ensuring that data cannot be exposed, and organizations often opt to destroy either the drive or the entire workstation or device to ensure that data cannot be recovered or exposed. Sanitization is a combination of processes that ensure that data from a system cannot be recovered by any means. Erasing and clearing are both prone to mistakes and technical problems that can result in remnant data and don’t make sense for systems that handled proprietary information."},{"ch":"D2","ch_name":"域2 资产安全","no":20,"type":"single","q":"Fred wants to classify his organization’s data using common labels: private, sensitive, public, and proprietary. Which of the following should he apply to his highest classification level based on common industry practices?","opts":["Private","Sensitive","Public","Proprietary"],"ans":"D","expl":"Common practice makes proprietary or confidential data the most sensitive data. Private data is internal business data that shouldn’t be exposed but that doesn’t meet the threshold for confidential or proprietary data. Sensitive data may help attackers or otherwise create risk, and public data is just that—data that is or can be made public."},{"ch":"D2","ch_name":"域2 资产安全","no":21,"type":"single","q":"What scenario describes data at rest?","opts":["Data in an IPsec tunnel","Data in an e-commerce transaction","Data stored on a hard drive","Data stored in RAM"],"ans":"C","expl":"Data at rest is inactive data that is physically stored. Data in an IPsec tunnel or part of an e-commerce transaction is data in motion. Data in RAM is ephemeral and is not inactive."},{"ch":"D2","ch_name":"域2 资产安全","no":22,"type":"single","q":"If you are selecting a security standard for a Windows 10 system that processes credit cards, what security standard is your best choice?\nFor questions 23–25, please refer to the following scenario:","opts":["Microsoft’s Windows 10 security baseline","The CIS Windows 10 baseline","PCI DSS","The NSA Windows 10 Secure Host Baseline"],"ans":"C","expl":"The Payment Card Industry Data Security Standard (PCI DSS) provides the set of require-ments for credit card processing systems. The Microsoft, NSA, and CIS baseline are all useful for building a Windows 10 security standard, but the PCI DSS standard is a better answer."},{"ch":"D2","ch_name":"域2 资产安全","no":23,"type":"single","q":"The CIS benchmarks are an example of what practice?","opts":["Conducting a risk assessment","Implementing data labeling","Proper system ownership","Using security baselines"],"ans":"D","expl":"The CIS benchmarks are an example of a security baseline. A risk assessment would help identify which controls were needed, and proper system ownership is an important part of making sure baselines are implemented and maintained. Data labeling can help ensure that controls are applied to the right systems and data.","scene":"The Center for Internet Security (CIS) works with subject matter experts from a variety of industries to create lists of security controls for operating systems, mobile devices, server software, and network devices. Your organization has decided to use the CIS benchmarks for your systems. Answer the following questions based on this decision."},{"ch":"D2","ch_name":"域2 资产安全","no":24,"type":"single","q":"Adjusting the CIS benchmarks to your organization’s mission and your specific IT systems would involve what two processes?","opts":["Scoping and selection","Scoping and tailoring","Baselining and tailoring","Tailoring and selection"],"ans":"B","expl":"Scoping involves selecting only the controls that are appropriate for your IT systems, while tailoring matches your organization’s mission and the controls from a selected baseline. Baselining is the process of configuring a system or software to match a baseline or building a baseline itself. Selection isn’t a technical term used for any of these processes.","scene":"The Center for Internet Security (CIS) works with subject matter experts from a variety of industries to create lists of security controls for operating systems, mobile devices, server software, and network devices. Your organization has decided to use the CIS benchmarks for your systems. Answer the following questions based on this decision."},{"ch":"D2","ch_name":"域2 资产安全","no":25,"type":"single","q":"How should you determine which controls from the baseline should be applied to a given system or software package?","opts":["Consult the custodians of the data.","Select based on the data classification of the data it stores or handles.","Apply the same controls to all systems.","Consult the business owner of the process the system or data supports."],"ans":"B","expl":"The controls implemented from a security baseline should match the data classification of the data used or stored on the system. Custodians are trusted to ensure the day-to-day security of the data and should do so by ensuring that the baseline is met and maintained.\nBusiness owners often have a conflict of interest between functionality and data security, and of course, applying the same controls everywhere is expensive and may not meet business needs or be a responsible use of resources.","scene":"The Center for Internet Security (CIS) works with subject matter experts from a variety of industries to create lists of security controls for operating systems, mobile devices, server software, and network devices. Your organization has decided to use the CIS benchmarks for your systems. Answer the following questions based on this decision."},{"ch":"D2","ch_name":"域2 资产安全","no":26,"type":"single","q":"The company that Henry works for operates in the EU and collects data about their cus-tomers. They send that data to a third party to analyze and provide reports to help the company make better business decisions. What term best describes the third-party anal-ysis company?","opts":["The data controller","The data owner","The data subject","The data processor"],"ans":"D","expl":"The third-party company is a data processor—they process data on behalf of Henry’s company, which is a data controller. The data is collected about data subjects. Data owners are tasked with making decisions about data, such as who receives access to it and how it is used."},{"ch":"D2","ch_name":"域2 资产安全","no":27,"type":"single","q":"The government defense contractor that Selah works for has recently shut down a major research project and is planning on reusing the hundreds of thousands of dollars of systems and data storage tapes used for the project for other purposes. When Selah reviews the com-pany’s internal processes, she finds that she can’t reuse the tapes and that the manual says they should be destroyed. Why isn’t Selah allowed to degauss and then reuse the tapes to save her employer money?","opts":["Data permanence may be an issue.","Data remanence is a concern.","The tapes may suffer from bitrot.","Data from tapes can’t be erased by degaussing."],"ans":"B","expl":"Many organizations require the destruction of media that contains data at higher levels of classification. Often the cost of the media is lower than the potential costs of data exposure, and it is difficult to guarantee that reused media doesn’t contain remnant data. Tapes can be erased by degaussing, but degaussing is not always fully effective. Bitrot describes the slow loss of data on aging media, while data permanence is a term sometimes used to describe the life span of data and media."},{"ch":"D2","ch_name":"域2 资产安全","no":28,"type":"single","q":"Information maintained about an individual that can be used to distinguish or trace their identity is known as what type of information?","opts":["Personally identifiable information (PII)","Personal health information (PHI)","Social Security number (SSN)","Secure identity information (SII)"],"ans":"A","expl":"NIST Special Publication 800-122 defines PII as any information that can be used to distinguish or trace an individual’s identity, such as name, Social Security number, date and place of birth, mother’s maiden name, biometric records, and other information that is linked or linkable to an individual such as medical, educational, financial, and employment information. PHI is health-related information about a specific person, Social Security num-bers are issued to individuals in the United States, and SII is a made-up term."},{"ch":"D2","ch_name":"域2 资产安全","no":29,"type":"single","q":"Which of the following information security risks to data at rest would result in the greatest reputational impact on an organization?","opts":["Improper classification","Data breach","Decryption","An intentional insider threat"],"ans":"B","expl":"Typically, data breaches cause the greatest reputational damage as a result of threats to data at rest. Data at rest with a high level of sensitivity is often encrypted to help prevent this. Decryption is not as significant of a threat if strong encryption is used and encryption keys are well secured. Insider threats are a risk, but the majority of insider threat issues are unintentional rather than intentional, making this risk less likely in most organizations."},{"ch":"D2","ch_name":"域2 资产安全","no":30,"type":"single","q":"Full disk encryption like Microsoft’s BitLocker is used to protect data in what state?","opts":["Data in transit","Data at rest","Unlabeled data","Labeled data"],"ans":"B","expl":"Full disk encryption only protects data at rest. Since it encrypts the full disk, it does not distinguish between labeled and unlabeled data."},{"ch":"D2","ch_name":"域2 资产安全","no":31,"type":"single","q":"The company that Katie works for provides its staff with mobile phones for employee use, with new phones issued every two years. What scenario best describes this type of practice when the phones themselves are still usable and receiving operating system updates?","opts":["EOL","Planned obsolescence","EOS","Device risk management"],"ans":"C","expl":"This is an example of an end-of-support (EOS) scenario. The company is intentionally ending support and needs to address what happens to the devices next—secure disposal, destruction, or re-sale—depending on data security requirements and policies set by the company. EOL is when a device or software is no longer made or supported, in contrast to end of support, which may be when it is no longer serviced, including via patches, upgrades, or organizational maintenance. Planned obsolescence and device risk management are not terms that are used on the exam."},{"ch":"D2","ch_name":"域2 资产安全","no":32,"type":"single","q":"What is the primary purpose of data classification?","opts":["It quantifies the cost of a data breach.","It prioritizes IT expenditures.","It allows compliance with breach notification laws.","It identifies the value of the data to the organization."],"ans":"D","expl":"Classification identifies the value of data to an organization. This can often help drive IT expenditure prioritization and could help with rough cost estimates if a breach occurred, but that’s not the primary purpose. Finally, most breach laws call out specific data types for notification rather than requiring organizations to classify data themselves."},{"ch":"D2","ch_name":"域2 资产安全","no":33,"type":"single","q":"Fred’s organization allows downgrading of systems for reuse after projects have been finished and the systems have been purged. What concern should Fred raise about the reuse of the systems from his Top Secret classified project for a future project classified as Secret?","opts":["The Top Secret data may be commingled with the Secret data, resulting in a need to relabel the system.","The cost of the sanitization process may exceed the cost of new equipment.","The data may be exposed as part of the sanitization process.","The organization’s DLP system may flag the new system due to the difference in data labels."],"ans":"B","expl":"Downgrading systems and media is rare due to the difficulty of ensuring that sanitization is complete. The need to completely wipe (or destroy) the media that systems use means that the cost of reuse is often significant and may exceed the cost of purchasing a new system or media. The goal of purging is to ensure that no data remains, so commingling data should not be a con-cern, nor should the exposure of the data; only staff with the proper clearance should handle the systems! Finally, a DLP system should flag data based on labels, not on the system it comes from."},{"ch":"D2","ch_name":"域2 资产安全","no":34,"type":"single","q":"Which of the following concerns should not be part of the decision when classifying data?","opts":["The cost to classify the data","The sensitivity of the data","The amount of harm that exposure of the data could cause","The value of the data to the organization"],"ans":"A","expl":"Classification should be conducted based on the value of the data to the organization, its sensitivity, and the amount of harm that could result from exposure of the data. Cost should be considered when implementing controls and is weighed against the damage that exposure would create."},{"ch":"D2","ch_name":"域2 资产安全","no":35,"type":"single","q":"Which of the following is the least effective method of removing data from media?\nFor questions 36–38, please refer to the following scenario:","opts":["Degaussing","Purging","Erasing","Clearing"],"ans":"C","expl":"Erasing, which describes a typical deletion process in many operating systems, typically removes only the link to the file and leaves the data that makes up the file itself. The data will remain in place but not indexed until the space is needed and it is overwritten. Degaussing works only on magnetic media, but it can be quite effective on it. Purging and clearing both describe more elaborate removal processes."},{"ch":"D2","ch_name":"域2 资产安全","no":36,"type":"single","q":"What encryption technology would be appropriate for HIPAA documents in transit?","opts":["BitLocker","DES","TLS","SSL"],"ans":"C","expl":"TLS is a modern encryption method used to encrypt and protect data in transit. BitLocker is a full disk encryption technology used for data at rest. DES and SSL are both outdated encryption methods and should not be used for data that requires high levels of security.","scene":"The healthcare company that Amanda works for handles HIPAA data as well as internal business data, protected health information, and day-to-day business communications. Its internal policy uses the following requirements for securing HIPAA data at rest and in transit. Classification Handling Requirements Confidential (HIPAA) Encrypt at rest and in transit. Full disk encryption is required for all workstations. Files can only be sent in encrypted form, and passwords must be transferred under separate cover. Printed documents must be labeled with “HIPAA handling required.” Private (PHI) Encrypt at rest and in transit. PHI must be stored on secure servers, and copies should not be kept on local workstations. Printed documents must be labeled with “Private.” Sensitive (business confidential) Encryption is recommended but not required. Public Information can be sent unencrypted."},{"ch":"D2","ch_name":"域2 资产安全","no":37,"type":"single","q":"Amanda’s employer asks Amanda to classify patient X-ray data that has an internal patient identifier associated with it but does not have any way to directly identify a patient. The company’s data owner believes that exposure of the data could cause damage (but not excep-tional damage) to the organization. How should Amanda classify the data?","opts":["Public","Sensitive","Private","Confidential"],"ans":"C","expl":"We know that the data classification will not be the top-level classification of Confidential because the loss of the data would not cause severe damage. This means we have to choose between private (PHI) and sensitive (confidential). Calling this private due to the patient’s personal health information fits the classification scheme, giving us the correct answer.","scene":"The healthcare company that Amanda works for handles HIPAA data as well as internal business data, protected health information, and day-to-day business communications. Its internal policy uses the following requirements for securing HIPAA data at rest and in transit. Classification Handling Requirements Confidential (HIPAA) Encrypt at rest and in transit. Full disk encryption is required for all workstations. Files can only be sent in encrypted form, and passwords must be transferred under separate cover. Printed documents must be labeled with “HIPAA handling required.” Private (PHI) Encrypt at rest and in transit. PHI must be stored on secure servers, and copies should not be kept on local workstations. Printed documents must be labeled with “Private.” Sensitive (business confidential) Encryption is recommended but not required. Public Information can be sent unencrypted."},{"ch":"D2","ch_name":"域2 资产安全","no":38,"type":"single","q":"What technology could Amanda’s employer implement to help prevent confidential data from being emailed out of the organization?","opts":["DLP","IDS","A firewall","UDP"],"ans":"A","expl":"A data loss prevention (DLP) system or software is designed to identify labeled data or data that fits specific patterns and descriptions to help prevent it from leaving the organiza-tion. An IDS is designed to identify intrusions. Although some IDS systems can detect specific types of sensitive data using pattern matching, they have no ability to stop traffic. A firewall uses rules to control traffic routing, while UDP is a network protocol.","scene":"The healthcare company that Amanda works for handles HIPAA data as well as internal business data, protected health information, and day-to-day business communications. Its internal policy uses the following requirements for securing HIPAA data at rest and in transit. Classification Handling Requirements Confidential (HIPAA) Encrypt at rest and in transit. Full disk encryption is required for all workstations. Files can only be sent in encrypted form, and passwords must be transferred under separate cover. Printed documents must be labeled with “HIPAA handling required.” Private (PHI) Encrypt at rest and in transit. PHI must be stored on secure servers, and copies should not be kept on local workstations. Printed documents must be labeled with “Private.” Sensitive (business confidential) Encryption is recommended but not required. Public Information can be sent unencrypted."},{"ch":"D2","ch_name":"域2 资产安全","no":39,"type":"single","q":"Jacob’s organization uses the US government’s data classification system, which includes Top Secret, Secret, Confidential, and Unclassified ratings (from most sensitive to least). Jacob encounters a system that contains Secret, Confidential, and Top Secret data. How should it be classified?","opts":["Top Secret","Confidential","Secret","Mixed classification"],"ans":"A","expl":"When data is stored in a mixed classification environment, it is typically classified based on the highest classification of data included. In this case, the US government’s highest classification is Top Secret. Mixed classification is not a valid classification in this scheme."},{"ch":"D2","ch_name":"域2 资产安全","no":40,"type":"single","q":"Elle is planning her organization’s asset retention efforts and wants to establish when the company will remove assets from use. Which of the following is typically the last event in a manufacturer or software provider’s lifecycle?","opts":["End of life","End of support","End of sales","General availability"],"ans":"B","expl":"The end of support of a device or product typically occurs after the end of life and end of sales. Support may continue for a period of months or even years, but eventually support stops too. General availability is found during the main part of a lifecycle, rather than at the end, and helps note when the product is out of testing and can be acquired or used by cus-tomers or others instead of specific groups like beta testers or early release partners."},{"ch":"D2","ch_name":"域2 资产安全","no":41,"type":"single","q":"Amanda has been asked to ensure that her organization’s controls assessment procedures match the specific systems that the company uses. What activity best matches this task?","opts":["Asset management","Compliance","Scoping","Tailoring"],"ans":"D","expl":"Tailoring ensures that assessment methods are appropriate to the systems, services, and other assets that are being validated and is the best answer here. Scoping is a related term and involves setting the boundaries of security control implementations. Asset management involves how assets are overseen throughout their lifecycle, and compli-ance is a broad term that describes ensuring that regulations, contractual terms, or other requirements are met."},{"ch":"D2","ch_name":"域2 资产安全","no":42,"type":"single","q":"Chris is responsible for his organization’s security standards and has guided the selection and implementation of a security baseline for Windows PCs in his organization. How can Chris most effectively make sure that the workstations he is responsible for are being checked for compliance and that settings are being applied as necessary?","opts":["Assign users to spot-check baseline compliance.","Use Microsoft Group Policy.","Create startup scripts to apply policy at system start.","Periodically review the baselines with the data owner and system owners."],"ans":"B","expl":"Group Policy provides the ability to monitor and apply settings in a security baseline. Manual checks by users and using startup scripts provide fewer reviews and may be prone to failure, while periodic review of the baseline won’t result in compliance being checked."},{"ch":"D2","ch_name":"域2 资产安全","no":43,"type":"single","q":"Frank is reviewing his company’s data lifecycle and wants to place appropriate controls around the data collection phase. Which of the following ensures that data subjects agree to the processing of their data?","opts":["Retention","Consent","Certification","Remanence"],"ans":"B","expl":"Providing consent, or agreeing to data collection and use, is important in many data collection scenarios and may be required by law. Remanence occurs when data remains in place, sometimes inadvertently, after it should have been removed or disposed of. Retention is the intentional pro-cess of keeping and managing data. Certification is not a data lifecycle process element."},{"ch":"D2","ch_name":"域2 资产安全","no":44,"type":"single","q":"As a DBA, Amy’s data role in her organization includes technical implementations of the data policies and standards, as well as managing the data structures that the data is stored in. What data role best fits what Amy does?","opts":["Data custodian","Data owner","Data processor","Data user"],"ans":"A","expl":"Amy is a data custodian and is responsible for the technical environment, including things like database structures and the technical implementations of data policies. Some organiza-tions may overlap other data roles, including data controllers or data stewards, but the best answer here is a data custodian. Amy is not a data user and is not a data processor who uses the data on behalf of a data controller."},{"ch":"D2","ch_name":"域2 资产安全","no":45,"type":"single","q":"The company Jim works for suffered from a major data breach in the past year and now wants to ensure that it knows where data is located and if it is being transferred, is being copied to a thumb drive, or is in a network file share where it should not be. Which of the following solutions is best suited to tagging, monitoring, and limiting where files are transferred to?","opts":["DRM","DLP","A network IPS","Antivirus"],"ans":"B","expl":"A data loss prevention (DLP) system can tag, monitor, and limit where files are transferred to. Jim’s company may also elect to use digital rights management tools in combination with a data loss prevention system, but DRM controls how data can be used, not where files are transferred to or where they exist at any point in time in most cases. An intrusion preven-tion system (IPS) may be able to detect files that are being sent across a network but won’t stop files from being copied on workstations or thumb drives. Antivirus is not designed for this purpose."},{"ch":"D2","ch_name":"域2 资产安全","no":46,"type":"single","q":"What security measure can provide an additional security control in the event that backup tapes are stolen or lost?","opts":["Keep multiple copies of the tapes.","Replace tape media with hard drives.","Use appropriate security labels.","Use AES-256 encryption."],"ans":"D","expl":"Using strong encryption, like AES-256, can help ensure that loss of removable media like tapes doesn’t result in a data breach. Security labels may help with handling processes, but they won’t help once the media is stolen or lost. Having multiple copies will ensure that you can still access the data but won’t increase the security of the media. Finally, using hard drives instead of tape only changes the media type and not the risk from theft or loss."},{"ch":"D2","ch_name":"域2 资产安全","no":47,"type":"single","q":"Joe works at a major pharmaceutical research and development company and has been tasked with writing his organization’s data retention policy. As part of its legal requirements, the organization must comply with the US Food and Drug Administration’s Code of Federal Regulations Title 21. To do so, it is required to retain records with electronic signatures. Why would a signature be part of a retention requirement?","opts":["It ensures that someone has reviewed the data.","It provides confidentiality.","It ensures that the data has been changed.","It validates who approved the data."],"ans":"D","expl":"Electronic signatures, as used in this rule, prove that the signature was provided by the intended signer. Electronic signatures as part of the FDA code are intended to ensure that electronic records are “trustworthy, reliable, and generally equivalent to paper records and handwritten signatures executed on paper.” Signatures cannot provide confidentiality or integrity and don’t ensure that someone has reviewed the data."},{"ch":"D2","ch_name":"域2 资产安全","no":48,"type":"single","q":"Susan wants to manage her data’s lifecycle based on retention rules. What technique can she use to ensure that data that has reached the end of its lifecycle can be identified and disposed of based on her organization’s disposal processes?","opts":["Rotation","DRM","DLP","Tagging"],"ans":"D","expl":"Tags that include information about the life span of the data and when it has expired can help with lifecycle management processes. Tags can be as simple as timestamps, or they can include additional metadata like the data type, creator, or purpose that can help inform the retention and disposal process. Rotation of files like logs is commonly done to limit how much space they take up, but rotation itself does not address disposal requirements and information that would guide the disposal process. DRM, or digital rights management, and DLP, or data loss prevention, both address data security and use but not disposal."},{"ch":"D2","ch_name":"域2 资产安全","no":49,"type":"single","q":"Ben has been asked to scrub data to remove data that is no longer needed by his organiza-tion. What phase of the data lifecycle is Ben most likely operating in?","opts":["Data retention","Data maintenance","Data remanence","Data collection"],"ans":"B","expl":"During the data maintenance phase of a typical data lifecycle, activities like data scrub-bing occur to remove unneeded, incorrect, or out-of-date data. Data retention is not a phase; instead, it is a decision that organizations make based on requirements, laws, or their own needs. Data remanence is also not a phase. Data remanence describes the problem of data that remains after data is removed. Finally, in the data collection phase, data is acquired\nand may be scrubbed, but the question describes a process occurring after data is no longer needed, not during acquisition."},{"ch":"D2","ch_name":"域2 资产安全","no":50,"type":"single","q":"Steve is concerned about the fact that employees leaving his organization were often privy to proprietary information. Which one of the following controls is most effective against this threat?","opts":["Sanitization","NDAs","Clearing","Encryption"],"ans":"B","expl":"Nondisclosure agreements (NDAs) are used to enforce confidentiality agreements with employees and may remain in effect even after an employee leaves the organization. Other controls, such as sanitization, clearing, and encryption, would not be effective against information in an employee’s memory."},{"ch":"D2","ch_name":"域2 资产安全","no":51,"type":"single","q":"Alex works for a government agency that is required to meet US federal government require-ments for data security. To meet these requirements, Alex has been tasked with making\n• sure data is identifiable by its classification level when it is created. What should Alex do to the data?","opts":["Classify the data.","Encrypt the data.","Label the data.","Apply DRM to the data."],"ans":"C","expl":"Data labels are crucial to identify the classification level of information contained on the media, and labeling data at creation helps to ensure that it is properly handled throughout its lifecycle. Digital rights management (DRM) tools provide ways to control how data is used, while encrypting it can help maintain the confidentiality and integrity of the data. Classifying the data is necessary to label it, but it doesn’t automatically place a label on the data."},{"ch":"D2","ch_name":"域2 资产安全","no":52,"type":"single","q":"Ben is following the National Institute of Standards and Technology (NIST) Special Pub-lication 800-88 guidelines for sanitization and disposition as shown here. He is handling information that his organization classified as sensitive, which is a moderate security catego-rization in the NIST model. If the media is going to be sold as surplus, what process does Ben need to follow?\n• Source: NIST SP 800-88.","opts":["Destroy, validate, document","Clear, purge, document","Purge, document, validate","Purge, validate, document"],"ans":"D","expl":"The NIST SP 800-88 process for sanitization and disposition shows that media that will be reused and was classified at a moderate level should be purged and then that purge should be validated. Finally, it should be documented."},{"ch":"D2","ch_name":"域2 资产安全","no":53,"type":"single","q":"What methods are often used to protect data in transit?","opts":["Telnet, ISDN, UDP","BitLocker, FileVault","AES, Serpent, IDEA","TLS, VPN, IPsec"],"ans":"D","expl":"Data in transit is data that is traversing a network or is otherwise in motion. TLS, VPNs, and IPsec tunnels are all techniques used to protect data in transit. AES, Serpent, and IDEA are all symmetric algorithms, while Telnet, ISDN, and UDP are all protocols. BitLocker and FileVault are both used to encrypt data, but they protect only stored data, not data in transit."},{"ch":"D2","ch_name":"域2 资产安全","no":54,"type":"single","q":"Which one of the following data roles bears ultimate organizational responsibility for data?","opts":["System owners","Business owners","Data owners","Mission owners"],"ans":"C","expl":"The data owner has ultimate responsibility for data belonging to an organization and is typically the CEO, president, or another senior employee. Business and mission owners typi-cally own processes or programs. System owners own a system that processes sensitive data."},{"ch":"D2","ch_name":"域2 资产安全","no":55,"type":"single","q":"Shandra wants to secure an encryption key. Which location would be the most difficult to protect, if the key was kept and used in that location?\nFor questions 56–58, please refer to the following scenario:","opts":["On a local network","On disk","In memory","On a public network"],"ans":"C","expl":"The most difficult location to secure for encryption keys and similar highly sensitive information is in active memory because the data needs to be decrypted to be used.\nWhen data is at rest on a drive or in transit via either a local or public network, it can be encrypted until it reaches its destination, and you can use strong encryption in each of those circumstances."},{"ch":"D2","ch_name":"域2 资产安全","no":56,"type":"single","q":"If Chris is one of the data owners for the organization, what steps in this process is he most likely responsible for?","opts":["He is responsible for steps 3, 4, and 5.","He is responsible for steps 1, 2, and 3.","He is responsible for steps 5, 6, and 7.","All of the steps are his direct responsibility."],"ans":"A","expl":"Chris is most likely to be responsible for classifying the data that he owns as well as assisting with or advising the system owners on security requirements and control selection. In an organization with multiple data owners, Chris is unlikely to set criteria for classifying data on his own. As a data owner, Chris will also not typically have direct responsibility for scoping, tailoring, applying, or enforcing those controls.","scene":"Chris has recently been hired into a new organization. The organization that Chris belongs to uses the following classification process:\n• Criteria are set for classifying data.\n• Data owners are established for each type of data.\n• Data is classified.\n• Required controls are selected for each classification.\n• Baseline security standards are selected for the organization.\n• Controls are scoped and tailored.\n• Controls are applied and enforced.\n• Access is granted and managed."},{"ch":"D2","ch_name":"域2 资产安全","no":57,"type":"single","q":"Chris manages a team of system administrators. What data role are they fulfilling if they con-duct steps 6, 7, and 8 of the classification process?","opts":["They are system owners and administrators.","They are administrators and custodians.","They are data owners and administrators.","They are custodians and users."],"ans":"B","expl":"The system administrators are acting in the roles of data administrators who grant access and will also act as custodians who are tasked with the day-to-day application of security controls. They are not acting as data owners who own the data itself. Typically, system administrators are delegated authority by system owners, such as a department head, and of course they are tasked with providing access to users.","scene":"Chris has recently been hired into a new organization. The organization that Chris belongs to uses the following classification process:\n• Criteria are set for classifying data.\n• Data owners are established for each type of data.\n• Data is classified.\n• Required controls are selected for each classification.\n• Baseline security standards are selected for the organization.\n• Controls are scoped and tailored.\n• Controls are applied and enforced.\n• Access is granted and managed."},{"ch":"D2","ch_name":"域2 资产安全","no":58,"type":"single","q":"If Chris’s company operates in the European Union and has been contracted to handle the data for a third party, what role is his company operating in when it uses this process to clas-sify and handle data?\nFor questions 59–62, please refer to the following scenario:","opts":["Business owners","Mission owners","Data processors","Data administrators"],"ans":"C","expl":"Third-party organizations that process personal data on behalf of a data controller are known as data processors. The organization that they are contracting with would act in the role of the business or mission owners, and others within Chris’s organization would have the role of data administrators, granting access as needed to the data based on their operational procedures and data classification.","scene":"Chris has recently been hired into a new organization. The organization that Chris belongs to uses the following classification process:\n• Criteria are set for classifying data.\n• Data owners are established for each type of data.\n• Data is classified.\n• Required controls are selected for each classification.\n• Baseline security standards are selected for the organization.\n• Controls are scoped and tailored.\n• Controls are applied and enforced.\n• Access is granted and managed."},{"ch":"D2","ch_name":"域2 资产安全","no":59,"type":"single","q":"Chris needs to identify all of the active systems and devices on the network. Which of the fol-lowing techniques will give him the most complete list of connected devices?","opts":["Query Active Directory for a list of all computer objects.","Perform a port scan of all systems on the network.","Ask all staff members to fill out a form listing all of their systems and devices.","Use network logs to identify all connected devices and track them down from there."],"ans":"D","expl":"While it can be a lot of work, the most complete inventory of active systems and devices can be created by determining what is connected to the network and then finding those assets. Port scans can help to find some systems, but firewalls and other security solutions can prevent systems from being discovered. Staff may not know about all of the systems and devices on the network or may presume that someone else will provide information about shared resources such as printers, security cameras, or other devices. Active Directory is unlikely to contain all devices, particularly if an inventory is needed!","scene":"Chris has been put in charge of his organization’s IT service management effort, and part of that effort includes creating an inventory of both tangible and intangible assets. As a security professional, you have been asked to provide Chris with security-related guidance on each of the following topics. Your goal is to provide Chris with the best answer from each of the options, knowing that in some cases more than one of the answers could be acceptable."},{"ch":"D2","ch_name":"域2 资产安全","no":60,"type":"single","q":"Chris knows that his inventory is only accurate at the moment it was completed. How can he best ensure that it remains up-to-date?","opts":["Perform a point-in-time query of network connected devices and update the list based on what is found.","Ensure that procurement and acquisition processes add new devices to the inventory before they are deployed.","Require every employee to provide an updated inventory of devices they are responsible for on a quarterly basis.","Manually verify every device in service at each organizational location on a yearly basis."],"ans":"B","expl":"In most organizations, changing processes so that new systems and devices are added to inventory before they are deployed is the first step in making sure asset inventories are\ncurrent. Yearly or quarterly updates are too infrequent for most organizations and will lead to gaps as devices are forgotten.","scene":"Chris has been put in charge of his organization’s IT service management effort, and part of that effort includes creating an inventory of both tangible and intangible assets. As a security professional, you have been asked to provide Chris with security-related guidance on each of the following topics. Your goal is to provide Chris with the best answer from each of the options, knowing that in some cases more than one of the answers could be acceptable."},{"ch":"D2","ch_name":"域2 资产安全","no":61,"type":"single","q":"Chris knows that his organization has more than just physical assets. In fact, his organi-zation’s business involves significant intellectual property assets, including designs and formulas. Chris needs to track and inventory those assets as well. How can he most effec-tively ensure that he can identify and manage data throughout his organization based on its classification or type?","opts":["Track file extensions for common data types.","Ensure that data is collected in specific network share locations based on the data type and group that works with it.","Use metadata tagging based on data type or security level.","Automatically tag data by file extension type."],"ans":"C","expl":"Chris should use metadata tagging to allow him to use technical tools like DLP and DRM to handle and track data based on its type and content. File extensions do not reveal data security or type, and relying on network share locations to secure data or inventory will lead to gaps in security as files are moved, copied, or stored locally.","scene":"Chris has been put in charge of his organization’s IT service management effort, and part of that effort includes creating an inventory of both tangible and intangible assets. As a security professional, you have been asked to provide Chris with security-related guidance on each of the following topics. Your goal is to provide Chris with the best answer from each of the options, knowing that in some cases more than one of the answers could be acceptable."},{"ch":"D2","ch_name":"域2 资产安全","no":62,"type":"single","q":"Chris has been tasked with identifying intangible assets but needs to provide his team with a list of the assets they will be inventorying. Which of the following is not an example of an intangible asset?","opts":["Patents","Databases","Formulas","Employees"],"ans":"D","expl":"Patents, databases, and formulas are all examples of intangible assets. Tangible assets include things like hardware, cables, and buildings. Personnel assets include employees, and most organizations would be quite concerned if their employees were intangible!","scene":"Chris has been put in charge of his organization’s IT service management effort, and part of that effort includes creating an inventory of both tangible and intangible assets. As a security professional, you have been asked to provide Chris with security-related guidance on each of the following topics. Your goal is to provide Chris with the best answer from each of the options, knowing that in some cases more than one of the answers could be acceptable."},{"ch":"D2","ch_name":"域2 资产安全","no":63,"type":"single","q":"Which of the following is not a common requirement for the collection of data under data privacy laws and statutes?","opts":["Only data that is needed is collected.","Data should be obtained lawfully and via fair methods.","Data should only be collected with the consent of the individual whose data is being col-lected.","Data should be collected from all individuals equally."],"ans":"D","expl":"There is no requirement that data collection be equal or equivalent. Instead, data collec-tion statutes and other requirements often require that only required data is collected, that individuals are made aware of the data collection, and that they consent to the collection. Similarly, data should only be collected lawfully and via fair methods."},{"ch":"D2","ch_name":"域2 资产安全","no":64,"type":"single","q":"Susan works in an organization that labels all removable media with the classification level of the data it contains, including public data. Why would Susan’s employer label all media instead of labeling only the media that contains data that could cause harm if it was exposed?","opts":["It is cheaper to order all prelabeled media.","It prevents sensitive media from not being marked by mistake.","It prevents reuse of public media for sensitive data.","Labeling all media is required by HIPAA."],"ans":"B","expl":"Requiring all media to have a label means that when unlabeled media is found, it should immediately be considered suspicious. This helps to prevent mistakes that might leave sensitive data unlabeled. Prelabeled media is not necessarily cheaper (nor may it make sense to buy!), while reusing public media simply means that it must be classified based on the data it now contains. HIPAA does not have specific media labeling requirements."},{"ch":"D2","ch_name":"域2 资产安全","no":65,"type":"single","q":"Data stored in RAM is best characterized as what type of data?","opts":["Data at rest","Data in use","Data in transit","Data at large"],"ans":"B","expl":"Data in use is data that is in a temporary storage location while an application or process is using it. Thus, data in memory is best described as data in use or ephemeral data. Data at rest is in storage, while data in transit is traveling over a network or other channel. Data at large is a made-up term."},{"ch":"D2","ch_name":"域2 资产安全","no":67,"type":"single","q":"Why is declassification rarely chosen as an option for media reuse?","opts":["Purging is sufficient for sensitive data.","Sanitization is the preferred method of data removal.","It is more expensive than new media and may still fail.","Clearing is required first."],"ans":"C","expl":"Ensuring that data cannot be recovered is difficult, and the time and effort required to securely and completely wipe media as part of declassification can exceed the cost of new media. Sanitization, purging, and clearing may be part of declassification, but they are not rea-sons that it is not frequently chosen as an option for organizations with data security concerns."},{"ch":"D2","ch_name":"域2 资产安全","no":68,"type":"single","q":"Incineration, crushing, shredding, and disintegration all describe what stage in the lifecy-cle of media?","opts":["Sanitization","Degaussing","Purging","Destruction"],"ans":"D","expl":"Destruction is the final stage in the lifecycle of media and can be done via disintegration, incineration, or a variety of other methods that result in the media and data being nonrecov-erable. Sanitization is a combination of processes used when data is being removed from a system or media. Purging is an intense form of clearing, and degaussing uses strong magnetic fields to wipe data from magnetic media."},{"ch":"D2","ch_name":"域2 资产安全","no":69,"type":"single","q":"What term is used to describe information like prescriptions and X-rays?","opts":["PHI","Proprietary data","PID","PII"],"ans":"A","expl":"PHI is protected health information. Personally identifiable information (PII) is any information that can identify an individual. Proprietary data is information that helps organi-zations maintain a competitive edge or that they want to keep to their own organization or a controlled set of individuals. PID is not a term used for data classification."},{"ch":"D2","ch_name":"域2 资产安全","no":70,"type":"single","q":"Why might an organization use unique screen backgrounds or designs on workstations that deal with data of different classification levels?","opts":["To indicate the software version in use","To promote a corporate message","To promote availability","To indicate the classification level of the data or system"],"ans":"D","expl":"Handling requirements and tools include visual indicators like a distinctive screen background and can help employees remember what level of classification they are dealing with and thus the handling requirements that they are expected to follow."},{"ch":"D2","ch_name":"域2 资产安全","no":71,"type":"single","q":"Charles has been asked to downgrade the media used for storage of private data for his organization. What process should Charles follow?","opts":["Degauss the drives, and then relabel them with a lower classification level.","Pulverize the drives, and then reclassify them based on the data they contain.","Follow the organization’s purging process, and then downgrade and replace labels.","Relabel the media, and then follow the organization’s purging process to ensure that the media matches the label."],"ans":"C","expl":"If an organization allows media to be downgraded, the purging process should be followed, and then the media should be relabeled. Degaussing may be used for magnetic media but won’t handle all types of media. Pulverizing would destroy the media, preventing reuse, while relabel-ing first could lead to mistakes that result in media that hasn’t been purged entering use."},{"ch":"D2","ch_name":"域2 资产安全","no":72,"type":"single","q":"Which of the following tasks is not performed by a system owner per NIST SP 800-18?","opts":["Develops a system security plan","Establishes rules for appropriate use and protection of data","Identifies and implements security controls","Ensures that system users receive appropriate security training"],"ans":"B","expl":"The data owner sets the rules for use and protection of data. The remaining options all describe tasks for the system owner, including implementation of security controls."},{"ch":"D2","ch_name":"域2 资产安全","no":77,"type":"single","q":"Susan needs to provide a set of minimum security requirements for email. What steps should she recommend for her organization to ensure that the email remains secure?","opts":["All email should be encrypted.","All email should be encrypted and labeled.","Sensitive email should be encrypted and labeled.","Only highly sensitive email should be encrypted."],"ans":"C","expl":"Encrypting and labeling sensitive email will ensure that it remains confidential and can be identified. Performing these actions only on sensitive email will reduce the cost and effort of encrypting all email, allowing only sensitive email to be the focus of the organization’s\nefforts. Only encrypting highly sensitive email not only skips labeling but might expose other classifications of email that shouldn’t be exposed."},{"ch":"D2","ch_name":"域2 资产安全","no":78,"type":"single","q":"How can a data retention policy reduce liabilities?","opts":["By reducing the amount of storage in use","By limiting the number of data classifications","By reducing the amount of data that may need to be produced for lawsuits","By reducing the legal penalties for noncompliance"],"ans":"C","expl":"Data retention policies can reduce the amount of old logs and other files that may need to be produced during a legal case. That can reduce organizational risk, but retention policies need to be in place well before a legal hold is filed. Reducing storage in use does not reduce liability, but it can reduce financial costs, and data retention policies don’t tend to limit the number of classifications in use. Legal penalties are not impacted by a retention policy."},{"ch":"D2","ch_name":"域2 资产安全","no":79,"type":"single","q":"What data role does a system that is used to process data have?","opts":["Mission owner","Data owner","Data processor","Custodian"],"ans":"C","expl":"Systems used to process data are data processors. Data owners are typically CEOs or other very senior staff, custodians are granted rights to perform day-to-day tasks when handling data, and mission owners are typically program or information system owners."},{"ch":"D2","ch_name":"域2 资产安全","no":80,"type":"single","q":"Which one of the following is not considered PII under US federal government regulations?","opts":["Name","Social Security number","Student ID number","ZIP code"],"ans":"D","expl":"Personally identifiable information includes any information that can uniquely iden-tify an individual. This would include name, Social Security number, and any other unique identifier (including a student ID number). ZIP code, by itself, does not uniquely identify an individual."},{"ch":"D2","ch_name":"域2 资产安全","no":81,"type":"single","q":"What type of health information is the Health Insurance Portability and Accountability Act required to protect?","opts":["PII","PHI","SHI","HPHI"],"ans":"B","expl":"Protected health information, or PHI, includes a variety of data in multiple formats, including oral and recorded data, such as that created or received by healthcare providers, employers, and life insurance providers. PHI must be protected by HIPAA. PII is personally identifiable information. SHI and HPHI are both made-up acronyms."},{"ch":"D2","ch_name":"域2 资产安全","no":82,"type":"single","q":"The system that Ian has built replaces data in a database field with a randomized string of characters that remains the same for each instance of that data. What technique has he used?","opts":["Data masking","Tokenization","Anonymization","DES"],"ans":"B","expl":"Tokenization replaces other data with a random string of characters. These tokens are then matched to the actual values for secure lookups as needed. Anonymization removes all personally identifiable data to ensure that the original subject cannot be identified. Data masking obscures some, but not all, data. Pseudonymization uses a pseudonym or alias to replace other information."},{"ch":"D2","ch_name":"域2 资产安全","no":83,"type":"single","q":"Juanita’s company processes credit cards and wants to select appropriate data security stan-dards. What data security standard is she most likely to need to use and comply with?","opts":["CC-Comply","PCI-DSS","GLBA","GDPR"],"ans":"B","expl":"The Payment Card Industry Data Security Standard, or PCI-DSS, is a credit card industry data security standard that defines how businesses must handle information related to credit cards. CC-Comply was made up for this question. GLBA, or Gramm-Leach-Bliley, modernized financial institution standards, and GDPR is an EU data privacy regulation."},{"ch":"D2","ch_name":"域2 资产安全","no":84,"type":"single","q":"What is the best method to sanitize a solid-state drive (SSD)?\nFor questions 85–87, please refer to the following scenario:","opts":["Clearing","Zero fill","Disintegration","Degaussing"],"ans":"C","expl":"Due to problems with remnant data, the U.S. National Security Agency requires physical destruction of SSDs. This process, known as disintegration, results in very small fragments via a shredding process. Zero fill wipes a drive by replacing data with zeros, degaussing uses magnets to wipe magnetic media, and clearing is the process of preparing media for reuse."},{"ch":"D2","ch_name":"域2 资产安全","no":85,"type":"single","q":"What data role will own responsibility for step 1, the categorization of information systems; to whom will they delegate step 2; and what data role will be responsible for step 3?","opts":["Data owners, system owners, custodians","Data processors, custodians, users","Business owners, administrators, custodians","System owners, business owners, administrators"],"ans":"A","expl":"The data owner bears responsibility for categorizing information systems and delegates selection of controls to system owners, while custodians implement the controls. Users don’t perform any of these actions, while business owners are tasked with ensuring that systems are fulfilling their busin
