 experienced?","opts":["Espionage","Confidentiality breach","Sabotage","Integrity breach"],"ans":"C","expl":"An attack committed against an organization by an insider, such as an employee, is known as sabotage. Espionage and confidentiality breaches involve the theft of sensitive information, which is not alleged to have occurred in this case. Integrity breaches involve the unauthorized modification of information, which is not described in this scenario."},{"ch":"D7","ch_name":"域7 安全运营","no":48,"type":"single","q":"Florian is building a disaster recovery plan for his organization and would like to determine the amount of time that a particular IT service may be down without causing serious damage to business operations. What variable is Florian calculating?","opts":["RTO","MTD","RPO","SLA"],"ans":"B","expl":"The maximum tolerable downtime (MTD) is the longest amount of time that an IT service or component may be unavailable without causing serious damage to the orga-nization. The recovery time objective (RTO) is the amount of time expected to return an IT service or component to operation after a failure. The recovery point objective (RPO) identifies the maximum amount of data, measured in time, that may be lost during a\nrecovery effort. Service-level agreements (SLAs) are written contracts that document service expectations."},{"ch":"D7","ch_name":"域7 安全运营","no":49,"type":"single","q":"Which of the following would normally be classified as zero-day attacks? (Select all that apply.)","opts":["An attacker who is new to the world of hacking","A database attack that places the date 00/00/0000 in data tables in an attempt to exploit flaws in business logic","An attack previously unknown to the security community","An attack that sets the operating system date and time to 00/00/0000 and 00:00:00"],"ans":"C","expl":"Zero-day attacks are those that are previously unknown to the security community and, therefore, have no available patch. These are especially dangerous attacks because they may be highly effective until a solution becomes available. The other attacks described here are all known attacks and would not be classified as zero-day events."},{"ch":"D7","ch_name":"域7 安全运营","no":50,"type":"single","q":"Grant is collecting records as part of the preparation for a possible lawsuit and is worried that his team may be spending too much time collecting information that may be irrelevant. What concept from the Federal Rules of Civil Procedure (FCRP) helps to ensure that addi-tional time and expense are not incurred as part of electronic discovery when the benefits do not outweigh the costs?","opts":["Tool-assisted review","Cooperation","Spoilation","Proportionality"],"ans":"D","expl":"The benefits of additional discovery must be proportional to the additional costs that they will require. This prevents additional discovery requests from becoming inordinately expensive, and the requester will typically have to justify these requests to the judge presiding over the case."},{"ch":"D7","ch_name":"域7 安全运营","no":51,"type":"single","q":"During an incident investigation, investigators meet with a system administrator who may have information about the incident but is not a suspect. What type of conversation is taking place during this meeting?","opts":["Interview","Interrogation","Both an interview and an interrogation","Neither an interview nor an interrogation"],"ans":"A","expl":"Interviews occur when investigators meet with an individual who may have information relevant to their investigation but is not a suspect. If the individual is a suspect, then the meeting is an interrogation."},{"ch":"D7","ch_name":"域7 安全运营","no":53,"type":"single","q":"You are working to evaluate the risk of flood to an area as part of a business continuity planning (BCP) effort. You consult the flood maps from the Federal Emergency Management Agency (FEMA). According to those maps, the area lies within a 200-year flood plain. What is the annualized rate of occurrence (ARO) of a flood in that region?","opts":["200","0.01","0.02","0.005"],"ans":"D","expl":"The annualized rate of occurrence (ARO) is the expected number of times an incident will occur each year. In the case of a 200-year flood plain, planners should expect a flood once every 200 years. This is equivalent to a 1/200 chance of a flood in any given year, or 0.005 floods per year."},{"ch":"D7","ch_name":"域7 安全运营","no":54,"type":"single","q":"Which one of the following individuals poses the greatest risk to security in most well-defended organizations?","opts":["Political activist","Malicious insider","Script kiddie","Thrill attacker"],"ans":"B","expl":"While all hackers with malicious intent pose a risk to the organization, the malicious insider poses the greatest risk to security because they likely have legitimate access to sensitive systems that may be used as a launching point for an attack. Other attackers do not begin with this advantage."},{"ch":"D7","ch_name":"域7 安全运营","no":55,"type":"single","q":"Veronica is considering the implementation of a database recovery mechanism recommended by a consultant. In the recommended approach, an automated process will move database backups from the primary facility to an off-site location each night. What type of database recovery technique is the consultant describing?","opts":["Remote journaling","Remote mirroring","Electronic vaulting","Transaction logging"],"ans":"C","expl":"In an electronic vaulting approach, automated technology moves database backups from the primary database server to a remote site on a scheduled basis, typically daily. Transac-tion logging is not a recovery technique alone; it is a process for generating the logs used in remote journaling. Remote journaling transfers transaction logs to a remote site on a more frequent basis than electronic vaulting, typically hourly. Remote mirroring maintains a live database server at the backup site and mirrors all transactions at the primary site on the server at the backup site."},{"ch":"D7","ch_name":"域7 安全运营","no":56,"type":"single","q":"When designing an access control scheme, Hilda set up roles so that the same person does not have the ability to provision a new user account and assign superuser privileges to an account. What information security principle is Hilda following?","opts":["Least privilege","Separation of duties","Job rotation","Security through obscurity"],"ans":"B","expl":"Hilda’s design follows the principle of separation of duties. Giving one user the ability to both create new accounts and grant administrative privileges combines two actions that would result in a significant security change that should be divided among two users."},{"ch":"D7","ch_name":"域7 安全运营","no":57,"type":"single","q":"Patrick was charged with implementing a threat hunting program for his organization. Which one of the following is the basic assumption of a threat hunting program that he should use as he plans his work?","opts":["Security controls were designed using a defense-in-depth strategy.","Audits may uncover control deficiencies.","Attackers may already be present on the network.","Defense mechanisms may contain unpatched vulnerabilities."],"ans":"C","expl":"While all of these assumptions are valid premises that Patrick might have going into the exercise, the basic assumption of a threat hunting exercise is the so-called presumption of compromise. This means that Patrick should assume that attackers have already gained access to his system and then hunt for indicators of their presence."},{"ch":"D7","ch_name":"域7 安全运营","no":58,"type":"single","q":"Brian is developing the training program for his organization’s disaster recovery program and would like to make sure that participants understand when disaster activity concludes. Which one of the following events marks the completion of a disaster recovery process?","opts":["Securing property and life safety","Restoring operations in an alternate facility","Restoring operations in the primary facility","Standing down first responders"],"ans":"C","expl":"The end goal of the disaster recovery process is restoring normal business operations in the primary facility. All of the other actions listed may take place during the disaster recovery process, but the process is not complete until the organization is once again functioning nor-mally in its primary facilities."},{"ch":"D7","ch_name":"域7 安全运营","no":59,"type":"single","q":"Melanie suspects that someone is using malicious software to steal computing cycles from her company. Which one of the following security tools would be in the best position to detect this type of incident?","opts":["NIDS","Firewall","HIDS","DLP"],"ans":"C","expl":"A host-based intrusion detection system (HIDS) may be able to detect unauthorized processes running on a system. The other controls mentioned, network intrusion detection systems (NIDSs), firewalls, and DLP systems, are network-based and may not notice rogue processes."},{"ch":"D7","ch_name":"域7 安全运营","no":60,"type":"single","q":"Brandon observes that an authorized user of a system on his network recently misused his account to exploit a system vulnerability against a shared server that allowed him to gain root access to that server. What type of attack took place?","opts":["Denial-of-service","Privilege escalation","Reconnaissance","Brute-force"],"ans":"B","expl":"The scenario describes a privilege escalation attack where a malicious insider with autho-rized access to a system misused that access to gain privileged credentials."},{"ch":"D7","ch_name":"域7 安全运营","no":61,"type":"single","q":"Carla has worked for her company for 15 years and has held a variety of different positions. Each time she changed positions, she gained new privileges associated with that position, but no privileges were ever taken away. What concept describes the sets of privileges she has accumulated?","opts":["Entitlement","Aggregation","Transitivity","Isolation"],"ans":"B","expl":"Carla’s account has experienced aggregation, where privileges accumulated over time. This condition is also known as privilege creep and likely constitutes a violation of the least privi-lege principle."},{"ch":"D7","ch_name":"域7 安全运营","no":62,"type":"single","q":"During what phase of the incident response process do administrators take action to limit the effect or scope of an incident?\nFor questions 63–66, please refer to the following scenario:","opts":["Detection","Response","Mitigation","Recovery"],"ans":"C","expl":"The mitigation phase of incident response focuses on actions that can contain the damage incurred during an incident. This includes limiting the scope and or effectiveness of the inci-dent. The detection phase identifies that an incident is taking place. The response phase includes steps taken to assemble a team and triage the incident. The recovery phase resumes normal operations."},{"ch":"D7","ch_name":"域7 安全运营","no":63,"type":"single","q":"At this point in the incident response process, what term best describes what has occurred in Ann’s organization?","opts":["Security occurrence","Security incident","Security event","Security intrusion"],"ans":"C","expl":"At this point in the process, Ann has no reason to believe that any actual security compro-mise or policy violation took place, so this situation does not meet the criteria for a security incident or intrusion. Rather, the alert generated by the intrusion detection system is simply\na security event requiring further investigation. Security occurrence is not a term commonly used in incident handling.","scene":"Ann is a security professional for a midsize business and typically handles log analysis and security monitoring tasks for her organization. One of her roles is to monitor alerts orig-inating from the organization’s intrusion detection system. The system typically generates several dozen alerts each day, and many of those alerts turn out to be false alarms after her investigation. This morning, the intrusion detection system alerted because the network began to receive an unusually high volume of inbound traffic. Ann received this alert and began looking into the origin of the traffic."},{"ch":"D7","ch_name":"域7 安全运营","no":64,"type":"single","q":"Ann continues her investigation and realizes that the traffic generating the alert is abnormally high volumes of inbound UDP traffic on port 53. What service typically uses this port?","opts":["DNS","SSH/SCP","SSL/TLS","HTTP"],"ans":"A","expl":"DNS traffic commonly uses port 53 for both TCP and UDP communications. SSH and SCP use TCP port 22. SSL and TLS do not have ports assigned to them but are commonly used for HTTPS traffic on port 443. Unencrypted web traffic over HTTP often uses port 80.","scene":"Ann is a security professional for a midsize business and typically handles log analysis and security monitoring tasks for her organization. One of her roles is to monitor alerts orig-inating from the organization’s intrusion detection system. The system typically generates several dozen alerts each day, and many of those alerts turn out to be false alarms after her investigation. This morning, the intrusion detection system alerted because the network began to receive an unusually high volume of inbound traffic. Ann received this alert and began looking into the origin of the traffic."},{"ch":"D7","ch_name":"域7 安全运营","no":65,"type":"single","q":"As Ann analyzes the traffic further, she realizes that the traffic is coming from many different sources and has overwhelmed the network, preventing legitimate uses. The inbound packets are responses to queries that she does not see in outbound traffic. The responses are abnor-mally large for their type. What type of attack should Ann suspect?","opts":["Reconnaissance","Malicious code","System penetration","Denial-of-service"],"ans":"D","expl":"The attack described in this scenario has all the hallmarks of a denial-of-service attack. More specifically, Ann’s organization is likely experiencing a DNS amplification attack where an attacker sends false requests to third-party DNS servers with a forged source IP address belonging to the targeted system. Because the attack uses UDP requests, there is no three-way handshake. The attack packets are carefully crafted to elicit a lengthy response from a short query. The purpose of these queries is to generate responses headed to the target system that are sufficiently large and numerous enough to overwhelm the targeted network or system.","scene":"Ann is a security professional for a midsize business and typically handles log analysis and security monitoring tasks for her organization. One of her roles is to monitor alerts orig-inating from the organization’s intrusion detection system. The system typically generates several dozen alerts each day, and many of those alerts turn out to be false alarms after her investigation. This morning, the intrusion detection system alerted because the network began to receive an unusually high volume of inbound traffic. Ann received this alert and began looking into the origin of the traffic."},{"ch":"D7","ch_name":"域7 安全运营","no":66,"type":"single","q":"Now that Ann understands that an attack has taken place that violates her organization’s security policy, what term best describes what has occurred in Ann’s organization?","opts":["Security occurrence","Security incident","Security event","Security intrusion"],"ans":"B","expl":"Now that Ann suspects an attack against her organization, she has sufficient evidence to declare a security incident. The attack underway seems to have undermined the availability of her network, meeting one of the criteria for a security incident. This is an escalation beyond\na security event but does not reach the level of an intrusion because there is no evidence that the attacker has even attempted to gain access to systems on Ann’s network. Security occur-rence is not a term commonly used in incident handling.","scene":"Ann is a security professional for a midsize business and typically handles log analysis and security monitoring tasks for her organization. One of her roles is to monitor alerts orig-inating from the organization’s intrusion detection system. The system typically generates several dozen alerts each day, and many of those alerts turn out to be false alarms after her investigation. This morning, the intrusion detection system alerted because the network began to receive an unusually high volume of inbound traffic. Ann received this alert and began looking into the origin of the traffic."},{"ch":"D7","ch_name":"域7 安全运营","no":67,"type":"single","q":"Frank is seeking to introduce a hacker’s laptop in court as evidence against the hacker. The laptop does contain logs that indicate the hacker committed the crime, but the court ruled that the search of the apartment that resulted in police finding the laptop was unconstitu-tional. What admissibility criteria prevents Frank from introducing the laptop as evidence?","opts":["Materiality","Relevance","Hearsay","Competence"],"ans":"D","expl":"To be admissible, evidence must be relevant, material, and competent. The laptop in this case is clearly material because it contains logs related to the crime in question. It is also\nrelevant because it provides evidence that ties the hacker to the crime. It is not competent because the evidence was not legally obtained."},{"ch":"D7","ch_name":"域7 安全运营","no":68,"type":"single","q":"Gordon suspects that a hacker has penetrated a system belonging to his company. The system does not contain any regulated information, and Gordon wants to conduct an investigation on behalf of his company. He has permission from his supervisor to conduct the investiga-tion. Which of the following statements is true?","opts":["Gordon is legally required to contact law enforcement before beginning the investiga-tion.","Gordon may not conduct his own investigation.","Gordon’s investigation may include examining the contents of hard disks, network traffic, and any other systems or information belonging to the company.","Gordon may ethically perform “hack back” activities after identifying the perpetrator."],"ans":"C","expl":"Gordon may conduct his investigation as he wishes and use any information that is legally available to him, including information and systems belonging to his employer. There is no obligation to contact law enforcement. However, Gordon may not perform “hack back” activities because those may constitute violations of the law and/or (ISC)2 Code of Ethics."},{"ch":"D7","ch_name":"域7 安全运营","no":69,"type":"single","q":"Which one of the following tools provides an organization with the greatest level of protec-tion against a software vendor going out of business?","opts":["Service-level agreement","Escrow agreement","Mutual assistance agreement","PCI DSS compliance agreement"],"ans":"B","expl":"Software escrow agreements place a copy of the source code for a software package in the hands of an independent third party who will turn the code over to the customer if the vendor ceases business operations. Service-level agreements, mutual assistance agreements, and compliance agreements all lose some or all of their effectiveness if the vendor goes out of business."},{"ch":"D7","ch_name":"域7 安全运营","no":70,"type":"single","q":"Fran is considering new human resources policies for her bank that will deter fraud. She plans to implement a mandatory vacation policy. What is typically considered the shortest effective length of a mandatory vacation?","opts":["Two days","Four days","One week","One month"],"ans":"C","expl":"Most security professionals recommend at least one, and preferably two, weeks of vaca-tion to deter fraud. The idea is that fraudulent schemes will be uncovered during the time that the employee is away and does not have the access required to perpetuate a cover-up."},{"ch":"D7","ch_name":"域7 安全运营","no":71,"type":"multi","q":"Which of the following events would constitute a security incident? (Select all that apply.)","opts":["An attempted network intrusion","A successful database intrusion","A malware infection","A successful attempt to access a file","A violation of a confidentiality policy","An unsuccessful attempt to remove information from a secured area"],"ans":"ABCEF","expl":"Any attempt to undermine the security of an organization or violation of a security policy is a security incident. All of the events described meet this definition and should be treated as an incident, with one exception. A successful attempt to access a file is certainly a security event, but it is not a security incident unless it is established that the individual accessing the file was not authorized to do so."},{"ch":"D7","ch_name":"域7 安全运营","no":72,"type":"multi","q":"Amanda is configuring her organization’s firewall to implement egress filtering. Which one of the following traffic types should not be blocked by her organization’s egress filtering policy? (Select all that apply.)","opts":["Traffic rapidly scanning many IP addresses on port 22","Traffic with a broadcast destination","Traffic with a source address from an external network","Traffic with a destination address on an external network"],"ans":"ABC","expl":"Egress filtering scans outbound traffic for potential security policy violations. This includes traffic that is likely malicious, such as an outbound SSH scan on port 22. It also includes traffic that appears to be part of an attack or misconfiguration, such as sending traffic to a broadcast destination address. Finally, it includes spoofed traffic generated by internal systems, which may bear a source address from an external network. The normal traffic that the firewall should expect to see is that bearing a destination address on an external network."},{"ch":"D7","ch_name":"域7 安全运营","no":73,"type":"single","q":"Allie is responsible for reviewing authentication logs on her organization’s network. She does not have the time to review all logs, so she decides to choose only records where there have been four or more invalid authentication attempts. What technique is Allie using to reduce the size of the pool?","opts":["Sampling","Random selection","Clipping","Statistical analysis"],"ans":"C","expl":"The two main methods of choosing records from a large pool for further analysis are sampling and clipping. Sampling uses statistical techniques to choose a sample that is repre-sentative of the entire pool, while clipping uses threshold values to select those records that exceed a predefined threshold because they may be of most interest to analysts."},{"ch":"D7","ch_name":"域7 安全运营","no":74,"type":"single","q":"You are performing an investigation into a potential bot infection on your network and want to perform a forensic analysis of the information that passed between different sys-tems on your network and those on the internet. You believe that the information was likely encrypted. You are beginning your investigation after the activity concluded. What would be the best and easiest way to obtain the source of this information?","opts":["Packet captures","NetFlow data","Intrusion detection system logs","Centralized authentication records"],"ans":"B","expl":"NetFlow data contains information on the source, destination, and size of all network communications and is routinely saved as a matter of normal activity. Packet capture data would provide relevant information, but it must be captured during the suspicious activity and cannot be re-created after the fact unless the organization is already conducting 100 percent packet capture, which is rare. Additionally, the use of encryption limits the effec-tiveness of packet capture. Intrusion detection system logs would not likely contain relevant information because the encrypted traffic would probably not match intrusion signatures. Centralized authentication records would not contain information about network traffic."},{"ch":"D7","ch_name":"域7 安全运营","no":75,"type":"single","q":"Which one of the following tools helps system administrators by providing a standard, secure template of configuration settings for operating systems and applications?","opts":["Security guidelines","Security policy","Baseline configuration","Running configuration"],"ans":"C","expl":"Baseline configurations serve as the starting point for configuring secure systems and applications. They contain the security settings necessary to comply with an organization’s security policy and may then be customized to meet the specific needs of an implementa-tion. While security policies and guidelines may contain information needed to secure a\nsystem, they do not contain a set of configuration settings that may be applied to a system. The running configuration of a system is the set of currently applied settings, which may or may not be secure. In this case, Allie is only selecting records that exceed an invalid login threshold, making this an example of clipping. She is not using statistical techniques to select a subset of records, so this is not an example of sampling."},{"ch":"D7","ch_name":"域7 安全运营","no":76,"type":"single","q":"What type of disaster recovery test activates the alternate processing facility and uses it to conduct transactions but leaves the primary site up and running?","opts":["Full interruption test","Parallel test","Checklist review","Tabletop exercise"],"ans":"B","expl":"During a parallel test, the team actually activates the disaster recovery site for testing, but the primary site remains operational. During a full interruption test, the team takes down the primary site and confirms that the disaster recovery site is capable of handling regular oper-ations. The full interruption test is the most thorough test but also the most disruptive. The checklist review is the least disruptive type of disaster recovery test. During a checklist review, team members each review the contents of their disaster recovery checklists on their own and suggest any necessary changes. During a tabletop exercise, team members come together and walk through a scenario without making any changes to information systems."},{"ch":"D7","ch_name":"域7 安全运营","no":77,"type":"single","q":"During which phase of the incident response process would an analyst receive an intrusion detection system alert and verify its accuracy?","opts":["Response","Mitigation","Detection","Reporting"],"ans":"C","expl":"Both the receipt of alerts and the verification of their accuracy occur during the Detection phase of the incident response process."},{"ch":"D7","ch_name":"域7 安全运营","no":78,"type":"single","q":"Kevin is developing a continuous security monitoring strategy for his organization. Which one of the following is not normally used when determining assessment and monitoring frequency?","opts":["Threat intelligence","System categorization/impact level","Security control operational burden","Organizational risk tolerance"],"ans":"C","expl":"According to NIST SP 800-137, organizations should use the following factors to determine assessment and monitoring frequency: security control volatility, system categorizations/impact levels, security controls or specific assessment objects providing critical functions, security controls with identified weaknesses, organizational risk toler-ance, threat information, vulnerability information, risk assessment results, the output of monitoring strategy reviews, and reporting requirements."},{"ch":"D7","ch_name":"域7 安全运营","no":79,"type":"single","q":"Hunter is reviewing his organization’s monitoring strategy and identifying new technologies that they might deploy. His assessment reveals that the firm is not doing enough to monitor employee activity on endpoint devices. Which one of the following technologies would best meet his needs?","opts":["EDR","IPS","IDS","UEBA"],"ans":"D","expl":"All of these technologies have the potential to monitor user behavior on endpoint devices. The key to answering this question correctly is realizing the emphasis on the user. Intrusion detection and prevention systems (IDSs/IPSs) focus on network and host behavior. Endpoint detection and response (EDR) systems focus on endpoint devices. User and entity behavior analytics (UEBA) solutions focus on the user and, therefore, would be the best way to meet Hunter’s requirement."},{"ch":"D7","ch_name":"域7 安全运营","no":80,"type":"single","q":"Bruce is seeing quite a bit of suspicious activity on his network. After consulting records in his SIEM, it appears that an outside entity is attempting to connect to all of his systems using a TCP connection on port 22. What type of scanning is the outsider likely engaging in?","opts":["FTP scanning","Telnet scanning","SSH scanning","HTTP scanning"],"ans":"C","expl":"SSH uses TCP port 22, so this attack is likely an attempt to scan for open or weakly secured SSH servers. FTP uses ports 20 and 21. Telnet uses port 23, and HTTP uses port 80."},{"ch":"D7","ch_name":"域7 安全运营","no":81,"type":"single","q":"Dylan believes that a database server in his environment was compromised using a SQL injection attack. Which one of the following actions would Dylan most likely take during the remediation phase of the attack?","opts":["Rebuilding the database from backups","Adding input validation to a web application","Reviewing firewall logs","Reviewing database logs"],"ans":"B","expl":"Remediation activities seek to address the issue that caused the incident. In this case, that was a web application that was open to SQL injection attack. Adding input validation seeks to remediate this vulnerability. Rebuilding the database is a recovery action, while reviewing logs is done as part of the detection and response effort."},{"ch":"D7","ch_name":"域7 安全运营","no":82,"type":"single","q":"Roger recently accepted a new position as a security professional at a company that runs its entire IT infrastructure within an IaaS environment. Which one of the following would most likely be the responsibility of Roger’s firm?","opts":["Configuring the network firewall","Applying hypervisor updates","Patching operating systems","Wiping drives prior to disposal"],"ans":"C","expl":"In an infrastructure as a service environment, the vendor is responsible for hardware- and network-related responsibilities. These include configuring network firewalls, maintaining the hypervisor, and managing physical equipment. The customer retains responsibility for patch-ing operating systems on its virtual machine instances."},{"ch":"D7","ch_name":"域7 安全运营","no":83,"type":"single","q":"What technique can application developers use to test applications in an isolated virtualized environment before allowing them on a production network?","opts":["Penetration testing","Sandboxing","White-box testing","Black-box testing"],"ans":"B","expl":"Sandboxing is a technique where application developers (or the recipients of an untrusted application) may test the code in a virtualized environment that is isolated from production systems. White-box testing, black-box testing, and penetration testing are all common soft-ware testing techniques but do not require the use of an isolated system."},{"ch":"D7","ch_name":"域7 安全运营","no":84,"type":"single","q":"Gina is the firewall administrator for a small business and recently installed a new firewall. After seeing signs of unusually heavy network traffic, she checked the intrusion detection system, which reported that a SYN flood attack was underway. What firewall configuration change can Gina make to most effectively prevent this attack?","opts":["Block SYN from known IPs.","Block SYN from unknown IPs.","Enable SYN-ACK spoofing at the firewall.","Disable TCP."],"ans":"C","expl":"While it may not immediately seem like the obvious answer, many firewalls have a built-in anti–SYN flood defense that responds to SYNs on behalf of protected systems.\nOnce the remote system proves to be a legitimate connection by continuing the three-way handshake, the rest of the TCP session is passed through. If the connection proves to be an attack, the firewall handles the additional load using appropriate mitigation tech-niques. Blocking SYNs from known or unknown IP addresses is likely to cause issues with systems that should be able to connect, and turning off TCP will break most modern network services!"},{"ch":"D7","ch_name":"域7 安全运营","no":85,"type":"multi","q":"Nancy is leading an effort to modernize her organization’s antimalware protection and would like to add endpoint detection and response (EDR) capabilities. Which of the follow-ing actions are normally supported by EDR systems? (Select all that apply.)","opts":["Analyzing endpoint memory, filesystem, and network activity for signs of malicious activity","Automatically isolating possible malicious activity to contain the potential damage","Conducting simulated phishing campaigns","Integration with threat intelligence sources"],"ans":"ABD","expl":"EDR platforms do not conduct simulated phishing campaigns. The most common features of EDR systems are analyzing endpoint memory, filesystem, and network activity for signs of malicious activity; isolating possible malicious activity to contain the potential damage; integrating with threat intelligence sources; and integrating with other incident response mechanisms."},{"ch":"D7","ch_name":"域7 安全运营","no":86,"type":"single","q":"Alan is assessing the potential for using machine learning and artificial intelligence in his cybersecurity program. Which of the following activities is most likely to benefit from this technology?","opts":["Intrusion detection","Account provisioning","Firewall rule modification","Media sanitization"],"ans":"A","expl":"While any cybersecurity activity has the potential to benefit from machine learning and artificial intelligence capabilities, this technology really shines when used for pattern detec-tion and anomaly detection problems. This is the type of activity performed by an intrusion detection system, and, therefore, this system would benefit the most from the use of ML/AI technology."},{"ch":"D7","ch_name":"域7 安全运营","no":87,"type":"single","q":"Timber Industries recently got into a dispute with a customer. During a meeting with his account representative, the customer stood up and declared, “There is no other solution. We will have to take this matter to court.” He then left the room. When does Timber Industries have an obligation to begin preserving evidence?","opts":["Immediately","Upon receipt of a notice of litigation from opposing attorneys","Upon receipt of a subpoena","Upon receipt of a court order"],"ans":"A","expl":"Companies have an obligation to preserve evidence whenever they believe that the threat of litigation is imminent. The statement made by this customer that “we will have to take this matter to court” is a clear threat of litigation and should trigger the preservation of any related documents and records."},{"ch":"D7","ch_name":"域7 安全运营","no":88,"type":"single","q":"Candace is designing a backup strategy for her organization’s file server. She would like to perform a backup every weekday that has the smallest possible storage footprint. What type of backup should she perform?","opts":["Incremental backup","Full backup","Differential backup","Transaction log backup"],"ans":"A","expl":"Incremental backups provide the option that includes the smallest amount of data. In this case, that would be only the data modified since the most recent incremental backup. A differential backup would back up all data modified since the last full backup, which would be a substantial amount. The full backup would include all information on the server. Trans-action log backups are specifically designed to support database servers and would not be effective on a file server."},{"ch":"D7","ch_name":"域7 安全运营","no":89,"type":"single","q":"Darcy is a computer security specialist who is assisting with the prosecution of a hacker. The prosecutor requests that Darcy give testimony in court about whether, in her opinion, the logs and other records in a case are indicative of a hacking attempt. What type of evidence is Darcy being asked to provide?","opts":["Expert opinion","Direct evidence","Real evidence","Documentary evidence"],"ans":"A","expl":"Expert opinion evidence allows individuals to offer their opinion based upon the facts in evidence and their personal knowledge. Expert opinion evidence may be offered only if the court accepts the witness as an expert in a particular field. Direct evidence is when witnesses testify about their direct observations. Real evidence consists of tangible items brought into court as evidence. Documentary evidence consists of written records used as evidence in court."},{"ch":"D7","ch_name":"域7 安全运营","no":90,"type":"single","q":"Which one of the following techniques is not commonly used to remove unwanted remnant data from magnetic tapes?","opts":["Physical destruction","Degaussing","Overwriting","Reformatting"],"ans":"D","expl":"The standard methods for clearing magnetic tapes, according to the NIST Guidelines for Media Sanitization, are overwriting the tape with nonsensitive data, degaussing, and physical destruction via shredding or incineration. Reformatting a tape does not remove remnant data."},{"ch":"D7","ch_name":"域7 安全运营","no":91,"type":"single","q":"Sally is building a new server for use in her environment and plans to implement RAID level 1 as a storage availability control. What is the minimum number of physical hard disks that she needs to implement this approach?","opts":["One","Two","Three","Five"],"ans":"B","expl":"RAID level 1, also known as disk mirroring, uses two disks that contain identical information. If one disk fails, the other contains the data needed for the system to continue operation."},{"ch":"D7","ch_name":"域7 安全运营","no":92,"type":"single","q":"Jerome is conducting a forensic investigation and is reviewing database server logs to inves-tigate query contents for evidence of SQL injection attacks. What type of analysis is he performing?","opts":["Hardware analysis","Software analysis","Network analysis","Media analysis"],"ans":"B","expl":"The analysis of application logs is one of the core tasks of software analysis. This is the correct answer because SQL injection attacks are application attacks."},{"ch":"D7","ch_name":"域7 安全运营","no":93,"type":"single","q":"Quigley Computing regularly ships tapes of backup data across the country to a secondary facility. These tapes contain confidential information. What is the most important security control that Quigley can use to protect these tapes?","opts":["Locked shipping containers","Private couriers","Data encryption","Media rotation"],"ans":"C","expl":"Quigley may choose to use any or all of these security controls, but data encryption is, by far, the most important control. It protects the confidentiality of data stored on the tapes, which are most vulnerable to theft while in transit between two secure locations."},{"ch":"D7","ch_name":"域7 安全运营","no":94,"type":"single","q":"Carolyn is concerned that users on her network may be storing sensitive information, such as Social Security numbers, on their hard drives without proper authorization or security con-trols. What third-party security service can she implement to best detect this activity?","opts":["IDS","IPS","DLP","TLS"],"ans":"C","expl":"Data loss prevention (DLP) systems may identify sensitive information stored on endpoint systems or in transit over a network. This is their primary purpose. DLP systems are com-monly available as a third party managed service offering. Intrusion detection and preven-tion systems (IDSs/IPSs) may be used to identify some sensitive information using signatures built for that purpose, but this is not the primary role of those tools and they would not be as effective as DLP systems at this task. TLS is a network encryption protocol that may be used to protect sensitive information, but it does not have any ability to identify sensitive information."},{"ch":"D7","ch_name":"域7 安全运营","no":95,"type":"single","q":"Gavin is the disaster recovery team leader for his organization, which is currently in the response phase of an incident that has severe customer impact. Gavin just received a phone call from a reporter asking for details on the root cause and an estimated recovery time. Gavin has this information at his fingertips. What should he do?","opts":["Provide the information to the reporter.","Request a few minutes to gather the information and return the call.","Refer the matter to the public relations department.","Refuse to provide any information."],"ans":"C","expl":"Disaster recovery teams should always refer media inquiries to the public relations team to ensure a coordinated, consistent response. They should not attempt to answer questions themselves."},{"ch":"D7","ch_name":"域7 安全运营","no":96,"type":"single","q":"Pauline is reviewing her organization’s emergency management plans. What should be the highest priority when creating these plans?","opts":["Protection of mission-critical data","Preservation of operational systems","Collection of evidence","Preservation of safety"],"ans":"D","expl":"All of these considerations are important when developing an emergency management plan. However, the safety of human life should always be the overwhelming priority, above all other considerations."},{"ch":"D7","ch_name":"域7 安全运营","no":97,"type":"single","q":"Barry is the CIO of an organization that recently suffered a serious operational issue that required activation of the disaster recovery plan. He would like to conduct a lessons learned session to review the incident. Who would be the best facilitator for this session?","opts":["Barry, as chief information officer","Chief information security officer","Disaster recovery team leader","External consultant"],"ans":"D","expl":"Barry should recruit an independent moderator to facilitate the session. Having a moder-ator who was not directly involved in the effort encourages honest and open feedback. While it is not necessary to use an external consultant, they may easily fill this role. While it is also possible to find a qualified internal employee to fill this position, it should not be someone who was involved in the incident response effort or has a major stake in the plan, such as Barry, the CISO, or the DR team leader."},{"ch":"D7","ch_name":"域7 安全运营","no":98,"type":"single","q":"Brent is reviewing the controls that will protect his organization in the event of a sustained period of power loss. Which one of the following solutions would best meet his needs?","opts":["Redundant servers","Uninterruptible power supply (UPS)","Generator","RAID"],"ans":"C","expl":"Generators are capable of providing backup power for a sustained period of time in the event of a power loss, but they take time to activate. Uninterruptible power supplies (UPS) provide immediate, battery-driven power for a short period of time to cover momentary losses of power, which would not cover a sustained period of power loss. RAID and redun-dant servers are high-availability controls but do not cover power loss scenarios."},{"ch":"D8","ch_name":"域8 软件开发安全","no":1,"type":"single","q":"Susan provides a public RESTful API for her organization’s data but wants to limit its use to trusted partners. She intends to use API keys. What other recommendation would you give Susan to limit the potential abuse of the service?","opts":["Limit request rates","Force HTTP-only requests","Avoid tokens due to bandwidth constraints","Blacklist HTTP methods such as GET, POST, and PUT"],"ans":"A","expl":"Limiting request rates can prevent abuse of APIs like this one. The other suggestions are all poor recommendations. In general, requests should require HTTPS, tokens are used for security using tools like JSON web tokens (JWT), and HTTP methods may be restricted, but GET, POST, and PUT are some of the most common methods used for API access and are far more typically whitelisted."},{"ch":"D8","ch_name":"域8 软件开发安全","no":2,"type":"multi","q":"Darren is conducting a threat hunting exercise and would like to look for botnet indicators of compromise. Which of the following are common ways that attackers leverage botnets? (Select all that apply.)","opts":["Mining cryptocurrency","Conducting brute-force attacks","Scanning for vulnerable systems","Conducting man-in-the-middle attacks"],"ans":"ABC","expl":"Botnets are used for a wide variety of malicious purposes, including scanning the network for vulnerable systems, conducting brute-force attacks against other systems, min-ing cryptocurrency, and sending out spam messages. They are not commonly used to conduct man-in-the-middle attacks, which are normally waged through DNS poisoning or similar mechanisms."},{"ch":"D8","ch_name":"域8 软件开发安全","no":3,"type":"single","q":"Which one of the following statements is not true about code review?","opts":["Code review should be a peer-driven process that includes multiple developers.","Code review may be automated.","Code review occurs during the design phase.","Code reviewers may expect to review several hundred lines of code per hour."],"ans":"C","expl":"Code review takes place after code has been developed, which occurs after the design phase of the system’s development lifecycle (SDLC). Code review may use a combination of manual and automated techniques or rely solely on one or the other. It should be a peer-\ndriven process that includes developers who did not write the code. Developers should expect to complete the review of around 300lines per hour, on average."},{"ch":"D8","ch_name":"域8 软件开发安全","no":6,"type":"single","q":"Ashley is investigating an attack that compromised an account of one of her users. In the attack, the attacker forced the submission of an authenticated request to a third-party site by exploiting trust relationships in the user’s browser. What type of attack most likely took place?","opts":["XSS","CSRF","SQL injection","Session hijacking"],"ans":"B","expl":"Cross-site request forgery (XSRF or CSRF) attacks exploit the trust that sites have in a user’s browser by attempting to force the submission of authenticated requests to third-party sites. Session hijacking attacks attempt to steal previously authenticated sessions but do not force the browser to submit requests. SQL injection directly attacks a database through a web application. Cross-site scripting uses reflected input to trick a user’s browser into exe-cuting untrusted code from a trusted site."},{"ch":"D8","ch_name":"域8 软件开发安全","no":7,"type":"single","q":"Arnold is creating a new software package and is making use of the OpenSSL library. What term best describes the library he is using?","opts":["Open source","COTS","Third-party","Managed"],"ans":"A","expl":"The OpenSSL package is a widely used implementation of TLS encryption that is avail-able as an open source package. It is not commercial off-the-shelf software (COTS). While it might be developed by third parties, it is more accurate to describe it as open source. The library is available as code for free use, but not as a managed service."},{"ch":"D8","ch_name":"域8 软件开发安全","no":9,"type":"multi","q":"Joshua is developing a software threat modeling program for his organization. Which of the following are appropriate goals for the program? (Select all that apply.)","opts":["To reduce the number of security-related design flaws","To reduce the number of security-related coding flaws","To reduce the severity of non-security-related flaws","To reduce the number of threat vectors"],"ans":"ABC","expl":"Software threat modeling is designed to reduce the number of security-related design and coding flaws as well as the severity of other flaws. The developer or evaluator of soft-ware has no control over the threat environment, because it is external to the organization."},{"ch":"D8","ch_name":"域8 软件开发安全","no":10,"type":"single","q":"In the diagram shown here, which is an example of a method?","opts":["Account","Owner","AddFunds","Balance"],"ans":"C","expl":"In the diagram, Account is the name of the class. Owner and Balance are attributes of that class. AddFunds and RemoveFunds are methods of the class."},{"ch":"D8","ch_name":"域8 软件开发安全","no":11,"type":"single","q":"Wanda is reviewing the application development documentation used by her organization and finds the lifecycle illustration shown here. What application development method is her organization using?","opts":["Waterfall","Spiral","Agile","RAD"],"ans":"D","expl":"Rapid Application Development, or RAD, focuses on fast development and the ability to quickly adjust to changing requirements. RAD uses four phases: requirements planning, user design, construction, and cutover."},{"ch":"D8","ch_name":"域8 软件开发安全","no":12,"type":"single","q":"Which one of the following testing methodologies typically works without access to source code?","opts":["Dynamic testing","Static testing","White-box testing","Code review"],"ans":"A","expl":"Dynamic testing of software typically occurs in a black-box environment where the tester does not have access to the source code. Static testing, white-box testing, and code review approaches all require access to the source code of the application."},{"ch":"D8","ch_name":"域8 软件开发安全","no":13,"type":"single","q":"Lucca is analyzing a web application that his organization acquired from a third-party vendor. Lucca determined that the application contains a flaw that causes users who are logged in to be able to take actions they should not be able to in their role. What type of security vulnerability should this be classified as?","opts":["Data validation","Session management","Authorization","Error handling"],"ans":"C","expl":"Given the list of options here, the root cause is most likely an issue with an authorization check that does not properly limit users to the authorization that they should have. Data validation issues are more likely to allow injection attacks or to allow bad data to be input, while session management issues would allow session hijacking or might actually cause them to be logged in as another user. Finally, error handling would show up as a problem when errors occurred, which this problem does not indicate."},{"ch":"D8","ch_name":"域8 软件开发安全","no":14,"type":"single","q":"Bobby is investigating how an authorized database user is gaining access to information outside his normal clearance level. Bobby believes that the user is making use of a type of function that summarizes data. What term describes this type of function?","opts":["Inference","Polymorphic","Aggregate","Modular"],"ans":"C","expl":"Aggregate functions summarize large amounts of data and provide only summary information as a result. When carefully crafted, aggregate functions may unintentionally reveal sensitive information."},{"ch":"D8","ch_name":"域8 软件开发安全","no":15,"type":"single","q":"Taylor would like to better protect the applications developed by her organization against buffer overflow attacks. Which of the following controls would best provide this protection?","opts":["Encryption","Input validation","Firewall","Intrusion prevention system"],"ans":"B","expl":"The best protection against buffer overflow attacks is server-side input validation. This technique limits user input to approved ranges of values that fit within allocated buffers. While firewalls and intrusion prevention systems may contain controls that limit buffer over-flows, it would be more effective to perform filtering on the application server. Encryption cannot protect against buffer overflow attacks."},{"ch":"D8","ch_name":"域8 软件开发安全","no":17,"type":"single","q":"What phase of the SW-CMM should Robert report as the current status of Acme Widgets?","opts":["Defined","Repeatable","Initial","Managed"],"ans":"C","expl":"Acme Widgets is clearly in the initial stage of the SW-CMM. This stage is characterized by the absence of formal process. The company may still produce working code, but it does so in a disorganized fashion.","scene":"Robert is a consultant who helps organizations create and develop mature software development practices. He prefers to use the Software Capability Maturity Model (SW-CMM) to evaluate the current and future status of organizations using both independent review and self-assessments. He is currently working with two different clients. Acme Widgets is not very well organized with its software development practices. It does have a dedicated team of developers who do “whatever it takes” to get software out the door, but it does not have any formal processes. Beta Particles is a company with years of experience developing software using formal, docu-mented software development processes. It uses a standard model for software development but does not have quantitative management of those processes."},{"ch":"D8","ch_name":"域8 软件开发安全","no":18,"type":"single","q":"Robert is working with Acme Widgets on a strategy to advance their software development practices. What SW-CMM stage should be their next target milestone?","opts":["Defined","Repeatable","Initial","Managed"],"ans":"B","expl":"The Repeatable stage is the second stage in the SW-CMM, following the Initial stage. It should be the next milestone goal for Acme Widgets. The Repeatable stage is characterized by basic lifecycle management processes.","scene":"Robert is a consultant who helps organizations create and develop mature software development practices. He prefers to use the Software Capability Maturity Model (SW-CMM) to evaluate the current and future status of organizations using both independent review and self-assessments. He is currently working with two different clients. Acme Widgets is not very well organized with its software development practices. It does have a dedicated team of developers who do “whatever it takes” to get software out the door, but it does not have any formal processes. Beta Particles is a company with years of experience developing software using formal, docu-mented software development processes. It uses a standard model for software development but does not have quantitative management of those processes."},{"ch":"D8","ch_name":"域8 软件开发安全","no":19,"type":"single","q":"What phase of the SW-CMM should Robert report as the current status of Beta Particles?","opts":["Defined","Repeatable","Optimizing","Managed"],"ans":"A","expl":"The Defined stage of the SW-CMM is marked by the presence of basic lifecycle management processes and reuse of code. It includes the use of requirements management, software project planning, quality assurance, and configuration management practices.","scene":"Robert is a consultant who helps organizations create and develop mature software development practices. He prefers to use the Software Capability Maturity Model (SW-CMM) to evaluate the current and future status of organizations using both independent review and self-assessments. He is currently working with two different clients. Acme Widgets is not very well organized with its software development practices. It does have a dedicated team of developers who do “whatever it takes” to get software out the door, but it does not have any formal processes. Beta Particles is a company with years of experience developing software using formal, docu-mented software development processes. It uses a standard model for software development but does not have quantitative management of those processes."},{"ch":"D8","ch_name":"域8 软件开发安全","no":20,"type":"single","q":"Robert is also working with Beta Particles on a strategy to advance their software development practices. What SW-CMM stage should be their next target milestone?","opts":["Defined","Repeatable","Optimizing","Managed"],"ans":"D","expl":"The Managed stage is the fourth stage in the SW-CMM, following the Defined stage.\nIt should be the next milestone goal for Beta Particles. The Managed stage is characterized by the use of quantitative software development measures.","scene":"Robert is a consultant who helps organizations create and develop mature software development practices. He prefers to use the Software Capability Maturity Model (SW-CMM) to evaluate the current and future status of organizations using both independent review and self-assessments. He is currently working with two different clients. Acme Widgets is not very well organized with its software development practices. It does have a dedicated team of developers who do “whatever it takes” to get software out the door, but it does not have any formal processes. Beta Particles is a company with years of experience developing software using formal, docu-mented software development processes. It uses a standard model for software development but does not have quantitative management of those processes."},{"ch":"D8","ch_name":"域8 软件开发安全","no":21,"type":"single","q":"Which one of the following database keys is used to enforce referential integrity relationships between tables?","opts":["Primary key","Candidate key","Foreign key","Master key"],"ans":"C","expl":"Referential integrity ensures that records exist in a secondary table when they are referenced with a foreign key from another table. Foreign keys are the mechanism used to enforce referential integrity."},{"ch":"D8","ch_name":"域8 软件开发安全","no":23,"type":"single","q":"Victor created a database table that contains information on his organization’s employees. The table contains the employee’s user ID, three different telephone number fields (home, work, and mobile), the employee’s office location, and the employee’s job title. There are 16 records in the table. What is the degree of this table?","opts":["3","4","6","16"],"ans":"C","expl":"The degree of a database table is the number of attributes in the table. Victor’s table has six attributes: the employee’s user ID, home telephone, office telephone, mobile telephone, office location, and job title."},{"ch":"D8","ch_name":"域8 软件开发安全","no":24,"type":"single","q":"Carrie is analyzing the application logs for her web-based application and comes across the following string:\n• ../../../../../../../../../etc/passwd\n• What type of attack was likely attempted against Carrie’s application?","opts":["Command injection","Session hijacking","Directory traversal","Brute-force"],"ans":"C","expl":"The string shown in the logs is characteristic of a directory traversal attack where the attacker attempts to force the web application to navigate up the file hierarchy and retrieve a file that should not normally be provided to a web user, such as the password file. The series of “double dots” is indicative of a directory traversal attack because it is the character string used to reference the directory one level up in a hierarchy."},{"ch":"D8","ch_name":"域8 软件开发安全","no":25,"type":"single","q":"When should a design review take place when following an SDLC approach to software development?","opts":["After the code review","After user acceptance testing","After the development of functional requirements","After the completion of unit testing"],"ans":"C","expl":"Design reviews should take place after the development of functional and control specifi-cations but before the creation of code. The code review, unit testing, and functional testing all take place after the creation of code and, therefore, after the design review."},{"ch":"D8","ch_name":"域8 软件开发安全","no":26,"type":"single","q":"Tracy is preparing to apply a patch to her organization’s enterprise resource planning system. She is concerned that the patch may introduce flaws that did not exist in prior versions, so she plans to conduct a test that will compare previous responses to input with those pro-duced by the newly patched application. What type of testing is Tracy planning?","opts":["Unit testing","Acceptance testing","Regression testing","Vulnerability testing"],"ans":"C","expl":"Regression testing is software testing that runs a set of known inputs against an applica-tion and then compares the results to those produced by an earlier version of the software. It is designed to capture unanticipated consequences of deploying new code versions prior to introducing them into a production environment."},{"ch":"D8","ch_name":"域8 软件开发安全","no":27,"type":"single","q":"What term is used to describe the level of confidence that software is free from vulnerabil-ities, either intentionally designed into the software or accidentally inserted at any time dur-ing its lifecycle, and that the software functions in the intended manner?","opts":["Validation","Accreditation","Confidence interval","Assurance"],"ans":"D","expl":"Assurance, when it comes to software, is the level of confidence that software is free from vulnerabilities, either intentionally designed into the software or accidentally inserted at any time during its lifecycle, and that the software functions in the intended manner. It is a term typically used in military and defense environments."},{"ch":"D8","ch_name":"域8 软件开发安全","no":28,"type":"single","q":"Victor recently took a new position at an online dating website and is responsible for leading a team of developers. He realized quickly that the developers are having issues with produc-tion code because they are working on different projects that result in conflicting modifica-tions to the production code. What process should Victor invest in improving?","opts":["Request control","Release control","Change control","Configuration control"],"ans":"C","expl":"The change control process is responsible for providing an organized framework within which multiple developers can create and test a solution prior to rolling it out in a produc-tion environment. Request control provides a framework for user requests. Release con-trol manages the deployment of code into production. Configuration control ensures that changes to software versions are made in accordance with the change and configuration management policies."},{"ch":"D8","ch_name":"域8 软件开发安全","no":29,"type":"single","q":"Tom is assessing security risks related to a database he manages. Examining user access con-trols, he determines that users have access to individual records in a table that match their clearances, but if they pull multiple records, that collection of facts has a higher classification than the classification of any of those facts standing alone and exceeds the permitted access. What type of issue has Tom identified?","opts":["Inference","SQL injection","Multilevel security","Aggregation"],"ans":"D","expl":"Aggregation is a security issue that arises when a collection of facts has a higher classification than the classification of any of those facts standing alone. An inference problem occurs when an attacker can pull together pieces of less sensitive information and use them to derive information of greater sensitivity. SQL injection is a web application exploit. Multilevel security is a system control that allows the simultaneous processing of information at different classification levels."},{"ch":"D8","ch_name":"域8 软件开发安全","no":30,"type":"single","q":"Ron leads a team of software developers who find themselves often re-creating code that per-forms common functions. What software development tool could he use to best address this situation?","opts":["Code repositories","Code libraries","IDEs","DAST"],"ans":"B","expl":"Code libraries are packages of reusable functions that may be incorporated into individual development projects. Ron could use libraries to easily share code among his team. Code repositories may be used to manage the distribution and updating of these libraries, but that is a second-order use case, making code libraries the best answer. Integrated development environments (IDEs) are tools used by developers to create software, while dynamic applica-tion security testing (DAST) is used to verify the correct implementation of code."},{"ch":"D8","ch_name":"域8 软件开发安全","no":31,"type":"single","q":"Vivian would like to hire a software tester to come in and evaluate a new web application from a user’s perspective. Which of the following tests best simulates that perspective?","opts":["Black box","Gray box","Blue box","White box"],"ans":"A","expl":"Black-box testing begins with no prior knowledge of the system implementation, simu-lating a user perspective. White-box and gray-box testing provide full and partial knowledge of the system, respectively, in advance of the test. Blue boxes are a phone hacking tool and are not used in software testing."},{"ch":"D8","ch_name":"域8 软件开发安全","no":33,"type":"single","q":"Brandon is a software developer seeking to integrate his software with a popular social media site. The site provides him with software libraries that he can use to better integrate his code as well as other tools that make his work easier. What term best describes the service he is using?","opts":["SDK","DLP","IDE","API"],"ans":"A","expl":"Software development kits (SDKs) are code libraries and other tools made available to assist developers in creating code. An integrated development environment (IDE) may be a component of an SDK, but it is not necessarily part of every SDK. An application program-ming interface (API) is a set of functions made available to external developers, but the code does not execute on the users’ machine, as would a code library or other SDK tools. Data loss prevention (DLP) capabilities are not a component of software development toolsets."},{"ch":"D8","ch_name":"域8 软件开发安全","no":34,"type":"single","q":"Kim is troubleshooting an application firewall that serves as a supplement to the organiza-tion’s network and host firewalls and intrusion prevention system, providing added protec-tion against web-based attacks. The issue the organization is experiencing is that the firewall technology suffers somewhat frequent restarts that render it unavailable for 10 minutes at a time. What configuration might Kim consider to maintain availability during that period at the lowest cost to the company?","opts":["High availability cluster","Failover device","Fail open","Redundant disks"],"ans":"C","expl":"A fail open configuration may be appropriate in this case. In this configuration, the firewall would continue to pass traffic without inspection while it is restarting. This would minimize downtime, and the traffic would still be protected by the other security con-trols described in the scenario. Failover devices and high availability clusters would indeed\nincrease availability, but at potentially significant expense. Redundant disks would not help in this scenario because no disk failure is described."},{"ch":"D8","ch_name":"域8 软件开发安全","no":35,"type":"single","q":"What type of security issue arises when an attacker can deduce a more sensitive piece of information by analyzing several pieces of information classified at a lower level?","opts":["SQL injection","Multilevel security","Parameterization","Inference"],"ans":"D","expl":"An inference problem occurs when an attacker can pull together pieces of less sensitive information and use them to derive information of greater sensitivity. SQL injection is a web application exploit. Multilevel security is a system control that allows the simultaneous\nprocessing of information at different classification levels. Parameterization is a security con-trol used to reduce the likelihood of attacks that rely upon improper user input."},{"ch":"D8","ch_name":"域8 软件开发安全","no":36,"type":"single","q":"Greg is battling a malware outbreak in his organization. He used specialized malware anal-ysis tools to capture samples of the malware from three different systems and noticed that the code is changing slightly from infection to infection. Greg believes that this is the reason that antivirus software is having a tough time defeating the outbreak. What type of malware should Greg suspect is responsible for this security incident?\nFor questions 37–40, please refer to the following scenario:","opts":["Stealth virus","Polymorphic virus","Multipartite virus","Encrypted virus"],"ans":"B","expl":"Polymorphic viruses mutate each time they infect a system by making adjustments to their code that assists them in evading signature detection mechanisms. Encrypted viruses also mutate from infection to infection but do so by encrypting themselves with different keys on each device."},{"ch":"D8","ch_name":"域8 软件开发安全","no":37,"type":"single","q":"What vulnerability definitely exists on Linda’s message board?","opts":["Cross-site scripting","Cross-site request forgery","SQL injection","Improper authentication"],"ans":"A","expl":"The message forum is clearly susceptible to a cross-site scripting (XSS) attack. The code that Linda discovered in the message is a definitive example of an attempt to conduct cross-site scripting, and the alert box that she received demonstrates that the vulnerability exists. The website may also be vulnerable to cross-site request forgery, SQL injection, improper authentication, and other attacks, but there is no evidence of this provided in the scenario.","scene":"Linda is reviewing posts to a user forum on her company’s website, and when she browses a certain post, a message pops up in a dialog box on her screen reading “Alert.” She reviews the source code for the post and finds the following code snippet: <script>alert('Alert');<\/script>"},{"ch":"D8","ch_name":"域8 软件开发安全","no":38,"type":"single","q":"What was the likely motivation of the user who posted the message on the forum containing this code?","opts":["Reconnaissance","Theft of sensitive information","Credential stealing","Social engineering"],"ans":"A","expl":"The script that Linda discovered merely pops up a message on a user’s screen and does not perform any more malicious action. This type of script, using an alert() call, is commonly used to probe websites for cross-site scripting vulnerabilities.","scene":"Linda is reviewing posts to a user forum on her company’s website, and when she browses a certain post, a message pops up in a dialog box on her screen reading “Alert.” She reviews the source code for the post and finds the following code snippet: <script>alert('Alert');<\/script>"},{"ch":"D8","ch_name":"域8 软件开发安全","no":39,"type":"single","q":"Linda communicates with the vendor and determines that no patch is available to correct this vulnerability. Which one of the following devices would best help her defend the application against further attack?","opts":["VPN","WAF","DLP","IDS"],"ans":"B","expl":"Web application firewalls (WAFs) sit in front of web applications and watch for poten-tially malicious web attacks, including cross-site scripting. They then block that traffic from reaching the web application. An intrusion detection system (IDS) may detect the attack but is unable to take action to prevent it. DLP and VPN solutions are unable to detect web appli-cation attacks.","scene":"Linda is reviewing posts to a user forum on her company’s website, and when she browses a certain post, a message pops up in a dialog box on her screen reading “Alert.” She reviews the source code for the post and finds the following code snippet: <script>alert('Alert');<\/script>"},{"ch":"D8","ch_name":"域8 软件开发安全","no":40,"type":"single","q":"In further discussions with the vendor, Linda finds that they are willing to correct the issue but do not know how to update their software. What technique would be most effective in mitigating the vulnerability of the application to this type of attack?","opts":["Bounds checking","Peer review","Input validation","OS patching"],"ans":"C","expl":"Input validation verifies that user-supplied input does not violate security conditions and is the most effective defense against cross-site scripting attacks. Bounds checking is a form of input validation, but it is typically used to ensure that numeric input falls within an accept-able range and is not applicable against cross-site scripting attacks. Peer review and OS patching are both good security practices but are unlikely to be effective against a cross-site scripting attack.","scene":"Linda is reviewing posts to a user forum on her company’s website, and when she browses a certain post, a message pops up in a dialog box on her screen reading “Alert.” She reviews the source code for the post and finds the following code snippet: <script>alert('Alert');<\/script>"},{"ch":"D8","ch_name":"域8 软件开发安全","no":42,"type":"single","q":"Lauren wants to use a software review process for the application she is working on. Which of the following processes would work best if she is a remote worker who works different hours from the rest of her team?","opts":["Pass around","Pair programming","Team review","Fagan inspection"],"ans":"A","expl":"Pass-around reviews are often done via email or using a central code review system, allowing developers to review code asynchronously. Pair programming requires two pro-grammers to work together, with one writing code and the other reviewing and tracking progress. Team reviews are typically done in a group, and Fagan inspection is a formal review process that would involve both the developer and a team to review the code using a formal process."},{"ch":"D8","ch_name":"域8 软件开发安全","no":43,"type":"single","q":"Alan is deploying Java code to a variety of machines in his environment and must install the JVM on those machines first. What term best describes the JVM in this case?","opts":["Repository","Change manager","Runtime","Sandbox"],"ans":"C","expl":"The JVM is the runtime virtual machine that allows the execution of Java code on a device. The JVM implements the Java sandbox, but that is only one of its many functions. The JVM itself is not a change manager or code repository."},{"ch":"D8","ch_name":"域8 软件开发安全","no":44,"type":"single","q":"Christine is nearing the final stages of testing a new software package. Which one of the fol-lowing types of software testing usually occurs last and is executed against test scenarios?","opts":["Unit testing","Integration testing","User acceptance testing","System testing"],"ans":"C","expl":"User acceptance testing (UAT) is typically the last phase of the testing process. It verifies that the solution developed meets user requirements and validates it against use cases. Unit testing, integration testing, and system testing are all conducted earlier in the process leading up to UAT."},{"ch":"D8","ch_name":"域8 软件开发安全","no":45,"type":"single","q":"Alexis’ organization recently moved to a CI/CD approach for software development where they intend to speed up the deployment of code supporting their website. What is the most reasonable frequency that they can expect to achieve using this type of approach?","opts":["Monthly deployments","Weekly deployments","Daily deployments","Hundreds of daily deployments"],"ans":"D","expl":"When organizations adopt a continuous integration/continuous delivery (CI/CD) approach to software development, they may deploy code extremely rapidly. In fact, some organizations deploy new code to production hundreds or even thousands of times per day using this approach."},{"ch":"D8","ch_name":"域8 软件开发安全","no":46,"type":"single","q":"Amber is conducting a threat intelligence project and would like to find a source of information on threats to her organization’s web applications. Which of the following organizations is widely considered as the definitive source for information on web-based attack vectors?","opts":["(ISC)2","ISACA","OWASP","Mozilla Foundation"],"ans":"C","expl":"The Open Web Application Security Project (OWASP) is widely considered as the most authoritative source on web application security issues. They publish the OWASP Top Ten list that publicizes the most critical web application security issues."},{"ch":"D8","ch_name":"域8 软件开发安全","no":47,"type":"single","q":"Chris is a software developer, and he is actively writing code for an application. What phase of the Agile process is he in?","opts":["Planning","Sprints","Deployment","Development"],"ans":"B","expl":"Chris is in an Agile sprint phase and is likely developing code based on user stories. Planning includes stakeholder stories, as well as design and test case preparation. Deploy-ment includes the actual deployment of the application, as well as additional verification and testing."},{"ch":"D8","ch_name":"域8 软件开发安全","no":48,"type":"single","q":"Alyssa’s team recently implemented a new system that gathers information from a variety of different log sources, analyzes that information, and then triggers automated playbooks in response to security events. What term best describes this technology?","opts":["SIEM","Log repositories","IPS","SOAR"],"ans":"D","expl":"Security information and event management (SIEM) systems do correlate information from multiple sources and perform analysis, but they stop short of providing automated playbook responses. That is the realm of security orchestration, automation, and response (SOAR) platforms. Intrusion prevention platforms have a more limited scope, allowing the blocking of traffic based upon analysis performed by the IPS itself. Log repositories simply collect log information and do not perform analysis."},{"ch":"D8","ch_name":"域8 软件开发安全","no":49,"type":"single","q":"Chris is reviewing the code of an open source application that he is planning to use in his organization. He finds the code excerpt shown here:\n• int myarray[10]; myarray[10] = 8;\n• What type of attack is taking place?","opts":["Mismatched data types","Overflow","SQL injection","Covert channel"],"ans":"B","expl":"This is an example of a specific type of buffer overflow known as an off-by-one error. The first line of the code defines an array of 10 elements, which would be numbered 0 through\nThe second line of code tries to place a value in the 11th element of the array (remember, array counting begins at 0!), which would cause an overflow."},{"ch":"D8","ch_name":"域8 软件开发安全","no":50,"type":"single","q":"Which one of the following database issues occurs when one transaction writes a value to the database that overwrites a value that was needed by transactions with earlier precedence?","opts":["Dirty read","Incorrect summary","Lost update","SQL injection"],"ans":"C","expl":"Lost updates occur when one transaction writes a value to the database that overwrites a value needed by transactions that have earlier precedence, causing those transactions to read an incorrect value. Dirty reads occur when one transaction reads a value from a data-\nbase that was written by another transaction that did not commit. Incorrect summaries occur when one transaction is using an aggregate function to summarize data stored in a database while a second transaction is making modifications to the database, causing the summary to include incorrect information. SQL injection is a web application security flaw, not a data-base concurrency problem."},{"ch":"D8","ch_name":"域8 软件开发安全","no":51,"type":"single","q":"Belinda would like to better protect users of her organization’s web application from cookie stealing attacks. Which one of the following is the most effective control against this type of session hijacking attack?","opts":["TLS","Complex session cookies","SSL","Expiring cookies frequently"],"ans":"A","expl":"Transport Layer Security (TLS) provides the most effective defense against session hijack-ing because it encrypts all traffic between the client and server, preventing the attacker from stealing session credentials. Secure Sockets Layer (SSL) also encrypts traffic, but it is vulner-able to attacks against its encryption technology. Complex and expiring cookies are a good idea, but they are not sufficient protection against session hijacking."},{"ch":"D8","ch_name":"域8 软件开发安全","no":52,"type":"single","q":"In a software configuration management program, what is the primary role of the CAB?","opts":[
