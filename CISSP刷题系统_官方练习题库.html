":"The attack described in the scenario is a classic example of TCP scanning, a network reconnaissance technique that may precede other attacks. There is no evidence that the attack disrupted system availability, which would characterize a denial-of-service attack; that it was waged by a malicious insider; or that the attack resulted in the compromise of a system."},{"ch":"PT4","ch_name":"模拟卷 4","no":39,"type":"single","q":"What type of Windows audit record describes events like an OS shutdown or a service being stopped?","opts":["An application log","A security log","A system log","A setup log"],"ans":"C","expl":"Windows system logs include reboots, shutdowns, and service state changes. Application logs record events generated by programs, security logs track events like logins and uses of rights, and setup logs track application setup."},{"ch":"PT4","ch_name":"模拟卷 4","no":40,"type":"single","q":"Melissa is in charge of her organization’s security compliance efforts and has been told that the organization does not install Windows patches until a month has passed since the patch has been released unless there is a zero-day exploit that is being actively exploited. Why would the company delay patching like this?","opts":["To minimize business impact of the installation","To allow any flaws with the patch to be identified","To prevent malware in the patches from being installed before it is identified","To allow the patch to be distributed to all systems"],"ans":"B","expl":"Many organizations delay patches for a period of time to ensure that any previously unidentified flaws are found before the patches are installed throughout their organization. Melissa needs to balance business impact against security in her role and may choose to support this or to push for more aggressive installation practices depending on the organiza-tion’s risk tolerance and security needs."},{"ch":"PT4","ch_name":"模拟卷 4","no":41,"type":"single","q":"What level of RAID is also known as disk striping?","opts":["RAID 0","RAID 1","RAID 5","RAID 10"],"ans":"A","expl":"RAID level 0 is also known as disk striping. RAID 1 is called disk mirroring. RAID 5 is called disk striping with parity. RAID 10 is known as a stripe of mirrors."},{"ch":"PT4","ch_name":"模拟卷 4","no":42,"type":"single","q":"Jacob executes an attack against a system using a valid but low-privilege user account by accessing a file pointer that the account has access to. After the access check, but before the file is opened, he quickly switches the file pointer to point to a file that the user account does not have access to. What type of attack is this?","opts":["TOCTOU","Permissions creep","Impersonation","Link swap"],"ans":"A","expl":"This is an example of a time of check/time of use, or TOC/TOU, attack. It exploits the difference between the times when a system checks for permission to perform an action and when the action is actually performed. Permissions creep would occur if the account had gained additional rights over time as the other’s role or job changed. Imper-sonation occurs when an attacker pretends to be a valid user, and link swap is not a type of attack."},{"ch":"PT4","ch_name":"模拟卷 4","no":44,"type":"single","q":"Fred’s company wants to ensure the integrity of email messages sent via its central email servers. If the confidentiality of the messages is not critical, what solution should Fred suggest?","opts":["Digitally sign and encrypt all messages to ensure integrity.","Digitally sign but don’t encrypt all messages.","Use TLS to protect messages, ensuring their integrity.","Use a hashing algorithm to provide a hash in each message to prove that it hasn’t changed."],"ans":"B","expl":"Fred’s company needs to protect integrity, which can be accomplished by digitally sign-ing messages. Any change will cause the signature to be invalid. Encrypting isn’t necessary because the company does not want to protect confidentiality. TLS can provide in-transit protection but won’t protect integrity of the messages, and of course a hash used without a way to verify that the hash wasn’t changed won’t ensure integrity either."},{"ch":"PT4","ch_name":"模拟卷 4","no":45,"type":"single","q":"The leadership at Susan’s company has asked her to implement an access control system that can support rule declarations like “Only allow access to salespeople from managed devices on the wireless network between 8 a.m. and 6 p.m.” What type of access control system would be Susan’s best choice?","opts":["ABAC","RBAC","DAC","MAC"],"ans":"A","expl":"An attribute-based access control (ABAC) system will allow Susan to specify details about subjects, objects, and access, allowing granular control. Although a rule-based access con-trol system (RBAC) might allow this, the attribute-based access control system can be more specific and thus is more flexible. Discretionary access control (DAC) would allow object owners to make decisions, and mandatory access controls (MACs) would use classifications; neither of these capabilities was described in the requirements."},{"ch":"PT4","ch_name":"模拟卷 4","no":46,"type":"single","q":"Nora’s company operates servers on a five-year lifecycle. When they reach their end of life according to that process, the servers are sent to an e-waste recycler. Which of the following is the most effective control that Nora could implement to ensure that a data breach does not occur due to remanent data?","opts":["Zero wipe the drives before the servers leave the organization.","Remove the drives and shred them.","Reformat the drives before the servers are sent to the e-waste company.","Require certificates of disposal from the e-waste company."],"ans":"B","expl":"The most effective control is to remove the drives and shred them, removing any chance for the servers to leave with data remaining on them. A trustworthy company that can pro-vide a certificate of disposal with appropriate contractual controls may be a reasonable and cost-efficient alternative, but the company may also then want to zero wipe drives before the systems leave to reduce the risk if a system makes it out of the recycler’s control. The worst answer here is reformatting, which will not remove data."},{"ch":"PT4","ch_name":"模拟卷 4","no":47,"type":"single","q":"Chris is deploying a gigabit Ethernet network using Category 6 cable between two buildings. What is the maximum distance he can run the cable according to the Category 6 standard?","opts":["50 meters","100 meters","200 meters","300 meters"],"ans":"B","expl":"The maximum allowed length of a Cat 6 cable is 100 meters, or 328 feet. Long distances are typically handled by a fiber run or by using network devices like switches or repeaters—not only because of the distance, but also because outdoor runs can experience lightning strikes, which won’t affect fiber. Knowing that copper twisted pair has distance limitations can be important in many network designs and influences where switches and other devices are placed."},{"ch":"PT4","ch_name":"模拟卷 4","no":48,"type":"single","q":"Howard is a security analyst working with an experienced computer forensics investigator. The investigator asks him to retrieve a forensic drive controller, but Howard cannot locate a device in the storage room with this name. What is another name for a forensic drive controller?","opts":["RAID controller","Write blocker","SCSI terminator","Forensic device analyzer"],"ans":"B","expl":"One of the main functions of a forensic drive controller is preventing any command sent to a device from modifying data stored on the device. For this reason, forensic drive control-lers are also often referred to as write blockers."},{"ch":"PT4","ch_name":"模拟卷 4","no":50,"type":"single","q":"Ben’s company has recently retired its fleet of multifunction printers. The information secu-rity team has expressed concerns that the printers contain hard drives and that they may still have data from scans and print jobs. What is the technical term for this issue?","opts":["Data pooling","Failed clearing","Data permanence","Data remanence"],"ans":"D","expl":"Data remanence describes data that is still on media after an attempt has been made to remove it. Failed clearing and data pooling are not technical terms, and data permanence describes how long data lasts."},{"ch":"PT4","ch_name":"模拟卷 4","no":51,"type":"single","q":"What access control scheme labels subjects and objects and allows subjects to access objects when the labels match?","opts":["DAC","MAC","Rule-based access control (RBAC)","Role-based access control (RBAC)"],"ans":"B","expl":"Mandatory access control (MAC) applies labels to subjects and objects and allows subjects to access objects when their labels match. Discretionary access control (DAC) is controlled by the owner of objects, rule-based access control applies rules throughout a system, and role-based access control bases rights on roles, which are often handled as groups of users."},{"ch":"PT4","ch_name":"模拟卷 4","no":52,"type":"single","q":"A cloud-based service that provides account provisioning, management, authentication, authorization, reporting, and monitoring capabilities is known as what type of service?","opts":["PaaS","IDaaS","IaaS","SaaS"],"ans":"B","expl":"Identity as a service (IDaaS) provides capabilities such as account provisioning, management, authentication, authorization, reporting, and monitoring. Platform as a service (PaaS), infrastructure as a service (IaaS), and software as a service (SaaS)."},{"ch":"PT4","ch_name":"模拟卷 4","no":53,"type":"single","q":"Sally wants to secure her organization’s VoIP systems. Which of the following attacks is one that she shouldn’t have to worry about?","opts":["Eavesdropping","Denial-of-service","Blackboxing","Caller ID spoofing"],"ans":"C","expl":"Eavesdropping, denial-of-service attacks, and caller ID spoofing are all common VoIP attacks. Blackboxing is a made-up answer, although various types of colored boxes were associated with phone phreaking."},{"ch":"PT4","ch_name":"模拟卷 4","no":54,"type":"single","q":"Marty discovers that the access restrictions in his organization allow any user to log into the workstation assigned to any other user, even if they are from completely different depart-ments. This type of access most directly violates which information security principle?","opts":["Separation of duties","Two-person control","Need to know","Least privilege"],"ans":"D","expl":"This broad access may indirectly violate all of the listed security principles, but it is most directly a violation of least privilege because it grants users privileges that they do not need for their job functions."},{"ch":"PT4","ch_name":"模拟卷 4","no":55,"type":"single","q":"Fred needs to transfer files between two servers on an untrusted network. Since he knows the network isn’t trusted, he needs to select an encrypted protocol that can ensure that his data remains secure. What protocol should he choose?","opts":["SSH","TCP","SFTP","IPsec"],"ans":"C","expl":"The Secure File Transfer Protocol (SFTP) is specifically designed for encrypted file transfer. SSH is used for secure command-line access, whereas TCP is one of the bundles of internet protocols commonly used to transmit data across a network. IPsec could be used to create a tunnel to transfer the data but is not specifically designed for file transfer."},{"ch":"PT4","ch_name":"模拟卷 4","no":56,"type":"single","q":"Chris uses a packet sniffer to capture traffic from a TACACS+ server. What protocol should he monitor, and what data should he expect to be readable?\nUse your knowledge of Kerberos authentication and authorization as well as the following diagram to answer questions 57–59.","opts":["UDP; none—TACACS+ encrypts the full session.","TCP; none—TACACS+ encrypts the full session.","UDP; all but the username and password, which are encrypted.","TCP; all but the username and password, which are encrypted."],"ans":"B","expl":"TACACS+ uses TCP and encrypts the entire session, unlike RADIUS, which only encrypts the password and operates via UDP."},{"ch":"PT4","ch_name":"模拟卷 4","no":60,"type":"single","q":"What does a service ticket (ST) provide in Kerberos authentication?","opts":["It serves as the authentication host.","It provides proof that the subject is authorized to access an object.","It provides proof that a subject has authenticated through a KDC and can request tickets to access other objects.","It provides ticket granting services."],"ans":"B","expl":"The service ticket in Kerberos authentication provides proof that a subject is authorized to access an object. Ticket granting services are provided by the TGS. Proof that a subject has\nauthenticated and can request tickets to other objects uses ticket-granting tickets, and authen-tication host is a made-up term."},{"ch":"PT4","ch_name":"模拟卷 4","no":61,"type":"single","q":"Judy is preparing to conduct a business impact analysis. What should her first step be in the process?","opts":["Identify threats to the business.","Identify risks to the organization.","Identify business priorities.","Conduct likelihood analysis."],"ans":"C","expl":"The first step in a business impact analysis is to identify the business’s priorities.\nJudy should ensure that business areas are all represented and that the functions of each department or area are assessed. Once that is done, she can move on to identifying risks, evaluating likelihood and impact, and then prioritizing the resources available to the business to address the identified priorities."},{"ch":"PT4","ch_name":"模拟卷 4","no":62,"type":"single","q":"What is the most common risk that cellular phone hotspots create for business networks?","opts":["They can provide attackers with a nonsecured network path into your network.","They can be used like rogue access points for man-in-the-middle attacks.","They allow wireless data to be intercepted.","They are unencrypted and can be easily sniffed."],"ans":"A","expl":"Organizations are most often concerned about hotspots creating an unsecured network connection into their secure network via laptops or other devices that are connected to them.\nBridging a cellular connection to a network connection to the business’s network creates a path that bypasses security controls. Hotspots could be used as rogue access points, but\nthis is a less common scenario. They do not specifically allow wireless data to be intercepted and, in most modern implementations, are encrypted, thus limiting the likelihood of sniffing providing useful data."},{"ch":"PT4","ch_name":"模拟卷 4","no":63,"type":"single","q":"Which one of the following fire suppression systems poses the greatest risk of accidental dis-charge that damages equipment in a data center?","opts":["Wet pipe","Dry pipe","Deluge","Preaction"],"ans":"A","expl":"Dry pipe, deluge, and preaction systems all use pipes that remain empty until the system detects signs of a fire. Wet pipe systems use pipes filled with water that may damage equip-ment if there is damage to a pipe."},{"ch":"PT4","ch_name":"模拟卷 4","no":64,"type":"single","q":"Amanda’s healthcare provider maintains such data as details about her health, treatments, and medical billing. What type of data is this?","opts":["Protected health information","Personally identifiable information","Protected health insurance","Individual protected data"],"ans":"A","expl":"Protected health information (PHI) is defined by HIPAA to include health information used by healthcare providers, such as medical treatment, history, and billing. Personally iden-tifiable information is information that can be used to identify an individual, which may be included in the PHI but isn’t specifically this type of data. Protected health insurance and individual protected data are both made-up terms."},{"ch":"PT4","ch_name":"模拟卷 4","no":65,"type":"single","q":"What type of code review is best suited to identifying business logic flaws?","opts":["Mutational fuzzing","Manual","Generational fuzzing","Interface testing"],"ans":"B","expl":"Manual testing uses human understanding of business logic to assess program flow and responses. Mutation or generational fuzzing will help determine how the program responds to expected inputs but does not test the business logic. Interface testing ensures that data exchange between modules works properly but does not focus on the logic of the program or application."},{"ch":"PT4","ch_name":"模拟卷 4","no":66,"type":"single","q":"Something you know is an example of what type of authentication factor?","opts":["Type 1","Type 2","Type 3","Type 4"],"ans":"A","expl":"A Type 1 authentication factor is something you know. A Type 2 authentication factor is something you have, like a smartcard or hardware token. A Type 3 authentication factor is something you are, like a biometric identifier. There is no such thing as a Type 4 authentica-tion factor."},{"ch":"PT4","ch_name":"模拟卷 4","no":67,"type":"single","q":"Saria is the system owner for a healthcare organization. What responsibilities does she have related to the data that resides on or is processed by the systems she owns?","opts":["She has to classify the data.","She has to make sure that appropriate security controls are in place to protect the data.","She has to grant appropriate access to personnel.","She bears sole responsibility for ensuring that data is protected at rest, in transit, and in use."],"ans":"B","expl":"System owners develop and maintain system security plans with system administrators, and they have to ensure that appropriate security controls are in place on those systems. System owners also share responsibility for data protection with data owners. System admin-istrators grant appropriate access and apply the controls, whereas data owners own the classification process."},{"ch":"PT4","ch_name":"模拟卷 4","no":68,"type":"single","q":"During software testing, Jack diagrams how a hacker might approach the application he is reviewing and determines what requirements the hacker might have. He then tests how the system would respond to the attacker’s likely behavior. What type of testing is Jack conducting?","opts":["Misuse case testing","Use case testing","Hacker use case testing","Static code analysis"],"ans":"A","expl":"Jack is performing misuse case analysis, a process that tests code based on how it would perform if it was misused instead of used properly. Use case testing tests valid use cases, whereas static code analysis involves reviewing the code itself for flaws rather than testing the live software. Hacker use case testing isn’t an industry term for a type of testing."},{"ch":"PT4","ch_name":"模拟卷 4","no":69,"type":"multi","q":"Rick’s risk assessment for his company’s web application noted that it could suffer from SQL injection attacks. Which of the following mitigation techniques would you recommend Rick apply to help reduce this risk? (Select all that apply.)","opts":["Stored procedures","Escaping all user-supplied input","Parameterized queries","Input validation"],"ans":"ABCD","expl":"All of these options are useful to help prevent SQL injection. Stored procedures limit what can be done via the database server, and escaping user input makes dangerous characters less likely to be a problem. Parameterized queries limit what can be sent in a query, and input validation adds another layer of protection by limiting what can be success-fully input by a user."},{"ch":"PT4","ch_name":"模拟卷 4","no":70,"type":"single","q":"Chris has been assigned to scan a system on all of its possible TCP and UDP ports. How many ports of each type must he scan to complete his assignment?","opts":["65,536 TCP ports and 32,768 UDP ports","1,024 common TCP ports and 32,768 ephemeral UDP ports","65,536 TCP and 65,536 UDP ports","16,384 TCP ports, and 16,384 UDP ports"],"ans":"C","expl":"Both TCP and UDP port numbers are a 16-digit binary number, which means there can be 216 ports, or 65,536 ports, numbered from 0 to 65,535."},{"ch":"PT4","ch_name":"模拟卷 4","no":71,"type":"single","q":"CVE and the NVD both provide information about what?","opts":["Vulnerabilities","Markup languages","Vulnerability assessment tools","Penetration testing methodologies"],"ans":"A","expl":"MITRE’s Common Vulnerabilities and Exploits (CVE) dictionary and NIST’s National Vulnerability Database (NVD) both provide information about vulnerabilities."},{"ch":"PT4","ch_name":"模拟卷 4","no":72,"type":"single","q":"Michelle wants to ensure that her company does not keep logs for longer than they need to. What type of policy should she write and implement to ensure this?","opts":["An EOL policy","A data classification policy","An EOS policy","A record retention policy"],"ans":"D","expl":"Record retention policies are used to establish what data organizations retain and how long they will retain it for. Keeping data longer than necessary can increase risk to the organization, but having data when needed for investigations, legal compliance, or other business purposes is also important. EOL, or end of life, and EOS, or end of support, apply to hardware or software and not to data. Data classification policies are used to help clas-sify data, which may influence how long it is retained, but classification policies themselves typically do not set retention timeframes."},{"ch":"PT4","ch_name":"模拟卷 4","no":73,"type":"single","q":"In what type of trusted recovery process does the system recover against one or more failure types without administrator intervention while protecting itself against data loss?","opts":["Automated recovery","Manual recovery","Function recovery","Automated recovery without undue data loss"],"ans":"D","expl":"In an automated recovery, the system can recover itself against one or more failure types. In an automated recovery without undue loss, the system can recover itself against one or more failure types and also preserve data against loss. In function recovery, the system can restore functional processes automatically. In a manual recovery approach, the system does not fail into a secure state but requires an administrator to manually restore operations."},{"ch":"PT4","ch_name":"模拟卷 4","no":74,"type":"single","q":"What three important items should be considered if you are attempting to control the strength of signal for a wireless network as well as where it is accessible?","opts":["Antenna placement, antenna type, antenna power levels","Antenna design, power levels, use of a captive portal","Antenna placement, antenna design, use of a captive portal","Power levels, antenna placement, FCC minimum strength requirements"],"ans":"A","expl":"Antenna placement, antenna design, and power level control are the three impor-\ntant factors in determining where a signal can be accessed and how usable it is. A captive portal can be used to control user logins, and antenna design is part of antenna types. The FCC does provide maximum broadcast power guidelines but does not require a minimum power level."},{"ch":"PT4","ch_name":"模拟卷 4","no":75,"type":"single","q":"What is the best way to ensure that data is unrecoverable from an SSD?","opts":["Use the built-in erase commands.","Use a random pattern wipe of 1s and 0s.","Physically destroy the drive.","Degauss the drive."],"ans":"C","expl":"Physically destroying the drive is the best way to ensure that there is no remnant data on the drive. SSDs are flash media, which means that you can’t degauss them, whereas both random pattern writes and the built-in erase commands have been shown to be prob-lematic due to the wear leveling built into SSDs as well as differences in how they handle erase commands."},{"ch":"PT4","ch_name":"模拟卷 4","no":76,"type":"single","q":"Alice sends a message to Bob and wants to ensure that Mal, a third party, does not read the contents of the message while in transit. What goal of cryptography is Alice attempting to achieve?","opts":["Confidentiality","Integrity","Authentication","Nonrepudiation"],"ans":"A","expl":"Confidentiality ensures that data cannot be read by unauthorized individuals while stored or in transit."},{"ch":"PT4","ch_name":"模拟卷 4","no":77,"type":"single","q":"Place the following stages in their proper order for the MITRE ATT&CK framework shown here. Note that Recon is the start of the process and Maintain is the end.","opts":["1 Recon – 2 Deliver – 3 Weaponize – 4 Exploit – 5 Control – 6 Execute – 7 Maintain","1 Recon – 2 Weaponize – 3 Deliver – 4 Exploit – 5 Control – 6 Execute – 7 Maintain","1 Recon – 2 Weaponize – 3 Deliver – 4 Exploit – 5 Execute – 6 Control – 7 Maintain","1 Recon – 2 Weaponize – 3 Exploit – 4 Deliver – 5 Control – 6 Execute – 7 Maintain"],"ans":"B","expl":"The proper order is as follows: 1 Recon– 2 Weaponize– 3 Deliver– 4 Exploit– 5 Control–\n6 Execute– 7 Maintain."},{"ch":"PT4","ch_name":"模拟卷 4","no":78,"type":"single","q":"The company that Gary works for processes credit cards and operates under an industry standard for credit card handling. Which of the following standards will his company need to comply with?","opts":["ISO27001","FIPS 140","PCI-DSS","ISO 27002"],"ans":"D","expl":"PCI-DSS, or the Payment Card Industry Data Security Standard is the industry standard Gary’s company will need to comply with. ISO27001 and 27002 are information security management standards. FIPS 140 is a standard for cryptographic modules."},{"ch":"PT4","ch_name":"模拟卷 4","no":79,"type":"single","q":"James has opted to implement a NAC solution that uses a post-admission philosophy for its control of network connectivity. What type of issues can’t a strictly post-admission policy handle?","opts":["Out-of-band monitoring","Preventing an unpatched laptop from being exploited immediately after connecting to the network","Denying access when user behavior doesn’t match an authorization matrix","Allowing a user access to a specific object when user behavior is allowed based on an authorization matrix"],"ans":"B","expl":"A post-admission philosophy allows or denies access based on user activity after con-nection. Since this doesn’t check the status of a machine before it connects, it can’t prevent the exploit of the system immediately after connection. This doesn’t preclude out-of-band or in-band monitoring, but it does mean that a strictly post-admission policy won’t handle system checks before the systems are admitted to the network."},{"ch":"PT4","ch_name":"模拟卷 4","no":80,"type":"single","q":"Ben has built an access control list that lists the objects that his users are allowed to access. When users attempt to access an object that they don’t have rights to, they are denied access, even though there isn’t a specific rule that prevents it. What access control principle is key to this behavior?","opts":["Least privilege","Implicit deny","Explicit deny","Final rule fall-through"],"ans":"B","expl":"The principle of implicit denial states that any action that is not explicitly allowed is denied. This is an important concept for firewall rules and other access control systems. Implementing least privilege ensures that subjects have only the rights they need to accom-plish their job. While explicit deny and final rule fall-through may sound like important access control concepts, neither is."},{"ch":"PT4","ch_name":"模拟卷 4","no":81,"type":"single","q":"Mary is a security risk analyst for an insurance company. She is currently examining a sce-nario where a hacker might use a SQL injection attack to deface a web server due to a missing patch in the company’s web application. In this scenario, what is the risk?","opts":["Unpatched web application","Web defacement","Hacker","Operating system"],"ans":"B","expl":"Risks are the combination of a threat and a vulnerability. Threats are the external forces seeking to undermine security, such as the hacker in this case. Vulnerabilities are the internal weaknesses that might allow a threat to succeed. In this case, web defacement is the risk. In this scenario, if the hacker attempts a SQL injection attack (threat) against the unpatched server (vulnerability), the result is website defacement (risk)."},{"ch":"PT4","ch_name":"模拟卷 4","no":82,"type":"single","q":"The mean time to detect a compromise is what type of security measurement?","opts":["An MTO","A technical control objective","A compliance objective","A KPI"],"ans":"D","expl":"The mean time to detect a compromise is a security KPI, or key performance indicator. KPIs are used to determine how effective practices, procedures, and staff are."},{"ch":"PT4","ch_name":"模拟卷 4","no":83,"type":"single","q":"Val is attempting to review security logs but is overwhelmed by the sheer volume of records maintained in her organization’s central log repository. What technique can she use to select a representative set of records for further review?","opts":["Statistical sampling.","Clipping.","Choose the first 5 percent of records from each day.","Choose 5 percent of records from the middle of the day."],"ans":"A","expl":"Val can use statistical sampling techniques to choose a set of records for review that are representative of the entire day’s data. Clipping chooses only records that exceed a set threshold, so it is not a representative sample. Choosing records based on the time they are\nrecorded may not produce a representative sample because it may capture events that occur at the same time each day and miss many events that simply don’t occur during the chosen time period."},{"ch":"PT4","ch_name":"模拟卷 4","no":84,"type":"single","q":"In Jen’s job as the network administrator for an industrial production facility, she is tasked with ensuring that the network is not susceptible to electromagnetic interference due to the large motors and other devices running on the production floor. What type of network cabling should she choose if this concern is more important than cost and difficulty of installation?\nFor questions 85–88, please refer to the following scenario:","opts":["10Base2","100BaseT","1000BaseT","Fiber optic"],"ans":"D","expl":"Fiber-optic cable is more expensive and can be harder to install than stranded copper cable or coaxial cable in some cases, but it isn’t susceptible to electromagnetic interference (EMI). That makes it a great solution for Jen’s problem, especially if she is deploying EMI-hardened systems to go with her EMI-resistant network cables."},{"ch":"PT4","ch_name":"模拟卷 4","no":85,"type":"single","q":"Bethany would like to put in place controls that provide an organized framework for company employees to suggest new website features that her team will develop. What change management process facilitates this?","opts":["Configuration control","Change control","Release control","Request control"],"ans":"D","expl":"The request control process provides an organized framework within which users can request modifications, managers can conduct cost/benefit analyses, and developers can prior-itize tasks.","scene":"Jasper Diamonds is a jewelry manufacturer that markets and sells custom jewelry through its website. Bethany is the manager of Jasper’s software development organization, and she is working to bring the company into line with industry-standard practices. She is developing a new change management process for the organization and wants to follow commonly accepted approaches."},{"ch":"PT4","ch_name":"模拟卷 4","no":86,"type":"single","q":"Bethany would also like to create a process that helps multiple developers work on code at the same time. What change management process facilitates this?","opts":["Configuration control","Change control","Release control","Request control"],"ans":"B","expl":"Change control provides an organized framework within which multiple developers can create and test solutions prior to rolling them out into a production environment.","scene":"Jasper Diamonds is a jewelry manufacturer that markets and sells custom jewelry through its website. Bethany is the manager of Jasper’s software development organization, and she is working to bring the company into line with industry-standard practices. She is developing a new change management process for the organization and wants to follow commonly accepted approaches."},{"ch":"PT4","ch_name":"模拟卷 4","no":87,"type":"single","q":"Bethany is working with her colleagues to conduct user acceptance testing. What change management process includes this task?","opts":["Configuration control","Change control","Release control","Request control"],"ans":"C","expl":"Release control includes acceptance testing to ensure that any alterations to end-user work tasks are understood and functional.","scene":"Jasper Diamonds is a jewelry manufacturer that markets and sells custom jewelry through its website. Bethany is the manager of Jasper’s software development organization, and she is working to bring the company into line with industry-standard practices. She is developing a new change management process for the organization and wants to follow commonly accepted approaches."},{"ch":"PT4","ch_name":"模拟卷 4","no":88,"type":"single","q":"Bethany noticed that some problems arise when system administrators update libraries without informing developers. What change management process can assist with\n• this problem?","opts":["Configuration control","Change control","Release control","Request control"],"ans":"A","expl":"Configuration control ensures that changes to software versions are made in accordance with the change control and configuration management process. Updates can be made only from authorized distributions in accordance with those policies.","scene":"Jasper Diamonds is a jewelry manufacturer that markets and sells custom jewelry through its website. Bethany is the manager of Jasper’s software development organization, and she is working to bring the company into line with industry-standard practices. She is developing a new change management process for the organization and wants to follow commonly accepted approaches."},{"ch":"PT4","ch_name":"模拟卷 4","no":89,"type":"single","q":"Ben has written the password hashing system for the web application he is building. His hashing code function for passwords results in the following process for a series of passwords:\n• hash (password1 + 07C98BFE4CF67B0BFE2643B5B22E2D7D) = 10B222970537B97919DB36EC757370D2\n• hash (password2 + 07C98BFE4CF67B0BFE2643B5B22E2D7D) = F1F16683F3E0208131B46D37A79C8921\n• What flaw has Ben introduced with his hashing implementation?","opts":["Plaintext salting","Salt reuse","Use of a short salt","Poor salt algorithm selection"],"ans":"B","expl":"Ben is reusing his salt. When the same salt is used for each hash, all users with the same password will have the same hash, and the attack can either attempt to steal the salt or may attempt to guess the salt by targeting the most frequent hash occurrences based on commonly used passwords. Short salts are an issue, but the salts used here are 32 bytes (256 bits) long. There is no salting algorithm used or mentioned here; salt is an added value for a hash, and plaintext salting is a made-up term."},{"ch":"PT4","ch_name":"模拟卷 4","no":90,"type":"single","q":"Which one of the following is an example of risk transference?","opts":["Building a guard shack","Purchasing insurance","Erecting fences","Relocating facilities"],"ans":"B","expl":"Risk transference involves actions that shift risk from one party to another. Purchasing insurance is an example of risk transference because it moves risk from the insured to the insurance company."},{"ch":"PT4","ch_name":"模拟卷 4","no":91,"type":"single","q":"What protocol takes the place of certificate revocation lists and adds real-time status verification?","opts":["RTCP","RTVP","OCSP","CSRTP"],"ans":"C","expl":"The Online Certificate Status Protocol (OCSP) eliminates the latency inherent in the use of certificate revocation lists by providing a means for real-time certificate verification."},{"ch":"PT4","ch_name":"模拟卷 4","no":92,"type":"single","q":"Xavier’s company has been using an increasing number of cloud services, and he is concerned that the security policies that the company has implemented in its existing data center are not being followed in the cloud. Which of the following solutions is best suited to ensuring that policies are applied to all cloud services?","opts":["A CIPS","A CASB","A CSG","A CDLP"],"ans":"B","expl":"A cloud access security broker is a tool that sits between on-premises and cloud systems, monitoring traffic and enforcing security policies. This scenario exactly matches what a CASB is designed to do. The other answers were made up; none of these is an actual cloud security device or tool (at least as of the writing of this book!)."},{"ch":"PT4","ch_name":"模拟卷 4","no":93,"type":"single","q":"What process makes TCP a connection-oriented protocol?","opts":["It works via network connections.","It uses a handshake.","It monitors for dropped connections.","It uses a complex header."],"ans":"B","expl":"TCP’s use of a handshake process to establish communications makes it a connection-oriented protocol. TCP does not monitor for dropped connections, nor does the fact that it works via network connections make it connection-oriented."},{"ch":"PT4","ch_name":"模拟卷 4","no":94,"type":"single","q":"Susan wants to build a security awareness program for her organization, but knows that keeping staff engaged is difficult. Which of the following techniques is often associated with the use of points and scores as part of the assessment process?","opts":["Gamification","Phishing testing","Security champions","Social engineering evaluations"],"ans":"A","expl":"Gamification uses common components from games like points, scores, and competition to engage participants in a security awareness program. None of the other answers uses these together unless they use a gamification component."},{"ch":"PT4","ch_name":"模拟卷 4","no":95,"type":"single","q":"You are conducting a qualitative risk assessment for your organization. The two important risk elements that should weigh most heavily in your analysis of risk are probability and\n• .","opts":["Likelihood","History","Impact","Cost"],"ans":"C","expl":"The two most important elements of a qualitative risk assessment are determining the probability and impact of each risk upon the organization. Likelihood is another word for probability. Cost should be taken into account but is only one element of impact, which also includes reputational damage, operational disruption, and other ill effects."},{"ch":"PT4","ch_name":"模拟卷 4","no":96,"type":"single","q":"Using the OSI model, what format does the Data Link layer use to format messages received from higher up the stack?","opts":["A data stream","A frame","A segment","A datagram"],"ans":"B","expl":"When a message reaches the Data Link layer, it is called a frame. Data streams exist at the Application, Presentation, and Session layers, whereas segments and datagrams exist at the Transport layer (for TCP and UDP, respectively)."},{"ch":"PT4","ch_name":"模拟卷 4","no":97,"type":"single","q":"What is the maximum penalty that may be imposed by an (ISC)2 peer review board when considering a potential ethics violation?","opts":["Revocation of certification","Termination of employment","Financial penalty","Suspension of certification"],"ans":"A","expl":"If the (ISC)2 peer review board finds that a certified individual has violated the (ISC)2 Code of Ethics, the board may revoke their certification. The board is not able to terminate an individual’s employment or assess financial penalties."},{"ch":"PT4","ch_name":"模拟卷 4","no":98,"type":"single","q":"Which one of the following statements about the SDLC is correct?","opts":["The SDLC requires the use of an iterative approach to software development.","The SDLC requires the use of a sequential approach to software development.","The SDLC does not include training for end users and support staff.","The waterfall methodology is compatible with the SDLC."],"ans":"D","expl":"SDLC approaches include steps to provide operational training for support staff as well as end-user training. The SDLC may use one of many development models, including the waterfall and spiral models. The SDLC does not mandate the use of an iterative or sequential approach; it allows for either approach."},{"ch":"PT4","ch_name":"模拟卷 4","no":99,"type":"single","q":"In the diagram shown here, Harry is prevented from reading a file at a higher classification level than his security clearance. What security model prevents this behavior?\n• Read Request","opts":["Bell–LaPadula","Biba","Clark–Wilson","Brewer–Nash"],"ans":"A","expl":"The Bell–LaPadula model includes the Simple Security Property, which prevents an individual from reading information that is classified at a level higher than the individual’s security clearance."},{"ch":"PT4","ch_name":"模拟卷 4","no":100,"type":"single","q":"Susan is setting up the network for a local coffee house and wants to ensure that users have to authenticate using an email address and agree to the coffee house’s acceptable use policy before being allowed on the network. What technology should she use to do this?","opts":["802.11","NAC","A captive portal","A wireless gateway"],"ans":"C","expl":"Captive portals are designed to show a page that can require actions like accepting an agreement or recording an email address before connecting clients to the internet. NAC is designed to verify whether clients meet a security profile, which doesn’t match the needs of most coffee shops. A wireless gateway is a tool to access a cellular or other network, rather than a way to interact with users before they connect, and 802.11 is the family of IEEE wireless standards."},{"ch":"PT4","ch_name":"模拟卷 4","no":101,"type":"single","q":"Travis is concerned about the security that his organization’s use of Microsoft’s Bit-Locker provides for systems. When are the systems most secure from data loss based on the encryption state of the drive if the systems are equipped with TPM and use full disk encryption?","opts":["When they are booted up and running because the system monitors for drive access","When the system is shutting down because keys are removed from memory","When they are booting up because the TPM checks for a secure boot process","When they are off because the drive is fully encrypted"],"ans":"D","expl":"The files on the drive are at their most secure when the system is off and the drive is encrypted and not in a readable state. BitLocker decrypts files as needed when in use, meaning that any time after the system is booted files may be accessed, particularly if the user is logged in and access to the system can be gained or if malware is running."},{"ch":"PT4","ch_name":"模拟卷 4","no":102,"type":"single","q":"Andrea wants to ensure that her virtualized networks are secure between virtual environ-ments. She uses virtual machine clusters in multiple locations in her state with third-party internet service providers between those locations. Which of the following solutions is best suited to protecting her traffic if she runs a flattened layer 2 network between those locations?\nFor questions 103–105, please refer to the following scenario:","opts":["TLS","BGP","IPsec","AES"],"ans":"C","expl":"An IPsec VPN will allow Andrea to keep her networks running as layer 2 flattened networks when necessary while providing the security for her traffic that she wants. TLS operates at a higher network layer, although traffic could be tunneled through it. BGP is a routing protocol, and AES is an encryption algorithm."},{"ch":"PT4","ch_name":"模拟卷 4","no":103,"type":"single","q":"What security considerations should Fred’s company require for sending sensitive data over the cellular network?","opts":["They should use the same requirements as data over any public network.","Cellular provider networks are private networks and should not require special consideration.","Encrypt all traffic to ensure confidentiality.","Require the use of WAP for all data sent from the phone."],"ans":"A","expl":"Cellular networks have the same issues that any public network does. Encryption requirements should match those that the organization selects for other public networks like hotels, conference WiFi, and similar scenarios. Encrypting all data is difficult and adds overhead, so it should not be the default answer unless the company specifically requires it. WAP is a dated wireless application protocol and is not in broad use; requiring it would be difficult. WAP does provide TLS, which would help when in use.","scene":"The company that Fred works for is reviewing the security of their company-issued cell phones. They issue 4G-capable smartphones running Android and iOS and use a mobile device management solution to deploy company software to the phones. The mobile device management software also allows the company to remotely wipe the phones if they are lost."},{"ch":"PT4","ch_name":"模拟卷 4","no":104,"type":"single","q":"Fred intends to attend a major hacker conference this year and needs to connect to his employer’s network during his time at the conference. What should he do when connecting to his cellular provider’s 4G network while at the conference?","opts":["Continue normal usage.","Discontinue all usage; towers can be spoofed.","Only use trusted WiFi networks.","Connect to his company’s encrypted VPN service."],"ans":"D","expl":"Fred’s best option is to use an encrypted, trusted VPN service to tunnel all of his data usage. Trusted WiFi networks are unlikely to exist at a hacker conference, normal usage is dangerous due to the proliferation of technology that allows fake towers to be set up, and discontinuing all usage won’t support Fred’s business needs.","scene":"The company that Fred works for is reviewing the security of their company-issued cell phones. They issue 4G-capable smartphones running Android and iOS and use a mobile device management solution to deploy company software to the phones. The mobile device management software also allows the company to remotely wipe the phones if they are lost."},{"ch":"PT4","ch_name":"模拟卷 4","no":105,"type":"single","q":"What are the most likely circumstances that would cause a remote wipe of a mobile phone to fail?","opts":["The phone has a passcode on it.","The phone cannot contact a network.","The provider has not unlocked the phone.","The phone is in use."],"ans":"B","expl":"Remote wipe tools are a useful solution, but they work only if the phone can access either a cellular or WiFi network. Remote wipe solutions are designed to wipe data from the phone regardless of whether it is in use or has a passcode. Providers unlock phones for use on other cellular networks rather than for wiping or other feature support.","scene":"The company that Fred works for is reviewing the security of their company-issued cell phones. They issue 4G-capable smartphones running Android and iOS and use a mobile device management solution to deploy company software to the phones. The mobile device management software also allows the company to remotely wipe the phones if they are lost."},{"ch":"PT4","ch_name":"模拟卷 4","no":106,"type":"single","q":"Elaine is developing a business continuity plan for her organization. What value should she seek to minimize?","opts":["AV","SSL","RTO","MTO"],"ans":"C","expl":"The goal of business continuity planning exercises is to reduce the amount of time required to restore operations. This is done by minimizing the recovery time objective (RTO)."},{"ch":"PT4","ch_name":"模拟卷 4","no":107,"type":"single","q":"Warren wants to conduct an internal security audit. He wants to use a broadly accepted audit framework so that he can more easily compare the results to other organizations. Which of the following options should he select as his base audit framework?","opts":["ITSM","ATT&CK","COBIT","CIS"],"ans":"C","expl":"The COBIT, or Control Objectives for Information and related Technologies, frame-work describes common requirements that organizations should have in place for their information systems. It is the only audit or compliance framework on the list. ITSM is the acronym for Information Technology Service Management; CIS is the Center for Information Security, which provides guidelines for system security that can be used to assess systems but is not itself an audit framework; and ATT&CK is a framework for describing threats and attack methodologies."},{"ch":"PT4","ch_name":"模拟卷 4","no":109,"type":"single","q":"Jack’s data center design calls for dual-power supplies in every critical server. What part of the CIA triad is he addressing with this design decision?","opts":["Confidentiality","Integrity","Availability","None of the above"],"ans":"C","expl":"Redundancy is part of many availability designs. Dual power supplies allow multiple levels of availability support; they allow you to connect servers to distinct power infra-structures and also provide the ability to run if a single power supply dies. Some servers are even set up to use more than two power supplies. Another approach to this type of avail-ability is to use more systems, rather than more expensive systems with greater support for availability."},{"ch":"PT4","ch_name":"模拟卷 4","no":110,"type":"single","q":"What step is missing from the IR process cycle diagram shown here?\n• Remediation Detection\n• X Response\n• Reporting Mitigation","opts":["Forensics","Retribution","Recovery","Analysis"],"ans":"C","expl":"The CISSP CBK uses a six-stage process: Detection, Response, Mitigation, Reporting, Recovery, and Remediation. This diagram is missing Recovery. Other standards differ, using different terms or slightly different processes."},{"ch":"PT4","ch_name":"模拟卷 4","no":111,"type":"single","q":"Frank is attempting to protect his web application against cross-site scripting attacks. Users do not need to provide input containing scripts, so he decided the most effective way to filter would be to write a filter on the server that watches for the <SCRIPT> tag and removes it. What is the issue with Frank’s approach?","opts":["Validation should always be performed on the client side.","Attackers may use XSS filter evasion techniques against this approach.","Server-side validation requires removing all HTML tags, not just the <SCRIPT> tag.","There is no problem with Frank’s approach."],"ans":"B","expl":"While removing the <SCRIPT> tag from user input, it is not sufficient, as a user may easily evade this filter by encoding the tag with an XSS filter evasion technique. Frank was correct to perform validation on the server rather than at the client, but he should use validation that limits user input to allowed values, rather than filtering out one potentially malicious tag."},{"ch":"PT4","ch_name":"模拟卷 4","no":112,"type":"single","q":"Megan wants to ensure that the new software as a service provider that her company is signing a contract with will make sure the service works all the time without disruptions. Which of the following is often part of contracts to provide that assurance?","opts":["An SLA","An RPA","An NDA","An MOU"],"ans":"A","expl":"A service level agreement, or SLA, contains details about how the service will be provided, what level of outages or downtime is acceptable, and what remedies may exist in the case of outages or other issues. Megan should ensure that the SLA contains both appropriate performance guarantees and penalties that will be of sufficient magnitude to compensate her company for issues while motivating the service provider to maintain a reliable service. RPA is robotic process automation, an automation technology. NDA is a nondisclosure agreement, a legal document used to help control for the risk of information\nor data being exposed or shared. An MOU is a memorandum of understanding and is used when two organizations want to work together to document a shared vision or the goals they share."},{"ch":"PT4","ch_name":"模拟卷 4","no":113,"type":"single","q":"Uptown Records Management recently entered into a contract with a hospital for the secure storage of medical records. The hospital is a U.S.-based, HIPAA-covered entity, which means it needs to ensure that organizations they contract with can meet security prac-\n• tice requirements. What type of agreement should the two organizations sign to meet this requirement?","opts":["NDA","NCA","BAA","SLA"],"ans":"C","expl":"HIPAA requires that anyone working with personal health information on behalf of a HIPAA-covered entity be subject to the terms of a business associates agreement (BAA)."},{"ch":"PT4","ch_name":"模拟卷 4","no":114,"type":"single","q":"Norm would like to conduct a disaster recovery test for his organization and wants to choose the most thorough type of test, recognizing that it may be quite disruptive. What type of test should Norm choose?","opts":["Full interruption test","Parallel test","Tabletop exercise","Checklist review"],"ans":"A","expl":"During a full interruption test, the team takes down the primary site and confirms that the disaster recovery site is capable of handling regular operations. The full interruption test is the most thorough test but also the most disruptive. During a parallel test, the team actu-ally activates the disaster recovery site for testing, but the primary site remains operational. The checklist review is the least disruptive type of disaster recovery test. During a checklist review, team members each review the contents of their disaster recovery checklists on their own and suggest any necessary changes. During a tabletop exercise, team members come together and walk through a scenario without making any changes to information systems."},{"ch":"PT4","ch_name":"模拟卷 4","no":115,"type":"single","q":"Ed is building a network that supports IPv6 but needs to connect it to an IPv4 network. What type of device should Ed place between the networks?","opts":["A switch","A router","A bridge","A gateway"],"ans":"D","expl":"Ed’s best option is to install an IPv6 to IPv4gateway that can translate traffic between the networks. A bridge would be appropriate for different types of networks, whereas a router would make sense if the networks were similar. A modern switch might be able to carry both types of traffic but wouldn’t be much help translating between the two protocols."},{"ch":"PT4","ch_name":"模拟卷 4","no":116,"type":"single","q":"Henry’s company has deployed an extensive IoT infrastructure for building monitoring that includes environmental controls, occupancy sensors, and a variety of other sensors and controllers that help manage the building. Which of the following security concerns should Henry report as the most critical in his analysis of the IoT deployment?","opts":["The lack of local storage space for security logs that is common to IoT devices.","The IoT devices may not have a separate administrative interface, allowing anybody on the same network to attempt to log into them and making brute-force attacks possible.","The IoT devices may not support strong encryption for communications, exposing the log and sensor data to interception on the network.","The long-term support and patching model for the IoT devices may create security and operational risk for the organization."],"ans":"D","expl":"Henry’s biggest concern should be the long-term security and supportability of the IoT devices. As these devices are increasingly embedded in buildings and infrastructure, the support model and security model are important to understand. Both the lack of sep-arate administrative access and the lack of strong encryption can be addressed by placing\nthe IoT devices on a dedicated subnet or network that prevents other users from accessing the devices directly. This will help limit the risk without undue expense or complexity and is a common practice. Finally, lack of storage space can be a concern, but is not the most important when looking at the risks IoT devices can create."},{"ch":"PT4","ch_name":"模拟卷 4","no":117,"type":"single","q":"Isaac wants to use a connectionless protocol to transfer data because he needs to optimize speed of transmission over reliability. Which protocol should he select?","opts":["ICMP","TCP","UDP","SNMP"],"ans":"C","expl":"UDP, the User Datagram Protocol, is a connectionless, best-effort protocol that is often used when sending data quickly without strong requirements for reliability features like error correction and detection or flow control to make sense. TCP is connection-oriented and provides those and other reliability features. ICMP, the Internet Control Message Pro-tocol, is used to check routes and paths as well as availability, but is not used for significant data transfer in normal cases. SNMP is a network management monitoring protocol."},{"ch":"PT4","ch_name":"模拟卷 4","no":118,"type":"single","q":"Which one of the following actions is not required under the EU General Data Protection Regulation?","opts":["Organizations must allow individuals to opt out of information sharing.","Organizations must provide individuals with lists of employees with access to information.","Organizations must use proper mechanisms to protect data against unauthorized dis-closure.","Organizations must have a dispute resolution process for privacy issues."],"ans":"B","expl":"The EU General Data Protection Regulation does not require that organizations provide individuals with employee lists."},{"ch":"PT4","ch_name":"模拟卷 4","no":119,"type":"single","q":"Tammy is selecting a disaster recovery facility for her organization. She would like to choose a facility that balances the time required to recover operations with the cost involved. What type of facility should she choose?","opts":["Hot site","Warm site","Cold site","Red site"],"ans":"B","expl":"Tammy should choose a warm site. This type of facility meets her requirements for a good balance between cost and recovery time. It is less expensive than a hot site but facili-tates faster recovery than a cold site. A red site is not a type of disaster recovery facility."},{"ch":"PT4","ch_name":"模拟卷 4","no":120,"type":"single","q":"What layer of the OSI model is associated with datagrams?","opts":["Session","Transport","Network","Data Link"],"ans":"B","expl":"When data reaches the Transport layer, it is sent as segments (TCP) or datagrams (UDP). Above the Transport layer, data becomes a data stream, while below the Transport layer they are converted to packets at the Network layer, frames at the Data Link layer, and bits at the Physical layer."},{"ch":"PT4","ch_name":"模拟卷 4","no":121,"type":"single","q":"Which one of the following is not a valid key length for the Advanced Encryption Standard?","opts":["128 bits","192 bits","256 bits","384 bits"],"ans":"D","expl":"The Advanced Encryption Standard supports encryption with 128-bit keys, 192-bit keys, and 256-bit keys."},{"ch":"PT4","ch_name":"模拟卷 4","no":122,"type":"single","q":"Which one of the following technologies provides a function interface that allows devel-opers to directly interact with systems without knowing the implementation details of that system?","opts":["Data dictionary","Object model","Source code","API"],"ans":"D","expl":"An application programming interface (API) allows developers to create a direct method for other users to interact with their systems through an abstraction that does not require knowledge of the implementation details. Access to object models, source code, and data dictionaries also indirectly facilitate interaction but do so in a manner that provides other developers with implementation details."},{"ch":"PT4","ch_name":"模拟卷 4","no":123,"type":"single","q":"Ian wants to assess the security of his company’s new SaaS provider. Which of the follow-ing options is the most likely option that he can realistically expect to be able to use to assess a major cloud provider’s security?","opts":["Run a vulnerability scan against the provider’s external services.","Request a SOC 2 Type II report.","Run a vulnerability scan against the provider’s internal systems.","Request a SOC 1 Type II report."],"ans":"B","expl":"Ian’s best bet is an SOC report, and an SOC 2 Type II report will assess security controls and their application over time, telling him if the organization is responsibly maintaining their security efforts. An SOC 1 report looks at financial controls, and a Type I report only looks at how controls are described, not their application over time. Ian is unlikely to be allowed to run a vulnerability scan against a major provider’s infrastructure either internally or externally."}];
const LS_KEY = 'cissp_quiz_v1';
const LETTERS = ['A','B','C','D','E','F'];
const CHAPTERS = [];
for (const q of BANK) {
  let c = CHAPTERS.find(x => x.code === q.ch);
  if (!c) { c = {code:q.ch, name:q.ch_name, items:[]}; CHAPTERS.push(c); }
  c.items.push(q);
}
BANK.forEach((q,i) => q.id = q.ch + '_' + q.no);

/* ---------- state ---------- */
let st = {answers:{}, ui:{fs:'md', theme:'light', auto:false, shuffle:false}, pos:{}, cur:{type:'cur', ch:BANK[0].ch}};
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (s && typeof s === 'object') st = Object.assign(st, s, {ui:Object.assign(st.ui, s.ui||{}), answers:s.answers||{}, pos:s.pos||{}});
  }
} catch(e) {}

const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch(e){} };
const $ = s => document.querySelector(s);
const el = (t, cls, html) => { const n = document.createElement(t); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1900); };

/* ---------- session ---------- */
let session = [];      // array of question objects
let idx = 0;
let pending = new Set();   // selected indices in current question
let autoTimer = null;

function buildSession(reset) {
  const t = st.cur.type, ch = st.cur.ch;
  let list;
  if (t === 'cur') {
    if (ch === '__ALL__') list = BANK.slice();
    else {
      const c = CHAPTERS.find(x => x.code === ch);
      list = c ? c.items.slice() : BANK.slice();
    }
  }
  else if (t === 'single') list = BANK.filter(q => q.type === 'single');
  else if (t === 'multi') list = BANK.filter(q => q.type === 'multi');
  else if (t === 'wrong') list = BANK.filter(q => (st.answers[q.id] && !st.answers[q.id].ok));
  if (st.ui.shuffle && t !== 'wrong') list = shuffle(list);
  session = list;
  const key = t + ':' + (t === 'cur' ? ch : '') + (st.ui.shuffle ? ':sh' : '');
  idx = reset ? 0 : Math.min(st.pos[key] || 0, Math.max(0, session.length - 1));
  st.cur.key = key;
  pending.clear();
}
function shuffle(a) { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- render ---------- */
function renderStats() {
  const ids = Object.keys(st.answers);
  const done = ids.length, ok = ids.filter(k => st.answers[k].ok).length, bad = done - ok;
  $('#stDone').textContent = done + ' / ' + BANK.length;
  $('#stOk').textContent = ok;
  $('#stBad').textContent = bad;
  $('#stRate').textContent = done ? Math.round(ok / done * 100) + '%' : '—';
  // nav counts
  document.querySelectorAll('.nav-item[data-ch]').forEach(n => {
    const c = CHAPTERS.find(x => x.code === n.dataset.ch);
    const d = c ? c.items.filter(q => st.answers[q.id]).length : BANK.filter(q => st.answers[q.id]).length;
    const tot = c ? c.items.length : BANK.length;
    n.querySelector('.ct').textContent = d + '/' + tot;
  });
  const wb = $('#badgeWrong'); if (wb) wb.textContent = bad ? bad : '';
}

function renderNav() {
  const nav = $('#navChapters'); nav.innerHTML = '';
  const sel = $('#chSel');
  if (sel && !sel.options.length) {
    sel.appendChild(new Option('综合练习（全库 ' + BANK.length + ' 题）', '__ALL__'));
    CHAPTERS.forEach(c => sel.appendChild(new Option(c.name + '（' + c.items.length + ' 题）', c.code)));
    sel.onchange = () => {
      st.cur.type = 'cur'; st.cur.ch = sel.value;
      setSeg('cur');
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('on'));
      const b = document.querySelector('.nav-item[data-ch="' + sel.value + '"]');
      if (b) b.classList.add('on');
      buildSession(true); renderQ(); save();
    };
  }
  if (sel) sel.value = st.cur.ch;
  const mk = (label, dataCh, count, on, extra) => {
    const b = el('button', 'nav-item' + (on ? ' on' : ''));
    b.innerHTML = '<span class="nm">' + label + '</span><span class="ct">' + count + '</span>' + (extra || '');
    if (dataCh) b.dataset.ch = dataCh;
    b.onclick = () => {
      st.cur.type = 'cur'; st.cur.ch = dataCh;
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      setSeg('cur');
      buildSession(true); renderQ(); save();
    };
    return b;
  };
  // 综合练习
  const allDone = BANK.filter(q => st.answers[q.id]).length;
  nav.appendChild(mk('综合练习（全库）', '__ALL__', allDone + '/' + BANK.length,
    st.cur.type === 'cur' && st.cur.ch === '__ALL__'));

  const sep = el('div', 'nav-sep'); nav.appendChild(sep);
  CHAPTERS.forEach(c => {
    const d = c.items.filter(q => st.answers[q.id]).length;
    nav.appendChild(mk(c.name, c.code, d + '/' + c.items.length,
      st.cur.type === 'cur' && st.cur.ch === c.code));
  });
}

function setSeg(m) {
  document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
}

function renderQ() {
  const mb = document.querySelector('.mbar'); if (mb) mb.style.display = '';
  if (!session.length) {
    $('#qbody').innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15h6"/></svg>'
      + (st.cur.type === 'wrong' ? '<div>暂无错题，先去练习吧</div>' : '<div>当前题库为空</div>') + '</div>';
    $('#qIdx').textContent = '0 / 0'; $('#bar').style.width = '0%';
    $('#mSubmit').disabled = true; $('#cardQ').style.display = '';
    return;
  }
  $('#cardQ').style.display = ''; $('#cardResult').style.display = 'none';
  const q = session[idx];
  const rec = st.answers[q.id];
  $('#qIdx').textContent = '第 ' + (idx + 1) + ' / ' + session.length + ' 题';
  $('#qCh').textContent = q.ch_name + ' · 第' + q.no + '题';
  const tp = $('#qType');
  tp.textContent = q.type === 'multi' ? '多选题 · 全部选对才得分' : '单选题';
  tp.className = 'chip' + (q.type === 'multi' ? ' multi' : '');
  $('#bar').style.width = (session.length ? Math.round((idx) / session.length * 100) : 0) + '%';

  const body = $('#qbody'); body.innerHTML = '';
  if (q.scene) {
    const d = el('details', 'scene'); d.open = true;
    d.innerHTML = '<summary>题目场景（共用材料）</summary><div></div>';
    d.querySelector('div').textContent = q.scene;
    body.appendChild(d);
  }
  const stem = el('div', 'stem'); stem.textContent = q.q; body.appendChild(stem);

  const opts = el('div', 'opts');
  const answered = !!rec;
  q.opts.forEach((txt, i) => {
    const b = el('button', 'opt');
    b.dataset.i = i;
    b.innerHTML = '<span class="k">' + LETTERS[i] + '</span><span class="tx"></span>';
    b.querySelector('.tx').textContent = txt;
    b.classList.add('locked');
    if (rec) {
      // show graded state
      const correctSet = new Set(q.ans.split('').map(c => c.charCodeAt(0)-65));
      const selSet = new Set(rec.s);
      if (correctSet.has(i)) b.classList.add('right');
      if (selSet.has(i) && !correctSet.has(i)) b.classList.add('wrong');
      b.disabled = true;
    } else {
      b.classList.remove('locked');
      b.onclick = () => toggleOpt(i);
      if (pending.has(i)) b.classList.add('sel');
    }
    opts.appendChild(b);
  });
  body.appendChild(opts);

  const fb = el('div', 'fb');
  if (rec) { fb.className = 'fb show ' + (rec.ok ? 'good' : 'bad'); fb.innerHTML = fbHTML(q, rec); }
  body.appendChild(fb);

  const foot = el('div', 'footer');
  foot.innerHTML =
    '<button class="btn" id="bPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>上一题</button>' +
    '<button class="btn pri" id="bSubmit"' + (rec ? ' disabled' : '') + '>' + (rec ? '已提交' : '提交答案') + '</button>' +
    '<span class="sp"></span>' +
    '<button class="btn" id="bNext">下一题<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>';
  body.appendChild(foot);
  $('#bPrev').onclick = () => go(-1);
  $('#bNext').onclick = () => go(1);
  $('#bSubmit').onclick = submit;
  $('#mSubmit').disabled = !!rec;
  $('#mSubmit').textContent = rec ? '已提交' : '提交';
  renderStats();
}

function fbHTML(q, rec) {
  const ansTxt = q.ans.split('').join('、');
  const head = rec.ok
    ? '<div class="ttl"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>回答正确</div>'
    : '<div class="ttl"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>回答错误</div>';
  return head + '<div class="ans">正确答案：<b>' + ansTxt + '</b></div>'
    + '<div class="ex">' + escapeHtml(q.expl) + '</div>';
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleOpt(i) {
  const q = session[idx];
  if (st.answers[q.id]) return;
  if (q.type === 'multi') { pending.has(i) ? pending.delete(i) : pending.add(i); }
  else { pending.clear(); pending.add(i); }
  document.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.i; b.classList.toggle('sel', pending.has(k));
  });
  $('#mSubmit').disabled = pending.size === 0;
  const bs = document.querySelector('#bSubmit'); if (bs) bs.disabled = pending.size === 0;
}

function submit() {
  const q = session[idx];
  if (st.answers[q.id] || !pending.size) return;
  const sel = Array.from(pending).sort((a,b)=>a-b);
  const ok = sel.join('') === q.ans.split('').map(c=>c.charCodeAt(0)-65).sort((a,b)=>a-b).join('');
  st.answers[q.id] = {s: sel, ok, t: Date.now()};
  save();
  renderQ(); renderStats();
  if (ok && st.ui.auto) {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => { if (idx < session.length - 1) go(1); }, 1200);
  }
}

function go(d) {
  clearTimeout(autoTimer);
  const n = idx + d;
  if (n < 0) { toast('已经是第一题'); return; }
  if (n >= session.length) { toast('已经是最后一题，可查看成绩'); return; }
  idx = n; pending.clear();
  st.pos[st.cur.key] = idx; save();
  renderQ();
  window.scrollTo({top:0, behavior:'smooth'});
}
function jumpTo(i) { idx = i; pending.clear(); st.pos[st.cur.key] = idx; save(); renderQ(); window.scrollTo({top:0}); }

/* ---------- result ---------- */
function showResult() {
  clearTimeout(autoTimer);
  const done = session.filter(q => st.answers[q.id]);
  const ok = done.filter(q => st.answers[q.id].ok).length;
  const bad = done.length - ok;
  const rate = done.length ? Math.round(ok / done.length * 100) : 0;
  $('#rScope').textContent = scopeName();
  $('#rTotal').textContent = session.length;
  $('#rDone').textContent = done.length;
  $('#rOk').textContent = ok;
  $('#rBad').textContent = bad;
  $('#rRate').textContent = rate + '%';
  const C = 2 * Math.PI * 56;
  const fg = $('#ringFg');
  fg.style.strokeDasharray = C;
  fg.style.strokeDashoffset = C * (1 - rate / 100);
  fg.setAttribute('stroke', rate >= 70 ? 'var(--ok)' : (rate >= 50 ? 'var(--warn)' : 'var(--bad)'));
  const grid = $('#rGrid'); grid.innerHTML = '';
  session.forEach((q, i) => {
    const b = el('button', 'rq');
    b.textContent = i + 1;
    const r = st.answers[q.id];
    if (r) b.classList.add(r.ok ? 'ok' : 'bad'); else b.classList.add('none');
    b.title = q.q.slice(0, 60);
    b.onclick = () => { jumpTo(i); };
    grid.appendChild(b);
  });
  $('#cardQ').style.display = 'none';
  $('#cardResult').style.display = '';
  document.querySelector('.mbar').style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
}
function scopeName() {
  if (st.cur.type === 'cur') {
    if (st.cur.ch === '__ALL__') return '综合练习 · 全库 ' + BANK.length + ' 题';
    const c = CHAPTERS.find(x => x.code === st.cur.ch);
    return c ? c.name : '—';
  }
  return {single:'只练单选', multi:'只练多选', wrong:'错题重练'}[st.cur.type] || '';
}

/* ---------- export / import ---------- */
function exportJson() {
  const payload = {app:'cissp-quiz', version:1, exportedAt:new Date().toISOString(),
    stats:{total:BANK.length, answered:Object.keys(st.answers).length},
    answers:st.answers, ui:st.ui};
  const blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = 'CISSP刷题进度_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已导出进度文件，可放到网盘/微信传给其他设备');
}
function importJson(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const p = JSON.parse(fr.result);
      if (!p || !p.answers || typeof p.answers !== 'object') throw new Error('格式不符');
      let n = 0;
      for (const k in p.answers) { if (BANK.some(q => q.id === k)) { st.answers[k] = p.answers[k]; n++; } }
      if (p.ui) { if (p.ui.fs) st.ui.fs = p.ui.fs; if (p.ui.theme) st.ui.theme = p.ui.theme;
        if (typeof p.ui.auto === 'boolean') st.ui.auto = p.ui.auto; }
      save(); applyUi(); buildSession(); renderQ(); renderStats();
      toast('导入成功：合并 ' + n + ' 条作答记录');
    } catch(e) { toast('导入失败：' + e.message); }
  };
  fr.readAsText(file);
}

/* ---------- modal ---------- */
function confirmDlg(title, text, okLabel, onOk) {
  const m = $('#mask'), d = $('#dlg');
  d.innerHTML = '<h3></h3><p></p><div class="row"><button class="btn" id="dNo">取消</button><button class="btn pri" id="dYes"></button></div>';
  d.querySelector('h3').textContent = title;
  d.querySelector('p').textContent = text;
  d.querySelector('#dYes').textContent = okLabel || '确定';
  m.classList.add('show');
  const close = () => m.classList.remove('show');
  d.querySelector('#dNo').onclick = close;
  d.querySelector('#dYes').onclick = () => { close(); onOk && onOk(); };
}
$('#mask').onclick = e => { if (e.target.id === 'mask') $('#mask').classList.remove('show'); };

/* ---------- ui ---------- */
function applyUi() {
  document.body.className = 'fs-' + st.ui.fs.replace('fs-','') + (st.ui.theme === 'dark' ? ' dark' : '');
  $('#fsLabel').textContent = {sm:'字号小', md:'字号中', lg:'字号大'}[st.ui.fs] || '字号中';
  $('#themeLabel').textContent = st.ui.theme === 'dark' ? '深色' : '浅色';
  $('#btnShuffle').classList.toggle('on', !!st.ui.shuffle);
  $('#btnAuto').classList.toggle('on', !!st.ui.auto);
}
$('#btnFs').onclick = () => {
  const arr = ['md','lg','sm'];
  st.ui.fs = arr[(arr.indexOf(st.ui.fs.replace('fs-','')) + 1) % 3] || 'md';
  applyUi(); save();
};
$('#btnTheme').onclick = () => { st.ui.theme = st.ui.theme === 'dark' ? 'light' : 'dark'; applyUi(); save(); };
$('#btnExport').onclick = exportJson;
$('#btnImport').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ''; };
$('#btnShuffle').onclick = () => { st.ui.shuffle = !st.ui.shuffle; applyUi(); save(); buildSession(true); renderQ(); toast(st.ui.shuffle ? '已开启随机顺序' : '已恢复顺序练习'); };
$('#btnAuto').onclick = () => { st.ui.auto = !st.ui.auto; applyUi(); save(); toast(st.ui.auto ? '答对后 1.2 秒自动跳下一题' : '已关闭自动跳题'); };
$('#btnResult').onclick = showResult;
$('#btnBack2').onclick = () => { $('#cardResult').style.display = 'none'; $('#cardQ').style.display = ''; document.querySelector('.mbar').style.display = ''; renderQ(); };
$('#btnReset').onclick = () => confirmDlg('清空全部进度', '将删除本机保存的所有作答记录与错题（导出备份后再清空可恢复）。确定继续吗？', '清空', () => {
  st.answers = {}; st.pos = {}; save(); buildSession(); idx = 0; renderQ(); renderStats(); toast('已清空全部进度');
});
document.querySelectorAll('#segMode button').forEach(b => b.onclick = () => {
  st.cur.type = b.dataset.m;
  setSeg(b.dataset.m);
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('on'));
  const cur = document.querySelector('.nav-item[data-ch="' + st.cur.ch + '"]');
  if (cur && b.dataset.m === 'cur') cur.classList.add('on');
  buildSession(true); renderQ(); save();
});
$('#mPrev').onclick = () => go(-1);
$('#mNext').onclick = () => go(1);
$('#mSubmit').onclick = submit;

document.addEventListener('keydown', e => {
  if ($('#mask').classList.contains('show')) return;
  if (/input|textarea/i.test(document.activeElement.tagName)) return;
  const q = session[idx]; if (!q) return;
  if (e.key >= '1' && e.key <= '6') {
    const i = +e.key - 1;
    if (i < q.opts.length && !st.answers[q.id]) { toggleOpt(i); e.preventDefault(); }
  } else if (e.key === 'Enter') { if (!st.answers[q.id]) { submit(); e.preventDefault(); } }
  else if (e.key === 'ArrowRight') { go(1); }
  else if (e.key === 'ArrowLeft') { go(-1); }
});

/* ---------- init ---------- */
if (!st.cur.ch) st.cur.ch = CHAPTERS[0].code;
applyUi();
renderNav();
buildSession(false);
setSeg(st.cur.type);
renderQ();
renderStats();

if (!Object.keys(st.answers).length) {
  setTimeout(() => toast('点击选项作答，多选需全选对；Enter 提交，← → 翻题'), 700);
}
</script>
</body>
